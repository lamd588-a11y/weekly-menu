<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>每週菜單</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="每週菜單">
<meta name="theme-color" content="#F2F2F7">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
/* ============ 基礎 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{
  font-size:calc(16px * var(--fs,1));
  -webkit-text-size-adjust:100%;
}
:root{
  --fs:1;
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --card2:#FFFFFF;
  --text:#000000;
  --text2:#8A8A8E;
  --sep:rgba(60,60,67,.14);
  --fill:rgba(120,120,128,.12);
  --accent:#FF9500;
  --blue:#007AFF;
  --red:#FF3B30;
  --green:#34C759;
  --tabbar:rgba(249,249,249,.82);
  --shadow:0 1px 3px rgba(0,0,0,.06);
}
html[data-theme="dark"]{
  --bg:#000000;
  --card:#1C1C1E;
  --card2:#2C2C2E;
  --text:#FFFFFF;
  --text2:#8E8E93;
  --sep:rgba(84,84,88,.65);
  --fill:rgba(120,120,128,.24);
  --tabbar:rgba(28,28,30,.82);
  --shadow:none;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
input,select,button,textarea{font-family:inherit;color:inherit;font-size:1rem;}
button{border:0;background:none;padding:0;cursor:pointer;}
ul{margin:0;padding:0;list-style:none;}

/* ============ 版面 ============ */
.app{position:fixed;inset:0;display:flex;flex-direction:column;}
.view{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(6.5rem + env(safe-area-inset-bottom));
}
.view::-webkit-scrollbar{display:none;}

/* ============ 頂欄 ============ */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:.7rem;
  padding:calc(env(safe-area-inset-top) + .6rem) 1rem .6rem;
  background:var(--tabbar);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);
}
.topbar-title{font-size:1.12rem;font-weight:700;letter-spacing:.02em;flex:1;}
.avatar{
  width:2.4rem;height:2.4rem;border-radius:50%;
  background:var(--fill) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;flex:none;
  box-shadow:inset 0 0 0 .5px var(--sep);
}
.icon-btn{
  width:2.3rem;height:2.3rem;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;background:var(--fill);flex:none;
}

/* ============ 週切換 ============ */
.week-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:.9rem 1rem .5rem;
}
.week-nav button{
  width:2.4rem;height:2.4rem;border-radius:50%;
  background:var(--fill);color:var(--text);
  font-size:1.3rem;line-height:1;display:flex;align-items:center;justify-content:center;
}
.week-nav .center{text-align:center;flex:1;}
.week-nav .wk-label{font-size:1.05rem;font-weight:700;}
.week-nav .wk-range{font-size:.78rem;color:var(--text2);margin-top:.15rem;}
.wk-today{
  display:block;margin:.5rem auto 0;font-size:.8rem;color:var(--blue);
  padding:.3rem .9rem;border-radius:999px;background:var(--fill);
}

/* ============ 人數 ============ */
.menu-meta{
  display:flex;gap:.7rem;padding:.8rem 1rem .2rem;
}
.meta-field{
  flex:1;display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border-radius:.9rem;padding:.55rem .8rem;
  box-shadow:var(--shadow);
}
.meta-field span{font-size:.85rem;color:var(--text2);}
.meta-field input{
  width:3.6rem;border:0;background:transparent;text-align:right;
  font-size:1.05rem;font-weight:600;outline:none;
  -moz-appearance:textfield;
}
.meta-field input::-webkit-outer-spin-button,
.meta-field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

/* ============ 每日卡片 ============ */
.days{padding:.7rem 1rem 0;display:flex;flex-direction:column;gap:.85rem;}
.day-card{
  background:var(--card);border-radius:1.1rem;overflow:hidden;
  box-shadow:var(--shadow);
}
.day-card.today{box-shadow:0 0 0 1.5px var(--accent),var(--shadow);}
.day-head{
  display:flex;align-items:center;gap:.5rem;
  padding:.7rem .95rem .55rem;
  border-bottom:.5px solid var(--sep);
}
.day-head .dow{font-size:.98rem;font-weight:700;}
.day-head .dom{font-size:.82rem;color:var(--text2);margin-left:auto;}
.today-badge{
  font-size:.66rem;font-weight:700;color:#fff;background:var(--accent);
  padding:.1rem .4rem;border-radius:.4rem;
}
.dish-list{padding:.25rem 0;}
.dish-row{
  display:flex;align-items:center;gap:.55rem;
  padding:.55rem .95rem;
  font-size:.98rem;
  border-bottom:.5px solid var(--sep);
}
.dish-row:last-child{border-bottom:0;}
.dot{width:.55rem;height:.55rem;border-radius:50%;flex:none;}
.dish-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dish-last{font-size:.72rem;color:var(--text2);white-space:nowrap;}
.x-btn{
  color:var(--text2);font-size:.95rem;padding:.15rem .3rem;margin-left:.15rem;
}
.empty-line{
  padding:.7rem .95rem;font-size:.85rem;color:var(--text2);font-style:italic;
}
.add-line{
  width:100%;padding:.7rem;text-align:center;font-size:.9rem;
  color:var(--blue);font-weight:600;border-top:.5px solid var(--sep);
}
.add-line:active{background:var(--fill);}

/* ============ 通用卡片 / 分頁 ============ */
.page-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 1rem .3rem;
}
.page-head h1{font-size:1.7rem;margin:0;font-weight:800;letter-spacing:-.02em;}
.btn-primary{
  background:var(--blue);color:#fff;font-weight:600;font-size:.9rem;
  padding:.5rem .95rem;border-radius:999px;
}
.section-title{
  font-size:.78rem;font-weight:600;color:var(--text2);
  text-transform:uppercase;letter-spacing:.05em;
  padding:.2rem 1.4rem .45rem;
}
.card{
  background:var(--card);border-radius:1rem;margin:0 1rem .9rem;
  overflow:hidden;box-shadow:var(--shadow);
}
.row{
  display:flex;align-items:center;gap:.75rem;
  padding:.8rem 1rem;border-bottom:.5px solid var(--sep);
  min-height:3rem;
}
.row:last-child{border-bottom:0;}
.row .row-main{flex:1;min-width:0;}
.row-title{font-size:.98rem;font-weight:500;}
.row-sub{font-size:.76rem;color:var(--text2);margin-top:.12rem;}
.row .mini{
  font-size:.82rem;color:var(--blue);padding:.3rem .55rem;border-radius:.5rem;
}
.row .mini.danger{color:var(--red);}
.row .mini:active{background:var(--fill);}

/* ============ 分類 chips ============ */
.chips{
  display:flex;gap:.45rem;overflow-x:auto;padding:.2rem 1rem .7rem;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:none;padding:.42rem .85rem;border-radius:999px;
  background:var(--card);font-size:.85rem;font-weight:500;
  color:var(--text);box-shadow:var(--shadow);white-space:nowrap;
}
.chip.active{background:var(--blue);color:#fff;}

/* ============ 設定元件 ============ */
.segmented{
  display:flex;background:var(--fill);border-radius:.7rem;padding:.15rem;
  margin:.6rem 1rem .9rem;
}
.segmented button{
  flex:1;padding:.5rem;border-radius:.6rem;font-size:.88rem;font-weight:500;
  color:var(--text2);
}
.segmented button.active{background:var(--card);color:var(--text);font-weight:600;box-shadow:var(--shadow);}
.range-wrap{padding:.4rem 1rem .9rem;display:flex;align-items:center;gap:.8rem;}
.range-wrap input[type=range]{flex:1;accent-color:var(--blue);}
.range-val{font-size:.82rem;color:var(--text2);width:2.8rem;text-align:right;}

/* ============ 拖拉排序 ============ */
.sort-list{padding:0;}
.sort-item{
  display:flex;align-items:center;gap:.6rem;
  padding:.75rem 1rem;border-bottom:.5px solid var(--sep);
  background:var(--card);
}
.sort-item:last-child{border-bottom:0;}
.sort-item.dragging{opacity:.96;box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:.7rem;}
.sort-placeholder{background:var(--fill);border-radius:.6rem;margin:.2rem .5rem;}
.drag-handle{
  color:var(--text2);font-size:1.1rem;padding:.2rem .35rem .2rem 0;
  touch-action:none;cursor:grab;user-select:none;
}
.sort-name{flex:1;font-size:.98rem;}
.sort-count{font-size:.76rem;color:var(--text2);}

/* ============ 底部 Tab ============ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  display:flex;
  padding:.35rem 0 calc(.35rem + env(safe-area-inset-bottom));
  background:var(--tabbar);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:.12rem;
  color:var(--text2);font-size:.68rem;font-weight:500;
}
.tab.active{color:var(--blue);}
.tab-icon{font-size:1.3rem;line-height:1.1;}

/* ============ Sheet / Overlay ============ */
#overlay{position:fixed;inset:0;z-index:500;pointer-events:none;}
#overlay.show{pointer-events:auto;}
.sheet-mask{
  position:absolute;inset:0;background:rgba(0,0,0,.4);
  animation:fadeIn .18s ease;
}
.sheet{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--bg);
  border-radius:1.3rem 1.3rem 0 0;
  max-height:88vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
  animation:slideUp .26s cubic-bezier(.2,.9,.3,1);
  overflow:hidden;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:.85rem 1rem;border-bottom:.5px solid var(--sep);
  background:var(--card);
  border-radius:1.3rem 1.3rem 0 0;
}
.sheet-title{font-size:1rem;font-weight:700;}
.sheet-head .link{color:var(--blue);font-size:.95rem;}
.sheet-head .link.strong{font-weight:700;}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;}
.grabber{
  width:2.2rem;height:.28rem;border-radius:999px;background:var(--sep);
  margin:.45rem auto .1rem;
}

/* picker 列表 */
.picker-list{padding:0 1rem 1rem;}
.picker-item{
  display:flex;align-items:center;gap:.7rem;
  background:var(--card);border-radius:.85rem;
  padding:.8rem .95rem;margin-bottom:.5rem;
  box-shadow:var(--shadow);
}
.picker-item .nm{flex:1;font-size:.98rem;}
.picker-item .last{font-size:.72rem;color:var(--text2);}
.picker-item .check{
  width:1.4rem;height:1.4rem;border-radius:50%;
  border:1.5px solid var(--sep);flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;color:transparent;
}
.picker-item.selected .check{background:var(--blue);border-color:var(--blue);color:#fff;}

/* 表單 */
.form{padding:1rem;}
.field{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  background:var(--card);border-radius:.8rem;padding:.7rem .95rem;
  margin-bottom:.6rem;
}
.field span{font-size:.9rem;color:var(--text2);flex:none;}
.field input,.field select{
  flex:1;border:0;background:transparent;text-align:right;outline:none;
  font-size:1rem;min-width:0;
}
.btn-danger{
  width:100%;padding:.85rem;border-radius:.8rem;background:var(--card);
  color:var(--red);font-weight:600;font-size:.95rem;margin-top:.4rem;
}
.btn-block{
  width:100%;padding:.9rem;border-radius:.85rem;background:var(--card);
  font-size:.98rem;font-weight:500;margin-bottom:.6rem;text-align:center;
}
.btn-block.primary{background:var(--blue);color:#fff;font-weight:600;}
.empty-msg{
  text-align:center;color:var(--text2);font-size:.9rem;padding:2.5rem 1rem;
}
.hint{
  font-size:.76rem;color:var(--text2);padding:0 1.4rem .8rem;line-height:1.5;
}
</style>
</head>
<body>
<div class="app">
  <main class="view" id="view"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="overlay"></div>

<script>
/* =====================================================================
   每週菜單 PWA
   ===================================================================== */

/* ---------- 常數 ---------- */
const STORE_KEY = 'weekly_menu_v2';
const DOW_FULL  = ['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
const DOW_SHORT = ['一','二','三','四','五','六','日'];

const DEFAULT_CATS = [
  {id:'c_chicken', name:'雞',   color:'#FF9F0A'},
  {id:'c_beef',    name:'牛',   color:'#FF453A'},
  {id:'c_pork',    name:'豬',   color:'#FF375F'},
  {id:'c_fish',    name:'魚',   color:'#0A84FF'},
  {id:'c_veg',     name:'菜',   color:'#30D158'},
  {id:'c_soup',    name:'湯',   color:'#BF5AF2'},
  {id:'c_other',   name:'其他', color:'#8E8E93', fixed:true}
];

const CAT_I18N = {
  '雞':'Ayam','牛':'Sapi','豬':'Babi','魚':'Ikan','菜':'Sayur','湯':'Sup','其他':'Lainnya'
};

const I18N = {
  zh: {
    title:'每週菜單', weekRange:'週次', diners:'用餐人數', takeout:'外帶人數',
    none:'（無菜式）', generated:'匯出日期',
    days:['星期一','星期二','星期三','星期四','星期五','星期六','星期日']
  },
  id: {
    title:'Menu Mingguan', weekRange:'Pekan', diners:'Jumlah Makan', takeout:'Bawa Pulang',
    none:'(Tidak ada hidangan)', generated:'Diekspor',
    days:['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu']
  }
};

/* ---------- 工具 ---------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmtShort = s => { if(!s) return '—'; const d = fromISO(s); return `${d.getMonth()+1}/${d.getDate()}`; };

function mondayOf(date){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const dow = d.getDay();
  d.setDate(d.getDate() + (dow === 0 ? -6 : 1 - dow));
  return d;
}
function weekOffset(wk){
  const cur = iso(mondayOf(new Date()));
  return Math.round((fromISO(wk) - fromISO(cur)) / (7*86400000));
}

/* ---------- 狀態 ---------- */
let S = loadState();
let UI = {
  tab: 'menu',
  weekStart: iso(mondayOf(new Date())),
  dishFilter: 'all',
  picker: null,
  editingDishId: null
};

function defaultState(){
  return {
    settings:{ theme:'auto', fontScale:1, avatar:null },
    categories: DEFAULT_CATS.map(c => ({...c})),
    dishes: [],
    menus: {}
  };
}

function migrate(p){
  const base = defaultState();
  const out = Object.assign(base, p || {});
  out.settings = Object.assign(base.settings, p?.settings || {});
  if(!Array.isArray(out.categories) || !out.categories.length) out.categories = base.categories;
  if(!out.categories.some(c => c.id === 'c_other')){
    out.categories.push({id:'c_other', name:'其他', color:'#8E8E93', fixed:true});
  }
  if(!Array.isArray(out.dishes)) out.dishes = [];
  if(typeof out.menus !== 'object' || !out.menus) out.menus = {};
  return out;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){ console.warn('load failed', e); }
  return defaultState();
}

let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
    catch(e){ console.warn('save failed', e); }
  }, 120);
}

/* ---------- 取得資料 ---------- */
function getMenu(wk){
  if(!S.menus[wk]) S.menus[wk] = { diners:4, takeout:0, days:[[],[],[],[],[],[],[]] };
  const m = S.menus[wk];
  if(!Array.isArray(m.days)) m.days = [[],[],[],[],[],[],[]];
  while(m.days.length < 7) m.days.push([]);
  for(let i=0;i<7;i++) if(!Array.isArray(m.days[i])) m.days[i] = [];
  if(typeof m.diners !== 'number') m.diners = 4;
  if(typeof m.takeout !== 'number') m.takeout = 0;
  return m;
}
function catOf(id){ return S.categories.find(c => c.id === id) || {name:'未分類', color:'#8E8E93'}; }
function otherCat(){
  return S.categories.find(c => c.id === 'c_other')
      || S.categories.find(c => c.fixed)
      || S.categories[S.categories.length-1];
}

/* =====================================================================
   主題 / 全域設定
   ===================================================================== */
function applySettings(){
  const root = document.documentElement;
  let t = S.settings.theme;
  if(t === 'auto'){
    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  root.dataset.theme = t;
  root.style.setProperty('--fs', S.settings.fontScale || 1);

  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t === 'dark' ? '#000000' : '#F2F2F7');
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if(S.settings.theme === 'auto') applySettings();
});

/* =====================================================================
   主渲染
   ===================================================================== */
function render(){
  applySettings();
  if(UI.tab === 'menu')      renderMenuView();
  else if(UI.tab === 'dishes')   renderDishesView();
  else                       renderSettingsView();
  renderTabbar();
}

function renderTabbar(){
  const tabs = [
    {id:'menu',     icon:'🍽️', label:'本週菜單'},
    {id:'dishes',   icon:'📖', label:'菜式'},
    {id:'settings', icon:'⚙️', label:'設定'}
  ];
  $('#tabbar').innerHTML = tabs.map(t => `
    <button class="tab ${UI.tab === t.id ? 'active' : ''}"
            data-action="tab" data-tab="${t.id}">
      <span class="tab-icon">${t.icon}</span>
      <span class="tab-label">${t.label}</span>
    </button>`).join('');
}

/* =====================================================================
   1. 每週菜單頁
   ===================================================================== */
function renderMenuView(){
  const monday = fromISO(UI.weekStart);
  const menu = getMenu(UI.weekStart);
  const off = weekOffset(UI.weekStart);
  const label = off === 0 ? '本週' : off === -1 ? '上週' : off === 1 ? '下週'
              : (off > 0 ? `+${off} 週` : `${off} 週`);
  const lastDay = new Date(monday); lastDay.setDate(lastDay.getDate() + 6);
  const rangeTxt = `${monday.getFullYear()}/${monday.getMonth()+1}/${monday.getDate()}`
                 + ` – ${lastDay.getMonth()+1}/${lastDay.getDate()}`;
  const todayStr = iso(new Date());

  const avatarStyle = S.settings.avatar
    ? `background-image:url('${S.settings.avatar}')`
    : '';

  /* 7 天卡片 */
  let daysHtml = '';
  for(let i = 0; i < 7; i++){
    const d = new Date(monday); d.setDate(d.getDate() + i);
    const ds = iso(d);
    const isToday = ds === todayStr;

    const rows = (menu.days[i] || []).map(id => {
      const dish = S.dishes.find(x => x.id === id);
      if(!dish) return '';
      const cat = catOf(dish.catId);
      return `<li class="dish-row">
        <span class="dot" style="background:${cat.color}"></span>
        <span class="dish-name">${esc(dish.name)}</span>
        <span class="dish-last">上次 ${fmtShort(dish.lastCooked)}</span>
        <button class="x-btn" data-action="del-dish"
                data-day="${i}" data-id="${id}" aria-label="移除">✕</button>
      </li>`;
    }).join('');

    daysHtml += `
      <section class="day-card ${isToday ? 'today' : ''}">
        <div class="day-head">
          <span class="dow">${DOW_FULL[i]}</span>
          ${isToday ? '<span class="today-badge">今天</span>' : ''}

/* =====================================================================
   拖拉排序
   ===================================================================== */
function initSortable(listEl){
  if(!listEl) return;
  let dragging = null, placeholder = null, offsetY = 0;

  listEl.addEventListener('pointerdown', e => {
    const handle = e.target.closest('.drag-handle');
    if(!handle) return;
    const li = handle.closest('.sort-item');
    if(!li) return;

    e.preventDefault();
    const rect = li.getBoundingClientRect();
    offsetY = e.clientY - rect.top;

    placeholder = document.createElement('div');
    placeholder.className = 'sort-placeholder';
    placeholder.style.height = rect.height + 'px';

    li.parentNode.insertBefore(placeholder, li);
    li.classList.add('dragging');
    Object.assign(li.style, {
      position:'fixed',
      left: rect.left + 'px',
      top: rect.top + 'px',
      width: rect.width + 'px',
      zIndex: 9999,
      pointerEvents: 'none'
    });

    dragging = li;
    try{ listEl.setPointerCapture(e.pointerId); }catch(_){}
  });

  listEl.addEventListener('pointermove', e => {
    if(!dragging) return;
    e.preventDefault();
    dragging.style.top = (e.clientY - offsetY) + 'px';

    const y = e.clientY;
    const items = Array.from(listEl.querySelectorAll('.sort-item'))
                        .filter(el => el !== dragging);
    let target = null;
    for(const it of items){
      const r = it.getBoundingClientRect();
      if(y < r.top + r.height / 2){ target = it; break; }
    }
    if(target) listEl.insertBefore(placeholder, target);
    else listEl.appendChild(placeholder);
  });

  const end = e => {
    if(!dragging) return;
    const li = dragging;
    li.classList.remove('dragging');
    li.removeAttribute('style');
    if(placeholder && placeholder.parentNode){
      placeholder.parentNode.insertBefore(li, placeholder);
      placeholder.remove();
    }
    dragging = null; placeholder = null;

    const ids = Array.from(listEl.querySelectorAll('.sort-item')).map(el => el.dataset.id);
    const ordered = ids.map(id => S.categories.find(c => c.id === id)).filter(Boolean);
    S.categories = ordered;
    save();
    render();
  };

  listEl.addEventListener('pointerup', end);
  listEl.addEventListener('pointercancel', end);
  listEl.addEventListener('lostpointercapture', end);
}

function addCategory(){
  const name = (prompt('新增分類名稱：') || '').trim();
  if(!name) return;
  if(S.categories.some(c => c.name === name)){ alert('此分類已存在'); return; }
  const palette = ['#FF9F0A','#FF453A','#FF375F','#0A84FF','#30D158','#BF5AF2','#5AC8FA','#FFD60A','#64D2FF'];
  S.categories.splice(Math.max(0, S.categories.length - 1), 0, {
    id: uid(), name, color: palette[S.categories.length % palette.length]
  });
  save(); render();
}

function renameCategory(id){
  const c = S.categories.find(x => x.id === id);
  if(!c) return;
  const name = (prompt('修改分類名稱：', c.name) || '').trim();
  if(!name || name === c.name) return;
  if(S.categories.some(x => x.name === name && x.id !== id)){ alert('此分類名稱已存在'); return; }
  c.name = name;
  save(); render();
}

function deleteCategory(id){
  const c = S.categories.find(x => x.id === id);
  if(!c) return;
  if(c.fixed){ alert('「其他」分類為系統保留，無法刪除。'); return; }

  const affected = S.dishes.filter(d => d.catId === id);
  const other = otherCat();
  const msg = affected.length
    ? `確定刪除「${c.name}」分類嗎？\n\n此分類內的 ${affected.length} 項菜式，\n將會自動移到「${other.name}」分類。`
    : `確定刪除「${c.name}」分類嗎？\n\n此分類目前沒有菜式。`;
  if(!confirm(msg)) return;

  affected.forEach(d => { d.catId = other.id; });
  S.categories = S.categories.filter(x => x.id !== id);
  if(UI.dishFilter === id) UI.dishFilter = 'all';
  save(); render();
}

function doExportPDF(lang){

    'position:fixed;left:-9999px;top:0;width:420px;height:900px;border:0;');
  document.body.appendChild(iframe);

  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open(); doc.write(html); doc.close();

  setTimeout(() => {
    try{
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    }catch(err){
      alert('無法開啟列印視窗：' + err.message);
    }
    setTimeout(() => iframe.remove(), 3000);
  }, 450);
}

/* =====================================================================
   匯出 / 匯入資料
   ===================================================================== */
async function exportData(){
  const json = JSON.stringify(S, null, 2);
  const fname = `每週菜單_備份_${iso(new Date())}.json`;
  const blob = new Blob([json], {type:'application/json'});

  try{
    const file = new File([blob], fname, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title:'每週菜單備份' });
      return;
    }
  }catch(err){
    if(err && err.name === 'AbortError') return;
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
}

function importData(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || !Array.isArray(parsed.categories) || !Array.isArray(parsed.dishes)){
          throw new Error('檔案格式不正確');
        }
        if(!confirm('匯入將會覆蓋目前所有資料，確定要繼續嗎？')) return;
        S = migrate(parsed);
        save();
        render();
        alert('匯入成功！');
      }catch(err){
        alert('匯入失敗：' + err.message);
      }
    };
    reader.readAsText(f);
  };
  inp.click();
}

/* =====================================================================
   頭像
   ===================================================================== */
function pickAvatar(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      const SIZE = 320;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      const side = Math.min(img.width, img.height);
      ctx.drawImage(
        img,
        (img.width - side) / 2, (img.height - side) / 2, side, side,
        0, 0, SIZE, SIZE
      );
      S.settings.avatar = canvas.toDataURL('image/jpeg', 0.86);
      URL.revokeObjectURL(url);
      save();
      render();
    };
    img.onerror = () => { URL.revokeObjectURL(url); alert('無法讀取圖片'); };
    img.src = url;
  };
  inp.click();
}

/* =====================================================================
   Sheet 控制
   ===================================================================== */
function closeSheet(){
  const ov = $('#overlay');
  ov.classList.remove('show');
  ov.innerHTML = '';
}
function closePicker(){
  UI.picker = null;
  closeSheet();
  render();
}

/* =====================================================================
   事件處理
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;

  switch(a){

    /* --- Tab --- */
    case 'tab':
      UI.tab = el.dataset.tab;
      UI.picker = null;
      closeSheet();
      render();
      $('#view').scrollTop = 0;
      break;

    /* --- 週切換 --- */
    case 'shift-week': {
      const d = fromISO(UI.weekStart);
      d.setDate(d.getDate() + Number(el.dataset.delta) * 7);
      UI.weekStart = iso(d);
      render();
      break;
    }
    case 'this-week':
      UI.weekStart = iso(mondayOf(new Date()));
      render();
      break;

    /* --- 菜式選擇 --- */
    case 'open-picker':
      UI.picker = { day: Number(el.dataset.day), cat: 'all' };
      renderPicker();
      break;

    case 'close-picker':
      closePicker();
      break;

    case 'picker-cat':
      if(UI.picker){ UI.picker.cat = el.dataset.cat; renderPicker(); }
      break;

    case 'toggle-pick': {
      if(!UI.picker) break;
      const id = el.dataset.id;
      const menu = getMenu(UI.weekStart);
      const day = UI.picker.day;
      const arr = menu.days[day];
      const idx = arr.indexOf(id);
      if(idx >= 0){
        arr.splice(idx, 1);
      }else{
        arr.push(id);
        // 更新「上次烹飪日期」
        const d = new Date(fromISO(UI.weekStart));
        d.setDate(d.getDate() + day);
        const ds = iso(d);
        if(ds <= iso(new Date())){
          const dish = S.dishes.find(x => x.id === id);
          if(dish && (!dish.lastCooked || dish.lastCooked < ds)) dish.lastCooked = ds;
        }
      }
      save();
      renderPicker();
      break;
    }

    case 'del-dish': {
      const day = Number(el.dataset.day);
      const id = el.dataset.id;
      const menu = getMenu(UI.weekStart);
      const arr = menu.days[day];
      const i = arr.indexOf(id);
      if(i >= 0) arr.splice(i, 1);
      save();
      render();
      break;
    }

    /* --- 菜式庫 --- */
    case 'filter':
      UI.dishFilter = el.dataset.cat;
      render();
      break;

    case 'new-dish':
      openDishEditor(null);
      break;

    case 'edit-dish':
      openDishEditor(el.dataset.id);
      break;

    case 'save-dish':
      saveDishFromForm();
      break;

    case 'delete-dish-item': {
      const id = UI.editingDishId;
      if(!id) break;
      const dish = S.dishes.find(x => x.id === id);
      if(!dish) break;
      if(!confirm(`確定刪除菜式「${dish.name}」嗎？\n此菜式亦會從所有每週菜單中移除。`)) return;

      S.dishes = S.dishes.filter(x => x.id !== id);
      Object.values(S.menus).forEach(m => {
        if(!m || !Array.isArray(m.days)) return;
        m.days = m.days.map(arr => Array.isArray(arr) ? arr.filter(x => x !== id) : []);
      });
      save();
      closeSheet();
      render();
      break;
    }

    case 'close-sheet':
      closeSheet();
      break;

    /* --- 設定 --- */
    case 'set-theme':
      S.settings.theme = el.dataset.theme;
      save();
      render();
      break;

    case 'pick-avatar':
      pickAvatar();
      break;

    case 'add-cat':
      addCategory();
      break;

    case 'rename-cat':
      renameCategory(el.dataset.id);
      break;

    case 'delete-cat':
      deleteCategory(el.dataset.id);
      break;

    case 'export-data':
      exportData();
      break;

    case 'import-data':
      importData();
      break;

    case 'pdf-sheet':
      openPdfSheet();
      break;

    case 'pdf-lang':
      doExportPDF(el.dataset.lang);
      break;
  }
});

/* 輸入框事件（不重新渲染，避免失焦） */
document.addEventListener('input', e => {
  const el = e.target;
  const a = el.dataset.action;

  if(a === 'menu-diners'){
    getMenu(UI.weekStart).diners = Math.max(0, Number(el.value) || 0);
    save();
  }
  else if(a === 'menu-takeout'){
    getMenu(UI.weekStart).takeout = Math.max(0, Number(el.value) || 0);
    save();
  }
  else if(a === 'font-scale'){
    S.settings.fontScale = Number(el.value) / 100;
    applySettings();
    save();
    const v = el.parentElement.querySelector('.range-val');
    if(v) v.textContent = el.value + '%';
  }
});

/* 阻止雙指縮放（保持 App 感） */
document.addEventListener('gesturestart', e => e.preventDefault());

/* =====================================================================
   啟動
   ===================================================================== */
render();

/* Service Worker（若 sw.js 存在則註冊） */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
