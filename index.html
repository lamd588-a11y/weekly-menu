<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>每週菜單</title>
  
  <!-- PWA & iOS 設定 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="每週菜單">
  
  <!-- PDF 生成函式庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      /* 長者友善字體尺寸 */
      --font-size-base: 20px;
      --font-size-lg: 24px;
      --font-size-xl: 28px;
      --font-size-title: 32px;
      --font-size-sm: 16px;

      /* 色彩（淺色模式預設） */
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --text-sub: #495057;
      --primary: #2e7d32;
      --primary-light: #e8f5e9;
      --danger: #c62828;
      --border-color: #cccccc;
      --nav-bg: #ffffff;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f8f9fa;
      --text-sub: #b0bec5;
      --primary: #4caf50;
      --primary-light: #1b381e;
      --danger: #ef5350;
      --border-color: #444444;
      --nav-bg: #1e1e1e;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      touch-action: manipulation;
    }

    /* iPhone 18 Pro Max 滿版及安全區域調整 */
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--font-size-base);
      line-height: 1.5;
      padding-bottom: calc(90px + env(safe-area-inset-bottom));
      padding-top: env(safe-area-inset-top);
      max-width: 440px; /* iPhone Pro Max 大約寬度 */
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    /* 通用按鍵（大尺寸適合作者） */
    .btn {
      padding: 12px 18px;
      font-size: var(--font-size-base);
      font-weight: bold;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      background-color: var(--card-bg);
      color: var(--text-color);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 52px;
    }
    .btn-primary {
      background-color: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-danger {
      background-color: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .btn-icon {
      padding: 8px 14px;
      font-size: 24px;
    }

    /* 頂部標頭 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: var(--card-bg);
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .avatar-img {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary);
    }

    /* 底部導覽列（行高較圖標高一點） */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 440px;
      margin: 0 auto;
      height: calc(75px + env(safe-area-inset-bottom));
      background: var(--nav-bg);
      border-top: 2px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding-top: 8px;
      z-index: 1000;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      text-decoration: none;
      font-size: var(--font-size-sm);
      font-weight: bold;
      width: 33%;
      line-height: 1.4; /* 確保文字行高足夠高且舒適 */
    }
    .nav-item.active {
      color: var(--primary);
    }
    .nav-icon {
      font-size: 28px;
      margin-bottom: 2px;
    }

    /* 頁面容器 */
    .page {
      display: none;
      padding: 16px;
    }
    .page.active {
      display: block;
    }

    /* 菜式庫頁面：大正方形網格 (1行3個) */
    .dish-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    .category-square {
      aspect-ratio: 1 / 1;
      background-color: var(--card-bg);
      border: 3px solid var(--primary);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      cursor: pointer;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .category-emoji {
      font-size: 44px;
      margin-bottom: 4px;
    }
    .category-name {
      font-size: var(--font-size-base);
      font-weight: bold;
    }

    /* 頂部三按鈕同行 */
    .top-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .top-actions .btn {
      flex: 1;
      font-size: var(--font-size-base);
    }

    /* 彈出視窗 (Modal) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      border-radius: 20px;
      padding: 20px;
      overflow-y: auto;
      position: relative;
      box-shadow: var(--shadow);
    }
    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 32px;
      font-weight: bold;
      color: var(--text-color);
      cursor: pointer;
      border: none;
      background: none;
    }

    /* 菜式列表項目 */
    .dish-item {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .dish-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dish-name {
      font-size: var(--font-size-lg);
      font-weight: bold;
      color: var(--primary);
      cursor: pointer;
      text-decoration: underline;
    }
    .dish-indo {
      font-size: var(--font-size-base);
      color: var(--text-sub);
    }
    .dish-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    /* 每週菜單頁 */
    .menu-header-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .day-card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .day-header {
      background: var(--primary-light);
      padding: 12px 16px;
      font-size: var(--font-size-lg);
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .day-body {
      padding: 12px;
    }
    .people-count {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      background: var(--bg-color);
      padding: 8px 12px;
      border-radius: 8px;
    }
    .people-select {
      font-size: var(--font-size-base);
      padding: 4px 8px;
      border-radius: 6px;
    }

    /* 表單元件 */
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px;
      font-size: var(--font-size-base);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-color);
      color: var(--text-color);
    }

    /* PDF 匯出隱藏預覽區 */
    #pdf-template {
      display: none;
      background: white;
      color: black;
      padding: 20px;
      font-size: 18px;
    }
    #pdf-template h1 { font-size: 28px; text-align: center; margin-bottom: 15px; }
    #pdf-template .pdf-day { margin-bottom: 15px; border-bottom: 2px solid #000; padding-bottom: 10px; }
    #pdf-template .pdf-day-title { font-size: 22px; font-weight: bold; background: #eee; padding: 4px 8px; }
    #pdf-template .pdf-dish { margin-left: 10px; font-size: 20px; font-weight: bold; margin-top: 5px; }
    #pdf-template .pdf-note { margin-left: 20px; font-size: 16px; color: #444; }
  </style>
</head>
<body>

  <!-- 頂部標頭 (顯示頭像，無 App 名稱) -->
  <header>
    <img id="avatar-display" src="icon.png" class="avatar-img" alt="頭像">
    <div id="header-right-actions"></div>
  </header>

  <!-- 頁面 1: 菜式庫 -->
  <div id="page-dishes" class="page active">
    <!-- 功能 14: 頂部三按鈕同行 -->
    <div class="top-actions">
      <button class="btn" onclick="exportJSON()">匯出</button>
      <button class="btn" onclick="triggerImportJSON()">匯入</button>
      <button class="btn btn-primary" onclick="openAddDishModal()">新增菜式</button>
    </div>
    <input type="file" id="import-json-file" accept=".json,application/json" style="display:none;" onchange="importJSON(event)">

    <!-- 功能 8: 1行3個大正方形分類 -->
    <div class="dish-grid" id="category-grid"></div>
  </div>

  <!-- 頁面 2: 每週菜單 -->
  <div id="page-weekly" class="page">
    <!-- 功能 26: 日期選擇、儲存、匯出PDF 同行 -->
    <div class="menu-header-row">
      <input type="date" id="monday-picker" class="btn" style="flex:1;" onchange="validateMonday(this)">
      <button class="btn btn-primary btn-icon" onclick="saveWeeklyMenu()" title="儲存菜單">💾</button>
      <button class="btn btn-primary btn-icon" onclick="exportPDF()" title="匯出PDF">📄</button>
    </div>

    <!-- 功能 16: 一鍵開關所有日子 -->
    <div style="display: flex; gap: 8px; margin-bottom: 12px;">
      <button class="btn" style="flex:1;" onclick="toggleAllDays(true)">展開全部</button>
      <button class="btn" style="flex:1;" onclick="toggleAllDays(false)">折疊全部</button>
    </div>

    <!-- 7 天選單容器 -->
    <div id="weekly-days-container"></div>
  </div>

  <!-- 頁面 3: 我的菜單 -->
  <div id="page-my-menus" class="page">
    <h2 style="margin-bottom: 12px; font-size: var(--font-size-title);">我的菜單</h2>
    <div id="my-menus-container"></div>
  </div>

  <!-- 頁面 4: 設定 -->
  <div id="page-settings" class="page">
    <h2 style="margin-bottom: 16px; font-size: var(--font-size-title);">系統設定</h2>
    
    <!-- 功能 38: 深淺色模式 -->
    <div class="form-group">
      <label>外觀模式</label>
      <button class="btn" style="width: 100%;" onclick="toggleTheme()">切換 深色 / 淺色 模式</button>
    </div>

    <!-- 功能 40: 自訂字體大小 -->
    <div class="form-group">
      <label for="font-scale-select">字體大小調整</label>
      <select id="font-scale-select" onchange="changeFontScale(this.value)">
        <option value="1">標準 (長者適中)</option>
        <option value="1.15">放大 (較大)</option>
        <option value="1.3">特大 (超大)</option>
      </select>
    </div>

    <!-- 功能 39: 自訂頭像 -->
    <div class="form-group">
      <label>自訂頭像</label>
      <input type="file" id="avatar-input" accept="image/*" onchange="uploadAvatar(
