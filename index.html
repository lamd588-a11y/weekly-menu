<!DOCTYPE html>
<html lang="zh-HK" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>每週菜單</title>
  
  <!-- PWA & iOS 設定 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4F46E5">

  <!-- Tailwind CSS & html2pdf CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#4F46E5',
          }
        }
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* 針對 iPhone 18 Pro Max / Safe Area 優化 */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .font-size-sm { font-size: 0.875rem; }
    .font-size-base { font-size: 1rem; }
    .font-size-lg { font-size: 1.125rem; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans min-h-screen pb-20 font-size-base transition-colors duration-200">

  <!-- 頂部導航欄 (Top Header) -->
  <header class="sticky top-0 z-20 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <img id="header-avatar" src="icon.png" class="w-10 h-10 rounded-full object-cover border-2 border-brand" alt="頭像">
      <h1 class="text-xl font-bold text-brand dark:text-indigo-400" id="app-title">每週菜單</h1>
    </div>
    <div class="flex space-x-2">
      <button onclick="exportPDF()" class="bg-brand text-white text-xs px-3 py-1.5 rounded-lg shadow active:scale-95 transition">匯出 PDF</button>
    </div>
  </header>

  <!-- 主要內容區 (Main Content) -->
  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- 頁籤切換：主頁 (菜單) / 分類庫 / 設定 -->
    <div class="flex bg-gray-200 dark:bg-gray-700 p-1 rounded-xl text-sm font-medium">
      <button onclick="switchTab('menu')" id="tab-menu" class="flex-1 py-2 rounded-lg bg-white dark:bg-gray-800 shadow text-center">每週菜單</button>
      <button onclick="switchTab('dishes')" id="tab-dishes" class="flex-1 py-2 rounded-lg text-center">菜式分類庫</button>
      <button onclick="switchTab('settings')" id="tab-settings" class="flex-1 py-2 rounded-lg text-center">設定</button>
    </div>

    <!-- 1. 每週菜單頁面 (Weekly Menu Tab) -->
    <section id="page-menu" class="space-y-4">
      <div class="flex justify-between items-center bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm">
        <label class="text-sm font-bold">開始日期 (週一)：</label>
        <input type="date" id="start-date" onchange="updateWeekDates()" class="bg-gray-100 dark:bg-gray-700 px-3 py-1.5 rounded-lg text-sm outline-none">
      </div>

      <!-- 7 天菜單列表 -->
      <div id="weekly-cards-container" class="space-y-4">
        <!-- 由 JavaScript 動態生成 7 天卡片 -->
      </div>
    </section>

    <!-- 2. 菜式分類選單頁面 (Dishes Category Tab) -->
    <section id="page-dishes" class="hidden space-y-4">
      <div class="text-xs text-gray-500 dark:text-gray-400">💡 點擊菜式即可快速「一點即選」加至目前選取的星期菜單。</div>
      
      <!-- 分類列表動態生成 -->
      <div id="category-dishes-container" class="space-y-4"></div>
    </section>

    <!-- 3. 設定頁面 (Settings Tab) -->
    <section id="page-settings" class="hidden space-y-6">
      
      <!-- 個人頭像設定 -->
      <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm space-y-3">
        <h3 class="font-bold border-b pb-2 dark:border-gray-700">自訂頭像</h3>
        <div class="flex items-center space-x-4">
          <img id="settings-avatar-preview" src="icon.png" class="w-16 h-16 rounded-full object-cover border-2 border-brand">
          <input type="file" id="avatar-input" accept="image/*" onchange="changeAvatar(event)" class="text-xs text-gray-500">
        </div>
      </div>

      <!-- 深淺色模式與字體 -->
      <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm space-y-4">
        <h3 class="font-bold border-b pb-2 dark:border-gray-700">顯示與介面</h3>
        <div class="flex justify-between items-center">
          <span>深色模式</span>
          <button onclick="toggleDarkMode()" class="px-4 py-1.5 bg-gray-200 dark:bg-gray-600 rounded-lg text-sm">切換模式</button>
        </div>
        <div class="flex justify-between items-center">
          <span>字體大小</span>
          <select id="font-size-select" onchange="changeFontSize(this.value)" class="bg-gray-100 dark:bg-gray-700 p-2 rounded-lg text-sm">
            <option value="sm">小</option>
            <option value="base" selected>中</option>
            <option value="lg">大</option>
          </select>
        </div>
      </div>

      <!-- 分類管理：新增、刪除、拖拉排序 -->
      <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm space-y-4">
        <h3 class="font-bold border-b pb-2 dark:border-gray-700">分類管理 (可拖動排序)</h3>
        
        <div class="flex space-x-2">
          <input type="text" id="new-cat-input" placeholder="新增分類名稱" class="flex-1 bg-gray-100 dark:bg-gray-700 p-2 rounded-lg text-sm border-none outline-none">
          <button onclick="addCategory()" class="bg-brand text-white px-4 py-2 rounded-lg text-sm">新增</button>
        </div>

        <ul id="category-settings-list" class="space-y-2">
          <!-- 動態載入分類項，支援上下移動與刪除 -->
        </ul>
      </div>

      <!-- 菜式管理與重新分類 -->
      <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm space-y-4">
        <h3 class="font-bold border-b pb-2 dark:border-gray-700">新增與重新分類菜式</h3>
        <div class="space-y-2">
          <input type="text" id="new-dish-name" placeholder="菜式中文名稱 (例: 宮保雞丁)" class="w-full bg-gray-100 dark:bg-gray-700 p-2 rounded-lg text-sm outline-none">
          <input type="text" id="new-dish-id" placeholder="印尼文翻譯 (自動生成或自訂)" class="w-full bg-gray-100 dark:bg-gray-700 p-2 rounded-lg text-sm outline-none">
          <select id="new-dish-cat" class="w-full bg-gray-100 dark:bg-gray-700 p-2 rounded-lg text-sm outline-none"></select>
          <button onclick="addDish()" class="w-full bg-brand text-white py-2 rounded-lg text-sm font-bold">新增菜式</button>
        </div>
      </div>

    </section>
  </main>

  <!-- 隱藏的 PDF 匯出列印模板 (PDF Export Template) -->
  <div id="pdf-template" class="hidden p-8 bg-white text-black space-y-6">
    <h1 id="pdf-title" class="text-2xl font-bold text-center border-b-2 border-black pb-4">每週菜單 / Menu Mingguan</h1>
    <div id="pdf-content" class="space-y-4"></div>
  </div>

  <!-- JavaScript 邏輯區 -->
  <script>
    // 預設資料庫
    let categories = ["雞", "牛", "豬", "魚", "菜", "湯", "其他"];
    let dishes = [
      { id: 1, name: "海南雞", idName: "Ayam Hainan", cat: "雞", lastCooked: "" },
      { id: 2, name: "炒牛肉", idName: "Daging Sapi Tumis", cat: "牛", lastCooked: "" },
      { id: 3, name: "咕嚕肉", idName: "Babi Asam Manis", cat: "豬", lastCooked: "" },
      { id: 4, name: "蒸水蛋", idName: "Telur Kukus", cat: "菜", lastCooked: "" },
      { id: 5, name: "蕃茄豆腐湯", idName: "Sup Tahu Tomat", cat: "湯", lastCooked: "" }
    ];

    // 初始化 7 天菜單結構
    const daysOfWeek = [
      { zh: "星期一", id: "Senin" },
      { zh: "星期二", id: "Selasa" },
      { zh: "星期三", id: "Rabu" },
      { zh: "星期四", id: "Kamis" },
      { zh: "星期五", id: "Jumat" },
      { zh: "星期六", id: "Sabtu" },
      { zh: "星期日", id: "Minggu" }
    ];

    let weeklyMenu = daysOfWeek.map(d => ({
      day: d.zh,
      dayId: d.id,
      date: "",
      dishes: [],
      diners: 2,
      takeout: 0
    }));

    let selectedDayIndex = 0;

    // 頁面載入初始化
    window.onload = function() {
      initDates();
      loadLocalStorage();
      renderWeeklyMenu();
      renderCategoryDishes();
      renderSettings();
    };

    // 初始化日期 (設為本週一)
    function initDates() {
      const now = new Date();
      const day = now.getDay();
      const diff = now.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(now.setDate(diff));
      document.getElementById('start-date').value = monday.toISOString().split('T')[0];
      updateWeekDates();
    }

    function updateWeekDates() {
      const startDate = new Date(document.getElementById('start-date').value);
      weeklyMenu.forEach((m, idx) => {
        const d = new Date(startDate);
        d.setDate(startDate.getDate() + idx);
        m.date = `${d.getMonth() + 1}/${d.getDate()}`;
      });
      renderWeeklyMenu();
    }

    // 頁籤切換
    function switchTab(tab) {
      ['menu', 'dishes', 'settings'].forEach(t => {
        document.getElementById(`page-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).classList.remove('bg-white', 'dark:bg-gray-800', 'shadow');
      });
      document.getElementById(`page-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).classList.add('bg-white', 'dark:bg-gray-800', 'shadow');
    }

    // 渲染每週菜單 (7天卡片)
    function renderWeeklyMenu() {
      const container = document.getElementById('weekly-cards-container');
      container.innerHTML = '';

      weeklyMenu.forEach((dayData, idx) => {
        const card = document.createElement('div');
        card.className = `bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border-2 ${selectedDayIndex === idx ? 'border-brand' : 'border-transparent'}`;
        card.onclick = () => { selectedDayIndex = idx; renderWeeklyMenu(); };

        const dishListHtml = dayData.dishes.length > 0
          ? dayData.dishes.map((d, dIdx) => `
              <div class="flex justify-between items-center py-1 border-b border-gray-100 dark:border-gray-700 text-sm">
                <div>
                  <span class="font-medium">${d.name}</span>
                  <span class="text-xs text-gray-400 block">${d.idName}</span>
                </div>
                <button onclick="removeDishFromDay(event, ${idx}, ${dIdx})" class="text-red-500 text-xs">刪除</button>
              </div>
            `).join('')
          : `<p class="text-xs text-gray-400 italic">尚未選擇菜式 (點擊下方分類庫一點即選)</p>`;

        card.innerHTML = `
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-base">${dayData.day} <span class="text-xs text-gray-500">(${dayData.date})</span></span>
            <span class="text-xs bg-indigo-100 dark:bg-indigo-900 text-brand dark:text-indigo-300 px-2 py-0.5 rounded-full">${dayData.dayId}</span>
          </div>
          <div class="space-y-1 mb-3">${dishListHtml}</div>
          <div class="flex space-x-4 text-xs text-gray-500 dark:text-gray-400 border-t pt-2 dark:border-gray-700">
            <label>用餐人數: <input type="number" value="${dayData.diners}" onchange="updatePeople(${idx}, 'diners', this.value)" class="w-12 bg-gray-100 dark:bg-gray-700 rounded px-1 text-center"></label>
            <label>外帶人數: <input type="number" value="${dayData.takeout}" onchange="updatePeople(${idx}, 'takeout', this.value)" class="w-12 bg-gray-100 dark:bg-gray-700 rounded px-1 text-center"></label>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updatePeople(dayIdx, key, val) {
      weeklyMenu[dayIdx][key] = parseInt(val) || 0;
      saveLocalStorage();
    }

    function removeDishFromDay(e, dayIdx, dishIdx) {
      e.stopPropagation();
      weeklyMenu[dayIdx].dishes.splice(dishIdx, 1);
      renderWeeklyMenu();
      saveLocalStorage();
    }

    // 渲染分類與菜式選單 (支援一點即選)
    function renderCategoryDishes() {
      const container = document.getElementById('category-dishes-container');
      container.innerHTML = '';

      categories.forEach(cat => {
        const catDishes = dishes.filter(d => d.cat === cat);
        const catBox = document.createElement('div');
        catBox.className = "bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm space-y-2";

        const dishItems = catDishes.map(d => `
          <div onclick="quickSelectDish(${d.id})" class="flex justify-between items-center p-2 bg-gray-50 dark:bg-gray-700 rounded-lg active:bg-indigo-50 dark:active:bg-indigo-950 cursor-pointer">
            <div>
              <div class="font-medium text-sm">${d.name} <span class="text-xs text-gray-400">(${d.idName})</span></div>
              <div class="text-[10px] text-gray-400">上次烹飪: ${d.lastCooked || '未有紀錄'}</div>
            </div>
            <span class="text-xs text-brand dark:text-indigo-400 font-bold">+ 加入</span>
          </div>
        `).join('');

        catBox.innerHTML = `
          <h4 class="font-bold text-sm text-brand dark:text-indigo-400 border-b pb-1 dark:border-gray-700">${cat}</h4>
          <div class="space-y-1">${dishItems || '<p class="text-xs text-gray-400">此分類暫無菜式</p>'}</div>
        `;
        container.appendChild(catBox);
      });
    }

    // 一點即選功能
    function quickSelectDish(dishId) {
      const dish = dishes.find(d => d.id === dishId);
      if (!dish) return;

      // 加入選取的星期
      weeklyMenu[selectedDayIndex].dishes.push({ ...dish });
      
      // 更新上次烹飪日期
      const today = new Date();
      dish.lastCooked = `${today.getMonth() + 1}/${today.getDate()}`;

      renderWeeklyMenu();
      renderCategoryDishes();
      saveLocalStorage();

      alert(`已將「${dish.name}」加入到 ${weeklyMenu[selectedDayIndex].day}！`);
    }

    // 渲染設定頁面
    function renderSettings() {
      // 載入分類清單 (支援排序與刪除)
      const catList = document.getElementById('category-settings-list');
      catList.innerHTML = '';
      categories.forEach((cat, idx) => {
        const li = document.createElement('li');
        li.className = "flex justify-between items-center bg-gray-50 dark:bg-gray-700 p-2 rounded-lg text-sm";
        li.innerHTML = `
          <span>${cat}</span>
          <div class="space-x-1">
            <button onclick="moveCategory(${idx}, -1)" class="px-2 py-0.5 bg-gray-200 dark:bg-gray-600 rounded text-xs">↑</button>
            <button onclick="moveCategory(${idx}, 1)" class="px-2 py-0.5 bg-gray-200 dark:bg-gray-600 rounded text-xs">↓</button>
            ${cat !== '其他' ? `<button onclick="deleteCategory('${cat}')" class="px-2 py-0.5 bg-red-500 text-white rounded text-xs">刪除</button>` : ''}
          </div>
        `;
        catList.appendChild(li);
      });

      // 更新新增菜式的分類下拉選單
      const catSelect = document.getElementById('new-dish-cat');
      catSelect.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    // 分類移動排序
    function moveCategory(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= categories.length) return;
      const temp = categories[index];
      categories[index] = categories[targetIndex];
      categories[targetIndex] = temp;
      renderSettings();
      renderCategoryDishes();
      saveLocalStorage();
    }

    // 刪除分類並將項目自動轉移至「其他」
    function deleteCategory(catName) {
      if (catName === '其他') return;
      
      const confirmDelete = confirm(`警告：刪除「${catName}」分類後，該分類下的所有菜式將會自動轉移到「其他」分類。確定要刪除嗎？`);
      if (!confirmDelete) return;

      // 轉移菜式
      dishes.forEach(d => {
        if (d.cat === catName) d.cat = '其他';
      });

      // 移除分類
      categories = categories.filter(c => c !== catName);

      renderSettings();
      renderCategoryDishes();
      saveLocalStorage();
    }

    function addCategory() {
      const input = document.getElementById('new-cat-input');
      const val = input.value.trim();
      if (val && !categories.includes(val)) {
        categories.push(val);
        input.value = '';
        renderSettings();
        renderCategoryDishes();
        saveLocalStorage();
      }
    }

    function addDish() {
      const name = document.getElementById('new-dish-name').value.trim();
      let idName = document.getElementById('new-dish-id').value.trim();
      const cat = document.getElementById('new-dish-cat').value;

      if (!name) { alert("請輸入菜式名稱"); return; }
      if (!idName) idName = name; // 簡化處理

      dishes.push({
        id: Date.now(),
        name,
        idName,
        cat,
        lastCooked: ""
      });

      document.getElementById('new-dish-name').value = '';
      document.getElementById('new-dish-id').value = '';
      renderCategoryDishes();
      saveLocalStorage();
      alert("菜式新增成功！");
    }

    // 匯出 PDF 功能 (支援中文 / 印尼文選擇)
    function exportPDF() {
      const lang = confirm("選擇匯出語言：\n按下【確定】匯出中文版 (Chinese)\n按下【取消】匯出印尼文版 (Indonesian)") ? 'zh' : 'id';
      
      const pdfContent = document.getElementById('pdf-content');
      document.getElementById('pdf-title').innerText = lang === 'zh' ? '每週菜單' : 'Menu Mingguan';
      
      pdfContent.innerHTML = weeklyMenu.map(m => `
        <div style="border-bottom: 1px solid #ccc; padding-bottom: 8px;">
          <h3 style="font-weight: bold; font-size: 16px;">
            ${lang === 'zh' ? m.day : m.dayId} (${m.date}) 
            - ${lang === 'zh' ? '用餐' : 'Makan'}: ${m.diners}人 | ${lang === 'zh' ? '外帶' : 'Bungkus'}: ${m.takeout}人
          </h3>
          <ul style="margin-left: 20px; list-style-type: disc;">
            ${m.dishes.length > 0 
              ? m.dishes.map(d => `<li>${lang === 'zh' ? d.name : d.idName}</li>`).join('') 
              : `<li>${lang === 'zh' ? '無' : 'Tidak ada'}</li>`}
          </ul>
        </div>
      `).join('');

      const element = document.getElementById('pdf-template');
      element.classList.remove('hidden');

      const opt = {
        margin:       0.5,
        filename:     `Weekly_Menu_${lang}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        element.classList.add('hidden');
      });
    }

    // 設定：變更頭像
    function changeAvatar(event) {
      const reader = new FileReader();
      reader.onload = function() {
        const url = reader.result;
        document.getElementById('header-avatar').src = url;
        document.getElementById('settings-avatar-preview').src = url;
        localStorage.setItem('custom_avatar', url);
      };
      if (event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
    }

    // 設定：深淺色模式
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    // 設定：字體大小
    function changeFontSize(size) {
      document.body.classList.remove('font-size-sm', 'font-size-base', 'font-size-lg');
      document.body.classList.add(`font-size-${size}`);
      localStorage.setItem('font_size', size);
    }

    // 本地儲存 (LocalStorage)
    function saveLocalStorage() {
      localStorage.setItem('menu_categories', JSON.stringify(categories));
      localStorage.setItem('menu_dishes', JSON.stringify(dishes));
      localStorage.setItem('weekly_menu', JSON.stringify(weeklyMenu));
    }

    function loadLocalStorage() {
      const savedCat = localStorage.getItem('menu_categories');
      const savedDishes = localStorage.getItem('menu_dishes');
      const savedMenu = localStorage.getItem('weekly_menu');
      const savedAvatar = localStorage.getItem('custom_avatar');
      const savedTheme = localStorage.getItem('theme');
      const savedFontSize = localStorage.getItem('font_size');

      if (savedCat) categories = JSON.parse(savedCat);
      if (savedDishes) dishes = JSON.parse(savedDishes);
      if (savedMenu) weeklyMenu = JSON.parse(savedMenu);
      if (savedAvatar) {
        document.getElementById('header-avatar').src = savedAvatar;
        document.getElementById('settings-avatar-preview').src = savedAvatar;
      }
      if (savedTheme === 'dark') document.documentElement.classList.add('dark');
      if (savedFontSize) changeFontSize(savedFontSize);
    }
  </script>
</body>
</html>
