<!DOCTYPE html>
<html lang="zh-HK" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>每週菜單</title>
  
  <!-- PWA & iOS 設定 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="每週菜單">

  <!-- jspdf 用於匯出 PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-color: #000000;
      --sub-text: #8e8e93;
      --primary: #007aff;
      --border-color: #e5e5ea;
      --font-base: 16px;
    }

    [data-theme="dark"] {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --text-color: #ffffff;
      --sub-text: #8e8e93;
      --primary: #0a84ff;
      --border-color: #38383a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      font-size: var(--font-base);
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      /* 適應 iPhone 18 Pro Max 等動態島/瀏海屏安全區域 */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* 頂部 Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      margin: 0;
      font-size: calc(var(--font-base) * 1.3);
      font-weight: 700;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary);
    }

    /* 主內容區 */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: none;
    }

    main.active {
      display: block;
    }

    /* 底部導覽列 */
    nav {
      display: flex;
      justify-content: space-around;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 8px 0;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--sub-text);
      font-size: calc(var(--font-base) * 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--primary);
      font-weight: bold;
    }

    /* 卡片與元件樣式 */
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .btn {
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: var(--font-base);
      font-weight: 600;
      width: 100%;
      margin-top: 8px;
      cursor: pointer;
    }

    .btn-danger {
      background-color: #ff3b30;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--font-base);
    }

    /* 每週菜單單日樣式 */
    .day-block {
      border-bottom: 1px solid var(--border-color);
      padding: 10px 0;
    }

    .day-title {
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .dish-list-item {
      display: block;
      margin-top: 4px;
      padding-left: 8px;
      border-left: 3px solid var(--primary);
    }

    /* 拖拉排序列表 */
    .drag-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: var(--bg-color);
      margin-bottom: 6px;
      border-radius: 6px;
      cursor: grab;
    }

    .dish-tag {
      font-size: 0.85em;
      color: var(--sub-text);
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <!-- Header 包含頭像 (需求 4) -->
  <header>
    <h1>每週菜單</h1>
    <img id="header-avatar" class="avatar" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><circle cx='20' cy='20' r='20' fill='%23ccc'/></svg>" alt="頭像">
  </header>

  <!-- TAB 1: 每週菜單 (需求 7, 8, 9, 10, 11) -->
  <main id="tab-menu" class="active">
    <div class="card">
      <h3>新增 / 選擇每週菜單</h3>
      <label>開始日期 (星期一)：</label>
      <input type="date" id="menu-start-date">
      <button class="btn" onclick="generateWeeklyMenu()">生成 / 載入本週菜單</button>
    </div>

    <div id="weekly-container"></div>

    <div class="card" id="pdf-export-card" style="display:none;">
      <h3>匯出菜單 PDF</h3>
      <label>選擇語言：</label>
      <select id="pdf-lang">
        <option value="zh">中文</option>
        <option value="id">印尼文 (Bahasa Indonesia)</option>
      </select>
      <button class="btn" onclick="exportMenuPDF()">匯出每週菜單 PDF</button>
    </div>
  </main>

  <!-- TAB 2: 菜式庫 (需求 6, 7) -->
  <main id="tab-dishes">
    <div class="card">
      <h3>新增菜式</h3>
      <input type="text" id="new-dish-name" placeholder="菜式名稱 (例如: 清蒸海上鮮)">
      <label>所屬分類：</label>
      <select id="new-dish-category"></select>
      <button class="btn" onclick="addDish()">新增菜式</button>
    </div>

    <div class="card">
      <h3>菜式清單</h3>
      <div id="dishes-container"></div>
    </div>
  </main>

  <!-- TAB 3: 設定 (需求 5, 12, 13, 14, 15, 16, 17) -->
  <main id="tab-settings">
    <!-- 個人頭像設定 (需求 16) -->
    <div class="card">
      <h3>個人頭像</h3>
      <input type="file" id="avatar-input" accept="image/*" onchange="uploadAvatar(event)">
    </div>

    <!-- 深淺色與字體 (需求 15, 17) -->
    <div class="card">
      <h3>顯示設定</h3>
      <label>主題：</label>
      <select id="theme-select" onchange="changeTheme(this.value)">
        <option value="light">淺色模式 (Light)</option>
        <option value="dark">深色模式 (Dark)</option>
      </select>

      <label style="margin-top: 10px; display:block;">字體大小：</label>
      <select id="font-size-select" onchange="changeFontSize(this.value)">
        <option value="14px">小</option>
        <option value="16px" selected>標準</option>
        <option value="18px">大</option>
        <option value="20px">特大</option>
      </select>
    </div>

    <!-- 分類管理與拖拉排序 (需求 12, 13, 14) -->
    <div class="card">
      <h3>管理分類 (按住可拖拉排序)</h3>
      <div id="category-drag-list"></div>
      
      <h4 style="margin-top:15px;">新增分類</h4>
      <input type="text" id="new-cat-name" placeholder="分類名稱">
      <button class="btn" onclick="addCategory()">新增分類</button>
    </div>

    <!-- 匯出匯入 (需求 5) -->
    <div class="card">
      <h3>資料備份與復原 (JSON)</h3>
      <button class="btn" onclick="exportData()">匯出資料 (支援 iPhone)</button>
      <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importData(event)">
      <button class="btn" style="background-color:#34c759;" onclick="document.getElementById('import-file').click()">匯入資料</button>
    </div>
  </main>

  <!-- 底部導覽列 -->
  <nav>
    <button class="nav-btn active" onclick="switchTab('tab-menu', this)">每週菜單</button>
    <button class="nav-btn" onclick="switchTab('tab-dishes', this)">菜式庫</button>
    <button class="nav-btn" onclick="switchTab('tab-settings', this)">設定</button>
  </nav>

  <script>
    // --- 預設資料結構 ---
    const DEFAULT_CATEGORIES = ["雞", "牛", "豬", "魚", "菜", "湯", "其他"];
    
    let appData = {
      categories: [...DEFAULT_CATEGORIES],
      dishes: [
        { id: '1', name: '白切雞', category: '雞', lastCooked: '' },
        { id: '2', name: '清蒸海上鮮', category: '魚', lastCooked: '' }
      ],
      weeklyMenus: {}, // key: YYYY-MM-DD (monday)
      avatar: '',
      theme: 'light',
      fontSize: '16px'
    };

    // --- 初始化 ---
    window.addEventListener('DOMContentLoaded', () => {
      loadLocalStorage();
      applySettings();
      renderCategorySelects();
      renderCategoryDragList();
      renderDishes();
      
      // 預設日期設為本週一
      document.getElementById('menu-start-date').value = getMonday(new Date()).toISOString().split('T')[0];
    });

    function saveLocalStorage() {
      localStorage.setItem('weekly_menu_app_data', JSON.stringify(appData));
    }

    function loadLocalStorage() {
      const saved = localStorage.getItem('weekly_menu_app_data');
      if (saved) {
        appData = { ...appData, ...JSON.parse(saved) };
      }
    }

    function applySettings() {
      // 主題 (需求 15)
      document.documentElement.setAttribute('data-theme', appData.theme);
      document.getElementById('theme-select').value = appData.theme;

      // 字體 (需求 17)
      document.documentElement.style.setProperty('--font-base', appData.fontSize);
      document.getElementById('font-size-select').value = appData.fontSize;

      // 頭像 (需求 4, 16)
      if (appData.avatar) {
        document.getElementById('header-avatar').src = appData.avatar;
      }
    }

    // Tab 切換
    function switchTab(tabId, btn) {
      document.querySelectorAll('main').forEach(m => m.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');

      if(tabId === 'tab-dishes') renderDishes();
    }

    // --- 計算星期一 ---
    function getMonday(d) {
      d = new Date(d);
      const day = d.getDay(), diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }

    // --- 分類管理 (需求 6, 12, 13, 14) ---
    function renderCategorySelects() {
      const select = document.getElementById('new-dish-category');
      select.innerHTML = appData.categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function renderCategoryDragList() {
      const container = document.getElementById('category-drag-list');
      container.innerHTML = appData.categories.map((cat, index) => `
        <div class="drag-item" draggable="true" ondragstart="dragStart(event, ${index})" ondragover="dragOver(event)" ondrop="drop(event, ${index})">
          <span>${cat}</span>
          ${cat !== '其他' ? `<button onclick="deleteCategory('${cat}')" style="color:red; background:none; border:none;">刪除</button>` : ''}
        </div>
      `).join('');
    }

    let draggedIdx = null;
    function dragStart(e, index) { draggedIdx = index; }
    function dragOver(e) { e.preventDefault(); }
    function drop(e, targetIdx) {
      e.preventDefault();
      const item = appData.categories.splice(draggedIdx, 1)[0];
      appData.categories.splice(targetIdx, 0, item);
      saveLocalStorage();
      renderCategoryDragList();
      renderCategorySelects();
    }

    function addCategory() {
      const name = document.getElementById('new-cat-name').value.trim();
      if (name && !appData.categories.includes(name)) {
        appData.categories.push(name);
        document.getElementById('new-cat-name').value = '';
        saveLocalStorage();
        renderCategoryDragList();
        renderCategorySelects();
      }
    }

    // 需求 14: 刪除分類時提示並移動至「其他」
    function deleteCategory(catName) {
      if (catName === '其他') return;
      if (confirm(`刪除分類「${catName}」後，其中的所有菜式將會自動移至「其他」分類。確定刪除？`)) {
        appData.dishes.forEach(d => {
          if (d.category === catName) d.category = '其他';
        });
        appData.categories = appData.categories.filter(c => c !== catName);
        saveLocalStorage();
        renderCategoryDragList();
        renderCategorySelects();
        renderDishes();
      }
    }

    // --- 菜式庫管理 ---
    function addDish() {
      const name = document.getElementById('new-dish-name').value.trim();
      const category = document.getElementById('new-dish-category').value;
      if (name) {
        appData.dishes.push({
          id: Date.now().toString(),
          name,
          category,
          lastCooked: ''
        });
        document.getElementById('new-dish-name').value = '';
        saveLocalStorage();
        renderDishes();
      }
    }

    function renderDishes() {
      const container = document.getElementById('dishes-container');
      container.innerHTML = appData.categories.map(cat => {
        const catDishes = appData.dishes.filter(d => d.category === cat);
        return `
          <h4>${cat}</h4>
          ${catDishes.length === 0 ? '<div style="color:var(--sub-text)">無菜式</div>' : ''}
          ${catDishes.map(d => `
            <div style="display:flex; justify-content:space-between; margin:4px 0;">
              <span>${d.name} <span class="dish-tag">上次烹飪: ${d.lastCooked || '未紀錄'}</span></span>
            </div>
          `).join('')}
        `;
      }).join('');
    }

    // --- 每週菜單邏輯 (需求 7, 8, 9, 10) ---
    function generateWeeklyMenu() {
      const dateVal = document.getElementById('menu-start-date').value;
      if (!dateVal) return;
      
      const startDate = getMonday(new Date(dateVal));
      const mondayStr = startDate.toISOString().split('T')[0];

      if (!appData.weeklyMenus[mondayStr]) {
        // 初始化 7 天菜單 (星期一開始)
        const days = [];
        for (let i = 0; i < 7; i++) {
          const currentDate = new Date(startDate);
          currentDate.setDate(startDate.getDate() + i);
          days.push({
            dateStr: currentDate.toISOString().split('T')[0],
            dayName: ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'][i],
            dishes: [],
            diners: 0,
            takeouts: 0
          });
        }
        appData.weeklyMenus[mondayStr] = { mondayStr, days };
        saveLocalStorage();
      }

      renderWeeklyMenu(mondayStr);
    }

    function renderWeeklyMenu(mondayStr) {
      const menu = appData.weeklyMenus[mondayStr];
      const container = document.getElementById('weekly-container');
      
      let html = `<div class="card"><h2>菜單週次: ${mondayStr}</h2>`;
      
      menu.days.forEach((day, dayIdx) => {
        html += `
          <div class="day-block">
            <div class="day-title">${day.dayName} (${day.dateStr})</div>
            <div>
              <label>用餐人數: <input type="number" value="${day.diners}" style="width:60px;" onchange="updateDayMeta('${mondayStr}', ${dayIdx}, 'diners', this.value)"></label>
              <label> 外帶人數: <input type="number" value="${day.takeouts}" style="width:60px;" onchange="updateDayMeta('${mondayStr}', ${dayIdx}, 'takeouts', this.value)"></label>
            </div>
            <div style="margin-top:6px;">
              <strong>已選菜式 (分行顯示):</strong>
              <div id="selected-dishes-${dayIdx}">
                ${day.dishes.map((dishId, dIdx) => {
                  const dish = appData.dishes.find(d => d.id === dishId);
                  return `<div class="dish-list-item">${dish ? dish.name : '已刪除'} <a href="#" onclick="removeDishFromDay('${mondayStr}', ${dayIdx},${dIdx})" style="color:red;margin-left:8px;">刪除</a></div>`;
                }).join('')}
              </div>
            </div>
            <div style="margin-top:6px;">
              <select id="select-dish-${dayIdx}">
                <option value="">-- 選擇菜式加入 --</option>
                ${appData.dishes.map(d => `<option value="${d.id}">${d.name} (${d.category} - 上次: ${d.lastCooked || '無'})</option>`).join('')}
              </select>
              <button class="btn" style="padding:4px 8px; width:auto;" onclick="addDishToDay('${mondayStr}', ${dayIdx})">加入</button>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
      document.getElementById('pdf-export-card').style.display = 'block';
    }

    function updateDayMeta(mondayStr, dayIdx, key, value) {
      appData.weeklyMenus[mondayStr].days[dayIdx][key] = parseInt(value) || 0;
      saveLocalStorage();
    }

    function addDishToDay(mondayStr, dayIdx) {
      const select = document.getElementById(`select-dish-${dayIdx}`);
      const dishId = select.value;
      if (!dishId) return;

      const dayObj = appData.weeklyMenus[mondayStr].days[dayIdx];
      dayObj.dishes.push(dishId);

      // 更新菜式最後烹飪日期 (需求 7)
      const dish = appData.dishes.find(d => d.id === dishId);
      if (dish) {
        dish.lastCooked = dayObj.dateStr;
      }

      saveLocalStorage();
      renderWeeklyMenu(mondayStr);
    }

    function removeDishFromDay(mondayStr, dayIdx, dishIdx) {
      appData.weeklyMenus[mondayStr].days[dayIdx].dishes.splice(dishIdx, 1);
      saveLocalStorage();
      renderWeeklyMenu(mondayStr);
    }

    // --- PDF 匯出功能 (需求 11: 中文 / 印尼文) ---
    function exportMenuPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const dateVal = document.getElementById('menu-start-date').value;
      const mondayStr = getMonday(new Date(dateVal)).toISOString().split('T')[0];
      const menu = appData.weeklyMenus[mondayStr];
      const lang = document.getElementById('pdf-lang').value;

      if (!menu) {
        alert('請先載入菜單！');
        return;
      }

      const dict = {
        zh: { title: "每週菜單", diners: "用餐人數", takeouts: "外帶人數", dishes: "菜式" },
        id: { title: "Menu Mingguan", diners: "Jumlah Pemakan", takeouts: "Jumlah Bungkus", dishes: "Menu Makanan" }
      };

      const t = dict[lang];
      let y = 20;

      doc.setFontSize(18);
      doc.text(`${t.title} (${mondayStr})`, 14, y);
      y += 10;

      doc.setFontSize(12);
      menu.days.forEach(day => {
        doc.text(`${day.dayName} [${day.dateStr}] - ${t.diners}: ${day.diners}, ${t.takeouts}: ${day.takeouts}`, 14, y);
        y += 6;

        day.dishes.forEach(dId => {
          const dish = appData.dishes.find(d => d.id === dId);
          if (dish) {
            doc.text(`  - ${dish.name}`, 14, y);
            y += 6;
          }
        });
        y += 4;
      });

      doc.save(`Weekly_Menu_${mondayStr}_${lang}.pdf`);
    }

    // --- 系統設定 (需求 15, 16, 17) ---
    function changeTheme(val) {
      appData.theme = val;
      saveLocalStorage();
      applySettings();
    }

    function changeFontSize(val) {
      appData.fontSize = val;
      saveLocalStorage();
      applySettings();
    }

    function uploadAvatar(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          appData.avatar = evt.target.result;
          saveLocalStorage();
          applySettings();
        };
        reader.readAsDataURL(file);
      }
    }

    // --- 匯出匯入 JSON (需求 5: 支援 iPhone) ---
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `weekly_menu_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          try {
            const imported = JSON.parse(evt.target.result);
            appData = { ...appData, ...imported };
            saveLocalStorage();
            applySettings();
            renderCategoryDragList();
            renderCategorySelects();
            renderDishes();
            alert('成功匯入資料！');
          } catch (err) {
            alert('檔案格式不正確！');
          }
        };
        reader.readAsText(file);
      }
    }
  </script>
</body>
</html>
