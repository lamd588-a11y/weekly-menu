<!DOCTYPE html>
<html lang="zh-HK" data-theme="light">
<head>
  <meta charset="UTF-8">
  <!-- iPhone 18 Pro Max 等現代 iOS 裝置 Viewport 設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>每週菜單</title>
  
  <!-- PWA & iOS 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="每週菜單">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <!-- html2pdf.js 庫 (用於生成與匯出 PDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-color: #000000;
      --sub-text: #8e8e93;
      --border-color: #e5e5ea;
      --primary-color: #007aff;
      --danger-color: #ff3b30;
      --base-font-size: 16px;
      --safe-top: env(safe-area-inset-top, 47px);
      --safe-bottom: env(safe-area-inset-bottom, 34px);
    }

    [data-theme="dark"] {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --text-color: #ffffff;
      --sub-text: #8e8e93;
      --border-color: #38383a;
      --primary-color: #0a84ff;
      --danger-color: #ff453a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--base-font-size);
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 60px);
      height: 100vh;
      overflow-x: hidden;
    }

    /* 頂部導覽列 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      font-size: calc(var(--base-font-size) * 1.2);
      font-weight: 700;
    }

    .avatar-img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary-color);
    }

    /* 主頁面視圖 */
    .view-container {
      padding: 16px;
      display: none;
    }

    .view-container.active {
      display: block;
    }

    /* 卡片通用樣式 */
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .card-title {
      font-weight: 600;
      margin-bottom: 12px;
      font-size: calc(var(--base-font-size) * 1.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 表單與輸入元件 */
    input, select, button {
      font-size: var(--base-font-size);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      background-color: var(--card-bg);
      color: var(--text-color);
    }

    button {
      background-color: var(--primary-color);
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    button.danger {
      background-color: var(--danger-color);
    }

    .day-row {
      border-bottom: 1px solid var(--border-color);
      padding: 10px 0;
    }

    .day-row:last-child {
      border-bottom: none;
    }

    .dish-tag {
      display: inline-block;
      background: var(--bg-color);
      padding: 4px 8px;
      border-radius: 6px;
      margin: 2px;
      font-size: calc(var(--base-font-size) * 0.9);
    }

    /* 設定頁拖拽分類列表 */
    .drag-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      margin-bottom: 8px;
      border-radius: 8px;
      cursor: grab;
    }

    .drag-item.dragging {
      opacity: 0.5;
    }

    /* 底部 Tab 導覽列 */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(50px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--sub-text);
      font-size: calc(var(--base-font-size) * 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .tab-btn.active {
      color: var(--primary-color);
    }

    /* Modal 彈窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 14px;
      width: 90%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .dish-select-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-color);
    }

    /* PDF 導出專用隱藏區域 */
    #pdf-template {
      display: none;
      padding: 20px;
      background: #fff;
      color: #000;
    }
  </style>
</head>
<body>

  <!-- 頂部列 -->
  <header>
    <div class="header-title" id="app-header-title">每週菜單</div>
    <img id="main-avatar" class="avatar-img" src="https://via.placeholder.com/100" alt="Avatar">
  </header>

  <!-- View 1: 主頁 (菜單列表 & 建立) -->
  <div id="view-menu" class="view-container active">
    <div class="card">
      <div class="card-title">
        <span>建立新每週菜單</span>
        <button onclick="createNewMenu()">+ 新建</button>
      </div>
      <div>
        <label>開始日期 (星期一): </label>
        <input type="date" id="menu-start-date">
      </div>
    </div>

    <div id="current-menu-container"></div>
  </div>

  <!-- View 2: 分類與菜式管理 -->
  <div id="view-dishes" class="view-container">
    <div class="card">
      <div class="card-title">新增菜式</div>
      <div style="display:flex; gap: 8px;">
        <input type="text" id="new-dish-name" placeholder="菜式名稱" style="flex:1;">
        <select id="new-dish-cat"></select>
        <button onclick="addDish()">新增</button>
      </div>
    </div>
    <div id="categories-dish-list"></div>
  </div>

  <!-- View 3: 設定頁面 -->
  <div id="view-settings" class="view-container">
    <!-- 頭像設定 -->
    <div class="card">
      <div class="card-title">自訂頭像</div>
      <input type="file" id="avatar-input" accept="image/*" onchange="updateAvatar(event)">
    </div>

    <!-- 主題與字體設定 -->
    <div class="card">
      <div class="card-title">顯示設定</div>
      <div style="margin-bottom: 12px;">
        <label>主題模式：</label>
        <select id="theme-select" onchange="changeTheme(this.value)">
          <option value="light">淺色模式 (Light)</option>
          <option value="dark">深色模式 (Dark)</option>
        </select>
      </div>
      <div>
        <label>字體大小：</label>
        <input type="range" id="font-size-range" min="14" max="22" value="16" onchange="changeFontSize(this.value)">
        <span id="font-size-val">16px</span>
      </div>
    </div>

    <!-- 分類管理 & 拖拽排序 -->
    <div class="card">
      <div class="card-title">分類管理 (可拖拽排序)</div>
      <div style="display:flex; gap: 8px; margin-bottom: 12px;">
        <input type="text" id="new-cat-name" placeholder="新分類名稱" style="flex:1;">
        <button onclick="addCategory()">新增分類</button>
      </div>
      <div id="drag-category-list"></div>
    </div>
  </div>

  <!-- 底部導覽列 -->
  <nav>
    <button class="tab-btn active" onclick="switchTab('view-menu', this)">
      <span>📅</span><span>菜單</span>
    </button>
    <button class="tab-btn" onclick="switchTab('view-dishes', this)">
      <span>🍲</span><span>菜式分類</span>
    </button>
    <button class="tab-btn" onclick="switchTab('view-settings', this)">
      <span>⚙️</span><span>設定</span>
    </button>
  </nav>

  <!-- 選擇菜式 Modal -->
  <div id="dish-modal" class="modal">
    <div class="modal-content">
      <h3>選擇菜式</h3>
      <div id="modal-dish-list"></div>
      <br>
      <button onclick="closeModal()" style="width:100%;">完成</button>
    </div>
  </div>

  <!-- PDF 渲染隱藏 DOM (專用於轉換 PDF) -->
  <div id="pdf-template"></div>

  <script>
    // 預設資料結構
    const DEFAULT_CATEGORIES = ["雞", "牛", "豬", "魚", "菜", "湯", "其他"];
    
    let appData = {
      theme: 'light',
      fontSize: 16,
      avatar: 'https://via.placeholder.com/100',
      categories: [...DEFAULT_CATEGORIES],
      dishes: [
        // { id: 1, name: "海南雞", category: "雞", lastCooked: "2026-04-10", nameIndo: "Ayam Hainan" }
      ],
      currentMenu: null
    };

    // 初始化 App
    window.onload = function() {
      loadData();
      applySettings();
      renderCategorySelects();
      renderCategoryDishList();
      renderDragCategories();
      initDefaultMenuDate();
      renderMenu();
    };

    function saveData() {
      localStorage.setItem('weekly_menu_data', JSON.stringify(appData));
    }

    function loadData() {
      const saved = localStorage.getItem('weekly_menu_data');
      if (saved) {
        appData = JSON.parse(saved);
        if (!appData.categories.includes("其他")) {
          appData.categories.push("其他");
        }
      }
    }

    function applySettings() {
      document.documentElement.setAttribute('data-theme', appData.theme);
      document.documentElement.style.setProperty('--base-font-size', appData.fontSize + 'px');
      document.getElementById('main-avatar').src = appData.avatar;
      document.getElementById('theme-select').value = appData.theme;
      document.getElementById('font-size-range').value = appData.fontSize;
      document.getElementById('font-size-val').innerText = appData.fontSize + 'px';
    }

    // 分頁切換
    function switchTab(viewId, btn) {
      document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      btn.classList.add('active');
    }

    // 設定頁功能：頭像、主題、字型
    function updateAvatar(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          appData.avatar = evt.target.result;
          document.getElementById('main-avatar').src = appData.avatar;
          saveData();
        };
        reader.readAsDataURL(file);
      }
    }

    function changeTheme(theme) {
      appData.theme = theme;
      applySettings();
      saveData();
    }

    function changeFontSize(size) {
      appData.fontSize = size;
      applySettings();
      saveData();
    }

    // 設定頁功能：分類拖拽與增刪
    function renderDragCategories() {
      const container = document.getElementById('drag-category-list');
      container.innerHTML = '';
      appData.categories.forEach((cat, index) => {
        const div = document.createElement('div');
        div.className = 'drag-item';
        div.draggable = true;
        div.dataset.index = index;
        div.innerHTML = `
          <span>☰ ${cat}</span>
          ${cat !== '其他' ? `<button class="danger" onclick="deleteCategory('${cat}')">刪除</button>` : '<span>(預設)</span>'}
        `;

        // 拖拽事件綁定
        div.addEventListener('dragstart', handleDragStart);
        div.addEventListener('dragover', handleDragOver);
        div.addEventListener('drop', handleDrop);
        div.addEventListener('dragend', handleDragEnd);

        container.appendChild(div);
      });
    }

    let dragSrcIndex = null;
    function handleDragStart(e) {
      dragSrcIndex = this.dataset.index;
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }
    function handleDragOver(e) {
      if (e.preventDefault) e.preventDefault();
      return false;
    }
    function handleDrop(e) {
      e.stopPropagation();
      const targetIndex = this.dataset.index;
      if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
        const movedItem = appData.categories.splice(dragSrcIndex, 1)[0];
        appData.categories.splice(targetIndex, 0, movedItem);
        saveData();
        renderDragCategories();
        renderCategorySelects();
      }
      return false;
    }
    function handleDragEnd() {
      this.classList.remove('dragging');
    }

    function addCategory() {
      const name = document.getElementById('new-cat-name').value.trim();
      if (name && !appData.categories.includes(name)) {
        appData.categories.splice(appData.categories.length - 1, 0, name); // 插在「其他」之前
        saveData();
        renderDragCategories();
        renderCategorySelects();
        document.getElementById('new-cat-name').value = '';
      }
    }

    // 需求 13: 刪除分類自動移至「其他」並預先通知
    function deleteCategory(catName) {
      if (catName === '其他') return;
      
      const count = appData.dishes.filter(d => d.category === catName).length;
      const confirmMsg = `確定要刪除分類「${catName}」嗎？\n該分類下的 ${count} 個菜式將會自動轉移至「其他」分類。`;
      
      if (confirm(confirmMsg)) {
        appData.dishes.forEach(d => {
          if (d.category === catName) d.category = '其他';
        });
        appData.categories = appData.categories.filter(c => c !== catName);
        saveData();
        renderDragCategories();
        renderCategorySelects();
        renderCategoryDishList();
      }
    }

    // 菜式管理
    function renderCategorySelects() {
      const select = document.getElementById('new-dish-cat');
      select.innerHTML = appData.categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function addDish() {
      const name = document.getElementById('new-dish-name').value.trim();
      const cat = document.getElementById('new-dish-cat').value;
      if (name) {
        appData.dishes.push({
          id: Date.now(),
          name: name,
          category: cat,
          lastCooked: '從未烹飪'
        });
        saveData();
        document.getElementById('new-dish-name').value = '';
        renderCategoryDishList();
      }
    }

    function renderCategoryDishList() {
      const container = document.getElementById('categories-dish-list');
      container.innerHTML = '';

      appData.categories.forEach(cat => {
        const catDishes = appData.dishes.filter(d => d.category === cat);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div class="card-title">${cat} (${catDishes.length})</div>`;
        
        if (catDishes.length === 0) {
          card.innerHTML += `<div style="color:var(--sub-text);">暫無菜式</div>`;
        } else {
          catDishes.forEach(d => {
            card.innerHTML += `
              <div style="display:flex; justify-content:space-between; margin-bottom: 6px;">
                <span>${d.name}</span>
                <span style="color:var(--sub-text); font-size: 0.85em;">上次烹飪: ${d.lastCooked}</span>
              </div>
            `;
          });
        }
        container.appendChild(card);
      });
    }

    // 每週菜單邏輯
    function initDefaultMenuDate() {
      const today = new Date();
      const day = today.getDay();
      const diff = today.getDate() - day + (day === 0 ? -6 : 1); // 調整至星期一
      const monday = new Date(today.setDate(diff));
      document.getElementById('menu-start-date').value = monday.toISOString().split('T')[0];
    }

    function createNewMenu() {
      const startDateVal = document.getElementById('menu-start-date').value;
      if (!startDateVal) return;

      const days = [];
      const monday = new Date(startDateVal);

      for (let i = 0; i < 7; i++) {
        const currentDate = new Date(monday);
        currentDate.setDate(monday.getDate() + i);
        const dateStr = `${currentDate.getMonth() + 1}月${currentDate.getDate()}日`;
        const weekDays = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
        days.push({
          dayName: weekDays[i],
          dateStr: dateStr,
          fullDate: currentDate.toISOString().split('T')[0],
          dishes: [],
          diners: 2,
          takeout: 0
        });
      }

      appData.currentMenu = {
        startDate: startDateVal,
        days: days
      };

      saveData();
      renderMenu();
    }

    function renderMenu() {
      const container = document.getElementById('current-menu-container');
      container.innerHTML = '';

      if (!appData.currentMenu) {
        container.innerHTML = `<div class="card" style="text-align:center; color:var(--sub-text);">請建立一張每週菜單</div>`;
        return;
      }

      const menuCard = document.createElement('div');
      menuCard.className = 'card';
      
      let html = `
        <div class="card-title">
          <span>每週菜單 (${appData.currentMenu.startDate} 開始)</span>
          <button onclick="exportPDF()">匯出 PDF</button>
        </div>
      `;

      appData.currentMenu.days.forEach((day, index) => {
        html += `
          <div class="day-row">
            <div style="font-weight:600; display:flex; justify-content:space-between; align-items:center;">
              <span>${day.dayName} (${day.dateStr})</span>
              <button onclick="openDishModal(${index})">+ 選擇菜式</button>
            </div>
            <div style="margin: 6px 0;">
              <label>用餐人數: </label>
              <input type="number" value="${day.diners}" min="0" style="width:50px;" onchange="updatePeople(${index}, 'diners', this.value)">
              <label style="margin-left:8px;">外帶人數: </label>
              <input type="number" value="${day.takeout}" min="0" style="width:50px;" onchange="updatePeople(${index}, 'takeout', this.value)">
            </div>
            <div>菜式列表 (分行顯示)：</div>
            <div id="day-dishes-${index}">
              ${day.dishes.map((d, dIdx) => `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
                  <span>• ${d.name} <small style="color:var(--sub-text)">(${d.category})</small></span>
                  <span style="color:var(--danger-color); cursor:pointer;" onclick="removeDishFromDay(${index},${dIdx})">刪除</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });

      menuCard.innerHTML = html;
      container.appendChild(menuCard);
    }

    function updatePeople(dayIdx, type, val) {
      appData.currentMenu.days[dayIdx][type] = parseInt(val) || 0;
      saveData();
    }

    let activeDayIndex = null;
    function openDishModal(dayIdx) {
      activeDayIndex = dayIdx;
      const modalList = document.getElementById('modal-dish-list');
      modalList.innerHTML = '';

      appData.categories.forEach(cat => {
        const catDishes = appData.dishes.filter(d => d.category === cat);
        if (catDishes.length > 0) {
          modalList.innerHTML += `<div style="font-weight:bold; margin-top:10px;">${cat}</div>`;
          catDishes.forEach(d => {
            modalList.innerHTML += `
              <div class="dish-select-item">
                <div>
                  <span>${d.name}</span><br>
                  <small style="color:var(--sub-text)">上次烹飪: ${d.lastCooked}</small>
                </div>
                <button onclick="selectDishToDay(${d.id})">揀選</button>
              </div>
            `;
          });
        }
      });

      document.getElementById('dish-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('dish-modal').classList.remove('active');
    }

    function selectDishToDay(dishId) {
      const dish = appData.dishes.find(d => d.id === dishId);
      if (dish && activeDayIndex !== null) {
        const currentDay = appData.currentMenu.days[activeDayIndex];
        currentDay.dishes.push(dish);
        
        // 更新該菜式最後烹飪日期為菜單當天日期
        dish.lastCooked = currentDay.fullDate;
        
        saveData();
        renderMenu();
        renderCategoryDishList();
        closeModal();
      }
    }

    function removeDishFromDay(dayIdx, dishIdx) {
      appData.currentMenu.days[dayIdx].dishes.splice(dishIdx, 1);
      saveData();
      renderMenu();
    }

    // 需求 10: 匯出 PDF (支援中文 / 印尼文)
    function exportPDF() {
      if (!appData.currentMenu) return;

      const lang = prompt("請選擇匯出語言 / Pilih Bahasa:\n1: 中文 (Chinese)\n2: 印尼文 (Bahasa Indonesia)", "1");
      if (lang !== "1" && lang !== "2") return;

      const isIndo = (lang === "2");
      const pdfContainer = document.getElementById('pdf-template');

      // 字典翻譯 (印尼文對照)
      const dict = {
        title: isIndo ? "Menu Mingguan" : "每週菜單",
        diners: isIndo ? "Jumlah Orang Makan" : "用餐人數",
        takeout: isIndo ? "Jumlah Bungkus" : "外帶人數",
        dishes: isIndo ? "Daftar Masakan" : "菜式列表",
        days: isIndo ? 
          ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'] : 
          ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日']
      };

      let html = `
        <div style="font-family: Arial, sans-serif; padding: 20px;">
          <h1 style="text-align:center;">${dict.title}</h1>
          <p style="text-align:center; font-size:14px; color:#555;">${appData.currentMenu.startDate}</p>
          <hr>
      `;

      appData.currentMenu.days.forEach((day, idx) => {
        html += `
          <div style="margin-bottom: 15px; border-bottom: 1px solid #ccc; padding-bottom: 5px;">
            <h3 style="margin: 5px 0;">${dict.days[idx]} (${day.dateStr})</h3>
            <p style="margin: 2px 0; font-size: 14px;">
              ${dict.diners}: ${day.diners} | ${dict.takeout}: ${day.takeout}
            </p>
            <div style="margin-top: 5px; font-weight: bold; font-size: 14px;">${dict.dishes}:</div>
            <ul style="margin: 3px 0; padding-left: 20px;">
        `;

        day.dishes.forEach(d => {
          // 若有印尼文名稱則顯示印尼文，否則預設名稱
          const nameShow = isIndo ? (d.nameIndo || d.name) : d.name;
          html += `<li style="font-size: 14px; line-height: 1.4;">${nameShow}</li>`;
        });

        html += `</ul></div>`;
      });

      html += `</div>`;
      pdfContainer.innerHTML = html;
      pdfContainer.style.display = 'block';

      // 設定 html2pdf 選項
      const opt = {
        margin:       10,
        filename:     `Menu_${appData.currentMenu.startDate}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(pdfContainer).save().then(() => {
        pdfContainer.style.display = 'none';
      });
    }
  </script>
</body>
</html>
