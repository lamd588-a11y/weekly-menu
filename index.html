<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>每週菜單</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap');
:root{--bg:#FFFCF3;--card:#FFFFFF;--text:#2B2117;--muted:#9C8C7C;--primary:#E86A2C;--primary-2:#FF8A4B;--border:#F2E6D6;--border-2:#E8D9C5;--shadow:0 8px 20px rgba(75,47,28,0.06);--shadow-lg:0 16px 36px rgba(75,47,28,0.10);--fs:20px;--radius:22px;}
.dark{--bg:#141210;--card:#1E1B17;--text:#F5EEE6;--border:#2E2820;--border-2:#3A332B;--muted:#A99A8B;--shadow:0 8px 20px rgba(0,0,0,0.3);--shadow-lg:0 16px 36px rgba(0,0,0,0.4);}
html{font-size:var(--fs)}*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(120% 60% at 50% -10%, #FFF1E0 0%, rgba(255,252,243,0) 60%);background-repeat:no-repeat;background-size:100% 100%;color:var(--text);font-family:'Noto Sans HK',-apple-system,PingFang HK,sans-serif;padding-bottom:140px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,0.88);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border-bottom:1.5px solid var(--border);padding:12px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;box-shadow:0 1px 0 rgba(0,0,0,0.03);}
.dark.top{background:rgba(30,27,23,0.85)}
.avatar{width:62px;height:62px;border-radius:50%;border:3px solid var(--primary);object-fit:cover;box-shadow:0 4px 12px rgba(232,106,44,0.25), 0 0 0 4px rgba(232,106,44,0.08);}
.pages{max-width:520px;margin:0 auto;padding:0 16px 16px 16px;box-sizing:border-box}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px;margin:0 0 16px 0;width:100%;box-sizing:border-box;overflow:hidden;box-shadow:var(--shadow);transition:transform 0.2s ease;}
.card:active{transform:scale(0.99)}
.card h3{font-family:'Fraunces',serif;letter-spacing:0.3px;font-weight:900}
.row{display:flex;gap:8px;align-items:center}
.btn{flex:1;padding:16px;border-radius:16px;border:none;background:linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);color:#fff;font-weight:900;font-size:1.1rem;box-shadow:0 6px 16px rgba(232,106,44,0.28), inset 0 1px 0 rgba(255,255,255,0.3);letter-spacing:0.3px;cursor:pointer;}
.btn:active{transform:scale(0.98)}
.ghost{flex:1;padding:14px;border-radius:16px;border:1.5px solid var(--border);background:var(--card);font-weight:800;font-size:1rem;box-shadow:0 2px 8px rgba(0,0,0,0.02);}
.iconBtn{width:48px;height:48px;min-width:48px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);font-size:22px;display:grid;place-items:center;margin:0;box-sizing:border-box;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.04);}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px;box-sizing:border-box;width:100%}
.catBox{aspect-ratio:1;border-radius:20px;border:1.5px solid rgba(0,0,0,0.06);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:8px;width:100%;min-width:0;box-sizing:border-box;box-shadow:0 6px 16px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.6);position:relative;overflow:hidden;transition:transform 0.2s cubic-bezier(.34,1.56,.64,1);}
.catBox::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 80% at 30% 20%, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 60%);pointer-events:none;}
.catBox:active{transform:scale(0.94)}
.weekWrap{display:flex;flex-direction:column;gap:10px}.weekRow{display:flex;gap:8px;justify-content:center}
.dayBox{width:32%;aspect-ratio:1;border-radius:20px;border:1.5px solid var(--border);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:8px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform 0.2s ease;}
.dayBox::before{content:'';position:absolute;top:-20%;left:-20%;right:-20%;height:60%;background:linear-gradient(180deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 100%);pointer-events:none;}
.dayBox:active{transform:scale(0.96)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.88);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border-top:1.5px solid var(--border);display:flex;justify-content:space-around;padding:10px 0 calc(16px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -8px 24px rgba(0,0,0,0.04);}
.dark.bottom{background:rgba(30,27,23,0.9)}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;position:relative;padding:6px 0;border-radius:12px;transition:all 0.2s ease}
.nav.ic{font-size:46px!important;line-height:1!important;display:block;filter:saturate(0.9);transition:transform 0.2s ease}
.nav.active{color:var(--primary)!important}
.nav.active.ic{transform:scale(1.08) translateY(-2px);filter:saturate(1.2)}
.nav.active::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:24px;height:4px;background:var(--primary);border-radius:99px}
.modal{position:fixed;inset:0;background:rgba(43,33,23,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;z-index:9999;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}
.sheet{width:calc(100% - 24px);max-width:500px;max-height:88vh;overflow:auto;background:var(--card);border-radius:24px;border:1.5px solid var(--border);box-sizing:border-box;margin:0 auto;box-shadow:var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.5) inset;}
.head{position:sticky;top:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);padding:14px;border-bottom:1.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;z-index:2}
.dark.head{background:rgba(30,27,23,0.92)}
.x{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg);display:grid;place-items:center;font-size:24px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.dishRow{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px dashed var(--border-2);gap:8px}
.dishRow:last-child{border-bottom:none}
.act{display:flex;gap:6px}.act button{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,0.04)}
select,textarea{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:1.05rem;box-sizing:border-box;box-shadow:inset 0 1px 2px rgba(0,0,0,0.04);}
.topRowFixed{display:flex;gap:8px;align-items:center;width:100%;box-sizing:border-box}
.topRowFixed input{flex:1 1 0;min-width:0;width:0;text-align:center;font-weight:900;background:#FFFEFB;border-radius:16px;padding:12px 6px;border:1.5px solid var(--border);box-sizing:border-box;font-size:1rem;box-shadow:inset 0 1px 3px rgba(0,0,0,0.04);}
#pdfWrap{position:fixed;inset:0;background:#222;z-index:10000;display:none;flex-direction:column}#pdfWrap.open{display:flex}
.pdfTool{position:sticky;top:0;background:#fff;padding:12px;display:flex;gap:12px;border-bottom:2px solid #ccc;z-index:2}
.pdfView{flex:1;overflow:auto;background:#333;padding:16px;display:flex;justify-content:center}
.pdfPage{width:100%;max-width:800px;background:#fff;margin:0 auto}
.pdfInner{padding:15mm 15mm 25mm 15mm!important;background:#fff;color:#000;box-sizing:border-box;font-size:16pt;line-height:1.5}
</style>
</head>
<body>
<div class="top"><img id="avatarTop" class="avatar" src="icon.png"><div style="display:flex;align-items:center;height:62px"><div style="font-weight:900;font-size:1.35rem;line-height:62px;font-family:'Fraunces',serif">每週菜單</div></div></div>
<div class="pages">
<div id="p-weekly" class="page active"><div class="card"><div class="topRowFixed"><input type="date" id="monPicker"><button class="iconBtn" onclick="saveWeekly()">💾</button><button class="iconBtn" onclick="exportWeeklyPDF()">📄</button></div></div><div id="weeklyGrid" class="weekWrap"></div></div>
<div id="p-library" class="page"><div class="card row"><button class="ghost" onclick="exportLib()">匯出</button><button class="ghost" onclick="document.getElementById('impFile').click()">匯入</button><button class="btn" onclick="openAdd()">新增菜式</button><input type="file" id="impFile" accept=".json" style="display:none"></div><div id="catGrid" class="grid3"></div></div>
<div id="p-mymenus" class="page"><div class="card row"><button class="ghost" onclick="toggleMy(true)">一鍵打開全部</button><button class="ghost" onclick="toggleMy(false)">一鍵關閉全部</button></div><div id="myList"></div></div>
<div id="p-settings" class="page"><div class="card"><h3>分類排序</h3><div id="catOrder"></div><div class="row" style="margin-top:12px;flex-wrap:nowrap"><input id="newCat" placeholder="新分類名稱" style="flex:1;min-width:0;padding:14px 16px;border-radius:16px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem;font-weight:800;box-sizing:border-box"><button class="btn" onclick="addCat()" style="flex:0 0 90px;min-width:90px">新增</button></div></div><div class="card"><h3>外觀</h3><div class="row"><span>深淺色</span><button class="ghost" onclick="toggleTheme()">切換</button></div><div style="margin-top:12px"><label>字體大小 <span id="fsVal">20</span>px</label><input type="range" id="fsRange" min="14" max="28" value="20" oninput="setFS(this.value)" style="width:100%"></div></div><div class="card"><h3>頭像</h3><div style="display:flex;gap:10px;align-items:center;margin:10px 0"><label for="avFile" style="flex:0 0 auto;padding:16px 22px;border-radius:16px;background:var(--primary);color:#fff;font-weight:900;font-size:1.15rem;cursor:pointer">📁 選擇圖片</label><span id="avFileName" style="flex:1;font-size:1.1rem;font-weight:800;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">尚未選取檔案</span></div><input type="file" id="avFile" accept="image/*" style="display:none"><div style="width:260px;height:260px;margin:12px auto;border-radius:50%;overflow:hidden;border:3px solid var(--primary);background:#000;touch-action:none"><canvas id="avCanvas" width="600" height="600" style="width:100%;height:100%"></canvas></div><div class="row"><span>縮放</span><input type="range" id="avZoom" min="0.2" max="4" step="0.05" value="1" style="flex:1"><button class="ghost" onclick="resetAv()">重置</button></div><button class="btn" style="width:100%;margin-top:10px" onclick="saveAv()">儲存頭像</button></div></div>
</div>
<div class="bottom">
<div class="nav active" onclick="go('weekly',this)"><span class="ic">📅</span>每週</div>
<div class="nav" onclick="go('library',this)"><span class="ic">📚</span>菜式庫</div>
<div class="nav" onclick="go('mymenus',this)"><span class="ic">🗂️</span>我的菜單</div>
<div class="nav" onclick="go('settings',this)"><span class="ic">⚙️</span>設定</div>
</div>
<div class="modal" id="mCat" style="z-index:10001"><div class="sheet"><div class="head"><b id="mCatTitle">分類</b><div class="x" onclick="closeM('mCat')">✕</div></div><div id="mCatBody"></div></div></div>
<div class="modal" id="mNote" style="z-index:10010"><div class="sheet"><div class="head"><b>備註</b><div class="x" onclick="closeM('mNote')">✕</div></div><div id="mNoteBody" style="padding:16px;white-space:pre-wrap;font-size:1.1rem"></div></div></div>
<div class="modal" id="mWeek" style="z-index:10002"><div class="sheet"><div class="head"><b id="mWeekTitle">日期</b><div class="x" onclick="closeM('mWeek')">✕</div></div><div style="padding:14px"><div class="row"><label>用餐</label><select id="diners"></select><label>外帶</label><select id="takeaway"></select></div><div id="selDishes" style="margin-top:12px"></div><button class="btn" style="width:100%;margin-top:12px" onclick="openPickCat()">選擇菜式</button></div></div></div>
<div class="modal" id="mPickCat" style="z-index:10003"><div class="sheet"><div class="head"><b>分類</b><div class="x" onclick="closeM('mPickCat')">✕</div></div><div id="mPickCatBody" class="grid3" style="padding:12px"></div></div></div>
<div class="modal" id="mPickDish" style="z-index:10004"><div class="sheet"><div class="head"><b>菜式</b><div class="x" onclick="closeM('mPickDish')">✕</div></div><div id="mPickDishBody"></div></div></div>
<div class="modal" id="mAdd" style="z-index:10005"><div class="sheet"><div class="head"><b>新增/修改菜式</b><div class="x" onclick="closeM('mAdd')">✕</div></div><div style="padding:14px"><input id="fName" placeholder="菜名（中文）" style="width:100%;padding:16px;border-radius:14px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:1.05rem;box-sizing:border-box;height:56px"><input id="fIndo" placeholder="菜名（印尼文）" style="margin-top:12px;width:100%;padding:16px;border-radius:14px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:1.05rem;box-sizing:border-box;height:56px"><textarea id="fNoteZh" placeholder="備註 + 烹調方法（中文）" style="margin-top:10px;height:110px"></textarea><textarea id="fNoteId" placeholder="備註 + 烹調方法（印尼文）" style="margin-top:10px;height:110px"></textarea><select id="fCat" style="margin-top:10px"></select><input type="hidden" id="fId"><button class="btn" style="width:100%;margin-top:12px" onclick="saveDish()">儲存</button></div></div></div>
<div class="modal" id="mAnyDate" style="z-index:10006"><div class="sheet" style="border-radius:28px;border:3px solid #111"><div class="head"><b>加入到哪一天？</b><div class="x" onclick="closeM('mAnyDate')">✕</div></div><div style="padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center"><input type="date" id="anyDate" style="width:92%!important;height:68px!important;min-height:68px!important;line-height:68px!important;padding:0 12px!important;border-radius:20px!important;border:3px solid #111!important;background:#fffaf5!important;color:#111!important;font-weight:900!important;font-size:1.3rem!important;text-align:center!important;box-sizing:border-box!important;display:block!important"><button onclick="confirmAddToWeek()" style="width:92%!important;height:68px!important;min-height:68px!important;line-height:68px!important;padding:0!important;border-radius:20px!important;border:3px solid #111!important;background:#ff6b35!important;color:#fff!important;font-weight:900!important;font-size:1.35rem!important;box-sizing:border-box!important;display:grid!important;place-items:center!important;text-align:center!important">確認加入</button></div></div></div>
<div id="pdfWrap"><div class="pdfTool"><button class="btn" id="btnClosePdf" type="button" style="font-size:38px!important;line-height:1!important">✕</button><button class="ghost" id="btnSharePdf" type="button" style="font-size:36px!important;line-height:1!important">📤</button></div><div class="pdfView"><div class="pdfPage"><div class="pdfInner" id="pdfContent"></div></div></div></div>
<script>
const CAT_META={"雞":{bg:"#ffeb8a",e:"🐔"},"牛":{bg:"#d7b899",e:"🐮"},"豬":{bg:"#ffb3c1",e:"🐷"},"魚":{bg:"#8ecfff",e:"🐟"},"蔬菜":{bg:"#a8e6a3",e:"🥬"},"湯水":{bg:"#ffcc7a",e:"🍲"},"西式":{bg:"#e2c499",e:"🍔"},"罐頭":{bg:"#9ec6ff",e:"🥫"},"其他":{bg:"#d8b4fe",e:"🍱"}};
let cats=JSON.parse(localStorage.getItem('cats')||'null')||Object.keys(CAT_META);
let dishes=JSON.parse(localStorage.getItem('dishes')||'null')||[];
let weeklyMenus=JSON.parse(localStorage.getItem('weeklyMenus')||'[]');
let current={mon:null,days:[]}, lastCook=JSON.parse(localStorage.getItem('lastCook')||'{}'), editDay=null, pendDish=null;
const cn=["一","二","三","四","五","六","日"], idn=["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"], dayEmo=["🌅","🌤️","🌞","🌇","🌙","⭐","🎉"];
function go(p,el){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('p-'+p).classList.add('active');document.querySelectorAll('.nav').forEach(e=>e.classList.remove('active'));if(el) el.classList.add('active'); else document.querySelectorAll('.nav')[['weekly','library','mymenus','settings'].indexOf(p)].classList.add('active');}
function getMon(d){let dt=new Date(d);let day=dt.getDay();let diff=dt.getDate()-day+(day==0?-6:1);return new Date(dt.setDate(diff));}
function fmt(d){if(typeof d==='string')return d;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function openM(id){document.getElementById(id).classList.add('open');}function closeM(id){document.getElementById(id).classList.remove('open');}
let zh2idTimer=null;
async function autoTransZh2Id(zhText,targetEl){if(!zhText||!zhText.trim())return;try{let q=encodeURIComponent(zhText);let res=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=id&dt=t&q=${q}`);let data=await res.json();let translated=data[0].map(x=>x[0]).join('');targetEl.value=translated;}catch(e){alert('翻譯失敗，請檢查網絡');}}
function debounceTrans(fn,delay){return function(...args){clearTimeout(zh2idTimer);zh2idTimer=setTimeout(()=>fn(...args),delay);}}
function makeDefaults(){if(dishes.length)return;}
makeDefaults();
function init(){let mon=getMon(new Date());document.getElementById('monPicker').valueAsDate=mon;onMon(mon);renderCats();renderWeek();renderMy();renderCatOrder();loadAll();let sel=document.getElementById('diners');sel.innerHTML=[...Array(10).keys()].map(n=>`<option value="${n}">${n}</option>`).join('');document.getElementById('takeaway').innerHTML=sel.innerHTML;document.getElementById('monPicker').addEventListener('change',e=>{let d=e.target.valueAsDate;if(!d)return;if(d.getDay()!==1){alert('只可以選擇星期一作起始日');let m=getMon(d);e.target.valueAsDate=m;d=m;} onMon(d);});document.getElementById('impFile').addEventListener('change',importLib);document.getElementById('btnClosePdf').addEventListener('click',e=>{e.stopPropagation();closePDF();});document.getElementById('btnSharePdf').addEventListener('click',e=>{e.stopPropagation();sharePDF();});}
function onMon(d){current.mon=d;current.days=[];for(let i=0;i<7;i++){let day=new Date(d);day.setDate(d.getDate()+i);current.days.push({date:day,dishes:[],diners:0,takeaway:0});}renderWeek();}
function loadAll(){let th=localStorage.getItem('theme');if(th==='dark')document.body.classList.add('dark');let fs=localStorage.getItem('fs');if(fs){document.getElementById('fsRange').value=fs;setFS(fs);}let av=localStorage.getItem('avatar');if(av)document.getElementById('avatarTop').src=av;}
function renderCats(){let g=document.getElementById('catGrid');g.innerHTML='';document.getElementById('fCat').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');cats.forEach(cat=>{let meta=CAT_META[cat]||{bg:'#eee',e:'🍱'};let cnt=dishes.filter(d=>d.cat===cat).length;g.innerHTML+=`<div class="catBox" style="background:${meta.bg}" onclick="openCat('${cat}')"><div class="em" style="font-size:68px!important;line-height:1!important;display:block!important">${meta.e}</div><div class="lb" style="font-size:16px!important">${cat} (${cnt})</div></div>`;});}
function openCat(cat){document.getElementById('mCatTitle').innerText=cat;let list=dishes.filter(d=>d.cat===cat);document.getElementById('mCatBody').innerHTML=list.map(d=>`<div class="dishRow"><div style="flex:1;cursor:pointer" onclick="showNote(${d.id})"><b>${d.name}</b><div style="font-size:.9rem;color:var(--muted)">${d.indo||''} ${lastCook[d.id]?'| 上次:'+lastCook[d.id]:''}</div></div><div class="act"><button onclick="openAnyDate(${d.id})">📅</button><button onclick="editDish(${d.id})">✏️</button><button onclick="delDish(${d.id})">🗑️</button></div></div>`).join('')||'<div style="padding:16px;color:var(--muted)">暫無菜式</div>';openM('mCat');}
function showNote(id){let d=dishes.find(x=>x.id==id);if(!d)return;let zh=(d.noteZh||d.note||'').replace(/中文：/g,'').trim();let idn=(d.noteId||'').trim();document.getElementById('mNoteBody').innerHTML=`<b>${d.name} / ${d.indo||''}</b><div style="margin-top:12px;white-space:pre-wrap">${zh}</div><div style="margin-top:10px;white-space:pre-wrap;color:var(--muted)">${idn}</div>`;openM('mNote');}
function openAdd(){document.getElementById('fId').value='';document.getElementById('fName').value='';document.getElementById('fIndo').value='';document.getElementById('fNoteZh').value='';document.getElementById('fNoteId').value='';openM('mAdd');let fName=document.getElementById('fName');let fIndo=document.getElementById('fIndo');let fNoteZh=document.getElementById('fNoteZh');let fNoteId=document.getElementById('fNoteId');fIndo.dataset.manual="";fNoteId.dataset.manual="";let lastName="";let lastNote="";fName.onblur=async()=>{let v=fName.value.trim();if(!v||v===lastName||fIndo.dataset.manual==="1")return;lastName=v;if(confirm(`完成輸入菜名「${v}」\n是否翻譯成印尼文並填入？`)){await autoTransZh2Id(v,fIndo);}};fNoteZh.onblur=async()=>{let v=fNoteZh.value.trim();if(!v||v===lastNote||fNoteId.dataset.manual==="1")return;lastNote=v;if(confirm(`完成輸入中文備註\n是否翻譯成印尼文並填入？\n\n${v.slice(0,80)}...`)){await autoTransZh2Id(v,fNoteId);}};fIndo.oninput=()=>fIndo.dataset.manual="1";fNoteId.oninput=()=>fNoteId.dataset.manual="1";}
function editDish(id){let d=dishes.find(x=>x.id==id);if(!d)return;document.getElementById('fId').value=d.id;document.getElementById('fName').value=d.name;document.getElementById('fIndo').value=d.indo||'';document.getElementById('fNoteZh').value=d.noteZh||d.note||'';document.getElementById('fNoteId').value=d.noteId||'';document.getElementById('fCat').value=d.cat;openAdd();let fName=document.getElementById('fName');let fIndo=document.getElementById('fIndo');let fNoteZh=document.getElementById('fNoteZh');let fNoteId=document.getElementById('fNoteId');fIndo.dataset.manual="";fNoteId.dataset.manual="";let lastName="";let lastNote="";fName.onblur=async()=>{let v=fName.value.trim();if(!v||v===lastName||fIndo.dataset.manual==="1")return;lastName=v;if(confirm(`完成輸入菜名「${v}」\n是否翻譯成印尼文並填入？`)){await autoTransZh2Id(v,fIndo);}};fNoteZh.onblur=async()=>{let v=fNoteZh.value.trim();if(!v||v===lastNote||fNoteId.dataset.manual==="1")return;lastNote=v;if(confirm(`完成輸入中文備註\n是否翻譯成印尼文並填入？\n\n${v.slice(0,80)}...`)){await autoTransZh2Id(v,fNoteId);}};fIndo.oninput=()=>fIndo.dataset.manual="1";fNoteId.oninput=()=>fNoteId.dataset.manual="1";}
function saveDish(){let id=document.getElementById('fId').value;let n=document.getElementById('fName').value.trim(),i=document.getElementById('fIndo').value.trim(),zh=document.getElementById('fNoteZh').value.trim(),idn=document.getElementById('fNoteId').value.trim(),c=document.getElementById('fCat').value;if(!n)return alert('中文必填');if(id){let d=dishes.find(x=>x.id==id);d.name=n;d.indo=i;d.noteZh=zh;d.noteId=idn;d.note=zh;d.cat=c;}else dishes.push({id:Date.now()+Math.random(),name:n,indo:i,noteZh:zh,noteId:idn,note:zh,cat:c});localStorage.setItem('dishes',JSON.stringify(dishes));renderCats();closeM('mAdd');}
function delDish(id){if(!confirm('刪除?'))return;dishes=dishes.filter(x=>x.id!=id);localStorage.setItem('dishes',JSON.stringify(dishes));renderCats();openCat(document.getElementById('mCatTitle').innerText);}
function renderWeek(){let wrap=document.getElementById('weeklyGrid');wrap.innerHTML='';let rows=[[0,1],[2,3],[4,5,6]];rows.forEach(r=>{let row=document.createElement('div');row.className='weekRow';r.forEach(idx=>{let day=current.days[idx];if(!day)return;let div=document.createElement('div');div.className='dayBox';div.innerHTML=`<div class="d1">${dayEmo[idx]}</div><div class="d2">星期${cn[idx]}<br>${fmt(day.date).slice(5)}<br><span style="color:var(--primary)">${day.dishes.length}道</span></div>`;div.onclick=()=>openWeek(idx);row.appendChild(div);});wrap.appendChild(row);});}
function openWeek(idx){editDay=idx;let day=current.days[idx];document.getElementById('mWeekTitle').innerText=`${fmt(day.date)} 星期${cn[idx]}`;document.getElementById('diners').value=day.diners;document.getElementById('takeaway').value=day.takeaway;document.getElementById('diners').onchange=e=>day.diners=+e.target.value;document.getElementById('takeaway').onchange=e=>day.takeaway=+e.target.value;document.getElementById('selDishes').innerHTML=day.dishes.map((d,i)=>`<div class="dishRow"><span style="flex:1;cursor:pointer" onclick="showNote(${d.id})"><b>${d.name}</b> ${d.indo?'<span style="font-size:.9rem;color:var(--muted)"> '+d.indo+'</span>':''}</span><button class="ghost" style="width:auto" onclick="remDay(${idx},${i})">✕</button></div>`).join('')||'<div style="color:var(--muted)">尚未選擇</div>';openM('mWeek');}
function remDay(a,b){if(!confirm('確定刪除此菜式？'))return;current.days[a].dishes.splice(b,1);openWeek(a);renderWeek();}
function openPickCat(){let b=document.getElementById('mPickCatBody');b.innerHTML='';cats.forEach(cat=>{let m=CAT_META[cat]||{bg:'#eee',e:'🍱'};let cnt=dishes.filter(d=>d.cat===cat).length;b.innerHTML+=`<div class="catBox" style="background:${m.bg}" onclick="openPickDish('${cat}')"><div class="em" style="font-size:68px!important;line-height:1!important;display:block!important">${m.e}</div><div class="lb" style="font-size:16px!important">${cat} (${cnt})</div></div>`;});openM('mPickCat');}
function openPickDish(cat){let list=dishes.filter(d=>d.cat===cat);document.getElementById('mPickDishBody').innerHTML=list.map(d=>`<div class="dishRow"><span style="flex:1;cursor:pointer" onclick="showNote(${d.id})"><b>${d.name}</b> ${d.indo?'<div style="font-size:.9rem">'+d.indo+'</div>':''}</span><button class="btn" style="flex:0 0 80px" onclick="addToDay(${d.id})">加入</button></div>`).join('')||'<div style="padding:16px">無</div>';openM('mPickDish');}
function addToDay(id){let d=dishes.find(x=>x.id==id);if(!d)return;current.days[editDay].dishes.push(d);lastCook[id]=fmt(new Date());localStorage.setItem('lastCook',JSON.stringify(lastCook));openWeek(editDay);renderWeek();closeM('mPickDish');closeM('mPickCat');}
function openAnyDate(id){pendDish=dishes.find(x=>x.id==id);if(!pendDish)return;document.getElementById('anyDate').valueAsDate=new Date();openM('mAnyDate');}
function confirmAddToWeek(){let d=document.getElementById('anyDate').valueAsDate;if(!d)return alert('請選日期');let mon=getMon(d);let idx=Math.round((d-mon)/86400000);if(idx<0||idx>6){alert('只能選同星期一的七日內');return;}if(fmt(mon)!==fmt(current.mon)){current.mon=mon;current.days=[];for(let i=0;i<7;i++){let day=new Date(mon);day.setDate(mon.getDate()+i);current.days.push({date:day,dishes:[],diners:0,takeaway:0});}document.getElementById('monPicker').valueAsDate=mon;}current.days[idx].dishes.push(pendDish);lastCook[pendDish.id]=fmt(d);localStorage.setItem('lastCook',JSON.stringify(lastCook));renderWeek();closeM('mAnyDate');closeM('mCat');}
function saveWeekly(){let m={monday:fmt(current.mon),days:current.days.map(d=>({date:fmt(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway}))};weeklyMenus.unshift(m);localStorage.setItem('weeklyMenus',JSON.stringify(weeklyMenus));renderMy();alert('已儲存');}
function renderMy(){let wrap=document.getElementById('myList');wrap.innerHTML=weeklyMenus.map((mm,i)=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${mm.monday} 開始</b><div class="row"><button class="ghost" style="flex:0 0 auto" onclick="pdfSingle(${i})">📄</button><button class="ghost" style="flex:0 0 auto" onclick="delMy(${i})">🗑️</button></div></div><div style="margin-top:8px">${mm.days.map(d=>`${d.date}:${d.dishes.length}道`).join(' | ')}</div></div>`).join('')||'<div class="card">暫無</div>';}
function delMy(i){if(!confirm('刪除此週？'))return;weeklyMenus.splice(i,1);localStorage.setItem('weeklyMenus',JSON.stringify(weeklyMenus));renderMy();}
function toggleMy(open){document.querySelectorAll('#myList.card').forEach(c=>c.style.display=open?'block':'block');}
function addCat(){let v=document.getElementById('newCat').value.trim();if(!v)return;if(cats.includes(v))return alert('已存在');cats.push(v);CAT_META[v]={bg:'#ffe9a0',e:'🍱'};localStorage.setItem('cats',JSON.stringify(cats));document.getElementById('newCat').value='';renderCats();renderCatOrder();}
function moveCat(i,dir){let j=i+dir;if(j<0||j>=cats.length)return;let t=cats[i];cats[i]=cats[j];cats[j]=t;localStorage.setItem('cats',JSON.stringify(cats));renderCats();renderCatOrder();}
function remCat(i){if(!confirm('刪除分類？'))return;let c=cats[i];if(dishes.some(d=>d.cat===c))return alert('此分類下仍有菜式');cats.splice(i,1);localStorage.setItem('cats',JSON.stringify(cats));renderCats();renderCatOrder();}
function renderCatOrder(){let b=document.getElementById('catOrder');b.innerHTML=cats.map((c,i)=>`<div class="card row" style="justify-content:space-between"><span>${i+1}. ${c}</span><span class="row"><button class="iconBtn" onclick="moveCat(${i},-1)">↑</button><button class="iconBtn" onclick="moveCat(${i},1)">↓</button><button class="iconBtn" onclick="remCat(${i})">🗑️</button></span></div>`).join('');}
function toggleTheme(){let isDark=document.body.classList.toggle('dark');localStorage.setItem('theme',isDark?'dark':'light');}
function setFS(v){document.documentElement.style.setProperty('--fs',v+'px');document.getElementById('fsVal').innerText=v;localStorage.setItem('fs',v);}
function resetAv(){}
function saveAv(){let c=document.getElementById('avCanvas');let url=c.toDataURL('image/png');localStorage.setItem('avatar',url);document.getElementById('avatarTop').src=url;alert('已儲存');}
function makePDF(days,monStr){let html=`<h1 style="text-align:center;border-bottom:3px solid #111;padding-bottom:12px;margin:0 0 12px 0;font-size:13pt;font-weight:900">每週菜單<br><span style="font-size:13pt">Daftar Menu Mingguan</span></h1><div style="text-align:center;margin:10px 0;font-weight:900;font-size:13pt">${monStr} 星期一 / Senin</div>`;days.forEach((d,i)=>{html+=`<div style="border:2.5px solid #111;border-radius:14px;overflow:hidden;margin-bottom:16px;background:#fff"><div style="display:flex;justify-content:space-between;background:#fff3d6;padding:12px 14px;font-weight:900;border-bottom:2.5px solid #111;flex-wrap:wrap;gap:6px;font-size:15pt"><b style="font-size:15pt;font-weight:900">星期${cn[i]} / ${idn[i]} ${d.date}</b><span style="font-size:15pt;font-weight:900">用餐 / Makan: ${d.diners} &nbsp; 外帶 / Bungkus: ${d.takeaway}</span></div>`;if(d.dishes.length===0){html+=`<div style="padding:10px 14px;font-size:13pt">無 / Belum ada</div>`;}else{d.dishes.forEach(dd=>{let zh=(dd.noteZh||dd.note||'').replace(/中文：/g,'').replace(/中文:/g,'').trim();let idNote=(dd.noteId||'').trim();html+=`<div style="padding:10px 14px;border-bottom:1px dashed #999;font-size:13pt;break-inside:avoid"><b style="font-size:13pt;font-weight:900">${dd.name} / ${dd.indo||''}</b><div style="margin-top:8px;white-space:pre-wrap;font-size:13pt;line-height:1.5">${zh}</div><div style="margin-top:6px;white-space:pre-wrap;font-size:13pt;line-height:1.5">${idNote}</div></div>`;});}html+=`</div>`;});return html;}
function exportWeeklyPDF(){showPDF(makePDF(current.days.map(d=>({date:fmt(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway})), fmt(current.mon)));}
function pdfSingle(i){let m=weeklyMenus[i];showPDF(makePDF(m.days,m.monday));}
function showPDF(inner){document.getElementById('pdfContent').innerHTML=inner;document.getElementById('pdfWrap').classList.add('open');}
function closePDF(){document.getElementById('pdfWrap').classList.remove('open');}
async function sharePDF(){let content=document.getElementById('pdfContent');let btn=document.getElementById('btnSharePdf');if(btn.dataset.busy==="1")return;let old=btn.textContent;btn.textContent='⏳';btn.disabled=true;btn.dataset.busy="1";try{const{jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});const pageW=210,pageH=297,marginTop=15,marginBottom=20,marginX=15;const usableW=pageW-marginX*2;let curY=marginTop;let headerWrap=document.createElement('div');headerWrap.style.width='794px';headerWrap.style.background='#fff';headerWrap.style.position='fixed';headerWrap.style.left='-9999px';headerWrap.style.top='0';let hClone=document.createElement('div');hClone.innerHTML=content.children[0].outerHTML+content.children[1].outerHTML;hClone.style.width='794px';headerWrap.appendChild(hClone);document.body.appendChild(headerWrap);let hCanvas=await html2canvas(hClone,{scale:1.5,useCORS:true,backgroundColor:'#ffffff'});document.body.removeChild(headerWrap);let hImg=hCanvas.toDataURL('image/jpeg',0.85);let hH=hCanvas.height*usableW/hCanvas.width;pdf.addImage(hImg,'JPEG',marginX,curY,usableW,hH,undefined,'FAST');curY+=hH+6;let dayDivs=content.querySelectorAll('div[style*="border:2.5px solid"]');for(let dayEl of dayDivs){let dayHeader=dayEl.firstElementChild;let dishes=dayEl.querySelectorAll('div[style*="break-inside:avoid"]');for(let el of[dayHeader,...dishes]){let wrap=document.createElement('div');wrap.style.width='794px';wrap.style.background='#fff';wrap.style.position='fixed';wrap.style.left='-9999px';wrap.style.top='0';let clone=el.cloneNode(true);clone.style.width='794px';wrap.appendChild(clone);document.body.appendChild(wrap);let c=await html2canvas(clone,{scale:1.5,useCORS:true,backgroundColor:'#ffffff'});document.body.removeChild(wrap);let imgData=c.toDataURL('image/jpeg',0.85);let imgH=c.height*usableW/c.width;if(curY+imgH>pageH-marginBottom){pdf.addPage();curY=marginTop;}pdf.addImage(imgData,'JPEG',marginX,curY,usableW,imgH,undefined,'FAST');curY+=imgH+1;}curY+=4;}const blob=pdf.output('blob');const file=new File([blob],`每週菜單_${fmt(new Date())}.pdf`,{type:'application/pdf'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'每週菜單'});return;}}catch(e){if(e.name==='AbortError'||String(e.message).includes('cancellation')){return;}}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}catch(e){if(e.name!=='AbortError')alert('PDF失敗: '+e.message);}finally{btn.textContent=old;btn.disabled=false;btn.dataset.busy="0";}}
function exportLib(){let blob=new Blob([JSON.stringify({cats,dishes},null,2)],{type:'application/json;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`菜式庫_${fmt(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function importLib(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{try{let j=JSON.parse(ev.target.result);if(j.cats&&j.dishes){cats=j.cats;dishes=j.dishes;localStorage.setItem('cats',JSON.stringify(cats));localStorage.setItem('dishes',JSON.stringify(dishes));renderCats();renderCatOrder();alert('匯入成功');}}catch{alert('失敗');}};r.readAsText(f);e.target.value='';}
init();
</script>
</body>
