<!DOCTYPE html>
<html lang="zh-HK" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>每週菜單</title>
  
  <!-- PWA 設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="每週菜單">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontSize: {
            'senior-sm': '1.125rem',
            'senior-base': '1.25rem',
            'senior-lg': '1.5rem',
            'senior-xl': '1.875rem',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Alpine.js & PDFMake -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    /* 針對長者優化的動態字型 */
    .text-dynamic-base { font-size: calc(1.25rem * var(--font-scale, 1)); }
    .text-dynamic-lg { font-size: calc(1.5rem * var(--font-scale, 1)); }
    .text-dynamic-xl { font-size: calc(1.875rem * var(--font-scale, 1)); }
    /* iOS 避開 Home Bar 底部安全區域 */
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 5rem); }
  </style>
</head>
<body x-data="app()" x-init="initApp()" :class="{'dark bg-gray-900 text-white': darkMode, 'bg-slate-50 text-slate-900': !darkMode}" class="h-full flex flex-col font-sans select-none" :style="'--font-scale: ' + fontScale">

  <!-- 頂部列：僅主頁顯示頭像 -->
  <header x-show="currentTab === 'home'" class="p-4 bg-emerald-600 dark:bg-emerald-800 text-white flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-3">
      <img :src="avatar || 'https://via.placeholder.com/150'" class="w-14 h-14 rounded-full border-2 border-white object-cover">
      <div>
        <h1 class="text-dynamic-lg font-bold">歡迎使用</h1>
        <p class="text-sm opacity-90">規劃本週美味佳餚</p>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="flex-1 overflow-y-auto p-4 pb-safe">

    <!-- 1. 每週菜單頁 (Home/Menu) -->
    <div x-show="currentTab === 'home'" x-cloak class="space-y-4">
      <!-- 頂部控制行：選擇日期、儲存、匯出PDF (純圖示) -->
      <div class="flex items-center space-x-2 bg-white dark:bg-gray-800 p-3 rounded-2xl shadow">
        <label class="text-dynamic-base font-bold whitespace-nowrap">週一：</label>
        <input type="date" x-model="selectedMonday" @change="validateMonday($event)" class="flex-1 p-2 rounded-xl border border-gray-300 dark:bg-gray-700 dark:border-gray-600 text-dynamic-base">
        <button @click="saveCurrentMenu()" class="p-3 bg-emerald-500 text-white rounded-xl text-dynamic-lg active:scale-95 transition" title="儲存菜單">
          <i class="fa-solid fa-floppy-disk"></i>
        </button>
        <button @click="exportPDF()" class="p-3 bg-red-500 text-white rounded-xl text-dynamic-lg active:scale-95 transition" title="匯出PDF">
          <i class="fa-solid fa-file-pdf"></i>
        </button>
      </div>

      <!-- 星期 1 至 7 大正方形網格 -->
      <div class="grid grid-cols-2 gap-4">
        <!-- 一、二 -->
        <template x-for="dayIdx in [0, 1]" :key="dayIdx">
          <div @click="openDayModal(dayIdx)" class="aspect-square bg-emerald-100 dark:bg-emerald-900/40 border-2 border-emerald-500 rounded-3xl p-3 flex flex-col justify-between items-center shadow-lg active:scale-95 transition cursor-pointer">
            <span class="text-dynamic-lg font-black text-emerald-800 dark:text-emerald-300" x-text="daysHeader[dayIdx].name"></span>
            <div class="text-5xl my-1" x-text="daysHeader[dayIdx].icon"></div>
            <span class="text-dynamic-base text-slate-600 dark:text-slate-300 font-bold" x-text="(weeklyMenu[dayIdx]?.dishes.length || 0) + ' 道菜'"></span>
          </div>
        </template>
        <!-- 三、四 -->
        <template x-for="dayIdx in [2, 3]" :key="dayIdx">
          <div @click="openDayModal(dayIdx)" class="aspect-square bg-emerald-100 dark:bg-emerald-900/40 border-2 border-emerald-500 rounded-3xl p-3 flex flex-col justify-between items-center shadow-lg active:scale-95 transition cursor-pointer">
            <span class="text-dynamic-lg font-black text-emerald-800 dark:text-emerald-300" x-text="daysHeader[dayIdx].name"></span>
            <div class="text-5xl my-1" x-text="daysHeader[dayIdx].icon"></div>
            <span class="text-dynamic-base text-slate-600 dark:text-slate-300 font-bold" x-text="(weeklyMenu[dayIdx]?.dishes.length || 0) + ' 道菜'"></span>
          </div>
        </template>
      </div>
      <!-- 五、六、日 (每行居中/網格顯示) -->
      <div class="grid grid-cols-3 gap-3">
        <template x-for="dayIdx in [4, 5, 6]" :key="dayIdx">
          <div @click="openDayModal(dayIdx)" class="aspect-square bg-emerald-100 dark:bg-emerald-900/40 border-2 border-emerald-500 rounded-3xl p-2 flex flex-col justify-between items-center shadow-lg active:scale-95 transition cursor-pointer">
            <span class="text-dynamic-base font-black text-emerald-800 dark:text-emerald-300" x-text="daysHeader[dayIdx].name"></span>
            <div class="text-4xl my-1" x-text="daysHeader[dayIdx].icon"></div>
            <span class="text-sm text-slate-600 dark:text-slate-300 font-bold" x-text="(weeklyMenu[dayIdx]?.dishes.length || 0) + ' 道菜'"></span>
          </div>
        </template>
      </div>
    </div>

    <!-- 2. 菜式庫頁 (Recipes) -->
    <div x-show="currentTab === 'recipes'" x-cloak class="space-y-4">
      <!-- 頂部按鈕行：匯出、匯入、新增菜式 -->
      <div class="grid grid-cols-3 gap-2">
        <button @click="exportRecipesJSON()" class="p-3 bg-blue-600 text-white rounded-2xl text-dynamic-base font-bold shadow active:scale-95">匯出</button>
        <button @click="$refs.importFileInput.click()" class="p-3 bg-indigo-600 text-white rounded-2xl text-dynamic-base font-bold shadow active:scale-95">匯入</button>
        <input type="file" x-ref="importFileInput" @change="importRecipesJSON($event)" accept=".json" class="hidden">
        <button @click="showAddDishModal = true" class="p-3 bg-emerald-600 text-white rounded-2xl text-dynamic-base font-bold shadow active:scale-95">新增菜式</button>
      </div>

      <!-- 分類大正方形，每行 3 個 -->
      <div class="grid grid-cols-3 gap-3">
        <template x-for="cat in categories" :key="cat.id">
          <div @click="activeCategory = cat; showCatDishesModal = true" class="aspect-square bg-orange-100 dark:bg-orange-900/40 border-2 border-orange-400 rounded-3xl p-2 flex flex-col justify-between items-center shadow active:scale-95 transition cursor-pointer">
            <span class="text-dynamic-base font-bold text-orange-900 dark:text-orange-200" x-text="cat.name"></span>
            <div class="text-4xl" x-text="cat.icon"></div>
            <span class="text-xs text-slate-500 dark:text-slate-400" x-text="getCategoryDishCount(cat.name) + ' 款'"></span>
          </div>
        </template>
      </div>
    </div>

    <!-- 3. 我的菜單頁 (Saved Menus) -->
    <div x-show="currentTab === 'myMenus'" x-cloak class="space-y-4">
      <h2 class="text-dynamic-xl font-bold mb-2">已儲存菜單 (最多10張)</h2>
      <template x-for="(menu, idx) in savedMenus" :key="menu.date">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow border border-gray-200 dark:border-gray-700 space-y-3">
          <div class="flex justify-between items-center border-b pb-2">
            <span class="text-dynamic-lg font-bold text-emerald-600 dark:text-emerald-400" x-text="'週一日期：' + menu.date"></span>
            <div class="space-x-2">
              <button @click="loadSavedMenuToCurrent(menu)" class="px-3 py-1 bg-blue-500 text-white rounded-xl text-sm">載入/修改</button>
              <button @click="deleteSavedMenu(idx)" class="px-3 py-1 bg-red-500 text-white rounded-xl text-sm">刪除</button>
            </div>
          </div>
          <!-- 菜單詳情 -->
          <div class="space-y-2">
            <template x-for="(day, dIdx) in menu.days" :key="dIdx">
              <div class="text-dynamic-base">
                <span class="font-bold text-orange-600 dark:text-orange-400" x-text="daysHeader[dIdx].name + '：'"></span>
                <span x-text="' (用餐:' + day.diners + '人, 外帶:' + day.takeout + '人)'" class="text-sm text-gray-500"></span>
                <div class="pl-4 space-y-1 mt-1">
                  <template x-for="dish in day.dishes" :key="dish.id">
                    <div x-data="{ openNote: false }" class="border-l-2 border-emerald-400 pl-2">
                      <div @click="openNote = !openNote" class="cursor-pointer font-medium flex justify-between items-center">
                        <div>
                          <span x-text="dish.name"></span> / <span class="text-emerald-600 dark:text-emerald-400" x-text="dish.indoName"></span>
                        </div>
                        <i class="fa-solid text-xs" :class="openNote ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                      </div>
                      <div x-show="openNote" class="text-sm bg-slate-100 dark:bg-gray-700 p-2 rounded-lg mt-1 space-y-1">
                        <p x-text="'中文備註：' + (dish.note || '無')"></p>
                        <p x-text="'印尼文：' + (dish.indoNote || '無')"></p>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- 4. 設定頁 (Settings) -->
    <div x-show="currentTab === 'settings'" x-cloak class="space-y-6">
      <!-- 深淺色轉換 -->
      <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow flex justify-between items-center">
        <span class="text-dynamic-lg font-bold">深色模式</span>
        <button @click="darkMode = !darkMode" class="px-4 py-2 bg-slate-200 dark:bg-gray-600 rounded-xl text-dynamic-base font-bold">
          <span x-text="darkMode ? '已開啟' : '已關閉'"></span>
        </button>
      </div>

      <!-- 自訂字體大小 -->
      <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow space-y-2">
        <span class="text-dynamic-lg font-bold">字體縮放</span>
        <div class="flex items-center space-x-4">
          <input type="range" min="0.8" max="1.5" step="0.1" x-model="fontScale" class="w-full">
          <span class="text-dynamic-base font-bold" x-text="Math.round(fontScale * 100) + '%'"></span>
        </div>
      </div>

      <!-- 自訂頭像 -->
      <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow space-y-3">
        <span class="text-dynamic-lg font-bold block">自訂頭像</span>
        <input type="file" @change="uploadAvatar($event)" accept="image/*" class="text-dynamic-base">
      </div>

      <!-- 分類管理 -->
      <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow space-y-4">
        <div class="flex justify-between items-center">
          <span class="text-dynamic-lg font-bold">分類管理</span>
          <button @click="addNewCategoryPrompt()" class="px-3 py-1 bg-emerald-600 text-white rounded-xl text-dynamic-base">+ 新增分類</button>
        </div>
        <div class="space-y-2">
          <template x-for="(cat, idx) in categories" :key="cat.id">
            <div class="flex items-center justify-between p-3 bg-slate-100 dark:bg-gray-700 rounded-xl">
              <div class="flex items-center space-x-2">
                <span class="text-2xl" x-text="cat.icon"></span>
                <span class="text-dynamic-base font-bold" x-text="cat.name"></span>
              </div>
              <div class="flex items-center space-x-2">
                <button @click="moveCategory(idx, -1)" class="p-2 bg-gray-300 dark:bg-gray-600 rounded-lg"><i class="fa-solid fa-arrow-up"></i></button>
                <button @click="moveCategory(idx, 1)" class="p-2 bg-gray-300 dark:bg-gray-600 rounded-lg"><i class="fa-solid fa-arrow-down"></i></button>
                <button @click="deleteCategory(cat, idx)" class="p-2 bg-red-500 text-white rounded-lg"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

  </main>

  <!-- 彈出視窗 1：單日菜單編輯 modal -->
  <div x-show="showDayModal" x-cloak class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 w-full max-w-lg rounded-3xl p-5 space-y-4 max-h-[90vh] overflow-y-auto relative shadow-2xl">
      <button @click="showDayModal = false" class="absolute top-4 right-4 text-3xl font-bold text-gray-500">✕</button>
      <h3 class="text-dynamic-xl font-bold text-emerald-600 dark:text-emerald-400" x-text="daysHeader[activeDayIndex]?.name + ' 菜單安排'"></h3>
      
      <!-- 人數選擇 -->
      <div class="grid grid-cols-2 gap-4 bg-slate-100 dark:bg-gray-700 p-3 rounded-2xl">
        <div>
          <label class="block text-dynamic-base font-bold">用餐人數</label>
          <select x-model="weeklyMenu[activeDayIndex].diners" class="w-full mt-1 p-2 rounded-xl text-dynamic-base border dark:bg-gray-800">
            <template x-for="i in 10"><option :value="i-1" x-text="i-1"></option></template>
          </select>
        </div>
        <div>
          <label class="block text-dynamic-base font-bold">外帶人數</label>
          <select x-model="weeklyMenu[activeDayIndex].takeout" class="w-full mt-1 p-2 rounded-xl text-dynamic-base border dark:bg-gray-800">
            <template x-for="i in 10"><option :value="i-1" x-text="i-1"></option></template>
          </select>
        </div>
      </div>

      <!-- 已選菜式列表 -->
      <div class="space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-dynamic-lg font-bold">已選菜式：</span>
          <button @click="showSelectCatModal = true" class="px-4 py-2 bg-emerald-600 text-white rounded-2xl text-dynamic-base font-bold">+ 選擇菜式</button>
        </div>
        <template x-for="(dish, dIdx) in weeklyMenu[activeDayIndex]?.dishes" :key="dIdx">
          <div class="flex justify-between items-center bg-emerald-50 dark:bg-gray-700 p-3 rounded-xl border border-emerald-200">
            <div>
              <p class="text-dynamic-base font-bold" x-text="dish.name"></p>
              <p class="text-sm text-emerald-600 dark:text-emerald-400" x-text="dish.indoName"></p>
            </div>
            <button @click="weeklyMenu[activeDayIndex].dishes.splice(dIdx, 1)" class="p-2 text-red-500 text-dynamic-lg"><i class="fa-solid fa-trash"></i></button>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- 彈出視窗 2：選擇菜式分類 modal -->
  <div x-show="showSelectCatModal" x-cloak class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 w-full max-w-lg rounded-3xl p-5 space-y-4 relative shadow-2xl">
      <button @click="showSelectCatModal = false" class="absolute top-4 right-4 text-3xl font-bold text-gray-500">✕</button>
      <h3 class="text-dynamic-xl font-bold">請選擇菜式分類</h3>
      <div class="grid grid-cols-3 gap-3">
        <template x-for="cat in categories" :key="cat.id">
          <div @click="activeSelectCat = cat.name; showSelectDishListModal = true" class="aspect-square bg-orange-100 dark:bg-orange-900/40 border-2 border-orange-400 rounded-3xl p-2 flex flex-col justify-center items-center cursor-pointer active:scale-95">
            <span class="text-3xl" x-text="cat.icon"></span>
            <span class="text-dynamic-base font-bold mt-1" x-text="cat.name"></span>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- 彈出視窗 3：從分類中挑選菜式 modal -->
  <div x-show="showSelectDishListModal" x-cloak class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 w-full max-w-lg rounded-3xl p-5 space-y-4 max-h-[80vh] overflow-y-auto relative shadow-2xl">
      <button @click="showSelectDishListModal = false" class="absolute top-4 right-4 text-3xl font-bold text-gray-500">✕</button>
      <h3 class="text-dynamic-xl font-bold" x-text="activeSelectCat + ' - 選擇菜式'"></h3>
      <div class="space-y-2">
        <template x-for="dish in getDishesByCategory(activeSelectCat)" :key="dish.id">
          <div class="p-3 bg-slate-100 dark:bg-gray-700 rounded-2xl flex justify-between items-center">
            <div @click="openNoteDetail(dish)" class="cursor-pointer flex-1">
              <p class="text-dynamic-base font-bold" x-text="dish.name"></p>
              <p class="text-sm text-emerald-600 dark:text-emerald-400" x-text="dish.indoName"></p>
              <p class="text-xs text-gray-400" x-text="'上次烹飪：' + (dish.lastCooked || '無')"></p>
            </div>
            <button @click="addDishToDay(dish)" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-dynamic-base font-bold">加入</button>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- 彈出視窗 4：菜式庫分類彈出菜式 modal -->
  <div x-show="showCatDishesModal" x-cloak class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 w-full max-w-lg rounded-3xl p-5 space-y-4 max-h-[85vh] overflow-y-auto relative shadow-2xl">
      <button @click="showCatDishesModal = false" class="absolute top-4 right-4 text-3xl font-bold text-gray-500">✕</button>
      <h3 class="text-dynamic-xl font-bold text-orange-600 dark:text-orange-400" x-text="activeCategory?.name + ' 菜式清單'"></h3>
      
      <div class="space-y-3">
        <template x-for="dish in getDishesByCategory(activeCategory?.name)" :key="dish.id">
          <div class="p-3 bg-slate-100 dark:bg-gray-700 rounded-2xl space-y-2">
            <div @click="openNoteDetail(dish)" class="cursor-pointer">
              <span class="text-dynamic-lg font-bold" x-text="dish.name"></span>
              <span class="text-dynamic-base text-emerald-600 dark:text-emerald-400 block" x-text="dish.indoName"></span>
            </div>
            <!-- 三個按鍵：加入日曆、修改、刪除 -->
            <div class="flex justify-end space-x-2 pt-2 border-t">
              <button @click="openAddToDateModal(dish)" class="px-3 py-1 bg-emerald-600 text-white rounded-xl text-sm font-bold"><i class="fa-solid fa-calendar-plus"></i> 加入菜單</button>
              <button @click="openEditDishModal(dish)" class="px-3 py-1 bg-blue-600 text-white rounded-xl text-sm font-bold"><i class="fa-solid fa-pen"></i> 修改</button>
              <button @click="deleteDish(dish.id)" class="px-3 py-1 bg-red-600 text-white rounded-xl text-sm font-bold"><i class="fa-solid fa-trash"></i> 刪除</button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- 彈出視窗 5：菜式備註 modal -->
  <div x-show="showNoteModal" x-cloak class="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-3xl p-5 space-y-3 relative shadow-2xl">
      <button @click="showNoteModal = false" class="absolute top-4 right-4 text-3xl font-bold text-gray-500">✕</button>
      <h3 class="text-dynamic-xl font-bold" x-text="activeDishNote?.name"></h3>
      <p class="text-dynamic-base text-emerald-600 font-bold" x-text="activeDishNote?.indoName"></p>
      <div class="bg-slate-100 dark:bg-gray-700 p-3 rounded-2xl space-y-2 text-dynamic-base">
        <p x-text="'中文烹調備註：' + (activeDishNote?.note || '無')"></p>
        <p x-text="'印尼文：' + (activeDishNote?.indoNote || '無')"></p>
      </div>
    </div>
  </div>

  <!-- 彈出視窗 6：新增/修改菜式 modal -->
  <div x-show="showAddDishModal" x-cloak class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 w-full max-w-lg rounded-3xl p-5 space-y-4 max-h-[90vh] overflow-y-auto relative shadow-2xl">
      <button @click="showAddDishModal = false" class="absolute top-4 right-4 text-3xl font-bold text-gray-500">✕</button>
      <h3 class="text-dynamic-xl font-bold" x-text="editingDish ? '修改菜式' : '新增菜式'"></h3>
      <div class="space-y-3">
        <div>
          <label class="block text-dynamic-base font-bold">中文菜名</label>
          <input type="text" x-model="dishForm.name" class="w-full p-2 border rounded-xl dark:bg-gray-700 text-dynamic-base">
        </div>
        <div>
          <label class="block text-dynamic-base font-bold">印尼文菜名</label>
          <input type="text" x-model="dishForm.indoName" class="w-full p-2 border rounded-xl dark:bg-gray-700 text-dynamic-base">
        </div>
        <div>
          <label class="block text-dynamic-base font-bold">分類</label>
          <select x-model="dishForm.category" class="w-full p-2 border rounded-xl dark:bg-gray-700 text-dynamic-base">
            <template x-for="cat in categories" :key="cat.id">
              <option :value="cat.name" x-text="cat.name"></option>
            </template>
          </select>
        </div>
        <div>
          <label class="block text-dynamic-base font-bold">中文烹調方法/備註</label>

  <!-- JavaScript 邏輯 -->
  <script>
    function app() {
      return {
        currentTab: 'home',
        darkMode: false,
        fontScale: 1.0,
        avatar: '',
        selectedMonday: '',
        activeDayIndex: 0,
        showDayModal: false,
        showSelectCatModal: false,
        showSelectDishListModal: false,
        activeSelectCat: '',
        showCatDishesModal: false,
        activeCategory: null,
        showNoteModal: false,
        activeDishNote: null,
        showAddDishModal: false,
        editingDish: null,
        dishForm: { name: '', indoName: '', category: '雞', note: '', indoNote: '' },

        daysHeader: [
          { name: '星期一 / Senin', icon: '🍳' },
          { name: '星期二 / Selasa', icon: '🍲' },
          { name: '星期三 / Rabu', icon: '🥗' },
          { name: '星期四 / Kamis', icon: '蒸' },
          { name: '星期五 / Jumat', icon: '🍗' },
          { name: '星期六 / Sabtu', icon: '魚' },
          { name: '星期日 / Minggu', icon: '🍲' }
        ],

        categories: [
          { id: 1, name: '雞', icon: '🐔' },
          { id: 2, name: '牛', icon: '🐮' },
          { id: 3, name: '豬', icon: '🐷' },
          { id: 4, name: '魚', icon: '🐟' },
          { id: 5, name: '蔬菜', icon: '🥬' },
          { id: 6, name: '湯水', icon: '🥣' },
          { id: 7, name: '西式', icon: '🍝' },
          { id: 8, name: '罐頭', icon: '🥫' },
          { id: 9, name: '其他', icon: '🍱' }
        ],

        dishes: [],
        weeklyMenu: Array.from({ length: 7 }, () => ({ diners: 0, takeout: 0, dishes: [] })),
        savedMenus: [],

        initApp() {
          this.initDefaultMonday();
          this.loadLocalData();
          if (this.dishes.length === 0) {
            this.seedDefaultDishes();
          }
        },

        initDefaultMonday() {
          const d = new Date();
          const day = d.getDay();
          const diff = d.getDate() - day + (day === 0 ? -6 : 1);
          const monday = new Date(d.setDate(diff));
          this.selectedMonday = monday.toISOString().split('T')[0];
        },

        validateMonday(e) {
          const val = e.target.value;
          if (!val) return;
          const d = new Date(val);
          if (d.getDay() !== 1) {
            alert('只可以選擇星期一作起始日！');
            this.initDefaultMonday();
          }
        },

        getCategoryDishCount(catName) {
          return this.dishes.filter(d => d.category === catName).length;
        },

        getDishesByCategory(catName) {
          return this.dishes.filter(d => d.category === catName);
        },

        openDayModal(idx) {
          this.activeDayIndex = idx;
          this.showDayModal = true;
        },

        addDishToDay(dish) {
          this.weeklyMenu[this.activeDayIndex].dishes.push({ ...dish });
          this.showSelectDishListModal = false;
          this.showSelectCatModal = false;
        },

        openNoteDetail(dish) {
          this.activeDishNote = dish;
          this.showNoteModal = true;
        },

        openEditDishModal(dish) {
          this.editingDish = dish;
          this.dishForm = { ...dish };
          this.showAddDishModal = true;
        },

        saveDishForm() {
          if (!this.dishForm.name) return alert('請輸入菜名');
          if (this.editingDish) {
            Object.assign(this.editingDish, this.dishForm);
          } else {
            this.dishes.push({
              id: Date.now(),
              ...this.dishForm,
              lastCooked: ''
            });
          }
          this.saveLocalData();
          this.showAddDishModal = false;
          this.editingDish = null;
          this.dishForm = { name: '', indoName: '', category: '雞', note: '', indoNote: '' };
        },

        deleteDish(id) {
          if (confirm('確定刪除此菜式？')) {
            this.dishes = this.dishes.filter(d => d.id !== id);
            this.saveLocalData();
          }
        },

        openAddToDateModal(dish) {
          const inputDate = prompt('請輸入要加入的日期 (YYYY-MM-DD)：', this.selectedMonday);
          if (!inputDate) return;
          const d = new Date(inputDate);
          const day = d.getDay();
          const targetIndex = day === 0 ? 6 : day - 1;
          this.weeklyMenu[targetIndex].dishes.push({ ...dish });
          alert(`已加入到 ${this.daysHeader[targetIndex].name}`);
        },

        saveCurrentMenu() {
          if (this.savedMenus.length >= 10) {
            alert('最多只能儲存10張每週菜單，請先刪除舊菜單。');
            return;
          }
          const existingIdx = this.savedMenus.findIndex(m => m.date === this.selectedMonday);
          if (existingIdx !== -1) {
            if (!confirm('該週菜單已存在，是否取代？')) return;
            this.savedMenus[existingIdx] = { date: this.selectedMonday, days: JSON.parse(JSON.stringify(this.weeklyMenu)) };
          } else {
            this.savedMenus.push({ date: this.selectedMonday, days: JSON.parse(JSON.stringify(this.weeklyMenu)) });
          }
          
          // 更新菜式的最後烹飪日期
          this.weeklyMenu.forEach(day => {
            day.dishes.forEach(d => {
              const target = this.dishes.find(x => x.id === d.id);
              if (target) target.lastCooked = this.selectedMonday;
            });
          });

          this.saveLocalData();
          alert('菜單已儲存！');
        },

        loadSavedMenuToCurrent(menu) {
          this.selectedMonday = menu.date;
          this.weeklyMenu = JSON.parse(JSON.stringify(menu.days));
          this.currentTab = 'home';
        },

        deleteSavedMenu(idx) {
          if (confirm('確定刪除此每週菜單？')) {
            this.savedMenus.splice(idx, 1);
            this.saveLocalData();
          }
        },

        // JSON 匯出與匯入 (菜式庫)
        exportRecipesJSON() {
          const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.dishes, null, 2));
          const dlAnchorElem = document.createElement('a');
          dlAnchorElem.setAttribute("href", dataStr);
          dlAnchorElem.setAttribute("download", "recipes_backup.json");
          dlAnchorElem.click();
        },

        importRecipesJSON(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const imported = JSON.parse(e.target.result);
              if (Array.isArray(imported)) {
                this.dishes = imported;
                this.saveLocalData();
                alert('菜式庫匯入成功！');
              }
            } catch (err) {
              alert('JSON 格式錯誤，無法匯入');
            }
          };
          reader.readAsText(file);
        },

        // PDF 匯出功能
        exportPDF() {
          const docDefinition = {
            pageSize: 'A4',
            pageMargins: [20, 20, 20, 20],
            content: [
              { text: `每週菜單 Menu Mingguan (${this.selectedMonday})`, style: 'header', alignment: 'center' },
              { text: '\n' }
            ],
            styles: {
              header: { fontSize: 22, bold: true },
              dayTitle: { fontSize: 16, bold: true, margin: [0, 5, 0, 5] },
              dishName: { fontSize: 14, bold: true },
              noteText: { fontSize: 12, italics: true, color: '#555555' }
            }
          };

          this.weeklyMenu.forEach((day, idx) => {
            docDefinition.content.push({
              text: `${this.daysHeader[idx].name} (Diners: ${day.diners}, Takeout: ${day.takeout})`,
              style: 'dayTitle'
            });

            if (day.dishes.length === 0) {
              docDefinition.content.push({ text: '無安排 / Tidak ada', margin: [10, 0, 0, 5] });
            } else {
              day.dishes.forEach(dish => {
                docDefinition.content.push({ text: `• ${dish.name} / ${dish.indoName}`, style: 'dishName', margin: [10, 2, 0, 0] });
                docDefinition.content.push({ text: `  備註：${dish.note || '-'} | Indo: ${dish.indoNote || '-'}`, style: 'noteText', margin: [15, 0, 0, 4] });
              });
            }
          });

          pdfMake.createPdf(docDefinition).download(`Menu_${this.selectedMonday}.pdf`);
        },

        moveCategory(idx, dir) {
          const target = idx + dir;
          if (target < 0 || target >= this.categories.length) return;
          const temp = this.categories[idx];
          this.categories[idx] = this.categories[target];
          this.categories[target] = temp;
          this.saveLocalData();
        },

        deleteCategory(cat, idx) {
          if (confirm(`刪除「${cat.name}」分類後，該分類所有菜式將自動移至「其他」分類，確定刪除？`)) {
            this.dishes.forEach(d => {
              if (d.category === cat.name) d.category = '其他';
            });
            this.categories.splice(idx, 1);
            this.saveLocalData();
          }
        },

        addNewCategoryPrompt() {
          const name = prompt('請輸入新分類名稱：');
          if (name) {
            this.categories.push({ id: Date.now(), name, icon: '🍲' });
            this.saveLocalData();
          }
        },

        uploadAvatar(e) {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (evt) => {
            this.avatar = evt.target.result;
            this.saveLocalData();
          };
          reader.readAsDataURL(file);
        },

        saveLocalData() {
          localStorage.setItem('menu_app_dishes', JSON.stringify(this.dishes));
          localStorage.setItem('menu_app_saved_menus', JSON.stringify(this.savedMenus));
          localStorage.setItem('menu_app_categories', JSON.stringify(this.categories));
          localStorage.setItem('menu_app_avatar', this.avatar);
        },

        loadLocalData() {
          const d = localStorage.getItem('menu_app_dishes');
          if (d) this.dishes = JSON.parse(d);
          const m = localStorage.getItem('menu_app_saved_menus');
          if (m) this.savedMenus = JSON.parse(m);
          const c = localStorage.getItem('menu_app_categories');
          if (c) this.categories = JSON.parse(c);
          const a = localStorage.getItem('menu_app_avatar');
          if (a) this.avatar = a;
        },
