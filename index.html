<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每週菜單">
<meta name="theme-color" content="#ff6b35">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>每週菜單</title>
<style>
:root{--bg:#fdf8f0;--card:#fff;--text:#1a1a1a;--muted:#8a8a8a;--primary:#ff6b35;--border:#f0e6d8;--r:20px;--fs:18px}
.dark{--bg:#111;--card:#1e1e1e;--text:#f5f5f5;--border:#333;--muted:#aaa}
html{font-size:var(--fs)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK",sans-serif;font-size:1rem;padding-bottom:130px;line-height:1.5}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center}
.avatar{width:54px;height:54px;border-radius:50%;border:3px solid var(--primary);object-fit:cover}
.page{max-width:500px;margin:0 auto;padding:16px;display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.bigBtn{flex:1;padding:16px;border-radius:16px;border:none;background:var(--primary);color:#fff;font-size:1.1rem;font-weight:800}
.ghost{flex:1;padding:14px;border-radius:14px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem;font-weight:700}
.iconBtn{width:56px;height:56px;display:grid;place-items:center;border-radius:16px;border:1.5px solid var(--border);background:var(--card);font-size:28px}
.catBox{aspect-ratio:1;border-radius:22px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:10px;cursor:pointer;border:2.5px solid #111;position:relative;overflow:hidden}
.catBox.emoji{font-size:56px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}.catBox.label{margin-top:6px;background:#fff;color:#111;padding:4px 10px;border-radius:12px;font-weight:800;font-size:.95rem;border:1.5px solid #111}
.weekGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;justify-items:center}
.weekGrid.full{grid-column:1 / -1; display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; width:100%}
.dayBox{aspect-ratio:1;width:100%;max-width:220px;border-radius:22px;border:2.5px solid #111;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;background:var(--card);text-align:center;padding:8px}
.dayBox.d1{font-size:2.2rem}.dayBox.d2{font-weight:800;margin-top:4px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1.5px solid var(--border);display:flex;justify-content:space-around;padding:14px 0 34px;z-index:20}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}.nav.active{color:var(--primary)}.nav.ic{font-size:36px;line-height:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:100;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:28px;padding:0;border:2px solid #111}
.sheetHead{position:sticky;top:0;background:var(--card);padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;z-index:2}
.x{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;font-size:22px;background:var(--bg);cursor:pointer}
.dishRow{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px dashed var(--border);gap:8px}
.dishRow b{font-size:1.1rem}.act{display:flex;gap:6px}.act button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);font-size:18px}
select,input,textarea{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem}
#pdfWrap{position:fixed;inset:0;background:#eee;z-index:200;overflow:auto;display:none}#pdfWrap.open{display:block}
.pdfTool{position:sticky;top:0;background:#fff;padding:12px 16px;display:flex;gap:10px;border-bottom:1px solid #ccc}
.pdfPage{width:210mm;background:#fff;margin:0 auto;padding:18mm 14mm;min-height:297mm}
@media screen and (max-width:800px){.pdfPage{width:100%;padding:6vw}}
.pdfTitle{font-size:22pt;font-weight:900;text-align:center}.pdfSub{font-size:12pt;text-align:center;color:#666;margin-bottom:12px}
.pdfDay{border:1.8px solid #111;border-radius:12px;margin-bottom:14px;page-break-inside:avoid}
.pdfDayH{background:#111;color:#fff;padding:8px 12px;display:flex;justify-content:space-between;font-weight:800}
.pdfDish{padding:10px 12px;border-top:1px dashed #aaa}
</style>
</head>
<body>

<div class="top">
  <div class="row"><img id="avatarTop" class="avatar" src="icon.png"><div><div style="font-weight:900;font-size:1.2rem">每週菜單</div><div style="font-size:.85rem;color:var(--muted)">Mingguan Menu</div></div></div>
  <div id="fontInfo" style="font-size:.9rem;color:var(--muted)"></div>
</div>

<div id="p-weekly" class="page active">
  <div class="card row"><input type="date" id="mondayPicker"><button class="iconBtn" onclick="saveWeekly()" title="儲存">💾</button><button class="iconBtn" onclick="exportWeeklyPDF()" title="PDF">📄</button></div>
  <div id="weeklyGrid" class="weekGrid"></div>
</div>

<div id="p-library" class="page">
  <div class="card row"><button class="ghost" onclick="exportLib()">匯出</button><button class="ghost" onclick="document.getElementById('importFile').click()">匯入</button><button class="bigBtn" onclick="openAdd()">新增菜式</button><input type="file" id="importFile" accept=".json" style="display:none"></div>
  <div class="row3" id="catGrid"></div>
</div>

<div id="p-mymenus" class="page"><div id="myList"></div></div>

<div id="p-settings" class="page">
  <div class="card"><h3>分類排序</h3><div id="catOrder"></div><div class="row" style="margin-top:10px"><input id="newCat" placeholder="新分類名稱"><button class="bigBtn" onclick="addCat()">新增</button></div></div>
  <div class="card"><h3>外觀</h3><div class="row"><span>深淺色</span><button class="ghost" onclick="toggleTheme()">切換</button></div><div style="margin-top:12px"><label>字體大小 <span id="fsVal">18</span>px</label><input type="range" id="fsRange" min="14" max="26" value="18" oninput="setFS(this.value)"></div></div>
  <div class="card"><h3>頭像設定</h3><input type="file" id="avatarFile" accept="image/*"><div style="position:relative;width:260px;height:260px;margin:12px auto;border-radius:50%;overflow:hidden;border:3px solid var(--primary);background:#000;touch-action:none"><canvas id="avCanvas" width="600" height="600" style="width:100%;height:100%"></canvas></div><div class="row"><span>縮放</span><input type="range" id="avZoom" min="0.2" max="4" step="0.05" value="1" style="flex:1"><button class="ghost" onclick="resetAv()">重置</button></div><button class="bigBtn" style="width:100%;margin-top:8px" onclick="saveAv()">儲存頭像</button></div>
</div>

<div class="bottom">
  <div class="nav active" onclick="go('weekly')"><span class="ic">📅</span><span>每週</span></div>
  <div class="nav" onclick="go('library')"><span class="ic">📚</span><span>菜式庫</span></div>
  <div class="nav" onclick="go('mymenus')"><span class="ic">🗂️</span><span>我的菜單</span></div>
  <div class="nav" onclick="go('settings')"><span class="ic">⚙️</span><span>設定</span></div>
</div>

<div class="modal" id="catModal"><div class="sheet"><div class="sheetHead"><b id="catTitle">分類</b><div class="x" onclick="closeM('catModal')">✕</div></div><div id="catDishes"></div></div></div>
<div class="modal" id="dishNoteModal"><div class="sheet"><div class="sheetHead"><b>備註 Catatan</b><div class="x" onclick="closeM('dishNoteModal')">✕</div></div><div style="padding:16px;white-space:pre-wrap;font-size:1.1rem" id="noteContent"></div></div></div>
<div class="modal" id="weekModal"><div class="sheet"><div class="sheetHead"><b id="weekTitle">日期</b><div class="x" onclick="closeM('weekModal')">✕</div></div><div style="padding:16px"><div class="row"><label>用餐 Makan</label><select id="diners"></select><label>外帶 Bungkus</label><select id="takeaway"></select></div><div id="selectedDishes" style="margin-top:12px"></div><button class="bigBtn" style="width:100%;margin-top:12px" onclick="openDishPicker()">選擇菜式 Pilih Menu</button></div></div></div>
<div class="modal" id="pickModal"><div class="sheet"><div class="sheetHead"><b>分類 Kategori</b><div class="x" onclick="closeM('pickModal')">✕</div></div><div id="pickCats" class="row3" style="padding:12px"></div></div></div>
<div class="modal" id="pickDishModal"><div class="sheet"><div class="sheetHead"><b>菜式 Menu</b><div class="x" onclick="closeM('pickDishModal')">✕</div></div><div id="pickDishes"></div></div></div>
<div class="modal" id="addModal"><div class="sheet"><div class="sheetHead"><b>新增/修改菜式</b><div class="x" onclick="closeM('addModal')">✕</div></div><div style="padding:16px"><input id="f_name" placeholder="中文菜名"><input id="f_indo" placeholder="印尼文 Nama Indonesia" style="margin-top:10px"><textarea id="f_note" placeholder="備註 + 烹調方法 (中+印) Catatan + Cara masak" style="margin-top:10px;height:120px"></textarea><select id="f_cat" style="margin-top:10px"></select><input type="hidden" id="f_id"><button class="bigBtn" style="width:100%;margin-top:12px" onclick="saveDish()">儲存 Simpan</button></div></div></div>
<div class="modal" id="dateForDishModal"><div class="sheet"><div class="sheetHead"><b>加入到哪一天？</b><div class="x" onclick="closeM('dateForDishModal')">✕</div></div><div style="padding:16px"><input type="date" id="anyDate"><button class="bigBtn" style="width:100%;margin-top:10px" onclick="confirmAddToDay()">確認加入</button></div></div></div>

<div id="pdfWrap"><div class="pdfTool"><button class="bigBtn" onclick="closePDF()">✕ 關閉</button><button class="ghost" onclick="downloadPDF()">💾 儲存</button><button class="ghost" onclick="sharePDF()">📤 傳送</button></div><div class="pdfPage" id="pdfContent"></div></div>

<script>
const CAT_META={
"雞 Ayam":{bg:"#ffeb8a",emoji:"🐔"},

"魚 Ikan":{bg:"#8ecfff",emoji:"🐟"},
"蔬菜 Sayur":{bg:"#a8e6a3",emoji:"🥬"},
"湯水 Sup":{bg:"#ffcc7a",emoji:"🍲"},
"西式 Barat":{bg:"#e2c499",emoji:"🍔"},
"罐頭 Kaleng":{bg:"#9ec6ff",emoji:"🥫"},
"其他 Lainnya":{bg:"#d8b4fe",emoji:"🍱"}
};
let cats=JSON.parse(localStorage.getItem('cats')||'null')||Object.keys(CAT_META);
let dishes=JSON.parse(localStorage.getItem('dishes')||'null')||[];
let weeklyMenus=JSON.parse(localStorage.getItem('weeklyMenus')||'[]');
let currentWeek={monday:null,days:[]};
let lastCook=JSON.parse(localStorage.getItem('lastCook')||'{}');
let editingDayIndex=null, pendingDishId=null;

function defaultDishes(){
 if(dishes.length) return dishes;
 const data=[
["雞 Ayam",[

["咖喱雞","Kari Ayam","中文：咖喱粉洋蔥爆香，雞炒勻加椰奶薯仔炆30分。\nIndonesia: Tumis bubuk kari dan bawang bombay, masukkan ayam, tambah santan dan kentang, masak 30 menit."],
["蒸雞","Ayam Kukus","中文：雞醃鹽薑汁蒸15分，淋熟油豉油。\nIndonesia: Marinasi ayam garam jahe, kukus 15 menit, siram minyak panas dan kecap asin."],
["咕嚕雞","Ayam Asam Manis","中文：雞炸金黃，番茄醬糖醋汁炒勻。\nIndonesia: Goreng ayam hingga keemasan, tumis saus tomat asam manis."],
["豉椒雞","Ayam Tauco Cabe","中文：豆豉辣椒蒜爆香，雞炒熟。\nIndonesia: Tumis tauco, cabai, bawang putih, masukkan ayam hingga matang."],
["檸檬雞","Ayam Lemon","中文：雞扒煎香，檸檬汁糖水埋芡。\nIndonesia: Goreng chicken chop, buat saus lemon gula."],

["牛 Sapi",[

["黑椒牛柳","Daging Sapi Lada Hitam","中文：牛柳粒煎香，黑椒汁洋蔥炒。\nIndonesia: Tumis daging sapi dadu, saus lada hitam dan bawang bombay."],
["蕃茄牛","Sapi Tomat","中文：牛肉片炒蕃茄洋蔥。\nIndonesia: Tumis irisan sapi dengan tomat dan bawang bombay."],
["牛扒","Steak Sapi","中文：牛扒煎兩面，黑椒汁。\nIndonesia: Goreng steak dua sisi, saus lada hitam."],
["咖喱牛","Kari Sapi","中文：咖喱薯仔牛腩炆1小時。\nIndonesia: Kari kentang daging sapi 1 jam."],
["涼瓜牛","Pare Sapi","中文：涼瓜牛肉豉汁炒。\nIndonesia: Tumis pare dan sapi saus tauco."],
["芥蘭牛","Kailan Sapi","中文：芥蘭炒牛肉。\nIndonesia: Tumis kailan dan sapi."],
["紅燒牛尾","Buntut Sapi Semur","中文：牛尾炆2小時。\nIndonesia: Buntut direbus 2 jam."],
["沙爹牛","Sate Sapi","中文：沙爹醬炒牛肉。\nIndonesia: Tumis sapi saus sate."],

 ]],
["豬 Babi",[
["叉燒","Babi Panggang Manis","中文：叉燒醬醃過夜，焗200度20分。\nIndonesia: Marinasi saus char siu semalam, panggang 200C 20 menit."],
["蒸肉餅","Kukus Daging Cincang","中文：豬肉碎醃鹹魚蒸15分。\nIndonesia: Daging cincang marinasi ikan asin kukus 15 menit."],

["粟米肉粒","Daging Jagung","中文：豬肉粒粟米炒。\nIndonesia: Tumis daging dadu dengan jagung."],

["糖醋排骨","Iga Asam Manis","中文：排骨炸香糖醋汁。\nIndonesia: Iga goreng saus asam manis."],
["蓮藕炆豬肉","Akar Teratai Babi","中文：蓮藕豬肉炆1小時。\nIndonesia: Akar teratai dan babi ungkep 1 jam."],

 ]],

["椒鹽九肚魚","Ikan Bombay Lada Garam","中文：九肚魚炸椒鹽。\nIndonesia: Goreng ikan bombay lada garam."],
["檸檬魚","Ikan Lemon","中文：檸檬汁蒸魚。\nIndonesia: Ikan kukus saus lemon."],
["咖喱魚","Kari Ikan","中文：咖喱魚腩。\nIndonesia: Kari perut ikan."],
["魚餅","Kue Ikan","中文：魚肉煎餅。\nIndonesia: Goreng kue ikan."]
 ]],

["白菜","Sawi Putih","中文：上湯白菜。\nIndonesia: Sawi putih sup atas."],
["椰菜花","Brokoli Putih","中文：蒜蓉椰菜花。\nIndonesia: Tumis kembang kol bawang putih."],
["勝瓜","Oyong","中文：勝瓜炒蛋。\nIndonesia: Oyong tumis telur."],
["豆角","Kacang Panjang","中文：乾煸四季豆。\nIndonesia: Tumis kering kacang panjang."],
["蓮藕炒","Tumis Akar Teratai","中文：蓮藕炒木耳。\nIndonesia: Tumis akar teratai jamur kuping."],
["雜菜","Capcay","中文：雜菜炒。\nIndonesia: Capcay goreng."]
 ]],
["湯水 Sup",[
["老火湯","Sup Tua","中文：豬骨紅蘿蔔粟米煲2小時。\nIndonesia: Tulang babi wortel jagung rebus 2 jam."],

["豆腐湯","Sup Tahu","中文：豆腐魚湯。\nIndonesia: Sup tahu ikan."],

dishes=defaultDishes();

const cn=["一","二","三","四","五","六","日"], idn=["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
const dayEmoji=["🌅","🌤️","🌞","🌇","🌙","⭐","🎉"];

function go(p){ document.querySelectorAll('.page').forEach(e=>e.classList.remove('active')); document.getElementById('p-'+p).classList.add('active'); document.querySelectorAll('.nav').forEach((e,i)=>{ e.classList.remove('active'); if(['weekly','library','mymenus','settings'][i]==p) e.classList.add('active'); }); }
function getMon(d){ let dt=new Date(d); let day=dt.getDay(); let diff=dt.getDate()-day+(day==0?-6:1); return new Date(dt.setDate(diff)); }
function fmt(d){ if(typeof d==='string') return d; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function init(){
 lastCook=JSON.parse(localStorage.getItem('lastCook')||'{}');
 loadAvatar(); loadFS();
 let mon=getMon(new Date()); document.getElementById('mondayPicker').valueAsDate=mon; onMonChange({target:{valueAsDate:mon}});
 renderCats(); renderWeekly(); renderMy(); renderCatOrder(); setupPick();
 let sel=document.getElementById('diners'); sel.innerHTML=[...Array(10).keys()].map(n=>`<option>${n}</option>`).join('');
 document.getElementById('takeaway').innerHTML=sel.innerHTML;
}
function onMonChange(e){
 let d=e.target.valueAsDate; if(!d) return;
 if(d.getDay()!==1){ alert('只可以選擇星期一作起始日\nHanya boleh pilih Senin sebagai awal minggu'); let m=getMon(d); document.getElementById('mondayPicker').valueAsDate=m; d=m; }
 currentWeek.monday=d; currentWeek.days=[];
 for(let i=0;i<7;i++){ let day=new Date(d); day.setDate(d.getDate()+i); currentWeek.days.push({date:day,dishes:[],diners:0,takeaway:0}); }
 renderWeekly();
}
function renderCats(){
 let grid=document.getElementById('catGrid'); grid.innerHTML='';
 let fcat=document.getElementById('f_cat'); fcat.innerHTML=cats.map(c=>`<option>${c}</option>`).join('');
 cats.forEach(cat=>{
  let meta=CAT_META[cat]||{bg:'#eee',emoji:'🍱'};
  let count=dishes.filter(d=>d.cat===cat).length;
  grid.innerHTML+=`<div class="catBox" style="background:${meta.bg}" onclick="openCat('${cat}')"><div class="emoji">${meta.emoji}</div><div class="label">${cat} (${count})</div></div>`;
 });
}
function openCat(cat){
 document.getElementById('catTitle').innerText=cat;
 let list=dishes.filter(d=>d.cat===cat);
 let box=document.getElementById('catDishes');
 box.innerHTML=list.map(d=>`<div class="dishRow"><div style="flex:1;cursor:pointer" onclick="showNote(${d.id})"><b>${d.name}</b> <span style="color:var(--muted)">${d.indo||''}</span><div style="font-size:.85rem;color:var(--muted)">${lastCook[d.id]?'上次 Terakhir: '+lastCook[d.id]:''}</div></div><div class="act"><button onclick="openAddToDay(${d.id})">📅</button><button onclick="editDish(${d.id})">✏️</button><button onclick="delDish(${d.id})">🗑️</button></div></div>`).join('')||'<div style="padding:20px;color:var(--muted)">暫無菜式</div>';
 openM('catModal');
}
function showNote(id){
 let d=dishes.find(x=>x.id==id); if(!d) return;
 document.getElementById('noteContent').innerText=`${d.name} / ${d.indo||''}\n\n${d.note||''}`;
 openM('dishNoteModal');
}
function openM(id){ document.getElementById(id).classList.add('open'); }
function closeM(id){ document.getElementById(id).classList.remove('open'); }

function openAdd(){ document.getElementById('f_id').value=''; document.getElementById('f_name').value=''; document.getElementById('f_indo').value=''; document.getElementById('f_note').value=''; openM('addModal'); }
function editDish(id){ let d=dishes.find(x=>x.id==id); openAdd(); document.getElementById('f_id').value=d.id; document.getElementById('f_name').value=d.name; document.getElementById('f_indo').value=d.indo||''; document.getElementById('f_note').value=d.note||''; document.getElementById('f_cat').value=d.cat; }
function saveDish(){
 let id=document.getElementById('f_id').value, name=document.getElementById('f_name').value.trim(), indo=document.getElementById('f_indo').value.trim(), note=document.getElementById('f_note').value.trim(), cat=document.getElementById('f_cat').value;
 if(!name) return alert('請輸入中文名稱');
 if(id){ let d=dishes.find(x=>x.id==id); d.name=name; d.indo=indo; d.note=note; d.cat=cat; } else dishes.push({id:Date.now()+Math.random(),name,indo,note,cat});
 localStorage.setItem('dishes',JSON.stringify(dishes)); renderCats(); closeM('addModal');
}
function delDish(id){ if(!confirm('確定刪除？ Hapus?')) return; dishes=dishes.filter(x=>x.id!=id); localStorage.setItem('dishes',JSON.stringify(dishes)); renderCats(); document.getElementById('catDishes').innerHTML=dishes.filter(d=>true).length; openCat(document.getElementById('catTitle').innerText); }

function openAddToDay(id){ pendingDishId=id; document.getElementById('anyDate').valueAsDate=new Date(); openM('dateForDishModal'); }
function confirmAddToDay(){
 let dateVal=document.getElementById('anyDate').value; if(!dateVal) return;
 let date=new Date(dateVal);
 let monday=getMon(date);
 if(fmt(currentWeek.monday)!=fmt(monday)){ alert('請先在每週頁選擇包含此日期的星期一\nPilih Senin yang mengandung tanggal ini dulu'); return; }
 let idx=Math.floor((date - currentWeek.monday)/86400000);
 if(idx<0||idx>=7) return alert('日期超出本週');
 let d=dishes.find(x=>x.id==pendingDishId);
 currentWeek.days[idx].dishes.push({...d});
 lastCook[d.id]=fmt(date); localStorage.setItem('lastCook',JSON.stringify(lastCook));
 renderWeekly(); closeM('dateForDishModal'); closeM('catModal');
}

function renderWeekly(){
 let grid=document.getElementById('weeklyGrid'); grid.innerHTML='';
 let rows=[[0,1],[2,3],[4,5,6]];
 rows.forEach((r,ri)=>{
  let wrap=document.createElement('div'); wrap.className= ri==2? 'full' : '';
  if(ri<2) wrap.style.display='contents';
  r.forEach(idx=>{
   let day=currentWeek.days[idx]; if(!day) return;
   let div=document.createElement('div'); div.className='dayBox';
   div.innerHTML=`<div class="d1">${dayEmoji[idx]}</div><div class="d2">星期${cn[idx]}<br>${fmt(day.date).slice(5)}<br><span style="font-size:.8rem">${idn[idx]}</span><br><span style="font-size:.75rem;color:var(--primary)">${day.dishes.length}道</span></div>`;
   div.onclick=()=>openWeek(idx);
   if(ri==2) wrap.appendChild(div); else grid.appendChild(div);
  });
  if(ri==2) grid.appendChild(wrap);
 });
}
function openWeek(idx){
 editingDayIndex=idx;
 let day=currentWeek.days[idx];
 document.getElementById('weekTitle').innerText=`${fmt(day.date)} 星期${cn[idx]} / ${idn[idx]}`;
 document.getElementById('diners').value=day.diners;
 document.getElementById('takeaway').value=day.takeaway;
 document.getElementById('diners').onchange=e=>{ day.diners=+e.target.value; };
 document.getElementById('takeaway').onchange=e=>{ day.takeaway=+e.target.value; };
 let sel=document.getElementById('selectedDishes');
 sel.innerHTML=day.dishes.map((d,i)=>`<div class="dishRow"><span style="flex:1;cursor:pointer" onclick="showNote(${d.id})"><b>${d.name}</b> ${d.indo||''}</span><button class="ghost" style="width:auto;padding:6px 12px" onclick="removeFromDay(${idx},${i})">✕</button></div>`).join('')||'<div style="color:var(--muted)">尚未選擇 Belum pilih</div>';
 openM('weekModal');
}
function removeFromDay(dayIdx,dishIdx){ currentWeek.days[dayIdx].dishes.splice(dishIdx,1); openWeek(dayIdx); renderWeekly(); }
function openDishPicker(){
 let box=document.getElementById('pickCats'); box.innerHTML='';
 cats.forEach(cat=>{
  let meta=CAT_META[cat]||{bg:'#eee',emoji:'🍱'};
  box.innerHTML+=`<div class="catBox" style="background:${meta.bg}" onclick="openPickDishes('${cat}')"><div class="emoji">${meta.emoji}</div><div class="label">${cat}</div></div>`;
 });
 openM('pickModal');
}
function openPickDishes(cat){
 let list=dishes.filter(d=>d.cat===cat);
 let box=document.getElementById('pickDishes');
 box.innerHTML=list.map(d=>`<div class="dishRow"><span style="flex:1;cursor:pointer" onclick="showNote(${d.id})"><b>${d.name}</b> ${d.indo||''}</span><button class="bigBtn" style="width:auto;padding:8px 14px" onclick="pickToWeek(${d.id})">加入</button></div>`).join('');
 openM('pickDishModal');
}
function pickToWeek(id){
 let d=dishes.find(x=>x.id==id);
 currentWeek.days[editingDayIndex].dishes.push({...d});
 lastCook[id]=fmt(currentWeek.days[editingDayIndex].date); localStorage.setItem('lastCook',JSON.stringify(lastCook));
 openWeek(editingDayIndex); renderWeekly();
}
function setupPick(){}
function saveWeekly(){
 if(!currentWeek.monday) return;
 let fname=fmt(currentWeek.monday);
 let ex=weeklyMenus.findIndex(m=>m.monday===fname);
 if(ex>=0){
  let c=confirm(`菜單 ${fname} 已存在，取代？\nMenu ${fname} sudah ada, ganti?`);
  if(!c){
   let nd=prompt('輸入新星期一日期 YYYY-MM-DD\nMasukkan Senin baru');
   if(!nd) return;
   let d=new Date(nd);
   if(d.getDay()!==1) return alert('只可以選擇星期一\nHanya Senin');
   fname=fmt(d);
   currentWeek.monday=d;
  } else weeklyMenus.splice(ex,1);
 }
 let toSave={monday:fname,days:currentWeek.days.map(d=>({date:fmt(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway}))};
 let idx=weeklyMenus.findIndex(m=>m.monday===fname);
 if(idx>=0) weeklyMenus[idx]=toSave; else weeklyMenus.push(toSave);
 if(weeklyMenus.length>10) weeklyMenus.shift();
 localStorage.setItem('weeklyMenus',JSON.stringify(weeklyMenus));
 renderMy(); alert('已儲存 '+fname);
}
function renderMy(){
 let box=document.getElementById('myList');
 box.innerHTML=weeklyMenus.map((m,i)=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${m.monday} 星期一 Senin</b><div class="row"><button class="ghost" style="width:auto" onclick="loadMenu(${i})">修改</button><button class="ghost" style="width:auto" onclick="delMenu(${i})">刪除</button><button class="iconBtn" onclick="exportPDFSingle(${i})">📄</button></div></div>${m.days.map((d,di)=>`<div style="border-top:1px dashed var(--border);padding:8px 0"><b>星期${cn[di]} ${idn[di]} ${d.date} 用餐 Makan:${d.diners} 外帶 Bungkus:${d.takeaway}</b>${d.dishes.map(dd=>`<div class="dishRow" style="padding:6px 0"><span style="flex:1;cursor:pointer" onclick="showNote(${dd.id})">${dd.name} / ${dd.indo||''}</span></div>`).join('')}</div>`).join('')}</div>`).join('')||'<div class="card">暫無菜單</div>';
}
function loadMenu(i){ let m=weeklyMenus[i]; document.getElementById('mondayPicker').value=m.monday; let mon=new Date(m.monday); currentWeek.monday=mon; currentWeek.days=m.days.map(d=>({date:new Date(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway})); go('weekly'); renderWeekly(); }
function delMenu(i){ if(!confirm('刪除？')) return; weeklyMenus.splice(i,1); localStorage.setItem('weeklyMenus',JSON.stringify(weeklyMenus)); renderMy(); }

// PDF
function makePDFContent(days, mondayStr){
 let title=`<div class="pdfTitle">每週菜單<br><span style="font-size:14pt">Daftar Menu Mingguan</span></div><div class="pdfSub">${mondayStr} 星期一 / Senin</div>`;
 let body=days.map((d,i)=>`<div class="pdfDay"><div class="pdfDayH"><span>星期${cn[i]} ${idn[i]} ${d.date}</span><span>用餐 Makan:${d.diners} 外帶 Bungkus:${d.takeaway}</span></div>${d.dishes.map(dd=>`<div class="pdfDish"><b>${dd.name} / ${dd.indo||''}</b><div style="margin-top:4px;white-space:pre-wrap">備註 Catatan: ${dd.note||''}</div></div>`).join('')||'<div class="pdfDish">無 Belum ada</div>'}</div>`).join('');
 return title+body;
}
function exportWeeklyPDF(){ let content=makePDFContent(currentWeek.days.map(d=>({date:fmt(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway})), fmt(currentWeek.monday)); showPDF(content); }
function exportPDFSingle(i){ let m=weeklyMenus[i]; showPDF(makePDFContent(m.days, m.monday)); }
function showPDF(inner){ document.getElementById('pdfContent').innerHTML=inner; document.getElementById('pdfWrap').classList.add('open'); }
function closePDF(){ document.getElementById('pdfWrap').classList.remove('open'); }
function downloadPDF(){
 let el=document.getElementById('pdfContent'); let full=`<!DOCTYPE html><html><head><meta charset="utf-8"><style>@page{size:A4;margin:12mm}body{font-family:sans-serif;font-size:14pt}.pdfDay{border:1.5px solid #000;border-radius:10px;margin-bottom:12px}.pdfDayH{background:#000;color:#fff;padding:6px 10px;display:flex;justify-content:space-between}</style></head><body>${el.innerHTML}</body></html>`;
 let blob=new Blob([full],{type:'text/html'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download=`每週菜單_${fmt(new Date())}.html`; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function sharePDF(){
 let el=document.getElementById('pdfContent'); let html=`<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>${el.innerHTML}</body></html>`; let blob=new Blob([html],{type:'text/html'}); let file=new File([blob],`每週菜單.html`,{type:'text/html'});
 try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'每週菜單'}); return; } }catch(e){}
 try{ if(navigator.share){ await navigator.share({title:'每週菜單 Daftar Menu', text:el.innerText.slice(0,800)}); return; } }catch(e){}
 downloadPDF();
}

function exportLib(){
 let data={cats,dishes};
 let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download=`菜式庫_${fmt(new Date())}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);

}
document.getElementById('importFile').addEventListener('change',e=>{
 let f=e.target.files[0]; if(!f) return;
 let r=new FileReader(); r.onload=ev=>{
  try{
   let j=JSON.parse(ev.target.result);
   if(j.cats && j.dishes){ cats=j.cats; dishes=j.dishes; localStorage.setItem('cats',JSON.stringify(cats)); localStorage.setItem('dishes',JSON.stringify(dishes)); renderCats(); renderCatOrder(); alert('匯入成功 Berjaya import'); }
   else alert('JSON格式錯誤 Format salah');
  }catch{ alert('JSON解析失敗 Gagal parse'); }
 }; r.readAsText(f); e.target.value='';
});

// Settings
function renderCatOrder(){ let box=document.getElementById('catOrder'); box.innerHTML=cats.map((c,i)=>`<div class="card row" style="justify-content:space-between"><span>${i+1}. ${c}</span><span class="row"><button class="iconBtn" onclick="moveCat(${i},-1)">↑</button><button class="iconBtn" onclick="moveCat(${i},1)">↓</button><button class="ghost" style="width:auto" onclick="deleteCat(${i})">刪除</button></span></div>`).join(''); }
function moveCat(i,dir){ let ni=i+dir; if(ni<0||ni>=cats.length) return; let t=cats[i]; cats[i]=cats[ni]; cats[ni]=t; localStorage.setItem('cats',JSON.stringify(cats)); renderCatOrder(); renderCats(); }
function addCat(){ let v=document.getElementById('newCat').value.trim(); if(!v) return; cats.push(v); localStorage.setItem('cats',JSON.stringify(cats)); document.getElementById('newCat').value=''; renderCatOrder(); renderCats(); }
function deleteCat(i){
 let cat=cats[i]; if(!confirm(`刪除「${cat}」分類？內所有菜式會移到「其他」\nHapus kategori "${cat}"? Semua menu pindah ke "其他"`)) return;
 dishes.forEach(d=>{ if(d.cat===cat) d.cat='其他 Lainnya'; });
 if(!cats.includes('其他 Lainnya')) cats.push('其他 Lainnya');
 cats.splice(i,1);
 localStorage.setItem('cats',JSON.stringify(cats)); localStorage.setItem('dishes',JSON.stringify(dishes));
 renderCatOrder(); renderCats();
}
function toggleTheme(){ document.body.classList.toggle('dark'); localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light'); }
function setFS(v){ document.documentElement.style.setProperty('--fs',v+'px'); document.getElementById('fsVal').innerText=v; localStorage.setItem('fs',v); }
function loadFS(){ let fs=localStorage.getItem('fs'); if(fs){ setFS(fs); document.getElementById('fsRange').value=fs; } let th=localStorage.getItem('theme'); if(th==='dark') document.body.classList.add('dark'); }
function loadAvatar(){ let av=localStorage.getItem('avatar'); if(av){ document.getElementById('avatarTop').src=av; } }
let img=new Image(), scale=1, px=0, py=0, dragging=false, lx=0, ly=0, initS=1;
let canvas=document.getElementById('avCanvas');
function drawAv(){ let ctx=canvas.getContext('2d'); ctx.clearRect(0,0,600,600); if(!img.src) return; let w=img.width*scale, h=img.height*scale; ctx.drawImage(img,300-w/2+px,300-h/2+py,w,h); }
document.getElementById('avatarFile').addEventListener('change',e=>{ let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=ev=>{ img.src=ev.target.result; img.onload=()=>{ let m=Math.min(img.width,img.height); initS=500/m; scale=initS; px=0; py=0; document.getElementById('avZoom').value=scale; drawAv(); }; }; r.readAsDataURL(f); });
document.getElementById('avZoom').addEventListener('input',e=>{ scale=parseFloat(e.target.value); drawAv(); });
canvas.addEventListener('mousedown',e=>{ dragging=true; lx=e.clientX; ly=e.clientY; });
canvas.addEventListener('touchstart',e=>{ dragging=true; lx=e.touches[0].clientX; ly=e.touches[0].clientY; },{passive:false});
window.addEventListener('mousemove',e=>{ if(!dragging) return; px+=e.clientX-lx; py+=e.clientY-ly; lx=e.clientX; ly=e.clientY; drawAv(); });
window.addEventListener('touchmove',e=>{ if(!dragging) return; e.preventDefault(); px+=e.touches[0].clientX-lx; py+=e.touches[0].clientY-ly; lx=e.touches[0].clientX; ly=e.touches[0].clientY; drawAv(); },{passive:false});
window.addEventListener('mouseup',()=>dragging=false); window.addEventListener('touchend',()=>dragging=false);
canvas.addEventListener('wheel',e=>{ e.preventDefault(); scale+=e.deltaY*-0.001; scale=Math.min(Math.max(0.2,scale),4); document.getElementById('avZoom').value=scale; drawAv(); },{passive:false});
function resetAv(){ px=0; py=0; scale=initS; document.getElementById('avZoom').value=scale; drawAv(); }
function saveAv(){ let d=canvas.toDataURL('image/png'); localStorage.setItem('avatar',d); document.getElementById('avatarTop').src=d; alert('頭像已儲存'); }

init();
</script>
</body>
</html>
