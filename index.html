<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>每週菜單</title>
  
  <!-- PWA & iOS 設定 -->
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIuavj週菜單IiwKICAic2hvcnRfbmFtZSI6ICLmr4X週菜單IiwKICAic3RhcnRfdXJsIjogIi4vIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjZjJmMmY3IiwKICAidGhlbWVfY29sb3IiOiAiIzAwN2FmZiIKfQ==">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="每週菜單">

  <!-- HTML2PDF 函式庫 (用於 PDF 匯出) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-color: #1c1c1e;
      --subtext-color: #8e8e93;
      --primary-color: #007aff;
      --border-color: #e5e5ea;
      --danger-color: #ff3b30;
      --base-font-size: 16px;
    }

    [data-theme="dark"] {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --text-color: #ffffff;
      --subtext-color: #8e8e93;
      --primary-color: #0a84ff;
      --border-color: #38383a;
      --danger-color: #ff453a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--base-font-size);
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 70px);
      max-width: 430px; /* 優化至 iPhone 18 Pro Max 螢幕尺寸比例 */
      margin-left: auto;
      margin-right: auto;
      min-height: 100vh;
    }

    /* 頂部導覽列與頭像 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-icon-img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
    }

    .header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary-color);
      background-color: var(--border-color);
    }

    /* 底部 Tab */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: 60px;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--subtext-color);
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--primary-color);
      font-weight: 600;
    }

    .tab-icon {
      font-size: 1.3rem;
    }

    /* 視圖切換 */
    .view {
      display: none;
      padding: 16px;
    }

    .view.active {
      display: block;
    }

    /* 卡片通用樣式 */
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .btn {
      background-color: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .btn-danger {
      background-color: var(--danger-color);
    }

    .btn-secondary {
      background-color: var(--subtext-color);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--subtext-color);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 0.95rem;
    }

    /* 每週菜單卡片樣式 */
    .day-row {
      border-bottom: 1px dashed var(--border-color);
      padding: 10px 0;
    }

    .day-row:last-child {
      border-bottom: none;
    }

    .day-header {
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .dish-line {
      display: block;
      padding: 2px 0;
      font-size: 0.9rem;
    }

    /* 拖拉排序列表 */
    .draggable-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: grab;
    }

    .draggable-item.dragging {
      opacity: 0.5;
    }

    .drag-handle {
      cursor: grab;
      color: var(--subtext-color);
      font-size: 1.2rem;
      margin-right: 10px;
    }

    /* 印尼文/中文 PDF 生成時隱藏元素 */
    #pdf-template {
      display: none;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <div class="header">
    <div class="header-title-container">
      <img src="icon.png" alt="Logo" class="app-icon-img" onerror="this.style.display='none'">
      <h1>每週菜單</h1>
    </div>
    <img id="header-avatar" class="avatar" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238e8e93'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" alt="Avatar">
  </div>

  <!-- 主頁視圖：每週菜單列表與新增 -->
  <div id="view-menu" class="view active">
    <button class="btn" onclick="openNewMenuModal()" style="margin-bottom: 16px;">+ 新建每週菜單</button>
    
    <div id="menu-list"></div>
  </div>

  <!-- 分類與菜式視圖 -->
  <div id="view-categories" class="view">
    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
      <input type="text" id="new-dish-name" class="form-control" placeholder="輸入新菜式名稱...">
      <select id="new-dish-category" class="form-control" style="width: 120px;"></select>
      <button class="btn" style="width: 80px;" onclick="addDish()">新增</button>
    </div>

    <div id="categories-dishes-container"></div>
  </div>

  <!-- 設定頁面視圖 -->
  <div id="view-settings" class="view">
    <div class="card">
      <h3>自訂頭像</h3>
      <div class="form-group">
        <input type="file" id="avatar-input" accept="image/*" class="form-control" onchange="uploadAvatar(event)">
      </div>
    </div>

    <div class="card">
      <h3>界面與顯示</h3>
      <div class="form-group">
        <label>主題模式</label>
        <select id="theme-select" class="form-control" onchange="changeTheme(this.value)">
          <option value="light">淺色模式 (Light)</option>
          <option value="dark">深色模式 (Dark)</option>
        </select>
      </div>
      <div class="form-group">
        <label>字體大小</label>
        <select id="fontsize-select" class="form-control" onchange="changeFontSize(this.value)">
          <option value="14px">小 (Small)</option>
          <option value="16px">中 (Medium)</option>
          <option value="18px">大 (Large)</option>
          <option value="20px">特大 (Extra Large)</option>
        </select>
      </div>
    </div>

    <div class="card">
      <h3>分類管理與排序 (可拖拉排序)</h3>
      <div style="display: flex; gap: 8px; margin-bottom: 12px;">
        <input type="text" id="add-category-input" class="form-control" placeholder="新增分類名稱...">
        <button class="btn" style="width: 80px;" onclick="addCategory()">新增</button>
      </div>
      <div id="category-drag-list"></div>
    </div>

    <div class="card">
      <h3>資料備份 (匯入 / 匯出)</h3>
      <p style="font-size: 0.8rem; color: var(--subtext-color);">支援 iOS Safari 匯出與匯入 JSON 格式備份檔。</p>
      <div style="display: flex; gap: 10px;">
        <button class="btn" onclick="exportData()">匯出備份</button>
        <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">匯入備份</button>
        <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(event)">
      </div>
    </div>
  </div>

  <!-- 底部選單 -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('menu', this)">
      <span class="tab-icon">📅</span>
      <span>每週菜單</span>
    </button>
    <button class="tab-btn" onclick="switchTab('categories', this)">
      <span class="tab-icon">🍲</span>
      <span>菜式分類</span>
    </button>
    <button class="tab-btn" onclick="switchTab('settings', this)">
      <span class="tab-icon">⚙️</span>
      <span>設定</span>
    </button>
  </div>

  <!-- 新建/編輯每週菜單 Modal (簡易浮層) -->
  <div id="menu-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; overflow-y: auto; padding: 20px;">
    <div class="card" style="max-width: 400px; margin: 20px auto;">
      <h3 id="modal-title">新建每週菜單</h3>
      
      <div class="form-group">
        <label>開始日期 (星期一)</label>
        <input type="date" id="menu-start-date" class="form-control" onchange="updateModalDayDates()">
      </div>

      <div class="form-group" style="display: flex; gap: 10px;">
        <div>
          <label>用餐人數</label>
          <input type="number" id="menu-dine-count" class="form-control" value="2" min="1">
        </div>
        <div>
          <label>外帶人數</label>
          <input type="number" id="menu-takeout-count" class="form-control" value="0" min="0">
        </div>
      </div>

      <div id="modal-days-container"></div>

      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <button class="btn" onclick="saveWeeklyMenu()">儲存菜單</button>
        <button class="btn btn-secondary" onclick="closeMenuModal()">取消</button>
      </div>
    </div>
  </div>

  <!-- PDF 匯出隱藏樣式模板 -->
  <div id="pdf-export-area" style="display: none; padding: 20px; background: #fff; color: #000; font-family: sans-serif;">
    <h2 id="pdf-title" style="text-align: center; margin-bottom: 8px;"></h2>
    <p id="pdf-subinfo" style="text-align: center; margin-bottom: 20px; font-size: 14px;"></p>
    <table style="width: 100%; border-collapse: collapse; margin-top: 10px;" border="1" cellpadding="8">
      <thead>
        <tr style="background-color: #f0f0f0;">
          <th style="width: 30%;" id="pdf-th-day">日期 / Day</th>
          <th id="pdf-th-dishes">菜式 / Dishes</th>
        </tr>
      </thead>
      <tbody id="pdf-tbody"></tbody>
    </table>
  </div>

  <script>
    // 預設資料庫結構
    let appData = {
      categories: ['雞', '牛', '豬', '魚', '菜', '湯', '其他'],
      dishes: [], // { id, name, category, lastCooked }
      menus: [],  // { id, startDate, dineCount, takeoutCount, days: { Monday: [dishNames], ... } }
      settings: {
        avatar: '',
        theme: 'light',
        fontSize: '16px'
      }
    };

    const DAYS = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
    const DAYS_ID = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];

    // 初始化 App
    window.onload = function() {
      loadLocalStorage();
      applySettings();
      renderAll();
    };

    function loadLocalStorage() {
      const saved = localStorage.getItem('weekly_menu_pwa_data');
      if (saved) {
        try {
          appData = JSON.parse(saved);
        } catch(e) {
          console.error("Data loading error", e);
        }
      }
    }

    function saveData() {
      localStorage.setItem('weekly_menu_pwa_data', JSON.stringify(appData));
      renderAll();
    }

    function applySettings() {
      document.documentElement.setAttribute('data-theme', appData.settings.theme || 'light');
      document.documentElement.style.setProperty('--base-font-size', appData.settings.fontSize || '16px');
      document.getElementById('theme-select').value = appData.settings.theme || 'light';
      document.getElementById('fontsize-select').value = appData.settings.fontSize || '16px';
      
      if (appData.settings.avatar) {
        document.getElementById('header-avatar').src = appData.settings.avatar;
      }
    }

    function switchTab(tabName, btnElement) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(`view-${tabName}`).classList.add('active');
      btnElement.classList.add('active');
    }

    function renderAll() {
      renderCategoriesSelect();
      renderCategoriesDishesView();
      renderMenuList();
      renderCategoryDragList();
    }

    /* ------------------- 分類與菜式邏輯 ------------------- */
    function renderCategoriesSelect() {
      const select = document.getElementById('new-dish-category');
      select.innerHTML = '';
      appData.categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    function addDish() {
      const nameInput = document.getElementById('new-dish-name');
      const catSelect = document.getElementById('new-dish-category');
      const name = nameInput.value.trim();
      const category = catSelect.value;

      if (!name) return alert('請輸入菜式名稱');

      appData.dishes.push({
        id: Date.now().toString(),
        name: name,
        category: category,
        lastCooked: ''
      });

      nameInput.value = '';
      saveData();
    }

    function renderCategoriesDishesView() {
      const container = document.getElementById('categories-dishes-container');
      container.innerHTML = '';

      appData.categories.forEach(cat => {
        const card = document.createElement('div');
        card.className = 'card';
        
        let dishesHTML = '';
        const catDishes = appData.dishes.filter(d => d.category === cat);

        if (catDishes.length === 0) {
          dishesHTML = '<p style="font-size:0.85rem; color:var(--subtext-color);">此分類暫無菜式</p>';
        } else {
          catDishes.forEach(d => {
            const lastDateText = d.lastCooked ? `(上次烹飪: ${d.lastCooked})` : '(尚未烹飪)';
            dishesHTML += `
              <div style="display:flex; justify-content:space-between; align-items:center; padding: 6px 0; border-bottom: 1px solid var(--border-color);">
                <div>
                  <strong>${d.name}</strong>
                  <br><span style="font-size:0.75rem; color:var(--subtext-color);">${lastDateText}</span>
                </div>
                <button style="background:none; border:none; color:var(--danger-color); cursor:pointer;" onclick="deleteDish('${d.id}')">刪除</button>
              </div>
            `;
          });
        }

        card.innerHTML = `<h4 style="margin:0 0 10px 0; color:var(--primary-color);">${cat}</h4>${dishesHTML}`;
        container.appendChild(card);
      });
    }

    function deleteDish(id) {
      if (confirm('確定刪除此菜式？')) {
        appData.dishes = appData.dishes.filter(d => d.id !== id);
        saveData();
      }
    }

    /* ------------------- 設定頁面：分類管理與拖拉排序 ------------------- */
    function renderCategoryDragList() {
      const list = document.getElementById('category-drag-list');
      list.innerHTML = '';

      appData.categories.forEach((cat, index) => {
        const item = document.createElement('div');
        item.className = 'draggable-item';
        item.draggable = true;
        item.dataset.index = index;

        item.innerHTML = `
          <div style="display:flex; align-items:center;">
            <span class="drag-handle">☰</span>
            <span>${cat}</span>
          </div>
          <div>
            ${cat !== '其他' ? `<button style="background:none; border:none; color:var(--danger-color); cursor:pointer;" onclick="deleteCategory('${cat}')">刪除</button>` : '<span style="font-size:0.8rem; color:var(--subtext-color);">預設</span>'}
          </div>
        `;

        // 拖拉事件
        item.addEventListener('dragstart', handleDragStart);
        item.addEventListener('dragover', handleDragOver);
        item.addEventListener('drop', handleDrop);
        item.addEventListener('dragend', handleDragEnd);

        list.appendChild(item);
      });
    }

    let dragSrcIndex = null;

    function handleDragStart(e) {
      dragSrcIndex = this.dataset.index;
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      if (e.preventDefault) e.preventDefault();
      return false;
    }

    function handleDrop(e) {
      if (e.stopPropagation) e.stopPropagation();
      const targetIndex = this.dataset.index;
      if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
        const movedItem = appData.categories.splice(dragSrcIndex, 1)[0];
        appData.categories.splice(targetIndex, 0, movedItem);
        saveData();
      }
      return false;
    }

    function handleDragEnd() {
      this.classList.remove('dragging');
    }

    function addCategory() {
      const input = document.getElementById('add-category-input');
      const val = input.value.trim();
      if (!val) return;
      if (appData.categories.includes(val)) return alert('分類已存在');

      appData.categories.push(val);
      input.value = '';
      saveData();
    }

    function deleteCategory(catName) {
      if (catName === '其他') return alert('「其他」分類不能刪除。');

      // 預先作出通知說明
      const confirmDelete = confirm(`警告：刪除分類「${catName}」後，該分類下的所有菜式自動移動到「其他」分類。確定刪除？`);
      
      if (confirmDelete) {
        // 將該分類的菜式移至「其他」
        appData.dishes.forEach(d => {
          if (d.category === catName) {
            d.category = '其他';
          }
        });

        // 移除分類
        appData.categories = appData.categories.filter(c => c !== catName);
        saveData();
      }
    }

    /* ------------------- 每週菜單邏輯 ------------------- */
    let editingMenuId = null;

    function openNewMenuModal() {
      editingMenuId = null;
      document.getElementById('modal-title').textContent = '新建每週菜單';
      document.getElementById('menu-start-date').valueAsDate = getNextMonday(new Date());
      document.getElementById('menu-dine-count').value = 2;
      document.getElementById('menu-takeout-count').value = 0;
      updateModalDayDates();
      document.getElementById('menu-modal').style.display = 'block';
    }

    function closeMenuModal() {
      document.getElementById('menu-modal').style.display = 'none';
    }

    function getNextMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function updateModalDayDates() {
      const startDateVal = document.getElementById('menu-start-date').value;
      if (!startDateVal) return;

      const container = document.getElementById('modal-days-container');
      container.innerHTML = '';

      const startDate = new Date(startDateVal);

      DAYS.forEach((dayName, idx) => {
        const currentDate = new Date(startDate);
        currentDate.setDate(startDate.getDate() + idx);
        const dateStr = currentDate.toISOString().split('T')[0];

        const dayDiv = document.createElement('div');
        dayDiv.className = 'day-row';

        let optionsHTML = '';
        appData.dishes.forEach(dish => {
          optionsHTML += `<option value="${dish.name}">${dish.name} (${dish.category})</option>`;
        });

        dayDiv.innerHTML = `
          <div class="day-header">
            <span>${dayName} (${dateStr})</span>
          </div>
          <select id="select-day-${idx}" class="form-control" multiple style="height: 80px;">
            ${optionsHTML}
          </select>
          <span style="font-size:0.7rem; color:var(--subtext-color);">按住可多選菜式</span>
        `;
        container.appendChild(dayDiv);
      });
    }

    function saveWeeklyMenu() {
      const startDateVal = document.getElementById('menu-start-date').value;
      const dineCount = document.getElementById('menu-dine-count').value;
      const takeoutCount = document.getElementById('menu-takeout-count').value;

      if (!startDateVal) return alert('請選擇星期一日期');

      const startDate = new Date(startDateVal);
      const daysData = [];

      DAYS.forEach((dayName, idx) => {
        const currentDate = new Date(startDate);
        currentDate.setDate(startDate.getDate() + idx);
        const dateStr = currentDate.toISOString().split('T')[0];

        const select = document.getElementById(`select-day-${idx}`);
        const selectedDishes = Array.from(select.selectedOptions).map(opt => opt.value);

        // 更新揀選了菜式的「上一次烹飪日期」
        selectedDishes.forEach(dishName => {
          const dishObj = appData.dishes.find(d => d.name === dishName);
          if (dishObj) {
            dishObj.lastCooked = dateStr;
          }
        });

        daysData.push({
          dayName: dayName,
          date: dateStr,
          dishes: selectedDishes
        });
      });

      const newMenu = {
        id: editingMenuId || Date.now().toString(),
        startDate: startDateVal,
        dineCount: dineCount,
        takeoutCount: takeoutCount,
        days: daysData
      };

      if (editingMenuId) {
        const idx = appData.menus.findIndex(m => m.id === editingMenuId);
        if (idx !== -1) appData.menus[idx] = newMenu;
      } else {
        appData.menus.unshift(newMenu);
      }

      closeMenuModal();
      saveData();
    }

    function renderMenuList() {
      const container = document.getElementById('menu-list');
      container.innerHTML = '';

      if (appData.menus.length === 0) {
        container.innerHTML = '<div class="card"><p style="text-align:center; color:var(--subtext-color);">暫無每週菜單，請點擊上方按鈕新建。</p></div>';
        return;
      }

      appData.menus.forEach(menu => {
        const card = document.createElement('div');
        card.className = 'card';

        let daysHTML = '';
        menu.days.forEach(d => {
          let dishesList = d.dishes.map(dish => `<span class="dish-line">• ${dish}</span>`).join('');
          if (!dishesList) dishesList = '<span class="dish-line" style="color:var(--subtext-color);">- 未設定 -</span>';

          daysHTML += `
            <div class="day-row">
              <div class="day-header">
                <span>${d.dayName}</span>
                <span style="font-size:0.8rem; font-weight:normal; color:var(--subtext-color);">${d.date}</span>
              </div>
              <div>${dishesList}</div>
            </div>
          `;
        });

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h3 style="margin:0;">每週菜單 (${menu.startDate})</h3>
            <button style="background:none; border:none; color:var(--danger-color); cursor:pointer;" onclick="deleteMenu('${menu.id}')">刪除</button>
          </div>
          <div style="font-size:0.85rem; color:var(--subtext-color); margin-bottom:12px;">
            🍽 用餐人數: ${menu.dineCount} 人 | 🛍 外帶人數: ${menu.takeoutCount} 人
          </div>
          ${daysHTML}
          <div style="display:flex; gap:10px; margin-top:14px;">
            <button class="btn" onclick="exportPDF('${menu.id}', 'zh')">匯出 PDF (中文)</button>
            <button class="btn btn-secondary" onclick="exportPDF('${menu.id}', 'id')">匯出 PDF (印尼文)</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function deleteMenu(id) {
      if (confirm('確定刪除此張每週菜單？')) {
        appData.menus = appData.menus.filter(m => m.id !== id);
        saveData();
      }
    }

    /* ------------------- PDF 匯出 (中文 / 印尼文) ------------------- */
    function exportPDF(menuId, lang) {
      const menu = appData.menus.find(m => m.id === menuId);
      if (!menu) return;

      const pdfArea = document.getElementById('pdf-export-area');
      const pdfTitle = document.getElementById('pdf-title');
      const pdfSubinfo = document.getElementById('pdf-subinfo');
      const pdfThDay = document.getElementById('pdf-th-day');
      const pdfThDishes = document.getElementById('pdf-th-dishes');
      const pdfTbody = document.getElementById('pdf-tbody');

      if (lang === 'id') {
        pdfTitle.textContent = `Menu Mingguan (${menu.startDate})`;
        pdfSubinfo.textContent = `Jumlah Orang Makan: ${menu.dineCount} | Jumlah Bawa Pulang: ${menu.takeoutCount}`;
        pdfThDay.textContent = 'Hari / Tanggal';
        pdfThDishes.textContent = 'Hidangan';
      } else {
        pdfTitle.textContent = `每週菜單 (${menu.startDate})`;
        pdfSubinfo.textContent = `用餐人數：${menu.dineCount} 人 | 外帶人數：${menu.takeoutCount} 人`;
        pdfThDay.textContent = '日期';
        pdfThDishes.textContent = '菜式';
      }

      pdfTbody.innerHTML = '';
      menu.days.forEach((d, idx) => {
        const tr = document.createElement('tr');
        const dayLabel = lang === 'id' ? `${DAYS_ID[idx]} (${d.date})` : `${d.dayName} (${d.date})`;
        const dishesList = d.dishes.length > 0 ? d.dishes.join('<br>') : '-';

        tr.innerHTML = `
          <td><strong>${dayLabel}</strong></td>
          <td>${dishesList}</td>
        `;
        pdfTbody.appendChild(tr);
      });

      pdfArea.style.display = 'block';

      const opt = {
        margin:       10,
        filename:     `Weekly_Menu_${menu.startDate}_${lang}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(pdfArea).save().then(() => {
        pdfArea.style.display = 'none';
      });
    }

    /* ------------------- 設定頁面：頭像、主題、字體、備份 ------------------- */
    function uploadAvatar(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        appData.settings.avatar = evt.target.result;
        saveData();
        applySettings();
      };
      reader.readAsDataURL(file);
    }

    function changeTheme(val) {
      appData.settings.theme = val;
      saveData();
      applySettings();
    }

    function changeFontSize(val) {
      appData.settings.fontSize = val;
      saveData();
      applySettings();
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `Weekly_Menu_Backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (imported && imported.categories && imported.dishes) {
            appData = imported;
            saveData();
            applySettings();
            alert('成功匯入備份資料！');
          } else {
            alert('檔案格式不正確！');
          }
        } catch(err) {
          alert('解析檔案失敗！');
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
