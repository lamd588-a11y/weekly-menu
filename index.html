<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="每週菜單">
  <meta name="theme-color" content="#ff6b35">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <title>每週菜單</title>
  <style>
    :root {
      --bg: #fdf8f0;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #7f8c8d;
      --primary: #ff6b35;
      --border: #e2d7c7;
      --r: 20px;
      --fs: 20px; /* 大字體設計，適合長者 */
    }

    .dark {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #f5f5f5;
      --border: #333333;
      --muted: #a0a0a0;
    }

    html { font-size: var(--fs); }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      padding-bottom: 110px; /* 為底部導航留出足夠高度 */
    }

    /* 頂部列 */
    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--card);
      border-bottom: 2px solid var(--border);
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top));
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      object-fit: cover;
    }

    .page {
      max-width: 500px; /* 適配 iPhone 18 Pro Max 大螢幕 */
      margin: 0 auto;
      padding: 16px;
      display: none;
    }
    .page.active { display: block; }

    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--r);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }

    .row { display: flex; gap: 10px; align-items: center; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    /* 大按鍵適老設計 */
    .bigBtn {
      flex: 1;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }
    .ghost {
      flex: 1;
      padding: 14px;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .iconBtn {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: var(--card);
      font-size: 28px;
      cursor: pointer;
    }

    /* 菜式庫大正方形格 (每行3個) */
    .catBox {
      aspect-ratio: 1;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border: 2px solid var(--border);
      background: var(--card);
      padding: 8px;
      text-align: center;
    }
    .catBox .emoji { font-size: 44px; margin-bottom: 4px; }
    .catBox .label { font-weight: 800; font-size: 0.95rem; }

    /* 每週菜單 1-2, 3-4, 5-7 排版 */
    .weekGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .weekGrid .full {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    .dayBox {
      aspect-ratio: 1;
      border-radius: 22px;
      border: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      background: var(--card);
      text-align: center;
      padding: 8px;
    }
    .dayBox .d1 { font-size: 2rem; }
    .dayBox .d2 { font-weight: 800; margin-top: 4px; font-size: 0.9rem; }

    /* 底部導航欄：加高設計 (行高於圖標) */
    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-top: 2px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 14px 0 calc(28px + env(safe-area-inset-bottom));
      z-index: 20;
      height: 90px;
    }
    .nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .nav.active { color: var(--primary); }
    .nav .ic { font-size: 32px; line-height: 1.1; }

    /* Modal 彈窗機制 */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.open { display: flex; }
    .sheet {
      background: var(--card);
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 28px;
      border: 2px solid var(--border);
    }
    .sheetHead {
      position: sticky;
      top: 0;
      background: var(--card);
      padding: 16px;
      border-bottom: 2px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }
    .x {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 22px;
      background: var(--bg);
      cursor: pointer;
    }

    /* 菜式條目 */
    .dishRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px dashed var(--border);
      gap: 12px;
    }
    .dishRow b { font-size: 1.1rem; display: block; }
    .dishRow small { color: var(--muted); display: block; font-size: 0.85rem; }
    .act { display: flex; gap: 6px; }
    .act button {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-size: 18px;
      cursor: pointer;
    }

    select, input, textarea {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }

    /* A4 列印/導出專用樣式 */
    @media print {
      body * { visibility: hidden; }
      #pdfPrintArea, #pdfPrintArea * { visibility: visible; }
      #pdfPrintArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        color: #000 !important;
        background: #fff !important;
      }
      @page { size: A4 portrait; margin: 12mm; }
    }
    .pdfPage {
      background: #fff;
      color: #000;
      padding: 10px;
      font-family: sans-serif;
    }
    .pdfTitle { font-size: 24pt; font-weight: 900; text-align: center; margin-bottom: 4px; }
    .pdfSub { font-size: 12pt; text-align: center; color: #555; margin-bottom: 16px; }
    .pdfDay { border: 2px solid #000; border-radius: 12px; margin-bottom: 12px; padding: 10px; page-break-inside: avoid; }
    .pdfDayH { font-weight: 800; font-size: 14pt; border-bottom: 1px solid #000; padding-bottom: 4px; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .pdfDish { font-size: 12pt; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px dashed #ccc; }
  </style>
</head>
<body>

  <!-- 頂部頭像區 (無App名稱) -->
  <div class="top">
    <img id="avatarTop" class="avatar" src="icon.png" alt="Logo">
    <div style="font-size:0.9rem; color:var(--muted);" id="dateDisplay"></div>
  </div>

  <!-- 頁面 1: 每週菜單 -->
  <div id="p-weekly" class="page active">
    <div class="card row">
      <input type="date" id="mondayPicker" onchange="onMonChange(event)">
      <button class="iconBtn" onclick="saveWeekly()" title="儲存">💾</button>
      <button class="iconBtn" onclick="exportWeeklyPDF()" title="導出PDF">📄</button>
    </div>
    <div id="weeklyGrid" class="weekGrid"></div>
  </div>

  <!-- 頁面 2: 菜式庫 -->
  <div id="p-library" class="page">
    <div class="card row">
      <button class="ghost" onclick="exportLib()">匯出</button>
      <button class="ghost" onclick="document.getElementById('importFile').click()">匯入</button>
      <button class="bigBtn" onclick="openAdd()">新增菜式</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importLib(event)">
    </div>
    <div class="row3" id="catGrid"></div>
  </div>

  <!-- 頁面 3: 我的菜單 -->
  <div id="p-mymenus" class="page">
    <div id="myList"></div>
  </div>

  <!-- 頁面 4: 設定 -->
  <div id="p-settings" class="page">
    <div class="card">
      <h3>分類排序與管理</h3>
      <div id="catOrder"></div>
      <div class="row" style="margin-top:12px">
        <input id="newCat" placeholder="新增分類名稱">
        <button class="bigBtn" onclick="addCat()">新增</button>
      </div>
    </div>

    <div class="card">
      <h3>外觀設定</h3>
      <div class="row">
        <span>深淺色模式</span>
        <button class="ghost" onclick="toggleTheme()">切換</button>
      </div>
      <div style="margin-top:14px">
        <label>字體大小 <span id="fsVal">20</span>px</label>
        <input type="range" id="fsRange" min="16" max="26" value="20" oninput="setFS(this.value)">
      </div>
    </div>

    <div class="card">
      <h3>自訂頭像</h3>
      <input type="file" id="avatarFile" accept="image/*" onchange="loadAvFile(event)">
      <div style="position:relative; width:220px; height:220px; margin:12px auto; border-radius:50%; overflow:hidden; border:3px solid var(--primary); background:#000;">
        <canvas id="avCanvas" width="400" height="400" style="width:100%; height:100%; cursor:grab;"></canvas>
      </div>
      <div class="row">
        <span>縮放</span>
        <input type="range" id="avZoom" min="0.2" max="3" step="0.05" value="1" oninput="drawAv()">
      </div>
      <button class="bigBtn" style="width:100%; margin-top:10px" onclick="saveAv()">儲存頭像</button>
    </div>
  </div>

  <!-- 底部導航欄 -->
  <div class="bottom">
    <div class="nav active" onclick="go('weekly')"><span class="ic">📅</span><span>每週</span></div>
    <div class="nav" onclick="go('library')"><span class="ic">📚</span><span>菜式庫</span></div>
    <div class="nav" onclick="go('mymenus')"><span class="ic">🗂️</span><span>我的菜單</span></div>
    <div class="nav" onclick="go('settings')"><span class="ic">⚙️</span><span>設定</span></div>
  </div>

  <!-- Modals 彈窗集合 -->
  <div class="modal" id="catModal"><div class="sheet"><div class="sheetHead"><b id="catTitle">分類</b><div class="x" onclick="closeM('catModal')">✕</div></div><div id="catDishes"></div></div></div>
  <div class="modal" id="dishNoteModal"><div class="sheet"><div class="sheetHead"><b>備註 / Catatan</b><div class="x" onclick="closeM('dishNoteModal')">✕</div></div><div style="padding:20px; white-space:pre-wrap; font-size:1.1rem;" id="noteContent"></div></div></div>

  <div class="modal" id="weekModal">
    <div class="sheet">
      <div class="sheetHead"><b id="weekTitle">日期</b><div class="x" onclick="closeM('weekModal')">✕</div></div>
      <div style="padding:16px">
        <div class="row" style="margin-bottom:12px">
          <label>用餐 Makan</label><select id="diners"></select>
          <label>外帶 Bungkus</label><select id="takeaway"></select>
        </div>
        <div id="selectedDishes"></div>
        <button class="bigBtn" style="width:100%; margin-top:12px" onclick="openDishPicker()">選擇菜式 Pilih Menu</button>
      </div>
    </div>
  </div>

  <div class="modal" id="pickModal"><div class="sheet"><div class="sheetHead"><b>選擇分類 Kategori</b><div class="x" onclick="closeM('pickModal')">✕</div></div><div id="pickCats" class="row3" style="padding:12px"></div></div></div>
  <div class="modal" id="pickDishModal"><div class="sheet"><div class="sheetHead"><b>選擇菜式 Menu</b><div class="x" onclick="closeM('pickDishModal')">✕</div></div><div id="pickDishes"></div></div></div>

  <div class="modal" id="addModal">
    <div class="sheet">
      <div class="sheetHead"><b id="addModalTitle">新增/修改菜式</b><div class="x" onclick="closeM('addModal')">✕</div></div>
      <div style="padding:16px">
        <input id="f_name" placeholder="中文菜名">
        <input id="f_indo" placeholder="印尼文 Nama Indonesia" style="margin-top:10px">
        <textarea id="f_note" placeholder="備註 + 烹調方法 (中+印) Catatan + Cara masak" style="margin-top:10px; height:120px"></textarea>
        <select id="f_cat" style="margin-top:10px"></select>
        <input type="hidden" id="f_id">
        <button class="bigBtn" style="width:100%; margin-top:12px" onclick="saveDish()">儲存 Simpan</button>
      </div>
    </div>
  </div>

  <div class="modal" id="dateForDishModal">
    <div class="sheet">
      <div class="sheetHead"><b>加入到哪一天？</b><div class="x" onclick="closeM('dateForDishModal')">✕</div></div>
      <div style="padding:16px">
        <input type="date" id="anyDate">
        <button class="bigBtn" style="width:100%; margin-top:12px" onclick="confirmAddToDay()">確認加入</button>
      </div>
    </div>
  </div>

  <!-- A4 列印/PDF 隱藏區域 -->
  <div id="pdfPrintArea" style="display:none"></div>

  <script>
    // 分類預設漫畫風格圖標與色彩
    const CAT_META = {
      "雞": { bg: "#fff3bf", emoji: "🐔" },
      "牛": { bg: "#ffe8cc", emoji: "🐮" },
      "豬": { bg: "#ffdeeb", emoji: "🐷" },
      "魚": { bg: "#d0ebff", emoji: "🐟" },
      "疏菜": { bg: "#d3f9d8", emoji: "🥬" },
      "湯水": { bg: "#fff4e6", emoji: "🍲" },
      "西式": { bg: "#e6fcff", emoji: "🍔" },
      "罐頭": { bg: "#f1f3f5", emoji: "🥫" },
      "其他": { bg: "#f3d9fa", emoji: "🍱" }
    };

    let cats = JSON.parse(localStorage.getItem('cats') || 'null') || Object.keys(CAT_META);
    let dishes = JSON.parse(localStorage.getItem('dishes') || 'null') || [];
    let weeklyMenus = JSON.parse(localStorage.getItem('weeklyMenus') || '[]');
    let currentWeek = { monday: null, days: [] };
    let editingDayIndex = null, pendingDishId = null;

    // 預設 90 款廣東菜式（中英印雙語烹調說明）
    function initDefaultDishes() {
      if (dishes.length > 0) return;
      const defaults = [
        ["雞", [
          ["豉油雞", "Ayam Kecap", "中文：雞醃豉油薑蒜，慢火煮20分鐘。\nIndo: Masak ayam dengan kecap asin, jahe, dan bawang putih api kecil 20 menit."],
          ["白切雞", "Ayam Rebus", "中文：水滾後放入浸熟，點薑蔥蓉。\nIndo: Rebus ayam air mendidih, sajikan dengan saus jahe."],
          ["霸王雞", "Ayam Bawang", "中文：蒸熟後鋪上大量蔥絲，淋上滾油。\nIndo: Kukus ayam, beri daun bawang dan siram minyak panas."],
          ["栗子炆雞", "Ayam Tumis Kastanye", "中文：栗子與雞塊爆炒後加水炆20分鐘。\nIndo: Tumis ayam dan kastanye, ungkep 20 menit."],
          ["咖喱雞", "Kari Ayam", "中文：炒香咖喱膏，加雞、薯仔及椰汁炆煮。\nIndo: Tumis bumbu kari, masukkan ayam, kentang, dan santan."],
          ["檸檬雞", "Ayam Lemon", "中文：雞扒煎金黃，淋上鮮檸檬汁芡。\nIndo: Goreng ayam fillet, siram saus lemon."],
          ["宮保雞丁", "Ayam Kung Pao", "中文：雞丁炒花生、辣椒及甜酸醬。\nIndo: Tumis ayam dadu dengan kacang dan cabai."],
          ["鹽焗雞", "Ayam Garam", "中文：塗抹鹽焗雞粉後蒸熟斬件。\nIndo: Baluri bubuk ayam garam lalu kukus."],
          ["冬菇蒸雞", "Ayam Kukus Jamur", "中文：冬菇浸軟切絲，與雞塊同蒸15分鐘。\nIndo: Kukus ayam dengan jamur hioko 15 menit."],
          ["北菇滑雞飯", "Nasi Ayam Jamur", "中文：雞肉醃好放在飯上同蒸。\nIndo: Kukus ayam berbumbu di atas nasi."]
        ]],
        ["牛", [
          ["乾炒牛河", "Kwetiau Sapi", "中文：大火爆炒牛肉及河粉，加老抽調色。\nIndo: Tumis daging sapi dan kwetiau api besar."],
          ["中式牛柳", "Bistik Sapi HK", "中文：牛柳煎香，加酸甜汁拌勻。\nIndo: Goreng daging sapi, tumis saus asam manis."],
          ["柱侯牛腩", "Semur Sapi Chu Hou", "中文：牛腩及蘿蔔加柱侯醬炆煮1.5小時。\nIndo: Ungkep daging sapi dan lobak dengan saus Chu Hou 1.5 jam."],
          ["黑椒牛柳粒", "Daging Sapi Lada Hitam", "中文：牛柳粒與洋蔥爆炒，加黑椒汁。\nIndo: Tumis sapi dadu dengan bawang bombay lada hitam."],
          ["蕃茄炒牛肉", "Sapi Tumis Tomat", "中文：牛肉炒至七熟，加入蕃茄同炒。\nIndo: Tumis sapi setengah matang lalu masukan tomat."],
          ["菜心炒牛肉", "Sapi Tumis Choy Sum", "中文：菜心汆水，加入醃好的牛肉爆炒。\nIndo: Tumis sapi dengan sayur Choy Sum."],
          ["水煮牛肉", "Sapi Pedas", "中文：牛肉切片焯熟，倒入麻辣湯底。\nIndo: Rebus irisan sapi dalam kuah pedas Mala."],
          ["免治牛肉飯", "Nasi Daging Cincang", "中文：牛肉碎炒洋蔥及茄汁，加太陽蛋。\nIndo: Tumis daging sapi cincang saus tomat."],
          ["沙爹牛肉麵", "Mie Sapi Satay", "中文：牛肉加沙爹醬炒香，放在即食麵上。\nIndo: Tumis sapi saus satai di atas mie."],
          ["滑蛋牛肉", "Sapi Telur Lembut", "中文：牛肉炒熟後倒入蛋液炒至半熟。\nIndo: Tumis sapi lalu siram kocokan telur lembut."]
        ]],
        ["豬", [
          ["咕嚕肉", "Babi Asam Manis", "中文：豬肉炸至脆身，拌入甜酸汁及菠蘿。\nIndo: Goreng daging babi, tumis saus asam manis nanas."],
          ["梅菜扣肉", "Babi Mei Cai", "中文：五花肉炸後切片，與梅菜同蒸1小時。\nIndo: Kukus babi samcan dan sayur asin 1 jam."],
          ["蒸鹹魚肉餅", "Kukus Daging Ikan Asin", "中文：免治豬肉加入鹹魚粒蒸15分鐘。\nIndo: Kukus daging cincang dengan potongan ikan asin."],
          ["椒鹽豬扒", "Pork Chop Garam Lada", "中文：豬扒拍鬆醃香，炸熟後撒椒鹽。\nIndo: Goreng pork chop, taburi garam dan lada."],
          ["京都骨", "Iga Babi Kyoto", "中文：排骨炸熟，裹上京都汁。\nIndo: Goreng iga babi dengan saus manis Kyoto."],
          ["涼瓜炒排骨", "Iga Babi Pare", "中文：涼瓜飛水，與排骨及豆豉同炒。\nIndo: Tumis iga babi dengan pare dan tauco."],
          ["蓮藕炆豬手", "Kaki Babi Akar Teratai", "中文：豬手汆水，與蓮藕南乳炆1.5小時。\nIndo: Ungkep kaki babi dan akar teratai."],

    // 頁面切換
    function go(p) {
      document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
      document.getElementById('p-' + p).classList.add('active');
      document.querySelectorAll('.nav').forEach((e, i) => {
        e.classList.remove('active');
        if (['weekly', 'library', 'mymenus', 'settings'][i] === p) e.classList.add('active');
      });
    }

    /* === 15 & 22: 週一日期限制 === */
    function getMon(d) {
      let dt = new Date(d);
      let day = dt.getDay();
      let diff = dt.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(dt.setDate(diff));
    }

    function fmt(d) {
      if (typeof d === 'string') return d;
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function onMonChange(e) {
      let d = e.target.valueAsDate;
      if (!d) return;
      if (d.getDay() !== 1) {
        alert("只可以選擇星期一作起始日\nHanya boleh pilih Hari Senin sebagai awal minggu");
        let m = getMon(d);
        document.getElementById('mondayPicker').valueAsDate = m;
        d = m;
      }
      initWeek(d);
    }

    function initWeek(monDate) {
      currentWeek.monday = fmt(monDate);
      currentWeek.days = [];
      const cnDays = ["一", "二", "三", "四", "五", "六", "日"];
      for (let i = 0; i < 7; i++) {
        let dt = new Date(monDate);
        dt.setDate(monDate.getDate() + i);
        currentWeek.days.push({
          dateStr: fmt(dt),
          cnDay: "星期" + cnDays[i],
          dishes: [],
          diners: 0,
          takeaway: 0
        });
      }
      renderWeekly();
    }

    /* === 16: 每週菜單佈局 === */
    function renderWeekly() {
      const grid = document.getElementById('weeklyGrid');
      grid.innerHTML = '';
      const emojis = ["🌅", "🌤️", "🌞", "🌇", "🌙", "⭐", "🎉"];

      for (let i = 0; i < 7; i += 2) {
        if (i < 4) {
          let row = document.createElement('div');
          row.style.display = 'contents';
          for (let j = i; j < i + 2; j++) {
            row.appendChild(createDayBox(j, emojis[j]));
          }
          grid.appendChild(row);
        } else {
          // 5-7 排在最後一行
          let full = document.createElement('div');
          full.className = 'full';
          for (let j = 4; j < 7; j++) {
            full.appendChild(createDayBox(j, emojis[j]));
          }
          grid.appendChild(full);
          break;
        }
      }
    }

    function createDayBox(idx, emoji) {
      let day = currentWeek.days[idx];
      let div = document.createElement('div');
      div.className = 'dayBox';
      div.onclick = () => openWeekModal(idx);
      div.innerHTML = `
        <div class="d1">${emoji}</div>
        <div class="d2">${day.dateStr.substring(5)}<br>${day.cnDay}</div>
        <div style="font-size:0.8rem; color:var(--primary); margin-top:4px;">${day.dishes.length} 款菜式</div>
      `;
      return div;
    }

    /* === 17: 日期彈窗與編輯 === */
    function openWeekModal(idx) {
      editingDayIndex = idx;
      let day = currentWeek.days[idx];
      document.getElementById('weekTitle').innerText = `${day.dateStr} (${day.cnDay})`;

      let sel1 = document.getElementById('diners');
      let sel2 = document.getElementById('takeaway');
      sel1.innerHTML = [...Array(10).keys()].map(n => `<option value="${n}" ${n==day.diners?'selected':''}>${n} 人</option>`).join('');
      sel2.innerHTML = [...Array(10).keys()].map(n => `<option value="${n}" ${n==day.takeaway?'selected':''}>${n} 人</option>`).join('');

      sel1.onchange = (e) => day.diners = parseInt(e.target.value);
      sel2.onchange = (e) => day.takeaway = parseInt(e.target.value);

      renderSelectedDishes();
      openM('weekModal');
    }

    function renderSelectedDishes() {
      let day = currentWeek.days[editingDayIndex];
      let wrap = document.getElementById('selectedDishes');
      wrap.innerHTML = day.dishes.map((d, i) => `
        <div class="dishRow">
          <div onclick="showNoteById('${d.id}')" style="cursor:pointer; flex:1">
            <b>${d.name}</b>
            <small>${d.indo}</small>
          </div>
          <button class="x" style="width:36px;height:36px;font-size:16px" onclick="removeDishFromDay(${i})">✕</button>
        </div>
      `).join('');
    }

    function removeDishFromDay(i) {
      currentWeek.days[editingDayIndex].dishes.splice(i, 1);
      renderSelectedDishes();
      renderWeekly();
    }

    /* === 18: 選擇菜式過程 === */
    function openDishPicker() {
      let wrap = document.getElementById('pickCats');
      wrap.innerHTML = cats.map(c => `
        <div class="catBox" onclick="openPickDishes('${c}')">
          <div class="emoji">${CAT_META[c]?.emoji || '🍱'}</div>
          <div class="label">${c}</div>
        </div>
      `).join('');
      openM('pickModal');
    }

    function openPickDishes(cat) {
      let list = dishes.filter(d => d.cat === cat);
      let wrap = document.getElementById('pickDishes');
      wrap.innerHTML = list.map(d => `
        <div class="dishRow">
          <div onclick="showNoteById('${d.id}')" style="cursor:pointer; flex:1">
            <b>${d.name}</b>
            <small>${d.indo}</small>
            ${d.lastCooked ? `<small style="color:var(--primary)">上次烹飪: ${d.lastCooked}</small>` : ''}
          </div>
          <button class="bigBtn" style="flex:0; padding:8px 16px; font-size:0.9rem;" onclick="pickDishToDay('${d.id}')">選擇</button>
        </div>
      `).join('');
      openM('pickDishModal');
    }

    function pickDishToDay(id) {
      let dish = dishes.find(d => d.id == id);
      if (dish && editingDayIndex !== null) {
        currentWeek.days[editingDayIndex].dishes.push(dish);
        renderSelectedDishes();
        renderWeekly();
        closeM('pickDishModal');
        closeM('pickModal');
      }
    }

    /* === 19, 21, 22, 26: 儲存菜單與烹飪日期更新 === */
    function saveWeekly() {
      if (!currentWeek.monday) return alert("請先選擇星期一起始日！");

      let exists = weeklyMenus.findIndex(m => m.monday === currentWeek.monday);
      if (exists >= 0) {
        if (!confirm("該星期的菜單已存在，是否覆蓋？\n選「取消」可另擇日期。")) {
          return;
        }
        weeklyMenus[exists] = JSON.parse(JSON.stringify(currentWeek));
      } else {
        if (weeklyMenus.length >= 10) {
          return alert("「我的菜單」最多只可儲存 10 張菜單，請先刪除舊菜單。");
        }
        weeklyMenus.push(JSON.parse(JSON.stringify(currentWeek)));
      }

      // 更新上一次烹飪日期 (2026年時間點)
      currentWeek.days.forEach(day => {
        day.dishes.forEach(d => {
          let target = dishes.find(x => x.id == d.id);
          if (target) target.lastCooked = day.dateStr;
        });
      });

      saveDishes();
      localStorage.setItem('weeklyMenus', JSON.stringify(weeklyMenus));
      alert("儲存成功！");
      renderMy();
      renderCats();
    }

    /* === 9, 10, 11, 14, 20: 菜式庫管理 === */
    function renderCats() {
      let grid = document.getElementById('catGrid');
      grid.innerHTML = cats.map(c => `
        <div class="catBox" onclick="openCatDishes('${c}')">
          <div class="emoji">${CAT_META[c]?.emoji || '🍱'}</div>
          <div class="label">${c}</div>
        </div>
      `).join('');
    }

    function openCatDishes(cat) {
      document.getElementById('catTitle').innerText = cat;
      let list = dishes.filter(d => d.cat === cat);
      let wrap = document.getElementById('catDishes');
      wrap.innerHTML = list.map(d => `
        <div class="dishRow">
          <div onclick="showNoteById('${d.id}')" style="cursor:pointer; flex:1">
            <b>${d.name}</b>
            <small>${d.indo}</small>
            ${d.lastCooked ? `<small style="color:var(--primary)">上次烹飪: ${d.lastCooked}</small>` : ''}
          </div>
          <div class="act">
            <button onclick="promptAddToDay('${d.id}')" title="加入每週菜單">📅</button>
            <button onclick="openEditDish('${d.id}')" title="修改">✏️</button>
            <button onclick="deleteDish('${d.id}')" title="刪除">🗑️</button>
          </div>
        </div>
      `).join('');
      openM('catModal');
    }

    function showNoteById(id) {
      let d = dishes.find(x => x.id == id);
      if (d) {
        document.getElementById('noteContent').innerText = d.note || "無備註 Catatan Tidak Ada";
        openM('dishNoteModal');
      }
    }

    function promptAddToDay(id) {
      pendingDishId = id;
      openM('dateForDishModal');
    }

    function confirmAddToDay() {
      let dateInput = document.getElementById('anyDate').value;
      if (!dateInput) return alert("請選擇日期！");
      let d = dishes.find(x => x.id == pendingDishId);

      // 檢查日期是否在當前週內
      let targetDay = currentWeek.days.find(x => x.dateStr === dateInput);
      if (targetDay) {
        targetDay.dishes.push(d);
        renderWeekly();
        alert(`已加入至 ${dateInput}`);
      } else {
        alert(`日期 ${dateInput} 未在當前週內，已更新該菜式的上次烹飪日期。`);
      }
      d.lastCooked = dateInput;
      saveDishes();
      closeM('dateForDishModal');
    }

    function openAdd() {
      document.getElementById('addModalTitle').innerText = "新增菜式";
      document.getElementById('f_id').value = "";
      document.getElementById('f_name').value = "";
      document.getElementById('f_indo').value = "";
      document.getElementById('f_note').value = "";
      fillCatSelect();
      openM('addModal');
    }

    function openEditDish(id) {
      let d = dishes.find(x => x.id == id);
      if (!d) return;
      document.getElementById('addModalTitle').innerText = "修改菜式";
      document.getElementById('f_id').value = d.id;
      document.getElementById('f_name').value = d.name;
      document.getElementById('f_indo').value = d.indo;
      document.getElementById('f_note').value = d.note;
      fillCatSelect(d.cat);
      openM('addModal');
    }

    function fillCatSelect(selected = "") {
      let sel = document.getElementById('f_cat');
      sel.innerHTML = cats.map(c => `<option value="${c}" ${c===selected?'selected':''}>${c}</option>`).join('');
    }

    function saveDish() {
      let id = document.getElementById('f_id').value;
      let name = document.getElementById('f_name').value.trim();
      let indo = document.getElementById('f_indo').value.trim();
      let note = document.getElementById('f_note').value.trim();
      let cat = document.getElementById('f_cat').value;

      if (!name) return alert("請輸入中文菜名！");

      if (id) {
        let d = dishes.find(x => x.id == id);
        if (d) { d.name = name; d.indo = indo; d.note = note; d.cat = cat; }
      } else {
        dishes.push({ id: Date.now(), name, indo, note, cat, lastCooked: "" });
      }

      saveDishes();
      closeM('addModal');
      renderCats();
      alert("儲存成功！");
    }

    function deleteDish(id) {
      if (confirm("確定要刪除這道菜式嗎？")) {
        dishes = dishes.filter(d => d.id != id);
        saveDishes();
        closeM('catModal');
        renderCats();
      }
    }

    /* === 5: 菜式庫 JSON 匯入/匯出 (嚴格測試保證操作) === */
    function exportLib() {
      let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dishes, null, 2));
      let dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `recipe_library_${fmt(new Date())}.json`);
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
    }

    function importLib(e) {
      let file = e.target.files[0];
      if (!file) return;
      let reader = new FileReader();
      reader.onload = function(evt) {
        try {
          let imported = JSON.parse(evt.target.result);
          if (Array.isArray(imported)) {
            dishes = imported;
            saveDishes();
            renderCats();
            alert("菜式庫成功匯入！");
          } else {
            alert("JSON 格式不符！");
          }
        } catch (err) {
          alert("匯入失敗：無效的 JSON 檔案");
        }
      };
      reader.readAsText(file);
    }

    /* === 24, 25: 我的菜單列表與開合備註 === */
    function renderMy() {
      let wrap = document.getElementById('myList');
      if (weeklyMenus.length === 0) {
        wrap.innerHTML = `<div class="card" style="text-align:center">尚未儲存任何每週菜單</div>`;
        return;
      }
      wrap.innerHTML = weeklyMenus.map((m, idx) => `
        <div class="card">
          <div class="row" style="justify-content:space-between; margin-bottom:10px;">
            <b>星期一日期：${m.monday}</b>
            <div>
              <button class="ghost" onclick="loadMyToEdit(${idx})">載入/修改</button>
              <button class="ghost" style="color:red" onclick="deleteMy(${idx})">刪除</button>
            </div>
          </div>
          ${m.days.map(d => `
            <div style="margin-top:8px; border-top:1px solid var(--border); padding-top:6px;">
              <div><b>${d.dateStr} (${d.cnDay})</b> - 用餐: ${d.diners}人 / 外帶: ${d.takeaway}人</div>
              ${d.dishes.map(ds => `
                <div style="margin-left:12px; margin-top:4px;">
                  <span style="cursor:pointer; color:var(--primary); font-weight:700;" onclick="toggleInlineNote('n_${idx}_${ds.id}')">
                    • ${ds.name} (${ds.indo})
                  </span>
                  <div id="n_${idx}_${ds.id}" style="display:none; font-size:0.85rem; color:var(--muted); padding-left:12px; white-space:pre-wrap;">${ds.note}</div>
                </div>
              `).join('')}
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    function toggleInlineNote(id) {
      let el = document.getElementById(id);
      if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function loadMyToEdit(idx) {
      currentWeek = JSON.parse(JSON.stringify(weeklyMenus[idx]));
      document.getElementById('mondayPicker').valueAsDate = new Date(currentWeek.monday);
      renderWeekly();
      go('weekly');
    }

    function deleteMy(idx) {
      if (confirm("確定刪除這張每週菜單嗎？")) {
        weeklyMenus.splice(idx, 1);
        localStorage.setItem('weeklyMenus', JSON.stringify(weeklyMenus));
        renderMy();
      }
    }

    /* === 28, 29, 30: 雙語 A4 PDF 導出 (全功能) === */
    function exportWeeklyPDF() {
      let area = document.getElementById('pdfPrintArea');
      area.style.display = 'block';

      area.innerHTML = `
        <div class="pdfPage">
          <div class="pdfTitle">每週菜單 Menu Mingguan</div>
          <div class="pdfSub">起始日期 / Tanggal Mulai: ${currentWeek.monday}</div>
          ${currentWeek.days.map(d => `
            <div class="pdfDay">
              <div class="pdfDayH">
                <span>${d.dateStr} (${d.cnDay})</span>
                <span>Makan: ${d.diners}人 \vert{} Bungkus: ${d.takeaway}人</span>
              </div>
              ${d.dishes.length === 0 ? '<div class="pdfDish">無菜式 Tidak ada menu</div>' : ''}
              ${d.dishes.map(ds => `
                <div class="pdfDish">
                  <b>${ds.name} / ${ds.indo}</b>
                  <div style="font-size:10pt; color:#444; white-space:pre-wrap; margin-top:2px;">${ds.note || ''}</div>
                </div>
              `).join('')}
            </div>
          `).join('')}
        </div>
      `;

      window.print();
      area.style.display = 'none';
    }

    /* === 31, 32, 33: 設定 - 分類順序與刪除邏輯 === */
    function renderCatOrder() {
      let wrap = document.getElementById('catOrder');
      wrap.innerHTML = cats.map((c, i) => `
        <div class="row" style="margin-bottom:8px;">
          <span style="flex:1; font-weight:700;">${c}</span>
          <button class="ghost" style="flex:0" onclick="moveCat(${i}, -1)">▲</button>
          <button class="ghost" style="flex:0" onclick="moveCat(${i}, 1)">▼</button>
          ${c !== '其他' ? `<button class="ghost" style="flex:0; color:red" onclick="delCat('${c}')">刪除</button>` : ''}
        </div>
      `).join('');
    }

    function moveCat(i, dir) {
      let target = i + dir;
      if (target < 0 || target >= cats.length) return;
      let temp = cats[i];
      cats[i] = cats[target];
      cats[target] = temp;
      saveCats();
      renderCatOrder();
      renderCats();
    }

    function addCat() {
      let name = document.getElementById('newCat').value.trim();
      if (!name) return;
      if (!cats.includes(name)) {
        cats.push(name);
        saveCats();
        renderCatOrder();
        renderCats();
        document.getElementById('newCat').value = "";
      }
    }

    function delCat(c) {
      if (confirm(`刪除分類「${c}」後，其中的所有菜式將自動移至「其他」分類。確定繼續？`)) {
        dishes.forEach(d => {
          if (d.cat === c) d.cat = "其他";
        });
        cats = cats.filter(x => x !== c);
        saveDishes();
        saveCats();
        renderCatOrder();
        renderCats();
      }
    }

    /* === 34, 36: 設定 - 深淺色與字體 === */
    function toggleTheme() {
      document.body.classList.toggle('dark');
      localStorage.setItem('dark', document.body.classList.contains('dark'));
    }

    function setFS(v) {
      document.documentElement.style.setProperty('--fs', v + 'px');
      document.getElementById('fsVal').innerText = v;
      localStorage.setItem('appFS', v);
    }

    /* === 35: 自訂頭像與 Canvas 手勢裁切/縮放 === */
    let imgObj = new Image();
    let avCanvas = document.getElementById('avCanvas');
    let ctx = avCanvas.getContext('2d');
    let scale = 1, posX = 0, posY = 0, isDragging = false, startX, startY;

    function loadAvFile(e) {
      let file = e.target.files[0];
      if (!file) return;
      let reader = new FileReader();
      reader.onload = function(evt) {
        imgObj.onload = function() {
          posX = 0; posY = 0; scale = 1;
          document.getElementById('avZoom').value = 1;
          drawAv();
        };
        imgObj.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function drawAv() {
      if (!imgObj.src) return;
      scale = parseFloat(document.getElementById('avZoom').value);
      ctx.clearRect(0, 0, avCanvas.width, avCanvas.height);
      ctx.save();
      ctx.translate(avCanvas.width / 2 + posX, avCanvas.height / 2 + posY);
      ctx.scale(scale, scale);
      ctx.drawImage(imgObj, -imgObj.width / 2, -imgObj.height / 2);
      ctx.restore();
    }

    avCanvas.onmousedown = (e) => { isDragging = true; startX = e.clientX - posX; startY = e.clientY - posY; };
    window.onmousemove = (e) => { if (isDragging) { posX = e.clientX - startX; posY = e.clientY - startY; drawAv(); } };
    window.onmouseup = () => isDragging = false;

    function saveAv() {
      let dataUrl = avCanvas.toDataURL();
      document.getElementById('avatarTop').src = dataUrl;
      localStorage.setItem('userAvatar', dataUrl);
      alert("頭像已更新！");
    }

    // 通用 Modal 控制
    function openM(id) { document.getElementById(id).classList.add('open'); }
    function closeM(id) { document.getElementById(id).classList.remove('open'); }

    // 初始化應用程式
    function init() {
      initDefaultDishes();

      // 載入設定
      if (localStorage.getItem('dark') === 'true') document.body.classList.add('dark');
      let savedFS = localStorage.getItem('appFS');
      if (savedFS) {
        setFS(savedFS);
        document.getElementById('fsRange').value = savedFS;
      }
      let savedAvatar = localStorage.getItem('userAvatar');
      if (savedAvatar) document.getElementById('avatarTop').src = savedAvatar;

      // 日期與週菜單初始化
      let now = new Date();
      document.getElementById('dateDisplay').innerText = fmt(now);
      let mon = getMon(now);
      document.getElementById('mondayPicker').valueAsDate = mon;
      initWeek(mon);

      renderCats();
      renderMy();
      renderCatOrder();
    }

    window.onload = init;
  </script>
</body>
</html>
