<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>每週菜單</title>
  
  <!-- PWA & iOS Meta Tags -->
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIuCBjIEPmY/mjaXph4EiLAogICJzaG9ydF9uYW1lIjogIuCBjIEPmY/mjaXph4EiLAogICJzdGFydF91cmwiOiAiaW5kZXguaHRtbCIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiI2ZmZmZmZiIsCiAgInRoZW1lX2NvbG9yIjogIiM0ZjQ2ZTUiLAogICJpY29ucyI6IFsKICAgIHsKICAgICAgInNyYyI6ICJpY29uLnBuZyIsCiAgICAgICJzaXplcyI6ICIxOTJ4MTkyIiwKICAgICAgInR5cGUiOiAiaW1hZ2UvcG5nIgogICAgfQogIF0KfQ==">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- html2pdf.js for PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* iPhone Safe Area Adaptation */
    :root {
      --sat: env(safe-area-inset-top, 47px);
      --sab: env(safe-area-inset-bottom, 34px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    body {
      padding-top: var(--sat);
      padding-bottom: var(--sab);
      padding-left: var(--sal);
      padding-right: var(--sar);
      font-size: var(--app-font-size, 16px);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Print Styles for PDF Export */
    @media print {
      body * {
        visibility: hidden;
      }
      #pdf-template, #pdf-template * {
        visibility: visible;
      }
      #pdf-template {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Header Section -->
  <header class="sticky top-0 z-30 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('settings')">
      <div class="relative w-10 h-10 rounded-full overflow-hidden border-2 border-brand-500 bg-gray-200 dark:bg-gray-700 flex items-center justify-center">
        <img id="header-avatar" src="" alt="Avatar" class="w-full h-full object-cover hidden">
        <i id="header-avatar-placeholder" class="fa-solid fa-user text-gray-400 dark:text-gray-500"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight">每週菜單</h1>
        <p class="text-xs text-gray-500 dark:text-gray-400">Weekly Menu Planner</p>
      </div>
    </div>

    <!-- Global Action Buttons -->
    <div class="flex items-center space-x-2">
      <button onclick="saveCurrentMenu()" title="儲存至我的菜單" class="p-2.5 rounded-full bg-blue-50 dark:bg-gray-700 text-brand-600 dark:text-blue-400 hover:bg-blue-100 active:scale-95 transition">
        <i class="fa-solid fa-floppy-disk text-lg"></i>
      </button>
      <button onclick="exportPDF()" title="匯出 PDF" class="p-2.5 rounded-full bg-emerald-50 dark:bg-gray-700 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-100 active:scale-95 transition">
        <i class="fa-solid fa-file-pdf text-lg"></i>
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 overflow-y-auto p-4 space-y-6 pb-24">

    <!-- TAB 1: Weekly Menu Planner (Main View) -->
    <section id="tab-planner" class="tab-content space-y-4">
      <!-- Date Selector Banner -->
      <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1">起始星期一日期 (Start Date):</label>
        <div class="flex items-center space-x-2">
          <input type="date" id="menu-start-date" onchange="handleStartDateChange(this.value)" class="flex-1 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-brand-500">
          <span id="date-weekday-tag" class="text-xs px-2.5 py-1 bg-brand-50 dark:bg-gray-700 text-brand-600 dark:text-blue-400 rounded-lg font-medium">星期一</span>
        </div>
      </div>

      <!-- 7 Days Cards -->
      <div id="planner-days-container" class="space-y-4">
        <!-- Generated Dynamically -->
      </div>
    </section>

    <!-- TAB 2: Recipe Library -->
    <section id="tab-recipes" class="tab-content hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold">菜式庫</h2>
        <button onclick="openRecipeModal()" class="bg-brand-600 text-white px-3.5 py-2 rounded-xl text-sm font-medium shadow hover:bg-brand-700 active:scale-95 transition flex items-center gap-1.5">
          <i class="fa-solid fa-plus"></i> 新增菜式
        </button>
      </div>

      <!-- Category Tabs & Recipe Lists -->
      <div id="recipe-library-container" class="space-y-4">
        <!-- Rendered by JavaScript -->
      </div>
    </section>

    <!-- TAB 3: Saved Menus -->
    <section id="tab-saved" class="tab-content hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold">我的菜單</h2>
        <span id="saved-count-tag" class="text-xs bg-gray-200 dark:bg-gray-700 px-2.5 py-1 rounded-full font-medium">0 / 10</span>
      </div>
      <div id="saved-menus-list" class="space-y-3">
        <!-- Saved Menus List -->
      </div>
    </section>

    <!-- TAB 4: Settings Page -->
    <section id="tab-settings" class="tab-content hidden space-y-6">
      <h2 class="text-xl font-bold">設定與偏好</h2>

      <!-- Avatar Upload & Crop Section -->
      <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-3">
        <h3 class="font-semibold text-sm text-gray-500 dark:text-gray-400">個人頭像設定</h3>
        <div class="flex items-center space-x-4">
          <div class="w-16 h-16 rounded-full overflow-hidden border-2 border-brand-500 bg-gray-100 dark:bg-gray-700 flex items-center justify-center shrink-0">
            <img id="settings-avatar-preview" src="" class="w-full h-full object-cover hidden">
            <i id="settings-avatar-placeholder" class="fa-solid fa-user text-2xl text-gray-400"></i>
          </div>
          <div>
            <input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="handleAvatarSelect(event)">
            <button onclick="document.getElementById('avatar-input').click()" class="bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 px-3.5 py-2 rounded-xl text-sm font-medium transition">
              上傳照片
            </button>
          </div>
        </div>
      </div>

      <!-- Preferences Section -->
      <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-4">
        <h3 class="font-semibold text-sm text-gray-500 dark:text-gray-400">個人化設定</h3>
        
        <!-- Theme Toggle -->
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium">深色模式 (Dark Theme)</span>
          <button id="theme-toggle" onclick="toggleTheme()" class="w-12 h-6 rounded-full bg-gray-300 dark:bg-brand-600 relative transition-colors duration-200">
            <span id="theme-toggle-dot" class="block w-5 h-5 rounded-full bg-white absolute top-0.5 left-0.5 transition-transform duration-200 dark:translate-x-6"></span>
          </button>
        </div>

        <!-- Font Size Slider -->
        <div class="space-y-1">
          <div class="flex justify-between text-sm">
            <span class="font-medium">字體大小</span>
            <span id="font-size-label" class="text-xs text-gray-500">16px</span>
          </div>
          <input type="range" id="font-size-range" min="14" max="20" value="16" step="1" oninput="updateFontSize(this.value)" class="w-full accent-brand-600">
        </div>
      </div>

      <!-- Category Management -->
      <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="font-semibold text-sm text-gray-500 dark:text-gray-400">分類管理 (可拖拉排序)</h3>
          <button onclick="addNewCategoryPrompt()" class="text-brand-600 dark:text-blue-400 text-sm font-medium"><i class="fa-solid fa-plus"></i> 新增分類</button>
        </div>
        <ul id="categories-drag-list" class="space-y-2">
          <!-- Categories with drag handles and delete button -->
        </ul>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-gray-800/90 backdrop-blur-md border-t border-gray-200 dark:border-gray-700 z-30 pb-[env(safe-area-inset-bottom)]">
    <div class="grid grid-cols-4 h-16">
      <button onclick="switchTab('planner')" id="nav-planner" class="nav-btn text-brand-600 dark:text-blue-400 flex flex-col items-center justify-center space-y-1">
        <i class="fa-solid fa-calendar-week text-lg"></i>
        <span class="text-[10px] font-medium">每週菜單</span>
      </button>
      <button onclick="switchTab('recipes')" id="nav-recipes" class="nav-btn text-gray-400 flex flex-col items-center justify-center space-y-1">
        <i class="fa-solid fa-utensils text-lg"></i>
        <span class="text-[10px] font-medium">菜式庫</span>
      </button>
      <button onclick="switchTab('saved')" id="nav-saved" class="nav-btn text-gray-400 flex flex-col items-center justify-center space-y-1">
        <i class="fa-solid fa-folder-open text-lg"></i>
        <span class="text-[10px] font-medium">我的菜單</span>
      </button>
      <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn text-gray-400 flex flex-col items-center justify-center space-y-1">
        <i class="fa-solid fa-gear text-lg"></i>
        <span class="text-[10px] font-medium">設定</span>
      </button>
    </div>
  </nav>

  <!-- MODAL: Add / Edit Recipe -->
  <div id="recipe-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-2xl p-5 space-y-4 shadow-2xl animate-fade-in">
      <h3 id="recipe-modal-title" class="text-lg font-bold">新增菜式</h3>
      <input type="hidden" id="edit-recipe-id">
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">中文名稱</label>
          <input type="text" id="recipe-cn-input" placeholder="例如：蒸蛋" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">印尼文名稱 (Bahasa Indonesia)</label>
          <input type="text" id="recipe-id-input" placeholder="例如：Telur Kukus" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">分類</label>
          <select id="recipe-cat-select" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
            <!-- Categories options dynamically inserted -->
          </select>
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeRecipeModal()" class="px-4 py-2 rounded-xl text-sm font-medium bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600">取消</button>
        <button onclick="saveRecipe()" class="px-4 py-2 rounded-xl text-sm font-medium bg-brand-600 text-white hover:bg-brand-700">儲存</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Select Recipe to Day Menu -->
  <div id="picker-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 w-full max-w-md h-[80vh] rounded-2xl p-4 flex flex-col shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b border-gray-200 dark:border-gray-700">
        <h3 id="picker-modal-title" class="font-bold text-base">選擇菜式加入菜單</h3>
        <button onclick="closePickerModal()" class="text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div id="picker-list-container" class="flex-1 overflow-y-auto space-y-4 py-3">
        <!-- Rendered with categories & recipes -->
      </div>
    </div>
  </div>

  <!-- MODAL: Avatar Cropper -->
  <div id="crop-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 w-full max-w-sm rounded-2xl p-4 space-y-4 text-center">
      <h3 class="font-bold text-base">調整 / 裁切頭像</h3>
      <div class="relative w-64 h-64 mx-auto bg-black rounded-full overflow-hidden flex items-center justify-center border-2 border-brand-500">
        <img id="crop-image" src="" class="max-w-none transform transition-transform duration-75 cursor-move">
      </div>
      <div class="space-y-2">
        <label class="block text-xs text-gray-500">縮放控制</label>
        <input type="range" id="crop-zoom" min="0.5" max="2.5" step="0.05" value="1" oninput="updateCropTransform()" class="w-full">
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeCropModal()" class="px-4 py-2 rounded-xl text-sm font-medium bg-gray-200 dark:bg-gray-700">取消</button>
        <button onclick="confirmCrop()" class="px-4 py-2 rounded-xl text-sm font-medium bg-brand-600 text-white">確認並儲存</button>
      </div>
    </div>
  </div>

  <!-- HIDDEN PDF Printable Template -->
  <div class="hidden">
    <div id="pdf-template" class="p-8 bg-white text-black space-y-6">
      <div class="text-center border-b pb-4">
        <h1 class="text-3xl font-extrabold tracking-tight">每週菜單 Menu Mingguan</h1>
        <p id="pdf-date-range" class="text-lg font-semibold text-gray-600 mt-1"></p>
      </div>
      <div id="pdf-days-list" class="space-y-4">
        <!-- Printable 7 days rendering -->
      </div>
    </div>
  </div>

  <!-- JavaScript App Logic -->
  <script>
    // --- Initial State & Storage Keys ---
    const STORAGE_KEY_RECIPES = 'wm_recipes_v1';
    const STORAGE_KEY_CATEGORIES = 'wm_categories_v1';
    const STORAGE_KEY_SAVED_MENUS = 'wm_saved_menus_v1';
    const STORAGE_KEY_SETTINGS = 'wm_settings_v1';

    const DEFAULT_CATEGORIES = ['雞', '牛', '豬', '魚', '海鮮(魚除外)', '蔬菜', '湯水', '西式', '罐頭', '其他'];
    
    const DEFAULT_RECIPES = [
      { id: '1', nameCn: '蒸水蛋', nameId: 'Telur Kukus', category: '其他', lastCooked: '' },
      { id: '2', nameCn: '番茄炒牛肉', nameId: 'Daging Sapi Tumis Tomat', category: '牛', lastCooked: '' },
      { id: '3', nameCn: '清蒸海上鮮', nameId: 'Ikan Kukus', category: '魚', lastCooked: '' },
      { id: '4', nameCn: '蒜蓉炒青菜', nameId: 'Sayur Tumis Bawang Putih', category: '蔬菜', lastCooked: '' },
      { id: '5', nameCn: '羅宋湯', nameId: 'Sup ABC', category: '湯水', lastCooked: '' }
    ];

    let state = {
      categories: [],
      recipes: [],
      savedMenus: [],
      settings: {
        theme: 'light',
        fontSize: 16,
        avatar: ''
      },
      currentMenu: {
        startDate: '', // YYYY-MM-DD
        days: {} // key: 0..6 (Mon..Sun) -> { dineIn: '', takeOut: '', recipes: [recipeObj...] }
      },
      activePickerDayIndex: null
    };

    // --- App Lifecycle ---
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      initCurrentMenu(getNearestMonday(new Date()));
      applySettings();
      renderPlannerDays();
      renderRecipeLibrary();
      renderSavedMenus();
      renderCategorySettings();
    });

    function loadState() {
      state.categories = JSON.parse(localStorage.getItem(STORAGE_KEY_CATEGORIES)) || DEFAULT_CATEGORIES;
      state.recipes = JSON.parse(localStorage.getItem(STORAGE_KEY_RECIPES)) || DEFAULT_RECIPES;
      state.savedMenus = JSON.parse(localStorage.getItem(STORAGE_KEY_SAVED_MENUS)) || [];
      state.settings = JSON.parse(localStorage.getItem(STORAGE_KEY_SETTINGS)) || state.settings;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY_CATEGORIES, JSON.stringify(state.categories));
      localStorage.setItem(STORAGE_KEY_RECIPES, JSON.stringify(state.recipes));
      localStorage.setItem(STORAGE_KEY_SAVED_MENUS, JSON.stringify(state.savedMenus));
      localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(state.settings));
    }

    // --- Helper Functions ---
    function getNearestMonday(dateObj) {
      const d = new Date(dateObj);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const mon = new Date(d.setDate(diff));
      return mon.toISOString().split('T')[0];
    }

    function isMonday(dateStr) {
      if (!dateStr) return false;
      const d = new Date(dateStr);
      return d.getDay() === 1;
    }

    function formatDateString(dateStr, addDays) {
      const d = new Date(dateStr);
      d.setDate(d.getDate() + addDays);
      return d.toISOString().split('T')[0];
    }

    const WEEKDAYS_ZH = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];

    // --- Tab Navigation ---
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-brand-600', 'dark:text-blue-400');
        btn.classList.add('text-gray-400');
      });
      const activeNav = document.getElementById(`nav-${tabId}`);
      if(activeNav) {
        activeNav.classList.remove('text-gray-400');
        activeNav.classList.add('text-brand-600', 'dark:text-blue-400');
      }
    }

    // --- Planner Logic & Start Date Enforcement ---
    function initCurrentMenu(mondayDateStr) {
      state.currentMenu.startDate = mondayDateStr;
      document.getElementById('menu-start-date').value = mondayDateStr;
      state.currentMenu.days = {};
      for (let i = 0; i < 7; i++) {
        state.currentMenu.days[i] = {
          dineIn: '',
          takeOut: '',
          recipes: []
        };
      }
    }

    function handleStartDateChange(selectedDateStr) {
      if (!isMonday(selectedDateStr)) {
        alert('只可以選擇星期一作起始日');
        document.getElementById('menu-start-date').value = state.currentMenu.startDate;
        return;
      }
      state.currentMenu.startDate = selectedDateStr;
      renderPlannerDays();
    }

    function renderPlannerDays() {
      const container = document.getElementById('planner-days-container');
      container.innerHTML = '';

      for (let i = 0; i < 7; i++) {
        const currentDate = formatDateString(state.currentMenu.startDate, i);
        const dayData = state.currentMenu.days[i];

        const dayCard = document.createElement('div');
        dayCard.className = 'bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-700 space-y-3';
        
        let recipeItemsHtml = dayData.recipes.map((r, rIdx) => `
          <li class="flex justify-between items-center bg-gray-50 dark:bg-gray-700/50 px-3 py-2 rounded-xl text-sm">
            <div>
              <span class="font-medium">${r.nameCn}</span>
              <span class="text-xs text-gray-400 ml-1">/ ${r.nameId}</span>
            </div>
            <button onclick="removeRecipeFromDay(${i}, ${rIdx})" class="text-gray-400 hover:text-red-500 p-1">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </li>
        `).join('');

        dayCard.innerHTML = `
          <div class="flex justify-between items-center border-b border-gray-100 dark:border-gray-700 pb-2">
            <div>
              <span class="font-bold text-base text-brand-600 dark:text-blue-400">${WEEKDAYS_ZH[i]}</span>
              <span class="text-xs text-gray-400 ml-2">${currentDate}</span>
            </div>
            <!-- Dine-in / Take-out SELECTORS -->
            <div class="flex items-center space-x-2 text-xs">
              <div class="flex items-center space-x-1">
                <span>🍽️ 用餐:</span>
                <select onchange="updateDayPeople(${i}, 'dineIn', this.value)" class="bg-gray-100 dark:bg-gray-700 rounded-lg p-1 font-semibold">
                  <option value="" ${dayData.dineIn === '' ? 'selected' : ''}>空白</option>
                  ${[...Array(10).keys()].map(n => `<option value="${n}" ${dayData.dineIn === String(n) ? 'selected' : ''}>${n}</option>`).join('')}
                </select>
              </div>
              <div class="flex items-center space-x-1">
                <span>🛍️ 外帶:</span>
                <select onchange="updateDayPeople(${i}, 'takeOut', this.value)" class="bg-gray-100 dark:bg-gray-700 rounded-lg p-1 font-semibold">
                  <option value="" ${dayData.takeOut === '' ? 'selected' : ''}>空白</option>
                  ${[...Array(10).keys()].map(n => `<option value="${n}" ${dayData.takeOut === String(n) ? 'selected' : ''}>${n}</option>`).join('')}
                </select>
              </div>
            </div>
          </div>

          <!-- Recipe List -->
          <ul class="space-y-1.5">
            ${recipeItemsHtml || '<li class="text-xs text-gray-400 italic py-1">未新增菜式</li>'}
          </ul>

          <button onclick="openPickerModal(${i})" class="w-full py-2 border border-dashed border-gray-300 dark:border-gray-600 rounded-xl text-xs font-medium text-gray-500 hover:text-brand-600 hover:border-brand-500 transition flex items-center justify-center gap-1">
            <i class="fa-solid fa-plus"></i> 加入菜式
          </button>
        `;

        container.appendChild(dayCard);
      }
    }

    function updateDayPeople(dayIndex, type, val) {
      state.currentMenu.days[dayIndex][type] = val;
    }

    function removeRecipeFromDay(dayIndex, recipeIndex) {
      state.currentMenu.days[dayIndex].recipes.splice(recipeIndex, 1);
      renderPlannerDays();
    }

    // --- Recipe Picker Modal ---
    function openPickerModal(dayIndex) {
      state.activePickerDayIndex = dayIndex;
      const container = document.getElementById('picker-list-container');
      container.innerHTML = '';

      state.categories.forEach(cat => {
        const catRecipes = state.recipes.filter(r => r.category === cat);
        if (catRecipes.length === 0) return;

        const catSec = document.createElement('div');
        catSec.className = 'space-y-1.5';
        catSec.innerHTML = `<h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">${cat}</h4>`;

        const list = document.createElement('div');
        list.className = 'grid grid-cols-1 gap-1.5';

        catRecipes.forEach(r => {
          const item = document.createElement('div');
          item.className = 'bg-gray-50 dark:bg-gray-700/60 p-2.5 rounded-xl flex justify-between items-center cursor-pointer hover:bg-brand-50 dark:hover:bg-gray-600 transition';
          item.onclick = () => selectRecipeForDay(r);
          item.innerHTML = `
            <div>
              <p class="text-sm font-semibold">${r.nameCn}</p>
              <p class="text-xs text-gray-400">${r.nameId}</p>
            </div>
            ${r.lastCooked ? `<span class="text-[10px] bg-gray-200 dark:bg-gray-600 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded-md">上次: ${r.lastCooked}</span>` : ''}
          `;
          list.appendChild(item);
        });

        catSec.appendChild(list);
        container.appendChild(catSec);
      });

      document.getElementById('picker-modal').classList.remove('hidden');
    }

    function closePickerModal() {
      document.getElementById('picker-modal').classList.add('hidden');
      state.activePickerDayIndex = null;
    }

    function selectRecipeForDay(recipeObj) {
      if (state.activePickerDayIndex === null) return;
      
      // Update last cooked date for this recipe to current day's date
      const targetDate = formatDateString(state.currentMenu.startDate, state.activePickerDayIndex);
      const recipeInStore = state.recipes.find(r => r.id === recipeObj.id);
      if (recipeInStore) {
        recipeInStore.lastCooked = targetDate;
        saveState();
      }

      state.currentMenu.days[state.activePickerDayIndex].recipes.push({ ...recipeObj });
      renderPlannerDays();
      renderRecipeLibrary();
      closePickerModal();
    }

    // --- Saved Menus Logic ---
    function saveCurrentMenu() {
      const name = state.currentMenu.startDate;
      const existingIdx = state.savedMenus.findIndex(m => m.startDate === name);

      if (existingIdx !== -1) {
        const choice = confirm(`日期 ${name} 的菜單已存在。\n點擊「確定」進行【取代】，點擊「取消」【另擇日期】。`);
        if (!choice) {
          promptNewMondayDate();
          return;
        } else {
          state.savedMenus[existingIdx] = JSON.parse(JSON.stringify(state.currentMenu));
        }
      } else {
        if (state.savedMenus.length >= 10) {
          alert('「我的菜單」最多只能儲存 10 張菜單，請先刪除舊菜單。');
          return;
        }
        state.savedMenus.unshift(JSON.parse(JSON.stringify(state.currentMenu)));
      }

      saveState();
      renderSavedMenus();
      alert('菜單儲存成功！');
    }

    function promptNewMondayDate() {
      const newDateStr = prompt('請輸入新的起始星期一日期 (YYYY-MM-DD):');
      if (!newDateStr) return;

      if (!isMonday(newDateStr)) {
        alert('只可以選擇星期一作起始日');
        promptNewMondayDate();
        return;
      }

      state.currentMenu.startDate = newDateStr;
      document.getElementById('menu-start-date').value = newDateStr;
      renderPlannerDays();
      saveCurrentMenu();
    }

    function renderSavedMenus() {
      const container = document.getElementById('saved-menus-list');
      document.getElementById('saved-count-tag').textContent = `${state.savedMenus.length} / 10`;
      container.innerHTML = '';

      if (state.savedMenus.length === 0) {
        container.innerHTML = '<p class="text-sm text-gray-400 italic text-center py-6">暫無已儲存的菜單</p>';
        return;
      }

      state.savedMenus.forEach((menu, idx) => {
        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex justify-between items-center';
        card.innerHTML = `
          <div>
            <h3 class="font-bold text-base">${menu.startDate}</h3>
            <p class="text-xs text-gray-400">星期一至星期日菜單</p>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="loadSavedMenu(${idx})" class="px-3 py-1.5 bg-brand-50 dark:bg-gray-700 text-brand-600 dark:text-blue-400 rounded-xl text-xs font-semibold hover:bg-brand-100">載入</button>
            <button onclick="deleteSavedMenu(${idx})" class="p-1.5 text-gray-400 hover:text-red-500 rounded-lg"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function loadSavedMenu(index) {
      state.currentMenu = JSON.parse(JSON.stringify(state.savedMenus[index]));
      document.getElementById('menu-start-date').value = state.currentMenu.startDate;
      renderPlannerDays();
      switchTab('planner');
    }

    function deleteSavedMenu(index) {
      if (confirm('確定要刪除這張菜單嗎？')) {
        state.savedMenus.splice(index, 1);
        saveState();
        renderSavedMenus();
      }
    }

    // --- Recipe Library Management ---
    function renderRecipeLibrary() {
      const container = document.getElementById('recipe-library-container');
      container.innerHTML = '';

      state.categories.forEach(cat => {
        const catRecipes = state.recipes.filter(r => r.category === cat);

        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-700 space-y-3';
        
        let recipeRows = catRecipes.map(r => `
          <div class="flex justify-between items-center bg-gray-50 dark:bg-gray-700/50 p-2.5 rounded-xl">
            <div>
              <span class="font-medium text-sm">${r.nameCn}</span>
              <span class="text-xs text-gray-400 block">${r.nameId}</span>
            </div>
            <div class="flex items-center space-x-3">
              ${r.lastCooked ? `<span class="text-[10px] text-gray-400 bg-gray-200 dark:bg-gray-600 px-2 py-0.5 rounded-md">上次: ${r.lastCooked}</span>` : ''}
              <button onclick="openRecipeModal('${r.id}')" class="text-gray-400 hover:text-brand-600"><i class="fa-solid fa-pen text-xs"></i></button>
              <button onclick="deleteRecipe('${r.id}')" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash-can text-xs"></i></button>
            </div>
          </div>
        `).join('');

        card.innerHTML = `
          <h3 class="font-bold text-sm text-gray-500 dark:text-gray-400 border-b border-gray-100 dark:border-gray-700 pb-2">${cat} (${catRecipes.length})</h3>
          <div class="space-y-2">
            ${recipeRows || '<p class="text-xs text-gray-400 italic">無菜式</p>'}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openRecipeModal(recipeId = null) {
      const modal = document.getElementById('recipe-modal');
      const title = document.getElementById('recipe-modal-title');
      const select = document.getElementById('recipe-cat-select');

      // Populate categories dropdown
      select.innerHTML = state.categories.map(c => `<option value="${c}">${c}</option>`).join('');

      if (recipeId) {
        const recipe = state.recipes.find(r => r.id === recipeId);
        title.textContent = '修改菜式';
        document.getElementById('edit-recipe-id').value = recipe.id;
        document.getElementById('recipe-cn-input').value = recipe.nameCn;
        document.getElementById('recipe-id-input').value = recipe.nameId;
        select.value = recipe.category;
      } else {
        title.textContent = '新增菜式';
        document.getElementById('edit-recipe-id').value = '';
        document.getElementById('recipe-cn-input').value = '';
        document.getElementById('recipe-id-input').value = '';
      }
      modal.classList.remove('hidden');
    }

    function closeRecipeModal() {
      document.getElementById('recipe-modal').classList.add('hidden');
    }

    function saveRecipe() {
      const id = document.getElementById('edit-recipe-id').value;
      const cn = document.getElementById('recipe-cn-input').value.trim();
      const idName = document.getElementById('recipe-id-input').value.trim();
      const cat = document.getElementById('recipe-cat-select').value;

      if (!cn) {
        alert('請輸入中文名稱');
        return;
      }

      if (id) {
        const r = state.recipes.find(item => item.id === id);
        r.nameCn = cn;
        r.nameId = idName;
        r.category = cat;
      } else {
        state.recipes.push({
          id: Date.now().toString(),
          nameCn: cn,
          nameId: idName,
          category: cat,
          lastCooked: ''
        });
      }

      saveState();
      renderRecipeLibrary();
      closeRecipeModal();
    }

    function deleteRecipe(id) {
      if (confirm('確定要刪除此菜式嗎？')) {
        state.recipes = state.recipes.filter(r => r.id !== id);
        saveState();
        renderRecipeLibrary();
      }
    }

    // --- Category Management & Drag & Drop ---
    function renderCategorySettings() {
      const container = document.getElementById('categories-drag-list');
      container.innerHTML = '';

      state.categories.forEach((cat, index) => {
        const li = document.createElement('li');
        li.className = 'flex justify-between items-center bg-gray-50 dark:bg-gray-700/60 p-2.5 rounded-xl text-sm';
        li.draggable = true;
        li.dataset.index = index;

        li.ondragstart = (e) => e.dataTransfer.setData('text/plain', index);
        li.ondragover = (e) => e.preventDefault();
        li.ondrop = (e) => {
          e.preventDefault();
          const fromIdx = e.dataTransfer.getData('text/plain');
          const toIdx = index;
          const moved = state.categories.splice(fromIdx, 1)[0];
          state.categories.splice(toIdx, 0, moved);
          saveState();
          renderCategorySettings();
          renderRecipeLibrary();
        };

        li.innerHTML = `
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-grip-vertical text-gray-400 cursor-move"></i>
            <span class="font-medium">${cat}</span>
          </div>
          ${cat !== '其他' ? `<button onclick="deleteCategory('${cat}')" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash-can text-xs"></i></button>` : '<span class="text-[10px] text-gray-400">預設</span>'}
        `;
        container.appendChild(li);
      });
    }

    function addNewCategoryPrompt() {
      const name = prompt('請輸入新分類名稱：');
      if (!name) return;
      if (state.categories.includes(name)) {
        alert('該分類已存在');
        return;
      }
      state.categories.push(name);
      saveState();
      renderCategorySettings();
      renderRecipeLibrary();
    }

    function deleteCategory(catName) {
      if (catName === '其他') {
        alert('不能刪除「其他」預設分類');
        return;
      }
      if (confirm(`確定要刪除「${catName}」分類嗎？刪除後，該分類下的所有菜式將會自動移至「其他」分類。`)) {
        state.categories = state.categories.filter(c => c !== catName);
        state.recipes.forEach(r => {
          if (r.category === catName) r.category = '其他';
        });
        saveState();
        renderCategorySettings();
        renderRecipeLibrary();
      }
    }

    // --- Settings & Avatar Crop ---
    function applySettings() {
      // Font size
      document.documentElement.style.setProperty('--app-font-size', state.settings.fontSize + 'px');
      document.getElementById('font-size-range').value = state.settings.fontSize;
      document.getElementById('font-size-label').textContent = state.settings.fontSize + 'px';

      // Theme
      if (state.settings.theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      // Avatar
      if (state.settings.avatar) {
        document.getElementById('header-avatar').src = state.settings.avatar;
        document.getElementById('header-avatar').classList.remove('hidden');
        document.getElementById('header-avatar-placeholder').classList.add('hidden');

        document.getElementById('settings-avatar-preview').src = state.settings.avatar;
        document.getElementById('settings-avatar-preview').classList.remove('hidden');
        document.getElementById('settings-avatar-placeholder').classList.add('hidden');
      }
    }

    function toggleTheme() {
      state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
      saveState();
      applySettings();
    }

    function updateFontSize(val) {
      state.settings.fontSize = val;
      saveState();
      applySettings();
    }

    let tempImageData = '';
    let cropScale = 1;

    function handleAvatarSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        tempImageData = evt.target.result;
        document.getElementById('crop-image').src = tempImageData;
        document.getElementById('crop-modal').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function updateCropTransform() {
      cropScale = document.getElementById('crop-zoom').value;
      document.getElementById('crop-image').style.transform = `scale(${cropScale})`;
    }

    function closeCropModal() {
      document.getElementById('crop-modal').classList.add('hidden');
    }

    function confirmCrop() {
      // Compress and save directly as data URL for local storage compatibility
      state.settings.avatar = tempImageData;
      saveState();
      applySettings();
      closeCropModal();
    }

    // --- Export PDF Functionality ---
    function exportPDF() {
      const template = document.getElementById('pdf-template');
      const dateRangeEl = document.getElementById('pdf-date-range');
      const listEl = document.getElementById('pdf-days-list');

      const startDate = state.currentMenu.startDate;
      const endDate = formatDateString(startDate, 6);
      dateRangeEl.textContent = `${startDate} ~ ${endDate}`;

      listEl.innerHTML = '';

      for (let i = 0; i < 7; i++) {
        const currentDate = formatDateString(startDate, i);
        const day = state.currentMenu.days[i];

        const dayBox = document.createElement('div');
        dayBox.className = 'border-2 border-gray-800 rounded-xl p-3 space-y-1';

        const recipesText = day.recipes.map(r => `• ${r.nameCn} / ${r.nameId}`).join('<br>') || '無特定菜樣';

        dayBox.innerHTML = `
          <div class="flex justify-between items-center font-bold text-lg border-b pb-1">
            <span>${WEEKDAYS_ZH[i]} (${currentDate})</span>
            <span class="text-base">🍽️ 用餐: ${day.dineIn || '-'} 人 | 🛍️ 外帶: ${day.takeOut || '-'} 人</span>
          </div>
          <div class="text-base pt-1 font-medium leading-relaxed">${recipesText}</div>
        `;
        listEl.appendChild(dayBox);
      }

      const opt = {
        margin:       0.5,
        filename:     `Weekly_Menu_${startDate}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(template).save();
    }
  </script>
</body>
</html>
