<!DOCTYPE html>
<html lang="zh-HK">
<head>

<title>每週菜單 - 暖木版完整版</title>
<style>
:root{--bg:#fdf3e7;--bg-wood:#f7e6d0;--card:#fff;--text:#3a2a1a;--muted:#a8917a;--primary:#c75c2c;--primary-dark:#a84a22;--primary-soft:#fbe8d9;--border:#f0dcc8;--shadow:0 12px 28px rgba(101,58,24,.14);--shadow-sm:0 4px 14px rgba(101,58,24,.08);--fs:18px}
.dark{--bg:#1a1510;--bg-wood:#231c14;--card:#2a2118;--text:#f5ece2;--border:#3a2e22;--muted:#9a8a7a;--shadow:none;--primary-soft:#3a2618}
*{box-sizing:border-box}html{font-size:var(--fs)}body{margin:0;background:linear-gradient(180deg,var(--bg) 0%, var(--bg-wood) 100%);color:var(--text);font-family:-apple-system,PingFang HK,Noto Sans TC,sans-serif;padding-bottom:110px;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#5e3816 0%, #a16a33 45%, #c78a5a 100%);color:#fff;padding:14px 18px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:14px;box-shadow:0 6px 22px rgba(80,40,10,.32)}
.avatar{width:60px;height:60px;border-radius:50%;border:3px solid rgba(255,255,255,.92);object-fit:cover;box-shadow:0 3px 10px rgba(0,0,0,.2);background:#fff}
.pages{max-width:520px;margin:0 auto;padding:12px 16px}
.page{display:none}.page.active{display:block;animation:fade .22s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:14px;margin:0 0 14px 0;box-shadow:var(--shadow-sm);overflow:hidden}
.row{display:flex;gap:10px;align-items:center}
.btn{padding:14px 22px;border-radius:16px;border:none;background:linear-gradient(180deg,var(--primary) 0%, var(--primary-dark) 100%);color:#fff;font-weight:900;font-size:1rem;box-shadow:0 6px 16px rgba(199,92,44,.3);cursor:pointer;transition:transform .1s}.btn:active{transform:scale(.97)}
.btn.full{width:100%;flex:1}
.ghost{flex:1;padding:13px;border-radius:16px;border:1.5px solid var(--border);background:var(--card);font-weight:800;color:var(--text)}
.iconBtn{width:48px;height:48px;border-radius:14px;border:1px solid var(--border);background:var(--card);font-size:22px;display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.catBox{aspect-ratio:1;border-radius:20px;border:1.5px solid rgba(255,255,255,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:10px;box-shadow:var(--shadow);transition:transform .12s}.catBox:active{transform:scale(.95)}
.weekWrap{display:flex;flex-direction:column;gap:12px}.weekRow{display:flex;gap:10px;justify-content:center}
.dayBox{width:32%;aspect-ratio:1;border-radius:20px;border:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:10px;box-shadow:var(--shadow-sm);transition:all .12s}.dayBox:active{transform:scale(.96)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0 calc(12px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -6px 22px rgba(60,30,10,.08)}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:800;cursor:pointer}
.ic{font-size:28px!important;line-height:1!important;display:block}.nav.active{color:var(--primary)!important}
.modal{position:fixed;inset:0;background:rgba(60,30,10,.48);backdrop-filter:blur(7px);display:none;z-index:9999;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}
.sheet{width:100%;max-width:500px;max-height:86vh;overflow:auto;background:var(--card);border-radius:26px;border:1px solid var(--border);box-shadow:0 24px 60px rgba(0,0,0,.28)}
.head{position:sticky;top:0;background:var(--card);padding:18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--bg);display:grid;place-items:center;font-size:18px;cursor:pointer}
.dishRow{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px dashed var(--border);gap:10px}
.act{display:flex;gap:6px}.act button{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--bg);font-size:18px}
select,textarea,input[type=text],input[type=date]{width:100%;padding:16px;border-radius:14px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem;box-sizing:border-box}
#pdfWrap{position:fixed;inset:0;background:#1c1510;display:none;flex-direction:column;z-index:10000}#pdfWrap.open{display:flex}
.pdfTool{position:sticky;top:0;background:#fff9f0;padding:12px;display:flex;gap:12px;border-bottom:1px solid var(--border);z-index:2}
.pdfView{flex:1;overflow:auto;background:#2b2118;padding:16px;display:flex;justify-content:center}
.pdfPage{width:100%;max-width:800px;background:#fff;margin:0 auto;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.pdfInner{padding:15mm 15mm 25mm 15mm!important;background:#fff;color:#000;box-sizing:border-box;font-size:16pt;line-height:1.5}
.topRowFixed{display:flex;gap:8px;align-items:center;width:100%;box-sizing:border-box}
.topRowFixed input{flex:1 1 0;min-width:0;width:0;text-align:center;font-weight:800;background:var(--primary-soft);border-radius:16px;padding:12px 6px;border:1.5px solid var(--border);box-sizing:border-box;font-size:1rem}
</style>
</head>
<body>
<div class="top"><img id="avatarTop" class="avatar" src="icon.png"><div><b>每週菜單</b><div style="font-size:.85rem;opacity:.9">Menu Mingguan • 暖木版</div></div></div>
<div class="pages">
<div id="p-weekly" class="page active"><div class="card"><div class="row"><input type="date" id="monPicker" style="flex:1;padding:12px 10px;border-radius:14px;border:1.5px solid var(--border);background:var(--primary-soft);font-weight:800;text-align:center"><button class="iconBtn" onclick="saveWeekly()">💾</button><button class="iconBtn" onclick="exportWeeklyPDF()">📄</button></div></div><div id="weeklyGrid" class="weekWrap"></div></div>
<div id="p-library" class="page"><div class="card row"><button class="ghost" onclick="exportLib()">匯出</button><button class="ghost" onclick="document.getElementById('impFile').click()">匯入</button><button class="btn full" onclick="openAdd()">新增菜式</button><input type="file" id="impFile" accept=".json" style="display:none"></div><div id="catGrid" class="grid3"></div></div>
<div id="p-mymenus" class="page"><div class="card row"><button class="ghost" onclick="toggleMy(true)">一鍵打開全部</button><button class="ghost" onclick="toggleMy(false)">一鍵關閉全部</button></div><div id="myList"></div></div>
<div id="p-settings" class="page"><div class="card"><h3>分類排序</h3><div id="catOrder"></div><div class="row" style="margin-top:12px"><input id="newCat" placeholder="新分類名稱" style="flex:1;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border)"><button class="btn" onclick="addCat()" style="min-width:90px">新增</button></div></div><div class="card"><h3>外觀</h3><div class="row"><span>深淺色</span><button class="ghost" onclick="toggleTheme()">切換</button></div><div style="margin-top:12px"><label>字體大小 <span id="fsVal">18</span>px</label><input type="range" id="fsRange" min="14" max="26" value="18" oninput="setFS(this.value)" style="width:100%"></div></div></div>
</div>
<div class="bottom">
<div class="nav active" onclick="go('weekly',this)"><span class="ic">📅</span>每週</div>
<div class="nav" onclick="go('library',this)"><span class="ic">📚</span>菜式庫</div>
<div class="nav" onclick="go('mymenus',this)"><span class="ic">🗂️</span>我的菜單</div>
<div class="nav" onclick="go('settings',this)"><span class="ic">⚙️</span>設定</div>
</div>
<div class="modal" id="mCat"><div class="sheet"><div class="head"><b id="mCatTitle">分類</b><div class="x" onclick="closeM('mCat')">✕</div></div><div id="mCatBody"></div></div></div>
<div class="modal" id="mNote"><div class="sheet"><div class="head"><b>備註</b><div class="x" onclick="closeM('mNote')">✕</div></div><div id="mNoteBody" style="padding:16px;white-space:pre-wrap"></div></div></div>
<div class="modal" id="mWeek"><div class="sheet"><div class="head"><b id="mWeekTitle">日期</b><div class="x" onclick="closeM('mWeek')">✕</div></div><div style="padding:14px"><div class="row"><label>用餐</label><select id="diners"></select><label>外帶</label><select id="takeaway"></select></div><div id="selDishes" style="margin-top:12px"></div><button class="btn full" style="margin-top:12px" onclick="openPickCat()">選擇菜式</button></div></div></div>
<div class="modal" id="mPickCat"><div class="sheet"><div class="head"><b>分類</b><div class="x" onclick="closeM('mPickCat')">✕</div></div><div id="mPickCatBody" class="grid3" style="padding:12px"></div></div></div>
<div class="modal" id="mPickDish"><div class="sheet"><div class="head"><b>菜式</b><div class="x" onclick="closeM('mPickDish')">✕</div></div><div id="mPickDishBody"></div></div></div>
<div class="modal" id="mAdd"><div class="sheet"><div class="head"><b>新增/修改菜式</b><div class="x" onclick="closeM('mAdd')">✕</div></div><div style="padding:14px"><input id="fName" placeholder="中文菜名"><input id="fIndo" placeholder="印尼文菜名" style="margin-top:12px"><textarea id="fNote" placeholder="備註 + 烹調方法" style="margin-top:12px;height:120px"></textarea><select id="fCat" style="margin-top:12px"></select><input type="hidden" id="fId"><button class="btn full" style="margin-top:12px" onclick="saveDish()">儲存</button></div></div></div>
<div class="modal" id="mAnyDate"><div class="sheet"><div class="head"><b>加入到哪一天？</b><div class="x" onclick="closeM('mAnyDate')">✕</div></div><div style="padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center"><input type="date" id="anyDate" style="width:92%;height:56px;border-radius:16px;text-align:center;font-weight:800"><button class="btn full" onclick="confirmAddToWeek()" style="width:92%;height:56px">確認加入</button></div></div></div>
<div id="pdfWrap"><div class="pdfTool"><button class="btn" id="btnClosePdf">✕</button><button class="ghost" id="btnSharePdf">📤</button></div><div class="pdfView"><div class="pdfPage"><div class="pdfInner" id="pdfContent"></div></div></div></div>
<script>
const CAT_META={"雞":{bg:"#",e:"🐔"},"牛":{bg:"#",e:"🐮"},"豬":{bg:"#",e:"🐷"},"魚":{bg:"#",e:"🐟"},"蔬菜":{bg:"#",e:"🥬"},"湯水":{bg:"#",e:"🍲"},"西式":{bg:"#",e:"🍔"},"罐頭":{bg:"#",e:"🥫"},"其他":{bg:"#",e:"🍱"}};
let cats=JSON.parse(localStorage.getItem('cats')||'null')||Object.keys(CAT_META);

let weeklyMenus=JSON.parse(localStorage.getItem('weeklyMenus')||'[]');
let current={mon:null,days:[]}, lastCook=JSON.parse(localStorage.getItem('lastCook')||'{}'), editDay=null, pendDish=null;
const cn=["一","二","三","四","五","六","日"], dayEmo=["🌅","🌤️","🌞","🌇","🌙","⭐","🎉"];

function getMon(d){let dt=new Date(d);let day=dt.getDay();let diff=dt.getDate()-day+(day==0?-6:1);return new Date(dt.setDate(diff));}
function fmt(d){if(typeof d==='string') return d; return ${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')};}
function openM(id){document.getElementById(id).classList.add('open');}function closeM(id){document.getElementById(id).classList.remove('open');}
function makeDefaults(){
 if(dishes.length) return;
 const D={

 "蔬菜":[["蒜蓉炒菜心","Tumis Choy Sum Bawang Putih","菜心切段，大火爆蒜蓉，下菜心快炒加鹽水。"],["上湯浸娃娃菜","Wanshui Kukus Kuah Kaldu","娃娃菜切半，加皮蛋鹹蛋碎杞子雞湯煮軟。"],["蠔油生菜","Selada Saus Tiram","生菜燙熟，淋蠔油生抽糖蒜油醬汁。"],["炒椰菜","Tumis Kubis","椰菜切絲快炒，加鹽糖炒軟。"],["番茄炒蛋","Telur Tumis Tomat","雞蛋炒滑蛋備用，番茄炒出汁，加雞蛋糖鹽翻炒。"],["苦瓜炒蛋","Telur Tumis Pare","苦瓜汆水，加入蛋液煎熟。"],["椒絲腐乳通菜","Kangkung Tumis Tau Fu Fa","通菜切段，加腐乳紅椒絲蒜蓉大火快炒。"],["菜脯煎蛋","Dadar Telur Lobak Asin","菜脯炒香，加入蛋液煎金黃。"],["蝦米炒椰菜花","Tumis Kembang Kol Udang Kering","椰菜花汆水，與蝦米蒜頭翻炒加水燜熟。"],["涼瓜排骨湯","Sup Pare Iga Babi","苦瓜排骨黃豆薑片，大火滾小火燉1小時。"]],
 "湯水":[["蘿蔔排骨湯","Sup Lobak Iga","白蘿蔔排骨薑片燉1小時。"],["冬瓜薏米湯","Sup Labu Air Barli","冬瓜薏米排骨陳皮燉。"],["節瓜鹹蛋湯","Sup Labu Air Telur Asin","節瓜鹹蛋瘦肉煮。"],["紫菜蛋花湯","Sup Rumput Laut Telur","紫菜蛋花加少許鹽。"],["番茄薯仔湯","Sup Tomat Kentang","番茄薯仔洋蔥瘦肉湯。"]],
 "西式":[["香草烤雞翼","Sayap Ayam Panggang Herbal","雞翼香草鹽黑椒烤。"],["芝士焗意粉","Pasta Panggang Keju","意粉芝士焗。"],["黑椒豬扒","Pork Chop Lada Hitam","豬扒黑椒汁。"]],
 "罐頭":[["茄汁焗豆","Kacang Panggang Saus Tomat","茄汁豆加熱。"],["午餐肉煎蛋","Telur Dadar Luncheon Meat","午餐肉切片煎蛋。"]],
 "其他":[["白飯","Nasi Putih","白飯。"],["炒米粉","Bihun Goreng","米粉炒。"]]
 };
 Object.entries(D).forEach(([cat,arr])=>{arr.forEach(([n,i,t])=>{dishes.push({id:Date.now()+Math.random(),name:n,indo:i,note:t,cat});});});
 localStorage.setItem('dishes',JSON.stringify(dishes));
}
function init(){let mon=getMon(new Date());document.getElementById('monPicker').valueAsDate=mon;onMon(mon);renderCats();renderWeek();renderMy();renderCatOrder();loadAll();let sel=document.getElementById('diners');sel.innerHTML=[...Array(10).keys()].map(n=>`<option value="${n}">${n}</option>`).join('');document.getElementById('takeaway').innerHTML=sel.innerHTML;document.getElementById('monPicker').addEventListener('change',e=>{let d=e.target.valueAsDate;if(!d)return;if(d.getDay()!==1){alert('只可以星期一');let m=getMon(d);e.target.valueAsDate=m;d=m;}onMon(d);});}
function onMon(d){current.mon=d;current.days=[];for(let i=0;i<7;i++){let day=new Date(d);day.setDate(d.getDate()+i);current.days.push({date:day,dishes:[],diners:0,takeaway:0});}renderWeek();}
function loadAll(){let th=localStorage.getItem('theme');if(th==='dark') document.body.classList.add('dark');let fs=localStorage.getItem('fs');if(fs){document.getElementById('fsRange').value=fs;setFS(fs);}}
function renderCats(){let g=document.getElementById('catGrid');g.innerHTML='';document.getElementById('fCat').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');cats.forEach(cat=>{let meta=CAT_META[cat]||{bg:'#eee',e:'🍱'};let cnt=dishes.filter(d=>d.cat===cat).length;g.innerHTML+=`<div class="catBox" style="background:${meta.bg}" onclick="openCat('${cat}')"><div style="font-size:56px;line-height:1">${meta.e}</div><div style="margin-top:6px;font-weight:900">${cat} (${cnt})</div></div>`;});}
function openCat(cat){document.getElementById('mCatTitle').innerText=cat;let list=dishes.filter(d=>d.cat===cat);document.getElementById('mCatBody').innerHTML=list.map(d=>`<div class="dishRow"><div style="flex:1;cursor:pointer" onclick="showNote(${d.id})"><b>${d.name}</b><div style="font-size:.9rem;color:var(--muted)">${d.indo||''}</div></div><div class="act"><button onclick="openAnyDate(${d.id})">📅</button><button onclick="editDish(${d.id})">✏️</button><button onclick="delDish(${d.id})">🗑️</button></div></div>`).join('')||'<div style="padding:20px">暫無</div>';openM('mCat');}
function showNote(id){let d=dishes.find(x=>x.id==id);if(!d) return;document.getElementById('mNoteBody').innerText=`${d.name} / ${d.indo||''}\n\n${d.note||''}`;openM('mNote');}
function openAnyDate(id){pendDish=id;document.getElementById('anyDate').valueAsDate=new Date();openM('mAnyDate');}
function confirmAddToWeek(){let v=document.getElementById('anyDate').value;if(!v) return;let date=new Date(v);let mon=getMon(date);if(fmt(mon)!==fmt(current.mon)){alert('請先選包含此日的星期一');return;}let idx=Math.round((date-current.mon)/86400000);if(idx<0||idx>6) return;let d=dishes.find(x=>x.id==pendDish);current.days[idx].dishes.push({...d});lastCook[d.id]=fmt(date);localStorage.setItem('lastCook',JSON.stringify(lastCook));renderWeek();closeM('mAnyDate');}
function openAdd(){document.getElementById('fId').value='';document.getElementById('fName').value='';document.getElementById('fIndo').value='';document.getElementById('fNote').value='';openM('mAdd');}
function editDish(id){let d=dishes.find(x=>x.id==id);openAdd();document.getElementById('fId').value=d.id;document.getElementById('fName').value=d.name;document.getElementById('fIndo').value=d.indo||'';document.getElementById('fNote').value=d.note||'';document.getElementById('fCat').value=d.cat;}
function saveDish(){let id=document.getElementById('fId').value,n=document.getElementById('fName').value.trim(),i=document.getElementById('fIndo').value.trim(),t=document.getElementById('fNote').value.trim(),c=document.getElementById('fCat').value;if(!n) return alert('中文必填');if(id){let d=dishes.find(x=>x.id==id);d.name=n;d.indo=i;d.note=t;d.cat=c;} else dishes.push({id:Date.now()+Math.random(),name:n,indo:i,note:t,cat:c});localStorage.setItem('dishes',JSON.stringify(dishes));renderCats();closeM('mAdd');}
function delDish(id){if(!confirm('刪除?')) return;dishes=dishes.filter(x=>x.id!=id);localStorage.setItem('dishes',JSON.stringify(dishes));renderCats();openCat(document.getElementById('mCatTitle').innerText);}
function renderWeek(){let wrap=document.getElementById('weeklyGrid');wrap.innerHTML='';let rows=[[0,1],[2,3],[4,5,6]];rows.forEach(r=>{let row=document.createElement('div');row.className='weekRow';r.forEach(idx=>{let day=current.days[idx];if(!day) return;let div=document.createElement('div');div.className='dayBox';div.innerHTML=`<div style="font-size:28px">${dayEmo[idx]}</div><div style="font-size:.9rem;font-weight:800;margin-top:4px">星期${cn[idx]}<br>${fmt(day.date).slice(5)}<br><span style="color:var(--primary)">${day.dishes.length}道</span></div>`;div.onclick=()=>openWeek(idx);row.appendChild(div);});wrap.appendChild(row);});}
function openWeek(idx){editDay=idx;let day=current.days[idx];document.getElementById('mWeekTitle').innerText=`${fmt(day.date)} 星期${cn[idx]}`;document.getElementById('diners').value=day.diners;document.getElementById('takeaway').value=day.takeaway;document.getElementById('diners').onchange=e=>day.diners=+e.target.value;document.getElementById('takeaway').onchange=e=>day.takeaway=+e.target.value;document.getElementById('selDishes').innerHTML=day.dishes.map((d,i)=>`<div class="dishRow"><span style="flex:1"><b>${d.name}</b> ${d.indo?'<span style="font-size:.9rem;color:var(--muted)"> '+d.indo+'</span>':''}</span><button class="ghost" style="width:auto" onclick="remDay(${idx},${i})">✕</button></div>`).join('')||'<div style="color:var(--muted)">尚未選擇</div>';openM('mWeek');}
function remDay(a,b){if(!confirm('確定刪除？')) return;current.days[a].dishes.splice(b,1);openWeek(a);renderWeek();}
function openPickCat(){let b=document.getElementById('mPickCatBody');b.innerHTML='';cats.forEach(cat=>{let m=CAT_META[cat]||{bg:'#eee',e:'🍱'};let cnt=dishes.filter(d=>d.cat===cat).length;b.innerHTML+=`<div class="catBox" style="background:${m.bg}" onclick="openPickDish('${cat}')"><div style="font-size:48px">${m.e}</div><div style="font-weight:800;margin-top:4px">${cat} (${cnt})</div></div>`;});openM('mPickCat');}
function openPickDish(cat){let list=dishes.filter(d=>d.cat===cat);document.getElementById('mPickDishBody').innerHTML=list.map(d=>`<div class="dishRow"><span style="flex:1"><b>${d.name}</b> ${d.indo?'<div style="font-size:.9rem">'+d.indo+'</div>':''}</span><button class="btn" style="width:auto" onclick="pickToWeek(${d.id})">加入</button></div>`).join('');openM('mPickDish');}
function pickToWeek(id){let d=dishes.find(x=>x.id==id);if(!confirm(`確定加入「${d.name}」？`)) return;current.days[editDay].dishes.push({...d});lastCook[id]=fmt(current.days[editDay].date);localStorage.setItem('lastCook',JSON.stringify(lastCook));openWeek(editDay);renderWeek();}
function saveWeekly(){if(!current.mon) return;let fname=fmt(current.mon);let ex=weeklyMenus.findIndex(m=>m.monday===fname);if(ex>=0){if(!confirm(`菜單 ${fname} 已存在，取代？`)) return;weeklyMenus.splice(ex,1);}let toSave={monday:fname,days:current.days.map(d=>({date:fmt(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway}))};weeklyMenus.push(toSave);if(weeklyMenus.length>10) weeklyMenus.shift();localStorage.setItem('weeklyMenus',JSON.stringify(weeklyMenus));renderMy();alert('已儲存 '+fname);}
function renderMy(){let box=document.getElementById('myList');box.innerHTML=weeklyMenus.map((m,i)=>`<div class="card"><div class="head" style="cursor:pointer"><b>${m.monday} 星期一</b><span>▼</span></div><div class="myBody" style="display:none">${m.days.map((d,di)=>`<div style="border-top:1px dashed var(--border);padding:8px 0"><b>星期${cn[di]} ${d.date} 用餐:${d.diners} 外帶:${d.takeaway}</b>${d.dishes.map(dd=>`<div>${dd.name} / ${dd.indo||''}</div>`).join('')}</div>`).join('')}</div></div>`).join('')||'<div class="card">暫無菜單</div>';box.querySelectorAll('.head').forEach(h=>{h.onclick=()=>{let b=h.nextElementSibling;b.style.display=b.style.display==='none'?'block':'none';};});}
function toggleMy(open){document.querySelectorAll('.myBody').forEach(b=>b.style.display=open?'block':'none');}
function exportLib(){let blob=new Blob([JSON.stringify(dishes)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='dishes.json';a.click();}
function setFS(v){document.documentElement.style.setProperty('--fs',v+'px');document.getElementById('fsVal').innerText=v;localStorage.setItem('fs',v);}
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light');}
function renderCatOrder(){let box=document.getElementById('catOrder');box.innerHTML=cats.map((c,i)=>`<div class="row" style="margin-bottom:6px"><span style="flex:1">${c}</span><button class="ghost" style="flex:0 0 40px" onclick="moveCat(${i},-1)">↑</button><button class="ghost" style="flex:0 0 40px" onclick="moveCat(${i},1)">↓</button></div>`).join('');}
function moveCat(i,d){let j=i+d;if(j<0||j>=cats.length) return;let t=cats[i];cats[i]=cats[j];cats[j]=t;localStorage.setItem('cats',JSON.stringify(cats));renderCats();renderCatOrder();}
function addCat(){let v=document.getElementById('newCat').value.trim();if(!v) return;if(cats.includes(v)) return alert('已存在');cats.push(v);CAT_META[v]={bg:'#ffe8a0',e:'🍱'};localStorage.setItem('cats',JSON.stringify(cats));document.getElementById('newCat').value='';renderCats();renderCatOrder();}
window.addEventListener('load',()=>{let mon=getMon(new Date());document.getElementById('monPicker').valueAsDate=mon;onMon(mon);renderCats();renderWeek();renderMy();renderCatOrder();loadAll();let sel=document.getElementById('diners');sel.innerHTML=[...Array(10).keys()].map(n=>`<option value="${n}">${n}</option>`).join('');document.getElementById('takeaway').innerHTML=sel.innerHTML;document.getElementById('monPicker').addEventListener('change',e=>{let d=e.target.valueAsDate;if(!d)return;if(d.getDay()!==1){alert('只可以星期一');let m=getMon(d);e.target.valueAsDate=m;d=m;}onMon(d);});document.getElementById('impFile').addEventListener('change',e=>{let f=e.target.files[0];if(!f) return;let r=new FileReader();r.onload=()=>{try{dishes=JSON.parse(r.result);localStorage.setItem('dishes',JSON.stringify(dishes));renderCats();}catch(err){alert('格式錯誤');}};r.readAsText(f);});});
function onMon(d){current.mon=d;current.days=[];for(let i=0;i<7;i++){let day=new Date(d);day.setDate(d.getDate()+i);current.days.push({date:day,dishes:[],diners:0,takeaway:0});}renderWeek();}
function loadAll(){let th=localStorage.getItem('theme');if(th==='dark') document.body.classList.add('dark');let fs=localStorage.getItem('fs');if(fs){document.getElementById('fsRange').value=fs;setFS(fs);}}
function exportWeeklyPDF(){alert('PDF匯出用原版功能，暖木版先睇樣板');}
</script>
</body>
