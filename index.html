<!DOCTYPE html>
<html lang="zh-HK" x-data="appData()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>每週菜單</title>

    <!-- PWA / iOS 設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="每週菜單">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="manifest" href="data:application/json,{"name":"每週菜單","short_name":"每週菜單","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#4f46e5"}">

    <!-- Tailwind CSS & Alpine.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#4f46e5' }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- 第三方套件：PDF 匯出、拖拉排序、圖片裁切、FontAwesome 圖示 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        /* 針對 iPhone 18 Pro Max 最佳化與 Safe Area */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-tap-highlight-color: transparent;
        }
        /* 可動態調校字體大小 */
        .dynamic-text-sm { font-size: calc(0.875rem * var(--font-scale, 1)); }
        .dynamic-text-base { font-size: calc(1rem * var(--font-scale, 1)); }
        .dynamic-text-lg { font-size: calc(1.125rem * var(--font-scale, 1)); }
        .dynamic-text-xl { font-size: calc(1.25rem * var(--font-scale, 1)); }

        /* A4 PDF 專用列印樣式 */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .pdf-page {
            width: 210mm;
            min-height: 297mm;
            padding: 15mm;
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col justify-between" :style="'--font-scale:' + fontSizeScale">

    <!-- 頂部導覽列 Header -->
    <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-20 px-4 py-3 flex justify-between items-center border-b border-gray-200 dark:border-gray-700">
        <div class="flex items-center space-x-3">
            <!-- 頭像 display (需求 4) -->
            <img :src="avatar || 'https://via.placeholder.com/150'" class="w-10 h-10 rounded-full object-cover border-2 border-indigo-500 shadow-sm" alt="頭像">
            <h1 class="font-bold dynamic-text-xl text-indigo-600 dark:text-indigo-400">每週菜單</h1>
        </div>
        <div class="flex space-x-2">
            <!-- 頂部快捷切換頁面 -->
            <button @click="currentTab = 'planner'" :class="currentTab === 'planner' ? 'bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600' : 'text-gray-500'" class="p-2 rounded-lg"><i class="fa-solid fa-calendar-week text-xl"></i></button>
            <button @click="currentTab = 'dishes'" :class="currentTab === 'dishes' ? 'bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600' : 'text-gray-500'" class="p-2 rounded-lg"><i class="fa-solid fa-utensils text-xl"></i></button>
            <button @click="currentTab = 'myMenus'" :class="currentTab === 'myMenus' ? 'bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600' : 'text-gray-500'" class="p-2 rounded-lg"><i class="fa-solid fa-folder-open text-xl"></i></button>
            <button @click="currentTab = 'settings'" :class="currentTab === 'settings' ? 'bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600' : 'text-gray-500'" class="p-2 rounded-lg"><i class="fa-solid fa-gear text-xl"></i></button>
        </div>
    </header>

    <!-- 主要內容區域 -->
    <main class="flex-1 overflow-y-auto p-4 max-w-md mx-auto w-full pb-24">

        <!-- ==================== 頁面 1: 每週菜單編輯器 (Planner) ==================== -->
        <section x-show="currentTab === 'planner'" class="space-y-4">
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm space-y-3">
                <div class="flex justify-between items-center">
                    <label class="font-bold dynamic-text-base">選擇起始星期一：</label>
                    <!-- 儲存按鈕 (圖示) (需求 18) -->
                    <button @click="saveCurrentMenu()" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 rounded-xl shadow-md transition flex items-center justify-center">
                        <i class="fa-solid fa-floppy-disk text-lg"></i>
                    </button>
                </div>
                <!-- 星期一日期選擇器 (需求 12, 13) -->
                <input type="date" x-model="selectedStartDate" @change="validateStartDate()" class="w-full p-2.5 border rounded-xl dark:bg-gray-700 dark:border-gray-600 dynamic-text-base">
            </div>

            <!-- 7天列表 (需求 12, 14, 15, 21) -->
            <template x-for="(day, index) in currentWeekDays" :key="index">
                <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-3">
                    <div class="flex justify-between items-center border-b pb-2 dark:border-gray-700">
                        <span class="font-bold text-indigo-600 dark:text-indigo-400 dynamic-text-lg" x-text="day.dayName + ' (' + day.dateStr + ')'"></span>
                        <button @click="openDishPicker(index)" class="text-xs bg-indigo-50 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-300 px-3 py-1.5 rounded-lg font-semibold">
                            <i class="fa-solid fa-plus mr-1"></i>擇菜式
                        </button>
                    </div>

                    <!-- 人數設定：用餐與外帶 (需求 14) -->
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="flex items-center space-x-1">
                            <span class="text-gray-500">用餐:</span>
                            <select x-model="day.dineIn" class="border rounded px-1 py-0.5 dark:bg-gray-700">
                                <option value="">未設</option>
                                <template x-for="n in 10"><option :value="n-1" x-text="n-1"></option></template>
                            </select>
                            <span class="text-gray-500">人</span>
                        </div>
                        <div class="flex items-center space-x-1">
                            <span class="text-gray-500">外帶:</span>
                            <select x-model="day.takeout" class="border rounded px-1 py-0.5 dark:bg-gray-700">
                                <option value="">未設</option>
                                <template x-for="n in 10"><option :value="n-1" x-text="n-1"></option></template>
                            </select>
                            <span class="text-gray-500">人</span>
                        </div>
                    </div>

                    <!-- 已選菜式 (需求 21: 分行顯示) -->
                    <div class="space-y-1.5 pt-1">
                        <template x-for="(dish, dIdx) in day.dishes" :key="dIdx">
                            <div class="flex justify-between items-center bg-gray-50 dark:bg-gray-700/50 p-2 rounded-lg">
                                <div>
                                    <div class="font-medium dynamic-text-base" x-text="dish.name"></div>
                                    <div class="text-xs text-gray-400 italic" x-text="dish.indonesian"></div>
                                </div>
                                <button @click="removeDishFromDay(index, dIdx)" class="text-red-400 hover:text-red-600 px-2"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        </template>
                        <div x-show="day.dishes.length === 0" class="text-xs text-gray-400 italic">尚未選擇菜式</div>
                    </div>
                </div>
            </template>
        </section>

        <!-- ==================== 頁面 2: 菜式庫管理 (Dishes) ==================== -->
        <section x-show="currentTab === 'dishes'" class="space-y-4">
            <!-- 新增菜式區塊 (需求 6, 7) -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm space-y-3">
                <h3 class="font-bold dynamic-text-base"><i class="fa-solid fa-plus-circle text-indigo-500 mr-2"></i>新增菜式</h3>
                <input type="text" x-model="newDish.name" placeholder="中文菜式名稱" class="w-full p-2.5 border rounded-xl dark:bg-gray-700 dark:border-gray-600 dynamic-text-base">
                <input type="text" x-model="newDish.indonesian" placeholder="印尼文 (Nama Masakan)" class="w-full p-2.5 border rounded-xl dark:bg-gray-700 dark:border-gray-600 dynamic-text-base">
                <select x-model="newDish.category" class="w-full p-2.5 border rounded-xl dark:bg-gray-700 dark:border-gray-600 dynamic-text-base">
                    <template x-for="cat in categories" :key="cat"><option :value="cat" x-text="cat"></option></template>
                </select>
                <button @click="addDish()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold dynamic-text-base shadow-sm">新增至菜式庫</button>
            </div>

            <!-- 菜式列表 (依分類展開) (需求 5, 6, 11) -->
            <div class="space-y-3">
                <template x-for="cat in categories" :key="cat">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm overflow-hidden">
                        <div class="bg-indigo-50/50 dark:bg-gray-700/50 p-3 font-bold text-indigo-700 dark:text-indigo-300 dynamic-text-base flex justify-between" x-text="cat"></div>
                        <div class="divide-y divide-gray-100 dark:divide-gray-700 p-2">
                            <template x-for="dish in dishes.filter(d => d.category === cat)" :key="dish.id">
                                <div class="p-2 flex justify-between items-center">
                                    <div>
                                        <div class="font-medium dynamic-text-base" x-text="dish.name"></div>
                                        <div class="text-xs text-gray-400" x-text="dish.indonesian || '無印尼文'"></div>
                                        <div class="text-[10px] text-indigo-500" x-text="dish.lastCooked ? '上做: ' + dish.lastCooked : '未會烹飪'"></div>
                                    </div>
                                    <div class="flex space-x-2">
                                        <!-- 修改/重新分類 -->
                                        <button @click="editDish(dish)" class="text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-pen"></i></button>
                                        <button @click="deleteDish(dish.id)" class="text-gray-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </section>

        <!-- ==================== 頁面 3: 我的菜單 (My Menus) ==================== -->
        <section x-show="currentTab === 'myMenus'" class="space-y-4">
            <h2 class="font-bold dynamic-text-lg">已儲存菜單 (最多10張) (需求 16, 20)</h2>
            <div class="space-y-3">
                <template x-for="(menu, mIdx) in savedMenus" :key="mIdx">
                    <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm flex justify-between items-center">
                        <div>
                            <div class="font-bold dynamic-text-base text-indigo-600 dark:text-indigo-400" x-text="'菜單：' + menu.startDate"></div>
                            <div class="text-xs text-gray-400" x-text="'包含 ' + menu.days.reduce((acc, d) => acc + d.dishes.length, 0) + ' 道菜'"></div>
                        </div>
                        <div class="flex space-x-2">
                            <!-- 載入修改 (需求 19) -->
                            <button @click="loadMenuToEdit(mIdx)" class="bg-indigo-50 dark:bg-indigo-900/50 text-indigo-600 p-2 rounded-xl"><i class="fa-solid fa-pen-to-square"></i></button>
                            <!-- 匯出 PDF 按鍵 (圖示) (需求 22, 23, 24) -->
                            <button @click="exportMenuPDF(menu)" class="bg-green-50 dark:bg-green-900/50 text-green-600 p-2 rounded-xl"><i class="fa-solid fa-file-pdf"></i></button>
                            <!-- 刪除菜單 (需求 19) -->
                            <button @click="deleteMenu(mIdx)" class="bg-red-50 dark:bg-red-900/50 text-red-600 p-2 rounded-xl"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                </template>
                <div x-show="savedMenus.length === 0" class="text-center text-gray-400 py-8">暫無儲存的每週菜單</div>
            </div>
        </section>

        <!-- ==================== 頁面 4: 設定 (Settings) ==================== -->
        <section x-show="currentTab === 'settings'" class="space-y-5">
            <!-- 頭像自訂 (需求 29) -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm space-y-3">
                <h3 class="font-bold dynamic-text-base">自訂頭像</h3>
                <input type="file" id="avatarInput" accept="image/*" @change="initCropper($event)" class="text-xs">
                <div x-show="cropperInstance" class="mt-2">
                    <div class="max-h-64 overflow-hidden rounded-xl">
                        <img id="cropperImage" class="max-w-full">
                    </div>
                    <button @click="cropAvatar()" class="mt-2 bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold">裁切並儲存頭像</button>
                </div>
            </div>

            <!-- 分類管理與拖動排序 (需求 25, 26, 27) -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm space-y-3">
                <h3 class="font-bold dynamic-text-base">分類管理 (可拖動排序)</h3>
                <div class="flex space-x-2">
                    <input type="text" x-model="newCatName" placeholder="新增分類名稱" class="flex-1 p-2 border rounded-xl dark:bg-gray-700 text-xs">
                    <button @click="addCategory()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold text-xs">新增</button>
                </div>
                <!-- Sortable.js 清單 -->
                <ul id="sortableCategories" class="space-y-2 pt-2">
                    <template x-for="(cat, cIdx) in categories" :key="cat">
                        <li class="flex justify-between items-center bg-gray-50 dark:bg-gray-700 p-2.5 rounded-xl border border-gray-100 dark:border-gray-600">
                            <span class="flex items-center space-x-2">
                                <i class="fa-solid fa-grip-vertical text-gray-400 cursor-move handle"></i>
                                <span class="dynamic-text-base font-medium" x-text="cat"></span>
                            </span>
                            <button x-show="cat !== '其他'" @click="removeCategory(cat)" class="text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button>
                        </li>
                    </template>
                </ul>
            </div>

            <!-- 外觀與顯示 settings (需求 28, 30) -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm space-y-4">
                <div class="flex justify-between items-center">
                    <span class="font-bold dynamic-text-base">深色模式 (Dark Mode)</span>
                    <button @click="darkMode = !darkMode" class="p-2 bg-gray-100 dark:bg-gray-700 rounded-xl text-lg">
                        <i x-show="!darkMode" class="fa-solid fa-moon"></i>
                        <i x-show="darkMode" class="fa-solid fa-sun text-yellow-400"></i>
                    </button>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between font-bold dynamic-text-base">
                        <span>字體大小調整</span>
                        <span x-text="Math.round(fontSizeScale * 100) + '%'"></span>
                    </div>
                    <input type="range" min="0.8" max="1.3" step="0.05" x-model="fontSizeScale" class="w-full">
                </div>
            </div>
        </section>
    </main>

    <!-- ==================== 一點即選 菜式選擇彈窗 Modal (需求 9, 10) ==================== -->
    <div x-show="showPickerModal" class="fixed inset-0 z-50 bg-black/60 flex items-end justify-center" x-cloak>
        <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-t-3xl p-5 max-h-[80vh] flex flex-col space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-2 dark:border-gray-700">
                <h3 class="font-bold dynamic-text-lg">點擊挑選菜式</h3>
                <button @click="showPickerModal = false" class="text-gray-400 text-xl">&times;</button>
            </div>
            <div class="overflow-y-auto flex-1 space-y-3">
                <template x-for="cat in categories" :key="cat">
                    <div>
                        <div class="font-bold text-xs text-indigo-500 mb-1" x-text="cat"></div>
                        <div class="grid grid-cols-2 gap-2">
                            <template x-for="dish in dishes.filter(d => d.category === cat)" :key="dish.id">
                                <!-- 一點即選 (需求 10) -->
                                <button @click="selectDishToCurrentDay(dish)" class="p-2.5 text-left border rounded-xl dark:border-gray-700 hover:border-indigo-500 active:bg-indigo-50 dark:active:bg-indigo-900/50 flex flex-col justify-between">
                                    <div>
                                        <div class="font-semibold text-xs" x-text="dish.name"></div>
                                        <div class="text-[10px] text-gray-400" x-text="dish.indonesian"></div>
                                    </div>
                                    <!-- 註明上一次烹飪日期 (需求 9) -->
                                    <div class="text-[9px] text-indigo-600 dark:text-indigo-300 mt-1" x-text="dish.lastCooked ? '上次: ' + dish.lastCooked : '未烹飪'"></div>
                                </button>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- ==================== 隱藏的 PDF 導出模板 (需求 22, 24) ==================== -->
    <div id="pdfExportContainer" class="hidden">
        <div class="pdf-page">
            <h1 class="text-3xl font-bold text-center border-b-2 border-black pb-4 mb-6" id="pdfTitle">每週菜單</h1>
            <div class="grid grid-cols-1 gap-4" id="pdfContent"></div>
        </div>
    </div>

    <!-- JavaScript 主邏輯 -->
    <script>
        function appData() {
            return {
                currentTab: 'planner',
                darkMode: localStorage.getItem('theme') === 'dark',
                fontSizeScale: localStorage.getItem('fontScale') || 1,
                avatar: localStorage.getItem('avatar') || '',
                cropperInstance: null,

                selectedStartDate: '',
                currentWeekDays: [],
                activeDayIndex: null,
                showPickerModal: false,

                // 分類 (需求 5)
                categories: JSON.parse(localStorage.getItem('categories')) || [
                    '雞', '牛', '豬', '魚', '海鮮(魚除外)', '疏菜', '湯水', '西式', '罐頭', '其他'
                ],
                newCatName: '',

                // 預設5款菜式分佈在3個分類內 (需求 8)
                dishes: JSON.parse(localStorage.getItem('dishes')) || [
                    { id: 1, name: '清蒸海上鮮', indonesian: 'Ikan Kukus', category: '魚', lastCooked: '' },
                    { id: 2, name: '紅燒牛肉', indonesian: 'Daging Sapi Rendang', category: '牛', lastCooked: '' },
                    { id: 3, name: '海南雞', indonesian: 'Nasi Ayam Hainan', category: '雞', lastCooked: '' },
                    { id: 4, name: '咖喱雞', indonesian: 'Kari Ayam', category: '雞', lastCooked: '' },
                    { id: 5, name: '白灼蝦', indonesian: 'Udang Rebus', category: '海鮮(魚除外)', lastCooked: '' }
                ],
                newDish: { name: '', indonesian: '', category: '雞' },

                savedMenus: JSON.parse(localStorage.getItem('savedMenus')) || [],

                init() {
                    // 初始化當前週星期一
                    let today = new Date();
                    let dayOfWeek = today.getDay();
                    let distanceToMonday = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek);
                    let monday = new Date(today.setDate(today.getDate() + distanceToMonday));
                    this.selectedStartDate = monday.toISOString().split('T')[0];
                    this.generateWeekDays();

                    this.$watch('darkMode', val => localStorage.setItem('theme', val ? 'dark' : 'light'));
                    this.$watch('fontSizeScale', val => localStorage.setItem('fontScale', val));
                    this.$watch('categories', val => localStorage.setItem('categories', JSON.stringify(val)), { deep: true });
                    this.$watch('dishes', val => localStorage.setItem('dishes', JSON.stringify(val)), { deep: true });
                    this.$watch('savedMenus', val => localStorage.setItem('savedMenus', JSON.stringify(val)), { deep: true });

                    this.$nextTick(() => this.initSortable());
                },

                // 驗證起始日必須為星期一 (需求 13, 17)
                validateStartDate() {
                    if (!this.selectedStartDate) return;
                    let date = new Date(this.selectedStartDate + 'T00:00:00');
                    if (date.getDay() !== 1) {
                        alert("請注意：只可以選擇星期一作起始日！");
                        // 自動轉為最近的星期一
                        let diff = (date.getDay() === 0 ? -6 : 1 - date.getDay());
                        date.setDate(date.getDate() + diff);
                        this.selectedStartDate = date.toISOString().split('T')[0];
                    }
                    this.generateWeekDays();
                },

                generateWeekDays() {
                    const daysNames = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
                    let start = new Date(this.selectedStartDate + 'T00:00:00');
                    this.currentWeekDays = daysNames.map((dayName, idx) => {
                        let d = new Date(start);
                        d.setDate(d.getDate() + idx);
                        return {
                            dayName: dayName,
                            dateStr: (d.getMonth() + 1) + '/' + d.getDate(),
                            fullDate: d.toISOString().split('T')[0],
                            dineIn: '',
                            takeout: '',
                            dishes: []
                        };
                    });
                },

                // 點選選擇菜式 Modal
                openDishPicker(dayIdx) {
                    this.activeDayIndex = dayIdx;
                    this.showPickerModal = true;
                },

                // 一點即選 (需求 10)
                selectDishToCurrentDay(dish) {
                    if (this.activeDayIndex !== null) {
                        this.currentWeekDays[this.activeDayIndex].dishes.push({ ...dish });
                        this.showPickerModal = false;
                    }
                },

                removeDishFromDay(dayIdx, dishIdx) {
                    this.currentWeekDays[dayIdx].dishes.splice(dishIdx, 1);
                },

                // 儲存每週菜單 (需求 16, 17, 20)
                saveCurrentMenu() {
                    let existingIndex = this.savedMenus.findIndex(m => m.startDate === this.selectedStartDate);
                    if (existingIndex !== -1) {
                        let replace = confirm("此日期的菜單已存在。按下「確定」取代該菜單，或「取消」另擇日期。");
                        if (!replace) {
                            alert("請選擇其他星期一作為起始日。");
                            return;
                        }
                    }

                    if (existingIndex === -1 && this.savedMenus.length >= 10) {
                        alert("每週菜單儲存上限為 10 張，請先刪除舊菜單！");
                        return;
                    }

                    let menuData = {
                        startDate: this.selectedStartDate,
                        days: JSON.parse(JSON.stringify(this.currentWeekDays))
                    };

                    if (existingIndex !== -1) {
                        this.savedMenus[existingIndex] = menuData;
                    } else {
                        this.savedMenus.push(menuData);
                    }

                    // 更新烹飪歷史日期 (需求 9)
                    this.currentWeekDays.forEach(day => {
                        day.dishes.forEach(d => {
                            let target = this.dishes.find(item => item.id === d.id);
                            if (target) target.lastCooked = day.fullDate;
                        });
                    });

                    alert("每週菜單已成功儲存！");
                },

                deleteMenu(index) {
                    if (confirm("確定刪除此每週菜單？")) {
                        this.savedMenus.splice(index, 1);
                    }
                },

                loadMenuToEdit(index) {
                    let menu = this.savedMenus[index];
                    this.selectedStartDate = menu.startDate;
                    this.currentWeekDays = JSON.parse(JSON.stringify(menu.days));
                    this.currentTab = 'planner';
                },

                // 菜式庫 CRUD
                addDish() {
                    if (!this.newDish.name) return alert("請輸入菜式名稱");
                    this.dishes.push({
                        id: Date.now(),
                        name: this.newDish.name,
                        indonesian: this.newDish.indonesian,
                        category: this.newDish.category,
                        lastCooked: ''
                    });
                    this.newDish.name = '';
                    this.newDish.indonesian = '';
                },

                editDish(dish) {
                    let newName = prompt("修改菜式名稱：", dish.name);
                    let newIndo = prompt("修改印尼文：", dish.indonesian);
                    let newCat = prompt("修改分類 (" + this.categories.join(',') + ")：", dish.category);
                    if (newName) dish.name = newName;
                    if (newIndo !== null) dish.indonesian = newIndo;
                    if (newCat && this.categories.includes(newCat)) dish.category = newCat;
                },

                deleteDish(id) {
                    if (confirm("確定刪除此菜式？")) {
                        this.dishes = this.dishes.filter(d => d.id !== id);
                    }
                },

                // 設定：分類管理 (需求 25, 27)
                addCategory() {
                    if (this.newCatName && !this.categories.includes(this.newCatName)) {
                        this.categories.push(this.newCatName);
                        this.newCatName = '';
                    }
                },

                removeCategory(cat) {
                    if (confirm(`刪除分類「${cat}」後，其下的所有菜式將自動移至「其他」分類。確定刪除？`)) {
                        this.dishes.forEach(d => {
                            if (d.category === cat) d.category = '其他';
                        });
                        this.categories = this.categories.filter(c => c !== cat);
                    }
                },

                initSortable() {
                    let el = document.getElementById('sortableCategories');
                    if (el) {
                        Sortable.create(el, {
                            handle: '.handle',
                            animation: 150,
                            onEnd: (evt) => {
                                let item = this.categories.splice(evt.oldIndex, 1)[0];
                                this.categories.splice(evt.newIndex, 0, item);
                            }
                        });
                    }
                },

                // 頭像裁切 (需求 29)
                initCropper(event) {
                    let files = event.target.files;
                    if (files && files.length > 0) {
                        let reader = new FileReader();
                        reader.onload = (e) => {
                            let img = document.getElementById('cropperImage');
                            img.src = e.target.result;
                            if (this.cropperInstance) this.cropperInstance.destroy();
                            this.cropperInstance = new Cropper(img, { aspectRatio: 1, viewMode: 1 });
                        };
                        reader.readAsDataURL(files[0]);
                    }
                },

                cropAvatar() {
                    if (this.cropperInstance) {
                        let canvas = this.cropperInstance.getCroppedCanvas({ width: 200, height: 200 });
                        this.avatar = canvas.toDataURL();
                        localStorage.setItem('avatar', this.avatar);
                        this.cropperInstance.destroy();
                        this.cropperInstance = null;
                        alert("頭像已更新！");
                    }
                },

                // 匯出 PDF (需求 22, 24)
                exportMenuPDF(menu) {
                    let container = document.getElementById('pdfContent');
                    document.getElementById('pdfTitle').innerText = '每週菜單 (' + menu.startDate + ')';
                    container.innerHTML = '';

                    menu.days.forEach(day => {
                        let dayDiv = document.createElement('div');
                        dayDiv.className = "border-b-2 border-gray-300 pb-3 mb-3";
                        
                        let dishesHtml = day.dishes.map(d => 
                            `<div class="text-xl font-bold mb-1">• ${d.name} <span class="text-lg font-normal italic text-gray-600">(${d.indonesian || '無印尼文'})</span></div>`
                        ).join('');

                        let peopleInfo = [];
                        if (day.dineIn !== '') peopleInfo.push(`用餐: ${day.dineIn}人`);
                        if (day.takeout !== '') peopleInfo.push(`外帶: ${day.takeout}人`);
                        let peopleText = peopleInfo.length > 0 ? ` [ ${peopleInfo.join(' | ')} ]` : '';

                        dayDiv.innerHTML = `
                            <div class="text-2xl font-black text-indigo-800 mb-2">${day.dayName} (${day.dateStr})${peopleText}</div>
                            <div class="pl-4">${dishesHtml || '<div class="text-lg italic text-gray-400">沒有選擇菜式</div>'}</div>
                        `;
                        container.appendChild(dayDiv);
                    });

                    let element = document.getElementById('pdfExportContainer');
                    element.classList.remove('hidden');

                    let opt = {
                        margin:       10,
                        filename:     `每週菜單_${menu.startDate}.pdf`,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2 },
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };

                    html2pdf().set(opt).from(element).save().then(() => {
                        element.classList.add('hidden');
                    });
                }
            }
        }
    </script>
</body>
</html>
