<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png?v=12">
<link rel="manifest" href="manifest.json?v=12">
<link rel="icon" href="icon.png?v=12">
<title>每週菜單 V12</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#fffaf0;--card:#fff;--text:#111;--muted:#888;--primary:#ff6b35;--border:#f0dcc8;--fs:20px}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,PingFang HK,sans-serif;padding-bottom:140px}
.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:2px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
.avatar{width:62px;height:62px;border-radius:50%;border:3px solid var(--primary);object-fit:cover}
.pages{max-width:520px;margin:0 auto;padding:12px}.page{display:none}.page.active{display:block}
.card{background:var(--card);border:2px solid var(--border);border-radius:20px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center}
.btn{flex:1;padding:16px;border-radius:16px;border:none;background:var(--primary);color:#fff;font-weight:900;font-size:1.1rem}
.ghost{flex:1;padding:14px;border-radius:16px;border:2px solid var(--border);background:var(--bg);font-weight:800}
.iconBtn{width:60px;height:60px;border-radius:18px;border:2px solid var(--border);background:var(--card);font-size:30px;display:grid;place-items:center}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.catBox{aspect-ratio:1;border-radius:18px;border:3px solid #111;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:6px}
.catBox.em{font-size:68px}.catBox.lb{margin-top:6px;background:#fff;color:#111;border:2px solid #111;border-radius:10px;padding:3px 8px;font-weight:900;font-size:.85rem;text-align:center}
.weekWrap{display:flex;flex-direction:column;gap:8px}.weekRow{display:flex;gap:8px;justify-content:center}
.dayBox{width:32%;aspect-ratio:1;border-radius:18px;border:3px solid #111;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:6px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--border);display:flex;justify-content:space-around;padding:16px 0 38px;z-index:20}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}.nav.ic{font-size:46px}.nav.active{color:var(--primary)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:9999;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}
.sheet{width:100%;max-width:500px;max-height:88vh;overflow:auto;background:var(--card);border-radius:24px;border:3px solid #111}
.head{position:sticky;top:0;background:var(--card);padding:14px;border-bottom:2px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.x{width:48px;height:48px;border-radius:50%;border:2px solid var(--border);background:var(--bg);display:grid;place-items:center;font-size:24px;cursor:pointer}
.dishRow{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1.5px dashed var(--border);gap:8px}
.act{display:flex;gap:6px}.act button{width:46px;height:46px;border-radius:12px;border:2px solid var(--border);background:var(--bg);font-size:20px}
select,input,textarea{width:100%;padding:14px;border-radius:14px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:1.05rem}
.topRowFixed{display:flex;gap:8px;align-items:center;width:100%}.topRowFixed input{flex:1;min-width:0}
#pdfWrap{position:fixed;inset:0;background:#222;z-index:10000;display:none;flex-direction:column}#pdfWrap.open{display:flex}
.pdfTool{position:sticky;top:0;background:#fff;padding:12px;display:flex;gap:12px;border-bottom:2px solid #ccc;z-index:2}
.pdfView{flex:1;overflow:auto;background:#333;padding:16px;display:flex;justify-content:center}
.pdfPage{width:100%;max-width:800px;background:#fff;margin:0 auto}
.pdfInner{padding:18mm;background:#fff;color:#000;box-sizing:border-box;font-size:18pt;line-height:1.6}
.pdfInner h1{text-align:center;margin:0 0 18px 0;font-size:28pt;line-height:1.2;border:5px solid #000;border-radius:20px;padding:18px}
.pdfInner.day{border:4px solid #000;border-radius:18px;margin-top:18px;overflow:hidden;page-break-inside:avoid}
.pdfInner.dayHead{background:#000;color:#fff;padding:12px 16px}
.pdfInner.dayHead b{display:block;font-size:14pt}
.pdfInner.dayHead span{display:block;font-size:12pt;margin-top:4px}
.pdfInner.dish{padding:12px 16px;border-top:3px solid #000}
</style>
</head>
<body>
<div class="top"><img id="avatarTop" class="avatar" src="icon.png"><div><div style="font-weight:900;font-size:1.25rem">每週菜單 V12 最終</div><div style="font-size:.9rem;color:var(--muted)">每週計劃</div></div></div>
<div class="pages">
<div id="p-weekly" class="page active"><div class="card"><div class="topRowFixed"><input type="date" id="monPicker"><button class="iconBtn" onclick="saveWeekly()">💾</button><button class="iconBtn" onclick="exportWeeklyPDF()">📄</button></div></div><div id="weeklyGrid" class="weekWrap"></div></div>
<div id="p-library" class="page"><div class="card row"><button class="ghost" onclick="exportLib()">匯出</button><button class="ghost" onclick="document.getElementById('impFile').click()">匯入</button><button class="btn" onclick="openAdd()">新增菜式</button><input type="file" id="impFile" accept=".json" style="display:none"></div><div id="catGrid" class="grid3"></div></div>
<div id="p-mymenus" class="page"><div id="myList"></div></div>
<div id="p-settings" class="page"><div class="card"><h3>分類排序</h3><div id="catOrder"></div></div></div>
</div>
<div class="bottom"><div class="nav active" onclick="go('weekly')"><span class="nav ic">📅</span>每週</div><div class="nav" onclick="go('library')"><span class="nav ic">📚</span>菜式庫</div><div class="nav" onclick="go('mymenus')"><span class="nav ic">🗂️</span>我的菜單</div><div class="nav" onclick="go('settings')"><span class="nav ic">⚙️</span>設定</div></div>
<div class="modal" id="mCat" style="z-index:10001"><div class="sheet"><div class="head"><b id="mCatTitle">分類</b><div class="x" onclick="closeM('mCat')">✕</div></div><div id="mCatBody"></div></div></div>
<div class="modal" id="mNote" style="z-index:10010"><div class="sheet"><div class="head"><b>備註</b><div class="x" onclick="closeM('mNote')">✕</div></div><div id="mNoteBody" style="padding:16px;white-space:pre-wrap"></div></div></div>
<div class="modal" id="mWeek" style="z-index:10002"><div class="sheet"><div class="head"><b id="mWeekTitle">日期</b><div class="x" onclick="closeM('mWeek')">✕</div></div><div style="padding:14px"><div class="row"><label>用餐</label><select id="diners"></select><label>外帶</label><select id="takeaway"></select></div><div id="selDishes" style="margin-top:12px"></div><button class="btn" style="width:100%;margin-top:12px" onclick="openPickCat()">選擇菜式</button></div></div></div>
<div class="modal" id="mPickCat" style="z-index:10003"><div class="sheet"><div class="head"><b>分類</b><div class="x" onclick="closeM('mPickCat')">✕</div></div><div id="mPickCatBody" class="grid3" style="padding:12px"></div></div></div>
<div class="modal" id="mPickDish" style="z-index:10004"><div class="sheet"><div class="head"><b>菜式</b><div class="x" onclick="closeM('mPickDish')">✕</div></div><div id="mPickDishBody"></div></div></div>
<div class="modal" id="mAdd" style="z-index:10005"><div class="sheet"><div class="head"><b>新增/修改菜式</b><div class="x" onclick="closeM('mAdd')">✕</div></div><div style="padding:14px"><input id="fName" placeholder="中文菜名"><input id="fIndo" placeholder="印尼文" style="margin-top:10px"><textarea id="fNote" placeholder="備註" style="margin-top:10px;height:120px"></textarea><select id="fCat" style="margin-top:10px"></select><input type="hidden" id="fId"><button class="btn" style="width:100%;margin-top:12px" onclick="saveDish()">儲存</button></div></div></div>
<div class="modal" id="mAnyDate" style="z-index:10006"><div class="sheet"><div class="head"><b>加入到哪一天？</b><div class="x" onclick="closeM('mAnyDate')">✕</div></div>
<div style="padding:14px;display:flex;flex-direction:column;gap:14px">
<input type="date" id="anyDate" style="width:100%!important;height:72px!important;min-height:72px!important;padding:0 18px!important;border-radius:20px!important;border:3px solid #111!important;background:#fffaf0!important;color:#111!important;font-weight:900!important;font-size:1.5rem!important;text-align:center!important;box-sizing:border-box!important;line-height:72px!important">
<button style="width:100%!important;height:72px!important;min-height:72px!important;padding:0 18px!important;border-radius:20px!important;font-size:1.5rem!important;border:3px solid #111!important;box-sizing:border-box!important;background:#ff6b35!important;color:#fff!important;font-weight:900!important;line-height:72px!important" onclick="confirmAddToWeek()">確認加入</button>
</div></div></div>
<div id="pdfWrap"><div class="pdfTool"><button class="btn" id="btnClosePdf" type="button">✕ 關閉</button><button class="ghost" id="btnSharePdf" type="button">📤 傳送真PDF</button></div><div class="pdfView"><div class="pdfPage"><div class="pdfInner" id="pdfContent"></div></div></div></div>
<script>
const CAT_META={"雞":{bg:"#ffeb8a",e:"🐔"},"牛":{bg:"#d7b899",e:"🐮"},"豬":{bg:"#ffb3c1",e:"🐷"},"魚":{bg:"#8ecfff",e:"🐟"},"蔬菜":{bg:"#a8e6a3",e:"🥬"},"湯水":{bg:"#ffcc7a",e:"🍲"},"西式":{bg:"#e2c499",e:"🍔"},"罐頭":{bg:"#9ec6ff",e:"🥫"},"其他":{bg:"#d8b4fe",e:"🍱"}};
let cats=JSON.parse(localStorage.getItem('cats')||'null')||Object.keys(CAT_META);
let dishes=JSON.parse(localStorage.getItem('dishes')||'null')||[];
let weeklyMenus=JSON.parse(localStorage.getItem('weeklyMenus')||'[]');
let current={mon:null,days:[]}, lastCook=JSON.parse(localStorage.getItem('lastCook')||'{}'), editDay=null, pendDish=null;
const cn=["一","二","三","四","五","六","日"], idn=["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"], dayEmo=["🌅","🌤️","🌞","🌇","🌙","⭐","🎉"];
function go(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('p-'+p).classList.add('active');document.querySelectorAll('.nav').forEach((el,i)=>{el.classList.remove('active');if(['weekly','library','mymenus','settings'][i]===p)el.classList.add('active');});}
function getMon(d){let dt=new Date(d);let day=dt.getDay();let diff=dt.getDate()-day+(day==0?-6:1);return new Date(dt.setDate(diff));}
function fmt(d){if(typeof d==='string')return d;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function openM(id){document.getElementById(id).classList.add('open');}function closeM(id){document.getElementById(id).classList.remove('open');}
function makeDefaults(){
 if(dishes.length) return;
 const D={
"雞":[["豉油雞","Ayam Kecap"],["白切雞","Ayam Rebus"],["麻油雞","Ayam Wijen"],["咖喱雞","Kari Ayam"],["蒸雞","Ayam Kukus"],["咕嚕雞","Ayam Asam Manis"],["豉椒雞","Ayam Tauco"],["檸檬雞","Ayam Lemon"],["鹽焗雞","Ayam Garam"],["雞翼薯仔","Sayap Kentang"]],
"牛":[["柱侯牛腩","Semur Sapi"],["黑椒牛柳","Sapi Lada Hitam"],["蕃茄牛","Sapi Tomat"],["牛扒","Steak"],["咖喱牛","Kari Sapi"],["涼瓜牛","Pare Sapi"],["芥蘭牛","Kailan Sapi"],["紅燒牛尾","Buntut"],["沙爹牛","Sate Sapi"],["清湯牛腩","Sup Sapi"]],
"豬":[["叉燒","Char Siu"],["蒸肉餅","Daging Kukus"],["咕嚕肉","Babi Asam Manis"],["梅菜扣肉","Mei Cai"],["椒鹽豬扒","Pork Lada Garam"],["粟米肉粒","Jagung Daging"],["回鍋肉","Babi Wajan"],["糖醋排骨","Iga Asam Manis"],["蓮藕炆豬肉","Teratai Babi"],["豬手花生","Kaki Kacang"]],
"魚":[["蒸鯇魚","Ikan Kukus"],["豉汁魚","Ikan Tauco"],["煎魚","Ikan Goreng"],["糖醋魚","Ikan Asam Manis"],["魚香茄子","Terong Ikan"],["魚湯","Sup Ikan"],["椒鹽九肚魚","Lada Garam"],["檸檬魚","Ikan Lemon"],["咖喱魚","Kari Ikan"],["魚餅","Kue Ikan"]],
"蔬菜":[["番茄蛋","Tomat Telur"],["菜心","Choy Sum"],["芥蘭","Kailan"],["通菜","Kangkung"],["白菜","Sawi Putih"],["椰菜花","Kembang Kol"],["勝瓜","Oyong"],["豆角","Kacang Panjang"],["蓮藕炒","Tumis Teratai"],["雜菜","Capcay"]],
"湯水":[["老火湯","Sup Tua"],["冬瓜湯","Sup Labu"],["ABC湯","Sup ABC"],["紫菜蛋花","Rumput Laut"],["豆腐湯","Sup Tahu"],["蘿蔔排骨","Sup Lobak"],["菜乾湯","Sup Kering"],["青紅蘿蔔","Sup Wortel"],["節瓜湯","Sup Labu Kecil"],["西洋菜","Selada Air"]],
"西式":[["意粉","Spaghetti"],["焗薯","Kentang Panggang"],["沙律","Salad"],["漢堡","Burger"],["薯條","Kentang Goreng"],["牛扒薯條","Steak Kentang"],["蘑菇湯","Sup Jamur"],["焗雞翼","Sayap Panggang"],["三文治","Sandwich"],["薄餅","Pizza"]],
"罐頭":[["茄汁豆","Kacang Tomat"],["午餐肉","Lunch Meat"],["沙甸魚","Sarden"],["粟米湯","Sup Jagung"],["吞拿魚","Tuna"],["蘑菇罐","Jamur Kaleng"],["豆豉鯪魚","Dencis"],["火腿通粉","Makaroni"],["粟米午餐肉","Jagung Kaleng"],["椰奶","Santan"]],
"其他":[["蒸水蛋","Telur Kukus"],["炒飯","Nasi Goreng"],["炒麵","Mie Goreng"],["粥","Bubur"],["餃子","Pangsit"],["雲吞","Wonton"],["腸粉","Cheung Fun"],["白飯","Nasi Putih"],["糖水","Sup Manis"],["涼拌青瓜","Acar"]]
 };
 Object.entries(D).forEach(([cat,arr])=>{arr.forEach(([n,i])=>{dishes.push({id:Date.now()+Math.random(),name:n,indo:i,note:"",cat});});});
 localStorage.setItem('dishes',JSON.stringify(dishes));
}
makeDefaults();
function init(){
 let mon=getMon(new Date()); document.getElementById('monPicker').valueAsDate=mon; onMon(mon);
 renderCats(); renderWeek(); renderMy();
 let sel=document.getElementById('diners'); sel.innerHTML=[...Array(10).keys()].map(n=>`<option value="${n}">${n}</option>`).join(''); document.getElementById('takeaway').innerHTML=sel.innerHTML;
 document.getElementById('monPicker').addEventListener('change',e=>{let d=e.target.valueAsDate;if(!d)return;if(d.getDay()!==1){alert('只可以選擇星期一');let m=getMon(d);e.target.valueAsDate=m;d=m;} onMon(d);});
 document.getElementById('btnClosePdf').addEventListener('click',closePDF);
 document.getElementById('btnSharePdf').addEventListener('click',sharePDF);
}
function onMon(d){ current.mon=d; current.days=[]; for(let i=0;i<7;i++){let day=new Date(d); day.setDate(d.getDate()+i); current.days.push({date:day,dishes:[],diners:0,takeaway:0});} renderWeek(); }
function renderCats(){
 let g=document.getElementById('catGrid'); g.innerHTML=''; document.getElementById('fCat').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');
 cats.forEach(cat=>{
  let meta=CAT_META[cat]||{bg:'#eee',e:'🍱'}; let cnt=dishes.filter(d=>d.cat===cat).length;
  g.innerHTML+=`<div class="catBox" style="background:${meta.bg}" onclick="openCat('${cat}')"><div class="em">${meta.e}</div><div class="lb">${cat} (${cnt})</div></div>`;
 });
}
function openCat(cat){
 document.getElementById('mCatTitle').innerText=cat;
 let list=dishes.filter(d=>d.cat===cat);
 document.getElementById('mCatBody').innerHTML=list.map(d=>`<div class="dishRow"><div style="flex:1;cursor:pointer" onclick="showNote(${d.id})"><b>${d.name}</b><div style="font-size:.9rem;color:var(--muted)">${d.indo||''}</div></div><div class="act"><button onclick="openAnyDate(${d.id})">📅</button><button onclick="editDish(${d.id})">✏️</button><button onclick="delDish(${d.id})">🗑️</button></div></div>`).join('')||'<div style="padding:20px">暫無</div>';
 openM('mCat');
}
function showNote(id){ let d=dishes.find(x=>x.id==id); document.getElementById('mNoteBody').innerText=`${d.name} / ${d.indo||''}\n\n${d.note||''}`; openM('mNote'); }
function openAnyDate(id){ pendDish=id; document.getElementById('anyDate').valueAsDate=new Date(); openM('mAnyDate'); }
function confirmAddToWeek(){ let v=document.getElementById('anyDate').value; if(!v) return; let date=new Date(v); let mon=getMon(date); if(fmt(mon)!==fmt(current.mon)){alert('請先選包含此日的星期一'); return;} let idx=Math.round((date-current.mon)/86400000); let d=dishes.find(x=>x.id==pendDish); current.days[idx].dishes.push({...d}); renderWeek(); closeM('mAnyDate'); }
function openAdd(){ document.getElementById('fId').value=''; document.getElementById('fName').value=''; document.getElementById('fIndo').value=''; document.getElementById('fNote').value=''; openM('mAdd'); }
function editDish(id){ let d=dishes.find(x=>x.id==id); openAdd(); document.getElementById('fId').value=d.id; document.getElementById('fName').value=d.name; document.getElementById('fIndo').value=d.indo||''; document.getElementById('fNote').value=d.note||''; document.getElementById('fCat').value=d.cat; }
function saveDish(){ let id=document.getElementById('fId').value,n=document.getElementById('fName').value.trim(),i=document.getElementById('fIndo').value.trim(),t=document.getElementById('fNote').value.trim(),c=document.getElementById('fCat').value; if(!n) return alert('中文必填'); if(id){let d=dishes.find(x=>x.id==id);d.name=n;d.indo=i;d.note=t;d.cat=c;} else dishes.push({id:Date.now()+Math.random(),name:n,indo:i,note:t,cat:c}); localStorage.setItem('dishes',JSON.stringify(dishes)); renderCats(); closeM('mAdd'); }
function delDish(id){ if(!confirm('刪除?')) return; dishes=dishes.filter(x=>x.id!=id); localStorage.setItem('dishes',JSON.stringify(dishes)); renderCats(); }
function renderWeek(){
 let wrap=document.getElementById('weeklyGrid'); wrap.innerHTML='';
 let rows=[[0,1],[2,3],[4,5,6]];
 rows.forEach(r=>{
  let row=document.createElement('div'); row.className='weekRow';
  r.forEach(idx=>{
   let day=current.days[idx];
   let div=document.createElement('div'); div.className='dayBox';
   div.innerHTML=`<div style="font-size:30px">${dayEmo[idx]}</div><div style="font-weight:900;margin-top:4px;font-size:.85rem">星期${cn[idx]}<br>${fmt(day.date).slice(5)}<br><span style="color:var(--primary)">${day.dishes.length}道</span></div>`;
   div.onclick=()=>openWeek(idx); row.appendChild(div);
  });
  wrap.appendChild(row);
 });
}
function openWeek(idx){
 editDay=idx; let day=current.days[idx];
 document.getElementById('mWeekTitle').innerText=`${fmt(day.date)} 星期${cn[idx]}`;
 document.getElementById('diners').value=day.diners; document.getElementById('takeaway').value=day.takeaway;
 document.getElementById('diners').onchange=e=>day.diners=+e.target.value;
 document.getElementById('takeaway').onchange=e=>day.takeaway=+e.target.value;
 document.getElementById('selDishes').innerHTML=day.dishes.map((d,i)=>`<div class="dishRow"><span><b>${d.name}</b></span><button class="ghost" style="width:auto" onclick="current.days[${idx}].dishes.splice(${i},1);openWeek(${idx});renderWeek()">✕</button></div>`).join('')||'<div>尚未選擇</div>';
 openM('mWeek');
}
function openPickCat(){ let b=document.getElementById('mPickCatBody'); b.innerHTML=''; cats.forEach(cat=>{let m=CAT_META[cat]||{bg:'#eee',e:'🍱'}; b.innerHTML+=`<div class="catBox" style="background:${m.bg}" onclick="openPickDish('${cat}')"><div class="em">${m.e}</div><div class="lb">${cat}</div></div>`;}); openM('mPickCat'); }
function openPickDish(cat){ let list=dishes.filter(d=>d.cat===cat); document.getElementById('mPickDishBody').innerHTML=list.map(d=>`<div class="dishRow"><span><b>${d.name}</b></span><button class="btn" style="width:auto" onclick="pickToWeek(${d.id})">加入</button></div>`).join(''); openM('mPickDish'); }
function pickToWeek(id){ current.days[editDay].dishes.push({...dishes.find(x=>x.id==id)}); openWeek(editDay); renderWeek(); }
function saveWeekly(){ let fname=fmt(current.mon); let toSave={monday:fname,days:current.days.map(d=>({date:fmt(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway}))}; weeklyMenus.push(toSave); localStorage.setItem('weeklyMenus',JSON.stringify(weeklyMenus)); alert('已儲存'); }
function renderMy(){ document.getElementById('myList').innerHTML=weeklyMenus.map((m,i)=>`<div class="card"><b>${m.monday}</b> <button onclick="pdfSingle(${i})">📄</button></div>`).join(''); }
function makePDF(days){
  let html = `<h1>每週菜單<br><span style="font-size:16pt">Daftar Menu Mingguan</span></h1>`;
  days.forEach((d,i)=>{
    html += `<div class="day"><div class="dayHead"><b>星期${cn[i]} / ${idn[i]} ${d.date}</b><span>用餐 Makan ${d.diners} 外帶 Bungkus ${d.takeaway}</span></div>`;
    if(d.dishes.length===0){ html+=`<div class="dish">無 / Belum ada</div>`; }
    else{ d.dishes.forEach(dd=>{ html+=`<div class="dish"><b>${dd.name} / ${dd.indo||''}</b><div style="margin-top:6px;white-space:pre-wrap;font-size:11pt">備註 Catatan: ${dd.note||''}</div></div>`; }); }
    html+=`</div>`;
  });
  return html;
}
function exportWeeklyPDF(){ showPDF(makePDF(current.days.map(d=>({date:fmt(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway})))); }
function pdfSingle(i){ showPDF(makePDF(weeklyMenus[i].days)); }
function showPDF(inner){ document.getElementById('pdfContent').innerHTML=inner; document.getElementById('pdfWrap').classList.add('open'); }
function closePDF(){ document.getElementById('pdfWrap').classList.remove('open'); }
async function sharePDF(){
  let content=document.getElementById('pdfContent');
  let wrapper=document.createElement('div');wrapper.style.width='794px';wrapper.style.position='fixed';wrapper.style.left='-9999px';
  let clone=content.cloneNode(true);clone.style.width='794px';clone.style.boxSizing='border-box';clone.style.padding='76px';wrapper.appendChild(clone);document.body.appendChild(wrapper);
  const canvas = await html2canvas(clone,{scale:2,backgroundColor:'#fff',width:794});
  document.body.removeChild(wrapper);
  const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const imgData=canvas.toDataURL('image/png');const imgW=210,imgH=canvas.height*imgW/canvas.width;
  pdf.addImage(imgData,'PNG',0,0,imgW,imgH);let remain=imgH-297,y=-297;while(remain>0){pdf.addPage();pdf.addImage(imgData,'PNG',0,y,imgW,imgH);y-=297;remain-=297;}
  const blob=pdf.output('blob');const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`每週菜單_${fmt(new Date())}.pdf`;a.click();
}
function exportLib(){ let blob=new Blob([JSON.stringify({cats,dishes},null,2)],{type:'application/json'}); let url=URL.createObjectURL(blob); let a=document.createElement('a');a.href=url;a.download=`菜式庫_${fmt(new Date())}.json`;a.click();}
init();
</script>
