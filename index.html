<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;max-width:400px;margin:20px auto}
.catBox{aspect-ratio:1;border-radius:20px;border:3px solid #111;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.catBox .em{font-size:70px!important;line-height:1!important}
.catBox .lb{margin-top:8px;border:2px solid #111;border-radius:10px;padding:4px 10px;font-weight:900;font-size:16px;background:#fff}
</style>
</head>
<body>
<div class="grid3">
<div class="catBox" style="background:#ffeb8a"><div class="em">🐔</div><div class="lb">雞 (10)</div></div>
<div class="catBox" style="background:#d7b899"><div class="em">🐮</div><div class="lb">牛 (10)</div></div>
<div class="catBox" style="background:#ffb3c1"><div class="em">🐷</div><div class="lb">豬 (10)</div></div>
</div>
</body>
</html>
