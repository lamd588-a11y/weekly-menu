<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>每週菜單 V3</title>
<style>
:root{--bg:#f8f7f4;--card:#fff;--text:#1a1a1a;--muted:#888;--primary:#ff6b35;--border:#ece9e3;--radius:18px}
.dark{--bg:#0a0a0a;--card:#181818;--text:#f5f5f5;--border:#2a2a2a}
html{font-size:16px} *{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,PingFang HK,sans-serif;font-size:1rem;padding-bottom:110px;transition:font-size.2s}
.header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;padding:14px 18px}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--primary)}
.page{padding:16px;max-width:600px;margin:0 auto}.card{background:var(--card);border-radius:18px;border:1px solid var(--border);padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:none;border-radius:12px;padding:10px 14px;background:var(--primary);color:#fff;font-weight:700}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px 14px}
.btn-icon{width:44px;height:44px;display:grid;place-items:center;font-size:20px;border-radius:12px;border:1px solid var(--border);background:var(--bg)}
.btn-icon.big{width:52px;height:52px;font-size:24px}
.cat-header{display:flex;justify-content:space-between;cursor:pointer;padding:6px 0}
.dish{padding:10px 0;border-top:1px dashed var(--border)}.dish-top{display:flex;justify-content:space-between}
.note{margin-top:6px;background:var(--bg);padding:8px;border-radius:8px;font-size:0.9em;white-space:pre-wrap}
select,input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 24px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);cursor:pointer}.nav-item.active{color:var(--primary)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:50;align-items:flex-end}.modal.open{display:flex}
.modal-box{background:var(--card);width:100%;max-height:85vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px}
.tag{font-size:.8em;color:var(--muted)}
#pdfOverlay{position:fixed;inset:0;background:#fff;z-index:9999;overflow:auto}
#pdfOverlay.pdf-toolbar{position:sticky;top:0;background:#fff;padding:12px;border-bottom:2px solid #000;display:flex;gap:10px;z-index:10}
.pdf-a4{width:210mm;max-width:100%;margin:0 auto;padding:20mm 15mm;font-size:16pt;line-height:1.5}
@media print{@page{size:A4 portrait;margin:20mm 15mm} #pdfOverlay.pdf-toolbar{display:none}.pdf-a4{padding:0}}
</style>
</head>
<body>
<div class="header"><div class="row"><img id="hdrAvatar" class="avatar" src="icon.png"><div><div style="font-weight:800">每週菜單</div><div class="tag">Mingguan Menu</div></div></div><button class="btn-ghost btn-icon" onclick="toggleTheme()">🌓</button></div>

<div id="p-weekly" class="page"><div class="card row"><input type="date" id="mondayPicker" style="flex:1"><button class="btn-icon big" onclick="saveWeekly()">💾</button><button class="btn-icon big" onclick="exportPDF()">📄</button></div><div class="row" style="margin-bottom:10px"><button class="btn-ghost" style="flex:1" onclick="toggleAllDays(true)">打開全部 Buka</button><button class="btn-ghost" style="flex:1" onclick="toggleAllDays(false)">關閉 Tutup</button></div><div id="weekContainer"></div></div>

<div id="p-library" class="page" style="display:none"><div class="card"><div class="row"><button class="btn" onclick="openAddDish()">＋新增</button><button class="btn-ghost" onclick="exportLibrary()">匯出</button><button class="btn-ghost" onclick="document.getElementById('importFile').click()">匯入</button><input type="file" id="importFile" style="display:none" onchange="importLibrary(event)"></div><div class="row" style="margin-top:10px"><button class="btn-ghost" style="flex:1" onclick="toggleAllCats(true)">一鍵打開所有分類</button><button class="btn-ghost" style="flex:1" onclick="toggleAllCats(false)">一鍵關閉所有分類</button></div></div><div id="libContainer"></div></div>

<div id="p-mymenus" class="page" style="display:none"><div id="myMenuList"></div></div>

<div id="p-settings" class="page" style="display:none">
<div class="card"><h4>頭像設定 - 可拖拉+縮放</h4><input type="file" id="avatarFile" accept="image/*"><div style="position:relative;width:220px;height:220px;margin:10px auto;border-radius:50%;overflow:hidden;border:2px solid var(--primary);touch-action:none" id="canvasWrap"><canvas id="avatarCanvas" width="400" height="400" style="width:100%;height:100%;cursor:grab"></canvas><div style="position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.4);pointer-events:none"></div></div><div class="row"><span>縮放</span><input type="range" id="zoom" min="0.5" max="3" step="0.05" value="1" style="flex:1"><button class="btn-ghost" onclick="resetAvatarPos()">重置</button></div><button class="btn" style="width:100%;margin-top:8px" onclick="saveAvatar()">儲存並設為App Icon</button><p class="tag">提示：用手指拖動圖片調整位置，雙指或拉桿縮放</p></div>
<div class="card"><h4>分類自訂排序 Kategori</h4><div id="catSettings"></div><div class="row"><input id="newCatName" placeholder="新增分類"><button class="btn" onclick="addCategory()">新增</button></div></div>
<div class="card"><h4>外觀</h4><div class="row"><span>深淺色</span><button class="btn-ghost" onclick="toggleTheme()">切換</button></div><div style="margin-top:10px"><label>字體大小 <span id="fontVal">16</span>px</label><input type="range" id="fontRange" min="12" max="22" value="16" oninput="setFontSize(this.value)" style="width:100%"></div></div>
</div>

<div class="bottom-nav"><div class="nav-item active" onclick="switchPage('weekly')"><span>📅</span>每週</div><div class="nav-item" onclick="switchPage('library')"><span>📚</span>菜式庫</div><div class="nav-item" onclick="switchPage('mymenus')"><span>🗂️</span>我的菜單</div><div class="nav-item" onclick="switchPage('settings')"><span>⚙️</span>設定</div></div>

<div class="modal" id="dishModal" onclick="if(event.target==this)closeDishModal()"><div class="modal-box"><h3>選擇菜色 一點即選</h3><div id="modalCats"></div></div></div>
<div class="modal" id="addDishModal" onclick="if(event.target==this)closeAddDish()"><div class="modal-box"><h3>新增/修改</h3><input id="d_name" placeholder="中文名稱"><input id="d_id" placeholder="印尼文" style="margin-top:8px"><textarea id="d_note" placeholder="備註" style="margin-top:8px"></textarea><select id="d_cat" style="margin-top:8px"></select><button class="btn" style="width:100%;margin-top:10px" onclick="saveDish()">儲存</button><input type="hidden" id="d_editId"></div></div>

<script>
const defaultCats=["雞 Ayam","牛 Sapi","豬 Babi","魚 Ikan","蔬菜 Sayur","湯水 Sup","西式 Barat","罐頭 Kaleng","其他 Lainnya"];
let cats=JSON.parse(localStorage.getItem('cats')||'null')||defaultCats.slice();
let dishes=JSON.parse(localStorage.getItem('dishes')||'null')||[
{id:1,name:"豉油雞",indo:"Ayam Kecap",note:"雞洗淨，豉油糖薑蔥煮30分",cat:"雞 Ayam"},
{id:2,name:"麻油雞",indo:"Ayam Wijen",note:"薑爆香，雞炒金黃加酒燜",cat:"雞 Ayam"},
{id:3,name:"紅燒牛",indo:"Semur Sapi",note:"汆水加醬油八角燉1.5h",cat:"牛 Sapi"},
{id:4,name:"蒸魚",indo:"Ikan Kukus",note:"薑蔥蒸8分淋油",cat:"魚 Ikan"},
{id:5,name:"番茄蛋",indo:"Tomat Telur",note:"蛋先炒番茄回鍋",cat:"蔬菜 Sayur"}];
let weeklyMenus=JSON.parse(localStorage.getItem('weeklyMenus')||'[]');let currentWeek={monday:null,days:[]};let lastCook={};let activeDayIndex=null;
const cn=["一","二","三","四","五","六","日"], idn=["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
function init(){lastCook=JSON.parse(localStorage.getItem('lastCook')||'{}');loadAvatar();
let mon=getMonday(new Date());document.getElementById('mondayPicker').valueAsDate=mon;document.getElementById('mondayPicker').addEventListener('change',onMondayChange);onMondayChange({target:{valueAsDate:mon}});renderLibrary();renderSettings();renderMyMenus();}
function getMonday(d){let date=new Date(d),day=date.getDay(),diff=date.getDate()-day+(day==0?-6:1);return new Date(date.setDate(diff));}
function formatDate(d){if(typeof d==='string')return d;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function onMondayChange(e){let d=e.target.valueAsDate;if(!d)return;if(d.getDay()!==1){alert("只可選星期一");let m=getMonday(d);document.getElementById('mondayPicker').valueAsDate=m;d=m;}currentWeek.monday=d;currentWeek.days=[];for(let i=0;i<7;i++){let day=new Date(d);day.setDate(d.getDate()+i);currentWeek.days.push({date:day,dishes:[],diners:0,takeaway:0});}renderWeek();}
function renderWeek(){let c=document.getElementById('weekContainer');c.innerHTML='';currentWeek.days.forEach((dayObj,idx)=>{c.innerHTML+=`<div class="card"><div class="cat-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display=='none'?'block':'none'"><b>星期${cn[idx]} ${formatDate(dayObj.date)}<br><span class="tag">${idn[idx]}</span></b><span>${dayObj.dishes.length}道</span></div><div class="day-body"><div class="row" style="margin:8px 0"><label>用餐</label><select onchange="currentWeek.days[${idx}].diners=+this.value">${[...Array(10).keys()].map(n=>`<option ${dayObj.diners==n?'selected':''}>${n}</option>`).join('')}</select><label>外帶</label><select onchange="currentWeek.days[${idx}].takeaway=+this.value">${[...Array(10).keys()].map(n=>`<option ${dayObj.takeaway==n?'selected':''}>${n}</option>`).join('')}</select></div>${dayObj.dishes.map((d,i)=>`<div class="dish"><div class="dish-top" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display=='none'?'block':'none'"><span><b>${d.name}</b> <span class="tag">${d.indo||''}</span></span><button class="btn-ghost" onclick="removeDishFromDay(${idx},${i});event.stopPropagation()">✕</button></div><div class="note" style="display:none">${d.note||''}</div></div>`).join('')||'<p class="tag">尚未選擇</p>'}<button class="btn" style="width:100%;margin-top:8px" onclick="openDishModal(${idx})">選擇菜色</button></div></div>`;});}
function toggleAllDays(o){document.querySelectorAll('#weekContainer.day-body').forEach(el=>el.style.display=o?'block':'none');}
function openDishModal(i){activeDayIndex=i;document.getElementById('dishModal').classList.add('open');renderModalCats();}
function closeDishModal(){document.getElementById('dishModal').classList.remove('open');}
function renderModalCats(){let b=document.getElementById('modalCats');b.innerHTML='';cats.forEach(cat=>{let cd=dishes.filter(d=>d.cat===cat);let h=`<div class="card"><div class="cat-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display=='none'?'block':'none'"><b>${cat}</b><span>▼</span></div><div>`;cd.forEach(d=>{h+=`<div class="dish" style="cursor:pointer" onclick="pickDish(${d.id})"><span>${d.name} <span class="tag">${d.indo||''}</span></span><span class="tag">${lastCook[d.id]||''}</span></div>`;});h+=`</div></div>`;b.innerHTML+=h;});}
function pickDish(id){let d=dishes.find(x=>x.id===id);currentWeek.days[activeDayIndex].dishes.push({...d});lastCook[id]=formatDate(new Date());localStorage.setItem('lastCook',JSON.stringify(lastCook));renderWeek();closeDishModal();}
function removeDishFromDay(a,b){currentWeek.days[a].dishes.splice(b,1);renderWeek();}
// 修正1
function toggleAllCats(open){document.querySelectorAll('#libContainer.cat-body').forEach(el=>{el.style.display=open?'block':'none';});}
function renderLibrary(){let c=document.getElementById('libContainer');c.innerHTML='';let sel=document.getElementById('d_cat');if(sel)sel.innerHTML=cats.map(cat=>`<option>${cat}</option>`).join('');cats.forEach(cat=>{let cd=dishes.filter(d=>d.cat===cat);let h=`<div class="card"><div class="cat-header" onclick="let b=this.nextElementSibling;b.style.display=b.style.display=='none'?'block':'none'"><b>${cat} (${cd.length})</b><span>▼</span></div><div class="cat-body">`;cd.forEach(d=>{h+=`<div class="dish"><div class="dish-top" onclick="this.parentElement.querySelector('.note').style.display=this.parentElement.querySelector('.note').style.display=='none'?'block':'none'"><span><b>${d.name}</b> <span class="tag">${d.indo||''}</span></span><span class="row"><button class="btn-ghost" onclick="editDish(${d.id});event.stopPropagation()">✏️</button><button class="btn-ghost" onclick="deleteDish(${d.id});event.stopPropagation()">🗑️</button></span></div><div class="note" style="display:none">${d.note||''}</div><select onchange="reCat(${d.id},this.value)" style="font-size:.9em;margin-top:4px">${cats.map(cc=>`<option ${cc===d.cat?'selected':''}>${cc}</option>`).join('')}</select></div>`;});h+=`</div></div>`;c.innerHTML+=h;});}
function openAddDish(){document.getElementById('addDishModal').classList.add('open');document.getElementById('d_editId').value='';}
function closeAddDish(){document.getElementById('addDishModal').classList.remove('open');}
function saveDish(){let id=document.getElementById('d_editId').value,n=document.getElementById('d_name').value.trim(),indo=document.getElementById('d_id').value.trim(),note=document.getElementById('d_note').value.trim(),cat=document.getElementById('d_cat').value;if(!n)return alert('請輸入名稱');if(id){let d=dishes.find(x=>x.id==id);d.name=n;d.indo=indo;d.note=note;d.cat=cat;}else dishes.push({id:Date.now(),name:n,indo,note,cat});localStorage.setItem('dishes',JSON.stringify(dishes));renderLibrary();closeAddDish();}
function editDish(id){let d=dishes.find(x=>x.id===id);openAddDish();document.getElementById('d_editId').value=d.id;document.getElementById('d_name').value=d.name;document.getElementById('d_id').value=d.indo||'';document.getElementById('d_note').value=d.note||'';document.getElementById('d_cat').value=d.cat;}
function deleteDish(id){if(confirm('刪除?')){dishes=dishes.filter(x=>x.id!==id);localStorage.setItem('dishes',JSON.stringify(dishes));renderLibrary();}}
function reCat(id,nc){let d=dishes.find(x=>x.id===id);d.cat=nc;localStorage.setItem('dishes',JSON.stringify(dishes));renderLibrary();}
function exportLibrary(){let b=new Blob([JSON.stringify({cats,dishes},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='菜式庫.json';a.click();}
function importLibrary(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{try{let data=JSON.parse(ev.target.result);if(data.cats)cats=data.cats;if(data.dishes)dishes=data.dishes;localStorage.setItem('cats',JSON.stringify(cats));localStorage.setItem('dishes',JSON.stringify(dishes));renderLibrary();renderSettings();}catch{alert('格式錯');}};r.readAsText(f);}
function saveWeekly(){if(!currentWeek.monday)return;let fname=formatDate(currentWeek.monday);let ex=weeklyMenus.findIndex(m=>m.monday===fname);if(ex>=0){if(!confirm('已存在，取代？')){let nd=prompt('輸入新星期一 YYYY-MM-DD');if(!nd)return;let d=new Date(nd);if(d.getDay()!==1)return alert('只可星期一');fname=formatDate(d);currentWeek.monday=d;}else weeklyMenus.splice(ex,1);}let toSave={monday:fname,days:currentWeek.days.map(d=>({date:formatDate(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway}))};let idx=weeklyMenus.findIndex(m=>m.monday===fname);if(idx>=0)weeklyMenus[idx]=toSave;else weeklyMenus.push(toSave);if(weeklyMenus.length>10)weeklyMenus.shift();localStorage.setItem('weeklyMenus',JSON.stringify(weeklyMenus));renderMyMenus();alert('已儲存:'+fname);}
function renderMyMenus(){let c=document.getElementById('myMenuList');c.innerHTML=weeklyMenus.map((m,i)=>`<div class="card"><div class="cat-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display=='none'?'block':'none'"><b>${m.monday} 星期一</b><span>▼</span></div><div>${m.days.map((d,di)=>`<div style="border-top:1px dashed var(--border);padding:6px 0"><b>星期${cn[di]} ${idn[di]} ${d.date} 用餐${d.diners}外帶${d.takeaway}</b>${d.dishes.map(dd=>`<div>${dd.name} ${dd.indo||''}</div>`).join('')}</div>`).join('')}<div class="row"><button class="btn-ghost" onclick="loadMenu(${i})">修改</button><button class="btn-ghost" onclick="deleteMenu(${i})">刪除</button><button class="btn-icon big" onclick="exportPDFSingle(${i})">📄</button></div></div></div>`).join('')||'<p class="tag">暫無</p>';}
function loadMenu(idx){let m=weeklyMenus[idx];document.getElementById('mondayPicker').value=m.monday;let mon=new Date(m.monday);currentWeek.monday=mon;currentWeek.days=m.days.map(d=>({date:new Date(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway}));switchPage('weekly');renderWeek();}
function deleteMenu(idx){if(confirm('刪除?')){weeklyMenus.splice(idx,1);localStorage.setItem('weeklyMenus',JSON.stringify(weeklyMenus));renderMyMenus();}}
// 修正3+4 A4 PDF 可關閉可儲存
function createPDF(inner){let old=document.getElementById('pdfOverlay');if(old)old.remove();let div=document.createElement('div');div.id='pdfOverlay';div.innerHTML=`<div class="pdf-toolbar"><button class="btn" onclick="document.getElementById('pdfOverlay').remove()">✕ 關閉 Tutup</button><button class="btn" onclick="window.print()">🖨️ 列印</button><button class="btn-ghost" onclick="downloadPDF()">💾 儲存 Save</button></div><div class="pdf-a4">${inner}</div>`;document.body.appendChild(div);}
function exportPDF(){let h=`<h1 style="text-align:center">每週菜單 Mingguan Menu<br>${formatDate(currentWeek.monday)} 星期一 Senin</h1>`;currentWeek.days.forEach((d,i)=>{h+=`<div style="border:1.5px solid #000;padding:12px;margin-bottom:12px"><b>星期${cn[i]} ${idn[i]} ${formatDate(d.date)} 用餐${d.diners} 外帶${d.takeaway}</b>${d.dishes.map(dd=>`<div style="border-bottom:1px dashed #aaa;padding:6px 0;font-size:0.9em">${dd.name} / ${dd.indo||''}<br><small>備註:${dd.note||''}</small></div>`).join('')}</div>`;});createPDF(h);}
function exportPDFSingle(i){let m=weeklyMenus[i];let h=`<h1>每週菜單 ${m.monday} 星期一</h1>`;m.days.forEach((d,di)=>{h+=`<div style="border:1.5px solid #000;padding:12px;margin-bottom:12px"><b>星期${cn[di]} ${idn[di]} ${d.date}</b>${d.dishes.map(dd=>`<div>${dd.name} / ${dd.indo||''}<br><small>${dd.note||''}</small></div>`).join('')}</div>`;});createPDF(h);}
function downloadPDF(){let content=document.querySelector('#pdfOverlay.pdf-a4').innerHTML;let html=`<!DOCTYPE html><html><head><meta charset="utf-8"><style>@page{size:A4;margin:20mm 15mm}body{font-family:sans-serif;font-size:16pt}</style></head><body>${content}</body></html>`;let blob=new Blob([html],{type:'text/html'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`每週菜單_${formatDate(new Date())}.html`;a.click();alert('已下載，用瀏覽器打開再選 另存為PDF 即可');}

function switchPage(p){document.querySelectorAll('.page').forEach(e=>e.style.display='none');document.getElementById('p-'+p).style.display='block';document.querySelectorAll('.nav-item').forEach((e,i)=>{e.classList.remove('active');if(['weekly','library','mymenus','settings'][i]===p)e.classList.add('active');});}
function renderSettings(){let c=document.getElementById('catSettings');c.innerHTML=cats.map((cat,i)=>`<div class="card row" style="justify-content:space-between"><span style="flex:1">${i+1}. ${cat}</span><span class="row"><button class="btn-ghost btn-icon" onclick="moveCat(${i},-1)">↑</button><button class="btn-ghost btn-icon" onclick="moveCat(${i},1)">↓</button><button class="btn-ghost" onclick="deleteCat(${i})">刪除</button></span></div>`).join('');}
function moveCat(i,dir){let ni=i+dir;if(ni<0||ni>=cats.length)return;let tmp=cats[i];cats[i]=cats[ni];cats[ni]=tmp;localStorage.setItem('cats',JSON.stringify(cats));renderSettings();renderLibrary();}
function addCategory(){let n=document.getElementById('newCatName').value.trim();if(!n)return;cats.push(n);localStorage.setItem('cats',JSON.stringify(cats));document.getElementById('newCatName').value='';renderSettings();renderLibrary();}
function deleteCat(i){let cat=cats[i];if(!confirm(`刪除「${cat}」會移到其他`))return;dishes.forEach(d=>{if(d.cat===cat)d.cat='其他 Lainnya';});if(!cats.includes('其他 Lainnya'))cats.push('其他 Lainnya');cats.splice(i,1);localStorage.setItem('cats',JSON.stringify(cats));localStorage.setItem('dishes',JSON.stringify(dishes));renderSettings();renderLibrary();}
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light');}
// 修正2 字體
function setFontSize(v){document.documentElement.style.fontSize=v+'px';document.body.style.fontSize=v+'px';document.getElementById('fontVal').innerText=v;localStorage.setItem('fontSize',v);}
function loadAvatar(){let av=localStorage.getItem('avatar');if(av)document.getElementById('hdrAvatar').src=av;let th=localStorage.getItem('theme');if(th==='dark')document.body.classList.add('dark');let fs=localStorage.getItem('fontSize');if(fs){setFontSize(fs);document.getElementById('fontRange').value=fs;}}
// 修正5 頭像拖拉縮放
let img=new Image(),scale=1,px=0,py=0,dragging=false,lastX=0,lastY=0;
let canvas=document.getElementById('avatarCanvas'),wrap=document.getElementById('canvasWrap');
function drawAvatar(){let ctx=canvas.getContext('2d');ctx.clearRect(0,0,400,400);let w=img.width*scale,h=img.height*scale;ctx.drawImage(img,200-w/2+px,200-h/2+py,w,h);}
document.getElementById('avatarFile').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{img.src=ev.target.result;img.onload=()=>{scale=1;px=0;py=0;drawAvatar();};};r.readAsDataURL(f);});
document.getElementById('zoom').addEventListener('input',e=>{scale=+e.target.value;drawAvatar();});
function getPos(e){let t=e.touches?e.touches[0]:e;return {x:t.clientX,y:t.clientY};}
canvas.addEventListener('mousedown',e=>{dragging=true;let p=getPos(e);lastX=p.x;lastY=p.y;canvas.style.cursor='grabbing';});
canvas.addEventListener('touchstart',e=>{dragging=true;let p=getPos(e);lastX=p.x;lastY=p.y;},{passive:false});
window.addEventListener('mousemove',e=>{if(!dragging)return;let p=getPos(e);px+=p.x-lastX;py+=p.y-lastY;lastX=p.x;lastY=p.y;drawAvatar();});
window.addEventListener('touchmove',e=>{if(!dragging)return;e.preventDefault();let p=getPos(e);px+=p.x-lastX;py+=p.y-lastY;lastX=p.x;lastY=p.y;drawAvatar();},{passive:false});
window.addEventListener('mouseup',()=>{dragging=false;canvas.style.cursor='grab';});window.addEventListener('touchend',()=>{dragging=false;});
function resetAvatarPos(){px=0;py=0;scale=1;document.getElementById('zoom').value=1;drawAvatar();}
function saveAvatar(){let d=canvas.toDataURL('image/png');localStorage.setItem('avatar',d);document.getElementById('hdrAvatar').src=d;alert('頭像已儲存並設為App Icon');}
init();
</script>
</body>
</html>
