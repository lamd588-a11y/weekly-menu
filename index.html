<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>每週菜單</title>
  
  <!-- iOS PWA 支援設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="每週菜單">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #1c1c1e;
      --border-color: #e5e5ea;
      --primary-color: #007aff;
      --danger-color: #ff3b30;
      --secondary-text: #8e8e93;
      --font-size: 16px;
    }

    [data-theme="dark"] {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --text-color: #ffffff;
      --border-color: #38383a;
      --secondary-text: #8e8e93;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--font-size);
      padding-bottom: 80px;
      padding-top: env(safe-area-inset-top);
      -webkit-user-select: none;
    }

    /* iPhone 容器樣式微調 */
    .app-container {
      max-width: 440px; /* 適配 iPhone Pro Max 寬度 */
      margin: 0 auto;
      padding: 16px;
      box-sizing: border-box;
    }

    /* 頁首與頭像 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #ccc;
      border: 2px solid var(--primary-color);
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    /* 頁籤切換 */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 1000;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--secondary-text);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 16px;
    }

    .tab-btn.active {
      color: var(--primary-color);
    }

    /* 卡片與區塊 */
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    .day-card {
      margin-bottom: 12px;
    }

    .day-header {
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .dish-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .dish-line:last-child {
      border-bottom: none;
    }

    .dish-translation {
      font-size: 0.85em;
      color: var(--secondary-text);
      display: block;
    }

    .people-count {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--secondary-text);
    }

    /* 表單元素 */
    select, input, button {
      font-size: inherit;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-color);
    }

    button.btn-primary {
      background-color: var(--primary-color);
      color: #fff;
      border: none;
      font-weight: bold;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
    }

    /* 設定頁面樣式 */
    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .category-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background: var(--bg-color);
      margin-bottom: 6px;
      border-radius: 6px;
      cursor: grab;
    }

    /* 列印與 PDF 模式控制 */
    @media print {
      .tab-bar, .no-print, button {
        display: none !important;
      }
      body {
        background: #fff !important;
        color: #000 !important;
        padding: 0;
      }
      .card {
        box-shadow: none;
        border: 1px solid #ccc;
      }
      .app-container {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 標頭 -->
  <header class="no-print">
    <div class="header-title">
      <img id="userAvatar" class="avatar" src="icon.png" alt="Logo">
      <h1>每週菜單</h1>
    </div>
    <button onclick="exportPDFModal()" style="font-size:0.8rem;">匯出 PDF</button>
  </header>

  <!-- 分頁 1: 每週菜單 -->
  <div id="pageMenu" class="page">
    <div class="card no-print">
      <label><b>選擇每週開始日期 (週一)：</b></label>
      <input type="date" id="weekStartDate" onchange="updateWeekDates()" style="width:100%; margin-top:8px;">
    </div>

    <div id="weeklyDaysContainer">
      <!-- 7天菜單動態生成於此 -->
    </div>
  </div>

  <!-- 分頁 2: 菜式與分類管理 -->
  <div id="pageDishes" class="page" style="display:none;">
    <div class="card">
      <h3>新增/管理菜式</h3>
      <input type="text" id="newDishName" placeholder="菜式中文名稱" style="width:68%;">
      <select id="newDishCategory" style="width:28%;"></select>
      <input type="text" id="newDishIndo" placeholder="印尼文翻譯 (選填)" style="width:98%; margin-top:8px;">
      <button class="btn-primary" onclick="addDish()">新增菜式</button>
    </div>

    <div class="card">
      <h3>菜式分類列表</h3>
      <div id="dishCategorySections"></div>
    </div>
  </div>

  <!-- 分頁 3: 設定 -->
  <div id="pageSettings" class="page" style="display:none;">
    <div class="card">
      <h3>系統設定</h3>
      
      <div class="setting-item">
        <span>自訂頭像</span>
        <input type="file" id="avatarInput" accept="image/*" onchange="uploadAvatar(event)" style="width:150px;">
      </div>

      <div class="setting-item">
        <span>深色模式</span>
        <input type="checkbox" id="themeToggle" onchange="toggleTheme(this.checked)">
      </div>

      <div class="setting-item">
        <span>字體大小</span>
        <select id="fontSizeSelect" onchange="changeFontSize(this.value)">
          <option value="14px">小</option>
          <option value="16px" selected>中</option>
          <option value="18px">大</option>
        </select>
      </div>
    </div>

    <div class="card">
      <h3>分類排序與管理</h3>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="text" id="newCatName" placeholder="新分類名稱" style="flex:1;">
        <button onclick="addCategory()">新增</button>
      </div>
      <small style="color:var(--secondary-text);">提示：可上下拖拉分類改變順序</small>
      <div id="categoryDragList" style="margin-top:10px;"></div>
    </div>
  </div>
</div>

<!-- 底部導覽列 -->
<nav class="tab-bar no-print">
  <button class="tab-btn active" onclick="switchTab('Menu', this)">每週菜單</button>
  <button class="tab-btn" onclick="switchTab('Dishes', this)">菜式庫</button>
  <button class="tab-btn" onclick="switchTab('Settings', this)">設定</button>
</nav>

<script>
  // 初始化預設資料
  let defaultCategories = ["雞", "牛", "豬", "魚", "菜", "湯", "其他"];
  let categories = JSON.parse(localStorage.getItem('menu_categories')) || defaultCategories;
  
  let defaultDishes = [
    { id: 1, name: "蒸水蛋", cat: "菜", indo: "Telur Kukus", lastCooked: "" },
    { id: 2, name: "炒青菜", cat: "菜", indo: "Sayur Tumis", lastCooked: "" },
    { id: 3, name: "紅燒牛肉", cat: "牛", indo: "Daging Sapi Semur", lastCooked: "" },
    { id: 4, name: "煎黃花魚", cat: "魚", indo: "Ikan Goreng", lastCooked: "" }
  ];
  let dishes = JSON.parse(localStorage.getItem('menu_dishes')) || defaultDishes;

  // 儲存 7 天菜單內容
  let weeklyPlan = JSON.parse(localStorage.getItem('weekly_plan')) || Array(7).fill(null).map(() => ({
    dishes: [],
    diners: 2,
    takeouts: 0
  }));

  const daysOfWeek = ["星期一", "星期二", "星期三", "星期四", "星期五", "星期六", "星期日"];

  // 頁面載入初始化
  window.onload = function() {
    loadSettings();
    renderCategorySelects();
    renderWeeklyDays();
    renderDishList();
    renderCategoryDragList();
  };

  function switchTab(tabName, btn) {
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('page' + tabName).style.display = 'block';
    btn.classList.add('active');
  }

  // 渲染每週菜單 UI
  function renderWeeklyDays() {
    const container = document.getElementById('weeklyDaysContainer');
    container.innerHTML = '';
    
    const startDateInput = document.getElementById('weekStartDate').value;
    let baseDate = startDateInput ? new Date(startDateInput) : getMonday(new Date());

    daysOfWeek.forEach((dayName, idx) => {
      let currentDate = new Date(baseDate);
      currentDate.setDate(baseDate.getDate() + idx);
      let dateStr = `${currentDate.getMonth()+1}月${currentDate.getDate()}日`;

      let dayData = weeklyPlan[idx];

      let card = document.createElement('div');
      card.className = 'card day-card';
      card.innerHTML = `
        <div class="day-header">
          <span>${dayName} (${dateStr})</span>
          <button onclick="addDishToDay(${idx})" style="font-size:0.75rem;">+ 選擇菜式</button>
        </div>
        <div id="dayDishes-${idx}">
          ${dayData.dishes.map((dId, dIdx) => {
            let dish = dishes.find(x => x.id === dId);
            if(!dish) return '';
            return `
              <div class="dish-line">
                <div>
                  <span class="zh-text">${dish.name}</span>
                  <span class="id-text dish-translation">${dish.indo || ''}</span>
                </div>
                <button onclick="removeDishFromDay(${idx},${dIdx})" class="no-print" style="color:var(--danger-color); border:none; background:none;">✕</button>
              </div>
            `;
          }).join('')}
        </div>
        <div class="people-count">
          <label>用餐人數: <input type="number" value="${dayData.diners}" min="0" style="width:40px;" onchange="updatePeople(${idx}, 'diners', this.value)"></label>
          <label>外帶人數: <input type="number" value="${dayData.takeouts}" min="0" style="width:40px;" onchange="updatePeople(${idx}, 'takeouts', this.value)"></label>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function getMonday(d) {
    d = new Date(d);
    let day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6 : 1);
    return new Date(d.setDate(diff));
  }

  function updateWeekDates() {
    renderWeeklyDays();
  }

  // 選擇菜式加入某天
  function addDishToDay(dayIdx) {
    let options = dishes.map(d => `${d.name} [${d.cat}] ${d.lastCooked ? '(上次:'+d.lastCooked+')' : ''}`).join('\n');
    let choice = prompt("請輸入欲加入的菜式名稱：\n\n可選菜式：\n" + options);
    if(choice) {
      let found = dishes.find(d => d.name.trim() === choice.trim());
      if(found) {
        weeklyPlan[dayIdx].dishes.push(found.id);
        // 更新上次烹飪日期為今天
        let today = new Date().toISOString().split('T')[0];
        found.lastCooked = today;
        saveData();
        renderWeeklyDays();
        renderDishList();
      } else {
        alert("找不到該菜式！");
      }
    }
  }

  function removeDishFromDay(dayIdx, dishIdx) {
    weeklyPlan[dayIdx].dishes.splice(dishIdx, 1);
    saveData();
    renderWeeklyDays();
  }

  function updatePeople(dayIdx, type, val) {
    weeklyPlan[dayIdx][type] = parseInt(val) || 0;
    saveData();
  }

  // 菜式與分類管理
  function addDish() {
    let name = document.getElementById('newDishName').value.trim();
    let cat = document.getElementById('newDishCategory').value;
    let indo = document.getElementById('newDishIndo').value.trim();
    if(!name) return alert("請輸入菜式名稱");

    dishes.push({
      id: Date.now(),
      name: name,
      cat: cat,
      indo: indo,
      lastCooked: ""
    });
    saveData();
    renderDishList();
    document.getElementById('newDishName').value = '';
    document.getElementById('newDishIndo').value = '';
  }

  function renderDishList() {
    const container = document.getElementById('dishCategorySections');
    container.innerHTML = '';

    categories.forEach(cat => {
      let catDishes = dishes.filter(d => d.cat === cat);
      let sec = document.createElement('div');
      sec.style.marginBottom = '12px';
      sec.innerHTML = `
        <h4 style="margin:6px 0; color:var(--primary-color);">${cat}</h4>
        ${catDishes.length === 0 ? '<small style="color:var(--secondary-text)">暫無菜式</small>' : ''}
        ${catDishes.map(d => `
          <div class="dish-line">
            <div>
              <span>${d.name}</span>
              <small style="color:var(--secondary-text);">${d.indo ? ' ('+d.indo+')' : ''}</small>
              <br><small style="color:var(--secondary-text)">上次烹飪: ${d.lastCooked || '未紀錄'}</small>
            </div>
            <button onclick="deleteDish(${d.id})" style="color:var(--danger-color); border:none; background:none;">刪除</button>
          </div>
        `).join('')}
      `;
      container.appendChild(sec);
    });
  }

  function deleteDish(id) {
    if(confirm("確定刪除此菜式？")) {
      dishes = dishes.filter(d => d.id !== id);
      saveData();
      renderDishList();
      renderWeeklyDays();
    }
  }

  function renderCategorySelects() {
    const sel = document.getElementById('newDishCategory');
    sel.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
  }

  // 分類排序與拖拉 (Drag and Drop)
  function renderCategoryDragList() {
    const container = document.getElementById('categoryDragList');
    container.innerHTML = '';
    categories.forEach((cat, index) => {
      let item = document.createElement('div');
      item.className = 'category-list-item';
      item.draggable = true;
      item.dataset.index = index;
      item.innerHTML = `
        <span>☰ ${cat}</span>
        ${cat !== '其他' ? `<button onclick="deleteCategory('${cat}')" style="color:var(--danger-color); border:none; background:none;">刪除</button>` : '<small>(預設)</small>'}
      `;

      item.ondragstart = (e) => e.dataTransfer.setData('text/plain', index);
      item.ondragover = (e) => e.preventDefault();
      item.ondrop = (e) => {
        e.preventDefault();
        let fromIdx = e.dataTransfer.getData('text/plain');
        let toIdx = index;
        let moved = categories.splice(fromIdx, 1)[0];
        categories.splice(toIdx, 0, moved);
        saveData();
        renderCategoryDragList();
        renderCategorySelects();
        renderDishList();
      };

      container.appendChild(item);
    });
  }

  function addCategory() {
    let name = document.getElementById('newCatName').value.trim();
    if(name && !categories.includes(name)) {
      categories.push(name);
      saveData();
      renderCategoryDragList();
      renderCategorySelects();
      renderDishList();
      document.getElementById('newCatName').value = '';
    }
  }

  function deleteCategory(catName) {
    if (catName === '其他') return alert("「其他」分類無法刪除。");
    
    // 通知並轉移至「其他」
    if(confirm(`確定刪除分類「${catName}」？\n刪除後，該分類下的所有菜式將自動移至「其他」分類。`)) {
      dishes.forEach(d => {
        if(d.cat === catName) d.cat = '其他';
      });
      categories = categories.filter(c => c !== catName);
      saveData();
      renderCategoryDragList();
      renderCategorySelects();
      renderDishList();
    }
  }

  // 設定與自訂
  function uploadAvatar(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('userAvatar').src = e.target.result;
        localStorage.setItem('user_avatar', e.target.result);
      };
      reader.readAsDataURL(file);
    }
  }

  function toggleTheme(isDark) {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    localStorage.setItem('theme_dark', isDark);
  }

  function changeFontSize(size) {
    document.documentElement.style.setProperty('--font-size', size);
    localStorage.setItem('app_font_size', size);
  }

  function loadSettings() {
    let savedAvatar = localStorage.getItem('user_avatar');
    if(savedAvatar) document.getElementById('userAvatar').src = savedAvatar;

    let isDark = localStorage.getItem('theme_dark') === 'true';
    document.getElementById('themeToggle').checked = isDark;
    toggleTheme(isDark);

    let fontSize = localStorage.getItem('app_font_size') || '16px';
    document.getElementById('fontSizeSelect').value = fontSize;
    changeFontSize(fontSize);
  }

  // 匯出 PDF 功能
  function exportPDFModal() {
    let lang = prompt("請選擇匯出 PDF 語言：\n1: 中文\n2: 印尼文 (Bahasa Indonesia)", "1");
    if(lang === "1") {
      setLanguageDisplay('zh');
      window.print();
    } else if(lang === "2") {
      setLanguageDisplay('id');
      window.print();
    }
    // 列印完成後復原顯示
    setTimeout(() => setLanguageDisplay('all'), 1000);
  }

  function setLanguageDisplay(lang) {
    let zhElems = document.querySelectorAll('.zh-text');
    let idElems = document.querySelectorAll('.id-text');

    if(lang === 'zh') {
      zhElems.forEach(el => el.style.display = 'inline');
      idElems.forEach(el => el.style.display = 'none');
    } else if(lang === 'id') {
      zhElems.forEach(el => el.style.display = 'none');
      idElems.forEach(el => el.style.display = 'inline');
    } else {
      zhElems.forEach(el => el.style.display = 'inline');
      idElems.forEach(el => el.style.display = 'block');
    }
  }

  function saveData() {
    localStorage.setItem('menu_categories', JSON.stringify(categories));
    localStorage.setItem('menu_dishes', JSON.stringify(dishes));
    localStorage.setItem('weekly_plan', JSON.stringify(weeklyPlan));
  }
</script>
</body>
</html>
