<!DOCTYPE html>
<html lang="zh-HK" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>每週菜單</title>
  
  <!-- PWA 設定 -->
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIuavjUmAseimnOS4uSIsCiAgInNob3J0X25hbWUiIjogIuavjUmAseimnOS4uSIsCiAgInN0YXJ0X3VybCI6ICIuL2luZGV4Lmh0bWwiLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiNmOGfafmYiLAogICJ0aGVtZV9jb2xvciI6ICIjNGY0NmU1IiwKICAiaWNvbnMiOiBbCiAgICB7CiAgICAgICJzcmMiOiAiaWNvbi5wbmciLAogICAgICAic2l6ZXMiOiAiMTkyeDE5MiIsCiAgICAgICJ0eXBlIjogImltYWdlL3BuZyIKICAgIH0KICBdCn0=">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#4f46e5' }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Cropper.js (頭像裁切/縮放) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <!-- SortableJS (分類拖拉排序) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <!-- html2pdf.js (匯出PDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* iPhone 18 Pro Max 螢幕尺寸模擬與適應 */
    body {
      max-width: 440px; /* iPhone 18 Pro Max / Plus 寬度規格 */
      margin: 0 auto;
      font-size: var(--app-font-size, 16px);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-full flex flex-col transition-colors duration-200">

  <!-- 頂部導航欄 -->
  <header class="bg-white dark:bg-slate-800 shadow-sm border-b border-slate-200 dark:border-slate-700 px-4 py-3 pt-safe flex justify-between items-center sticky top-0 z-10">
    <div class="flex items-center space-x-3">
      <img id="headerAvatar" src="https://via.placeholder.com/150" class="w-10 h-10 rounded-full object-cover border-2 border-indigo-500 shadow-sm" alt="Avatar">
      <h1 class="font-bold text-xl tracking-tight text-indigo-600 dark:text-indigo-400">每週菜單</h1>
    </div>
    <div class="flex space-x-2">
      <button onclick="saveWeeklyMenu()" title="儲存菜單" class="p-2.5 rounded-full bg-indigo-50 text-indigo-600 dark:bg-slate-700 dark:text-indigo-400 hover:bg-indigo-100">
        <i class="fa-solid fa-floppy-disk text-lg"></i>
      </button>
      <button onclick="exportPDF()" title="匯出 PDF" class="p-2.5 rounded-full bg-emerald-50 text-emerald-600 dark:bg-slate-700 dark:text-emerald-400 hover:bg-emerald-100">
        <i class="fa-solid fa-file-pdf text-lg"></i>
      </button>
    </div>
  </header>

  <!-- 主要內容區域 -->
  <main class="flex-1 overflow-y-auto p-4 pb-24 space-y-6" id="appMain">

    <!-- 頁籤切換：本週菜單 / 我的菜單 / 菜式庫 / 設定 -->
    <div class="flex bg-slate-200 dark:bg-slate-800 p-1 rounded-xl text-sm font-medium text-center">
      <button onclick="switchTab('editor')" id="tab-editor" class="flex-1 py-2 rounded-lg bg-white dark:bg-slate-700 shadow-sm text-indigo-600 dark:text-indigo-400 font-semibold">編寫菜單</button>
      <button onclick="switchTab('saved')" id="tab-saved" class="flex-1 py-2 rounded-lg text-slate-500 dark:text-slate-400">我的菜單</button>
      <button onclick="switchTab('dishes')" id="tab-dishes" class="flex-1 py-2 rounded-lg text-slate-500 dark:text-slate-400">菜式庫</button>
      <button onclick="switchTab('settings')" id="tab-settings" class="flex-1 py-2 rounded-lg text-slate-500 dark:text-slate-400">設定</button>
    </div>

    <!-- 1. 每週菜單編輯頁 -->
    <section id="page-editor" class="space-y-4">
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">選擇起始星期一：</label>
        <input type="date" id="startDatePicker" onchange="handleDateSelect(this.value)" class="w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <!-- 7天菜單列表 -->
      <div id="weeklyContainer" class="space-y-4"></div>
    </section>

    <!-- 2. 我的菜單頁 (最多10張) -->
    <section id="page-saved" class="hidden space-y-3">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-sm font-semibold text-slate-500">已儲存菜單 (最多 10 張)</h2>
        <span id="savedCount" class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-bold">0/10</span>
      </div>
      <div id="savedList" class="space-y-3"></div>
    </section>

    <!-- 3. 菜式庫頁 -->
    <section id="page-dishes" class="hidden space-y-4">
      <button onclick="openDishModal()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold shadow-md flex justify-center items-center gap-2">
        <i class="fa-solid fa-plus"></i> 新增菜式
      </button>

      <!-- 按分類展示菜式 -->
      <div id="dishesGroupedContainer" class="space-y-4"></div>
    </section>

    <!-- 4. 設定頁 -->
    <section id="page-settings" class="hidden space-y-6">
      <!-- 頭像設定 -->
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 space-y-3">
        <h3 class="font-bold text-sm">自訂頭像</h3>
        <div class="flex items-center gap-4">
          <img id="settingsAvatarPreview" src="https://via.placeholder.com/150" class="w-16 h-16 rounded-full object-cover border-2 border-indigo-500">
          <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="handleAvatarSelect(event)">
          <button onclick="document.getElementById('avatarInput').click()" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 rounded-xl text-sm font-semibold">選擇相片</button>
        </div>
      </div>

      <!-- 深淺色切換 -->
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex justify-between items-center">
        <span class="font-bold text-sm">深色模式</span>
        <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
          <i class="fa-solid fa-moon text-lg dark:hidden"></i>
          <i class="fa-solid fa-sun text-lg hidden dark:block"></i>
        </button>
      </div>

      <!-- 字體大小設定 -->
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 space-y-2">
        <div class="flex justify-between text-sm font-bold">
          <span>系統字體大小</span>
          <span id="fontSizeVal">16px</span>
        </div>
        <input type="range" min="14" max="22" value="16" id="fontSizeSlider" oninput="changeFontSize(this.value)" class="w-full accent-indigo-600">
      </div>

      <!-- 分類管理 (拖拉排序 / 增刪) -->
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-sm">分類管理 (可拖拉排序)</h3>
          <button onclick="addNewCategoryPrompt()" class="text-xs bg-indigo-50 text-indigo-600 dark:bg-slate-700 dark:text-indigo-400 px-2.5 py-1 rounded-lg font-bold">+ 新增分類</button>
        </div>
        <ul id="categorySortableList" class="space-y-2"></ul>
      </div>
    </section>

  </main>

  <!-- 點擊選擇菜式彈窗Modal -->
  <div id="selectDishModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex flex-col justify-end">
    <div class="bg-white dark:bg-slate-800 rounded-t-3xl max-h-[80vh] flex flex-col p-4 space-y-3 animate-slide-up">
      <div class="flex justify-between items-center pb-2 border-b border-slate-200 dark:border-slate-700">
        <h3 class="font-bold text-lg" id="modalDayTitle">選擇菜式</h3>
        <button onclick="closeSelectDishModal()" class="text-slate-400 p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div id="selectDishCategoryList" class="overflow-y-auto flex-1 space-y-4"></div>
    </div>
  </div>

  <!-- 菜式編輯 Modal -->
  <div id="dishModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl">
      <h3 class="font-bold text-lg" id="dishModalTitle">新增菜式</h3>
      <input type="hidden" id="editDishId">
      <div>
        <label class="block text-xs font-semibold mb-1">中文名稱</label>
        <input type="text" id="dishZhInput" class="w-full p-2.5 border rounded-xl dark:bg-slate-700 dark:border-slate-600 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">印尼文名稱 (Bahasa Indonesia)</label>
        <input type="text" id="dishInInput" placeholder="預留填寫印尼文" class="w-full p-2.5 border rounded-xl dark:bg-slate-700 dark:border-slate-600 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">所屬分類</label>
        <select id="dishCategorySelect" class="w-full p-2.5 border rounded-xl dark:bg-slate-700 dark:border-slate-600 outline-none"></select>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeDishModal()" class="flex-1 py-2.5 bg-slate-100 dark:bg-slate-700 rounded-xl font-bold">取消</button>
        <button onclick="saveDish()" class="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl font-bold">儲存</button>
      </div>
    </div>
  </div>

  <!-- 頭像裁切 Modal -->
  <div id="cropperModal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col p-4">
    <div class="flex-1 relative max-h-[70vh] my-auto">
      <img id="cropperImage" class="max-w-full">
    </div>
    <div class="flex justify-between items-center gap-4 pt-4">
      <button onclick="closeCropperModal()" class="flex-1 py-3 bg-slate-600 text-white rounded-xl font-bold">取消</button>
      <button onclick="cropAndSaveAvatar()" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold">裁切並儲存</button>
    </div>
  </div>

  <!-- 隱藏的 PDF 生成模板 (專用放大 A4 列印樣式) -->
  <div class="hidden">
  <div id="pdfTemplate" class="p-6 bg-white text-black font-sans space-y-4" style="width: 750px; box-sizing: border-box; font-size: 16px;">
    <div class="text-center border-b-2 border-slate-800 pb-3">
      <h1 class="text-2xl font-extrabold tracking-wide">每週菜單 (Menu Mingguan)</h1>
      <p class="text-sm font-bold text-slate-600 mt-1" id="pdfDateRange"></p>
    </div>
    <table class="w-full border-collapse border-2 border-slate-800 text-left" style="table-layout: fixed;">
      <thead>
        <tr class="bg-slate-100 border-b-2 border-slate-800">
          <th class="border border-slate-800 p-2.5 w-3/12">星期 / 日期<br><span class="text-xs font-normal">Hari / Tanggal</span></th>
          <th class="border border-slate-800 p-2.5 w-3/12">人數<br><span class="text-xs font-normal">Orang</span></th>
          <th class="border border-slate-800 p-2.5 w-6/12">菜式內容<br><span class="text-xs font-normal">Menu Makanan</span></th>
        </tr>
      </thead>
      <tbody id="pdfTableBody"></tbody>
    </table>
  </div>
</div>
  <!-- App 核心邏輯 -->
  <script>
    // 預設 10 個分類
    const DEFAULT_CATEGORIES = ['雞', '牛', '豬', '魚', '海鮮(魚除外)', '疏菜', '湯水', '西式', '罐頭', '其他'];

    // 預設 5 款菜式 (分佈於 3 個分類內)
    const DEFAULT_DISHES = [
      { id: 'd1', nameZh: '海南雞', nameIn: 'Ayam Hainan', category: '雞', lastCooked: '' },
      { id: 'd2', nameZh: '咖喱牛肉', nameIn: 'Rendang Sapi', category: '牛', lastCooked: '' },
      { id: 'd3', nameZh: '清蒸海鱸魚', nameIn: 'Ikan Kukus', category: '魚', lastCooked: '' },
      { id: 'd4', nameZh: '白切雞', nameIn: 'Ayam Rebus', category: '雞', lastCooked: '' },
      { id: 'd5', nameZh: '黑椒牛柳粒', nameIn: 'Sapi Lada Hitam', category: '牛', lastCooked: '' }
    ];

    // 全局狀態管理
    let state = {
      categories: JSON.parse(localStorage.getItem('categories')) || DEFAULT_CATEGORIES,
      dishes: JSON.parse(localStorage.getItem('dishes')) || DEFAULT_DISHES,
      savedMenus: JSON.parse(localStorage.getItem('savedMenus')) || {}, // Key: Monday Date string
      currentMenu: {
        mondayDate: getNextMonday(new Date()),
        days: Array(7).fill(null).map(() => ({ dishes: [], dineIn: '', takeOut: '' }))
      },
      avatar: localStorage.getItem('avatar') || 'https://via.placeholder.com/150',
      fontSize: localStorage.getItem('fontSize') || '16'
    };

    let activeDayIndexForSelect = null;
    let cropper = null;

    // 初始化 App
    document.addEventListener('DOMContentLoaded', () => {
      applyThemeAndSettings();
      initDateSelection();
      renderWeeklyEditor();
      renderCategoriesSetting();
    });

    // 取得指定日期當週的星期一
    function getNextMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(date.setDate(diff));
      return monday.toISOString().split('T')[0];
    }

    // 初始化日期選擇，預設當週一
    function initDateSelection() {
      const dateInput = document.getElementById('startDatePicker');
      dateInput.value = state.currentMenu.mondayDate;
    }

    // 處理日期選擇 (要求必須是星期一)
    function handleDateSelect(val) {
      if (!val) return;
      const selected = new Date(val);
      if (selected.getDay() !== 1) { // 1 代表星期一
        alert('請選擇星期一作為起始日！其他六天預設不能選擇。');
        document.getElementById('startDatePicker').value = state.currentMenu.mondayDate;
        return;
      }
      state.currentMenu.mondayDate = val;
      renderWeeklyEditor();
    }

    // 渲染每週菜單編輯器
    function renderWeeklyEditor() {
      const container = document.getElementById('weeklyContainer');
      container.innerHTML = '';
      const daysOfWeek = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
      const baseDate = new Date(state.currentMenu.mondayDate);

      daysOfWeek.forEach((dayName, idx) => {
        const currentDate = new Date(baseDate);
        currentDate.setDate(baseDate.getDate() + idx);
        const dateStr = currentDate.toISOString().split('T')[0];
        const dayData = state.currentMenu.days[idx];

        const card = document.createElement('div');
        card.className = "bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 space-y-3";
        
        let dishesHtml = dayData.dishes.map((dishId, dIdx) => {
          const dish = state.dishes.find(d => d.id === dishId);
          if (!dish) return '';
          return `
            <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-700/50 p-2.5 rounded-xl text-sm">
              <div>
                <span class="font-bold block">${dish.nameZh}</span>
                ${dish.nameIn ? `<span class="text-xs text-slate-500 dark:text-slate-400 block">${dish.nameIn}</span>` : ''}
              </div>
              <button onclick="removeDishFromDay(${idx}, ${dIdx})" class="text-rose-500 p-1"><i class="fa-solid fa-circle-minus"></i></button>
            </div>
          `;
        }).join('');

        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-2">
            <span class="font-bold text-indigo-600 dark:text-indigo-400">${dayName} <span class="text-xs font-normal text-slate-400">(${dateStr})</span></span>
            <div class="flex gap-2 text-xs">
              <input type="number" placeholder="堂食人數" value="${dayData.dineIn}" onchange="updatePeople(${idx}, 'dineIn', this.value)" class="w-20 p-1 border rounded dark:bg-slate-700 dark:border-slate-600 text-center">
              <input type="number" placeholder="外帶人數" value="${dayData.takeOut}" onchange="updatePeople(${idx}, 'takeOut', this.value)" class="w-20 p-1 border rounded dark:bg-slate-700 dark:border-slate-600 text-center">
            </div>
          </div>
          <div class="space-y-2">${dishesHtml}</div>
          <button onclick="openSelectDishModal(${idx})" class="w-full py-2 border-2 border-dashed border-indigo-200 dark:border-slate-600 text-indigo-600 dark:text-indigo-400 rounded-xl text-xs font-bold flex justify-center items-center gap-1 hover:bg-indigo-50">
            <i class="fa-solid fa-plus"></i> 一點即選菜式
          </button>
        `;
        container.appendChild(card);
      });
    }

    function updatePeople(dayIdx, field, val) {
      state.currentMenu.days[dayIdx][field] = val;
    }

    function removeDishFromDay(dayIdx, dishIdx) {
      state.currentMenu.days[dayIdx].dishes.splice(dishIdx, 1);
      renderWeeklyEditor();
    }

    // 開啟一點即選彈窗
    function openSelectDishModal(dayIdx) {
      activeDayIndexForSelect = dayIdx;
      const modal = document.getElementById('selectDishModal');
      const container = document.getElementById('selectDishCategoryList');
      container.innerHTML = '';

      state.categories.forEach(cat => {
        const catDishes = state.dishes.filter(d => d.category === cat);
        if (catDishes.length === 0) return;

        const group = document.createElement('div');
        group.className = "space-y-2";
        group.innerHTML = `<h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">${cat}</h4>`;

        const grid = document.createElement('div');
        grid.className = "grid grid-cols-2 gap-2";

        catDishes.forEach(dish => {
          const btn = document.createElement('button');
          btn.className = "p-2.5 bg-slate-100 dark:bg-slate-700 rounded-xl text-left hover:bg-indigo-50 dark:hover:bg-slate-600 transition flex flex-col justify-between";
          btn.onclick = () => selectDishForDay(dish.id);
          btn.innerHTML = `
            <div>
              <div class="font-bold text-sm">${dish.nameZh}</div>
              ${dish.nameIn ? `<div class="text-xs text-slate-400">${dish.nameIn}</div>` : ''}
            </div>
            ${dish.lastCooked ? `<div class="text-[10px] text-amber-600 dark:text-amber-400 mt-1">上次: ${dish.lastCooked}</div>` : '<div class="text-[10px] text-slate-400 mt-1">從未烹飪</div>'}
          `;
          grid.appendChild(btn);
        });

        group.appendChild(grid);
        container.appendChild(group);
      });

      modal.classList.remove('hidden');
    }

    function closeSelectDishModal() {
      document.getElementById('selectDishModal').classList.add('hidden');
    }

    // 一點即選選定菜式
    function selectDishForDay(dishId) {
      if (activeDayIndexForSelect !== null) {
        state.currentMenu.days[activeDayIndexForSelect].dishes.push(dishId);
        renderWeeklyEditor();
        closeSelectDishModal();
      }
    }

    // 儲存每週菜單 (以星期一日期為 Key，上限 10 張)
    function saveWeeklyMenu() {
      const key = state.currentMenu.mondayDate;
      const keys = Object.keys(state.savedMenus);

      if (!keys.includes(key) && keys.length >= 10) {
        alert('最多只能儲存 10 張每週菜單！請先刪除舊菜單。');
        return;
      }

      // 更新菜式庫中菜式的「上次烹飪日期」
      const nowStr = new Date().toISOString().split('T')[0];
      state.currentMenu.days.forEach(d => {
        d.dishes.forEach(did => {
          const dish = state.dishes.find(x => x.id === did);
          if (dish) dish.lastCooked = nowStr;
        });
      });
      localStorage.setItem('dishes', JSON.stringify(state.dishes));

      state.savedMenus[key] = JSON.parse(JSON.stringify(state.currentMenu));
      localStorage.setItem('savedMenus', JSON.stringify(state.savedMenus));
      alert(`菜單 (${key}) 已成功儲存！`);
      renderSavedMenus();
    }

    // 渲染「我的菜單」頁面
    function renderSavedMenus() {
      const container = document.getElementById('savedList');
      const keys = Object.keys(state.savedMenus).sort().reverse();
      document.getElementById('savedCount').innerText = `${keys.length}/10`;
      container.innerHTML = '';

      if (keys.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-400 py-8">暫無已儲存的菜單</p>`;
        return;
      }

      keys.forEach(k => {
        const item = document.createElement('div');
        item.className = "bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex justify-between items-center";
        item.innerHTML = `
          <div>
            <div class="font-bold text-indigo-600 dark:text-indigo-400">菜單周次：${k}</div>
            <div class="text-xs text-slate-400">點擊可載入進行修改</div>
          </div>
          <div class="flex space-x-2">
            <button onclick="loadSavedMenu('${k}')" class="p-2 bg-indigo-50 text-indigo-600 dark:bg-slate-700 dark:text-indigo-400 rounded-lg"><i class="fa-solid fa-pen-to-square"></i></button>
            <button onclick="deleteSavedMenu('${k}')" class="p-2 bg-rose-50 text-rose-600 dark:bg-slate-700 dark:text-rose-400 rounded-lg"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function loadSavedMenu(key) {
      state.currentMenu = JSON.parse(JSON.stringify(state.savedMenus[key]));
      document.getElementById('startDatePicker').value = state.currentMenu.mondayDate;
      switchTab('editor');
      renderWeeklyEditor();
    }

    function deleteSavedMenu(key) {
      if (confirm(`確定要刪除 ${key} 的菜單嗎？`)) {
        delete state.savedMenus[key];
        localStorage.setItem('savedMenus', JSON.stringify(state.savedMenus));
        renderSavedMenus();
      }
    }

    // 渲染菜式庫
    function renderDishesGrouped() {
      const container = document.getElementById('dishesGroupedContainer');
      container.innerHTML = '';

      state.categories.forEach(cat => {
        const catDishes = state.dishes.filter(d => d.category === cat);
        const sec = document.createElement('div');
        sec.className = "bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 space-y-3";
        
        let dishesList = catDishes.map(d => `
          <div class="flex justify-between items-center py-2 border-b border-slate-100 dark:border-slate-700 last:border-0">
            <div>
              <div class="font-bold text-sm">${d.nameZh}</div>
              <div class="text-xs text-slate-400">${d.nameIn || '未填寫印尼文'}</div>
            </div>
            <div class="flex space-x-2">
              <button onclick="openDishModal('${d.id}')" class="p-1.5 text-indigo-600"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteDish('${d.id}')" class="p-1.5 text-rose-500"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `).join('');

        sec.innerHTML = `
          <h3 class="font-bold text-sm text-indigo-600 dark:text-indigo-400 border-b border-slate-100 dark:border-slate-700 pb-1">${cat} (${catDishes.length})</h3>
          <div>${dishesList || '<div class="text-xs text-slate-400 py-2">無菜式</div>'}</div>
        `;
        container.appendChild(sec);
      });
    }

    function openDishModal(id = null) {
      const modal = document.getElementById('dishModal');
      const categorySelect = document.getElementById('dishCategorySelect');
      
      categorySelect.innerHTML = state.categories.map(c => `<option value="${c}">${c}</option>`).join('');

      if (id) {
        const dish = state.dishes.find(d => d.id === id);
        document.getElementById('dishModalTitle').innerText = '修改菜式';
        document.getElementById('editDishId').value = dish.id;
        document.getElementById('dishZhInput').value = dish.nameZh;
        document.getElementById('dishInInput').value = dish.nameIn || '';
        categorySelect.value = dish.category;
      } else {
        document.getElementById('dishModalTitle').innerText = '新增菜式';
        document.getElementById('editDishId').value = '';
        document.getElementById('dishZhInput').value = '';
        document.getElementById('dishInInput').value = '';
      }
      modal.classList.remove('hidden');
    }

    function closeDishModal() {
      document.getElementById('dishModal').classList.add('hidden');
    }

    function saveDish() {
      const id = document.getElementById('editDishId').value;
      const zh = document.getElementById('dishZhInput').value.trim();
      const inName = document.getElementById('dishInInput').value.trim();
      const cat = document.getElementById('dishCategorySelect').value;

      if (!zh) { alert('請輸入中文菜式名稱'); return; }

      if (id) {
        const dish = state.dishes.find(d => d.id === id);
        dish.nameZh = zh;
        dish.nameIn = inName;
        dish.category = cat;
      } else {
        state.dishes.push({
          id: 'd_' + Date.now(),
          nameZh: zh,
          nameIn: inName,
          category: cat,
          lastCooked: ''
        });
      }
      localStorage.setItem('dishes', JSON.stringify(state.dishes));
      closeDishModal();
      renderDishesGrouped();
    }

    function deleteDish(id) {
      if (confirm('確定刪除此菜式？')) {
        state.dishes = state.dishes.filter(d => d.id !== id);
        localStorage.setItem('dishes', JSON.stringify(state.dishes));
        renderDishesGrouped();
      }
    }

    // 設定頁：分類拖拉與管理
    function renderCategoriesSetting() {
      const list = document.getElementById('categorySortableList');
      list.innerHTML = '';
      
      state.categories.forEach((cat, idx) => {
        const li = document.createElement('li');
        li.className = "flex justify-between items-center bg-slate-50 dark:bg-slate-700 p-2.5 rounded-xl border border-slate-200 dark:border-slate-600";
        li.dataset.cat = cat;
        li.innerHTML = `
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-bars handle cursor-grab text-slate-400"></i>
            <span class="font-semibold text-sm">${cat}</span>
          </div>
          ${cat !== '其他' ? `<button onclick="removeCategory('${cat}')" class="text-rose-500 text-xs"><i class="fa-solid fa-trash"></i></button>` : ''}
        `;
        list.appendChild(li);
      });

      // 初始化 SortableJS 拖拉排序
      new Sortable(list, {
        handle: '.handle',
        animation: 150,
        onEnd: () => {
          const newOrder = Array.from(list.children).map(el => el.dataset.cat);
          state.categories = newOrder;
          localStorage.setItem('categories', JSON.stringify(state.categories));
        }
      });
    }

    function addNewCategoryPrompt() {
      const name = prompt('請輸入新分類名稱：');
      if (name && !state.categories.includes(name)) {
        state.categories.push(name);
        localStorage.setItem('categories', JSON.stringify(state.categories));
        renderCategoriesSetting();
      }
    }

    function removeCategory(catName) {
      if (confirm(`刪除分類「${catName}」時，分類內的所有菜式將會自動移到「其他」分類。確定刪除？`)) {
        // 將該分類的菜式移動至「其他」
        state.dishes.forEach(d => {
          if (d.category === catName) d.category = '其他';
        });
        state.categories = state.categories.filter(c => c !== catName);
        localStorage.setItem('dishes', JSON.stringify(state.dishes));
        localStorage.setItem('categories', JSON.stringify(state.categories));
        renderCategoriesSetting();
      }
    }

    // 自訂頭像與 Cropper 裁切
    function handleAvatarSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const cropperImg = document.getElementById('cropperImage');
        cropperImg.src = evt.target.result;
        document.getElementById('cropperModal').classList.remove('hidden');
        if (cropper) cropper.destroy();
        cropper = new Cropper(cropperImg, { aspectRatio: 1, viewMode: 1 });
      };
      reader.readAsDataURL(file);
    }

    function closeCropperModal() {
      document.getElementById('cropperModal').classList.add('hidden');
      if (cropper) cropper.destroy();
    }

    function cropAndSaveAvatar() {
      const canvas = cropper.getCroppedCanvas({ width: 200, height: 200 });
      const base64 = canvas.toDataURL();
      state.avatar = base64;
      localStorage.setItem('avatar', base64);
      applyThemeAndSettings();
      closeCropperModal();
    }

    // 主題與系統設定應用
    function applyThemeAndSettings() {
      document.getElementById('headerAvatar').src = state.avatar;
      document.getElementById('settingsAvatarPreview').src = state.avatar;
      document.documentElement.style.setProperty('--app-font-size', state.fontSize + 'px');
      document.getElementById('fontSizeVal').innerText = state.fontSize + 'px';
      document.getElementById('fontSizeSlider').value = state.fontSize;
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    function changeFontSize(val) {
      state.fontSize = val;
      localStorage.setItem('fontSize', val);
      applyThemeAndSettings();
    }

    // 切換 Tab
    function switchTab(tab) {
      ['editor', 'saved', 'dishes', 'settings'].forEach(t => {
        document.getElementById(`page-${t}`).classList.add('hidden');
        const btn = document.getElementById(`tab-${t}`);
        btn.className = "flex-1 py-2 rounded-lg text-slate-500 dark:text-slate-400";
      });
      document.getElementById(`page-${tab}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-${tab}`);
      activeBtn.className = "flex-1 py-2 rounded-lg bg-white dark:bg-slate-700 shadow-sm text-indigo-600 dark:text-indigo-400 font-semibold";

      if (tab === 'saved') renderSavedMenus();
      if (tab === 'dishes') renderDishesGrouped();
    }

    // 匯出每週菜單為 A4 PDF (含中印雙語對照)
    function exportPDF() {
  const daysOfWeekZh = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
  const daysOfWeekIn = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
  const baseDate = new Date(state.currentMenu.mondayDate);
  
  const tbody = document.getElementById('pdfTableBody');
  tbody.innerHTML = '';

  state.currentMenu.days.forEach((d, idx) => {
    const currentDate = new Date(baseDate);
    currentDate.setDate(baseDate.getDate() + idx);
    const dateStr = currentDate.toISOString().split('T')[0];

    const dishesText = d.dishes.map(id => {
      const dish = state.dishes.find(x => x.id === id);
      return dish ? `<div style="margin-bottom: 3px;">• <strong>${dish.nameZh}</strong> ${dish.nameIn ? `<span style="color: #555; font-size: 13px;">(${dish.nameIn})</span>` : ''}</div>` : '';
    }).join('');

    const tr = document.createElement('tr');
    tr.className = "border-b border-slate-800";
    tr.innerHTML = `
      <td class="border border-slate-800 p-2.5 font-bold" style="word-wrap: break-word;">
        ${daysOfWeekZh[idx]} (${daysOfWeekIn[idx]})<br>
        <span style="font-size: 12px; font-weight: normal; color: #555;">${dateStr}</span>
      </td>
      <td class="border border-slate-800 p-2.5 text-xs" style="word-wrap: break-word;">
        ${d.dineIn ? `堂食 (Makan): ${d.dineIn}人<br>` : ''}
        ${d.takeOut ? `外帶 (Bungkus): ${d.takeOut}人` : ''}
      </td>
      <td class="border border-slate-800 p-2.5 text-sm" style="word-wrap: break-word;">${dishesText || '<span style="color: #ccc;">-</span>'}</td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('pdfDateRange').innerText = `起始日期 (Tanggal Mulai): ${state.currentMenu.mondayDate}`;

  const element = document.getElementById('pdfTemplate');
  
  // 修改：設定精確的頁面邊距 [上, 左, 下, 右] (單位: mm)
  const opt = {
    margin:       [10, 10, 10, 10], // 上左右下皆預留 10mm 邊界
    filename:     `Weekly_Menu_${state.currentMenu.mondayDate}.pdf`,
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2, useCORS: true },
    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  html2pdf().set(opt).from(element).save();
}
