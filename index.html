<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>每週菜單</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#fffaf0;--card:#fff;--text:#111;--muted:#888;--primary:#ff6b35;--border:#f0dcc8;--fs:20px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,PingFang HK,sans-serif;padding-bottom:140px}
.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:2px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
.avatar{width:62px;height:62px;border-radius:50%;border:3px solid var(--primary);object-fit:cover}
.pages{max-width:520px;margin:0 auto;padding:12px}.page{display:none}.page.active{display:block}
.card{background:var(--card);border:2px solid var(--border);border-radius:20px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center}
.btn{flex:1;padding:16px;border-radius:16px;border:none;background:var(--primary);color:#fff;font-weight:900;font-size:1.1rem}
.ghost{flex:1;padding:14px;border-radius:16px;border:2px solid var(--border);background:var(--bg);font-weight:800}
.iconBtn{width:60px;height:60px;border-radius:18px;border:2px solid var(--border);background:var(--card);font-size:30px;display:grid;place-items:center}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* --- 重點修復：之前寫錯.catBox.em，而家正確係.catBox.em --- */
.catBox{aspect-ratio:1;border-radius:20px;border:3px solid #111;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:8px}
.catBox.em{font-size:62px!important;line-height:1!important;display:block;margin-bottom:6px;transform:scale(1.1)}
.catBox.lb{background:#fff;color:#111;border:2px solid #111;border-radius:10px;padding:4px 8px;font-weight:900;font-size:.9rem;text-align:center}

.weekWrap{display:flex;flex-direction:column;gap:8px}.weekRow{display:flex;gap:8px;justify-content:center}
.dayBox{width:32%;aspect-ratio:1;border-radius:18px;border:3px solid #111;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--border);display:flex;justify-content:space-around;padding:16px 0 38px;z-index:20}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}
.ic{font-size:46px!important;line-height:1!important;display:block;pointer-events:none}
.nav.active{color:var(--primary)!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:9999;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}
.sheet{width:100%;max-width:500px;max-height:88vh;overflow:auto;background:var(--card);border-radius:24px;border:3px solid #111}
.head{position:sticky;top:0;background:var(--card);padding:14px;border-bottom:2px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.x{width:48px;height:48px;border-radius:50%;border:2px solid var(--border);background:var(--bg);display:grid;place-items:center;font-size:24px;cursor:pointer}
.dishRow{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1.5px dashed var(--border);gap:8px}
.act{display:flex;gap:6px}.act button{width:46px;height:46px;border-radius:12px;border:2px solid var(--border);background:var(--bg);font-size:20px}
select,input,textarea{width:100%;padding:14px;border-radius:14px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:1.05rem}
.topRowFixed{display:flex;gap:8px;align-items:center;width:100%}.topRowFixed input{flex:1;min-width:0}
#pdfWrap{position:fixed;inset:0;background:#222;z-index:10000;display:none;flex-direction:column}#pdfWrap.open{display:flex}
.pdfTool{position:sticky;top:0;background:#fff;padding:12px;display:flex;gap:12px;border-bottom:2px solid #ccc}
.pdfView{flex:1;overflow:auto;background:#333;padding:16px;display:flex;justify-content:center}
.pdfPage{width:100%;max-width:800px;background:#fff}
.pdfInner{padding:20mm;background:#fff;color:#000;box-sizing:border-box;font-size:18pt;line-height:1.6}
</style>
</head>
<body>
<!-- LOCKED v1.3 FIX - 卡通加大修復版 -->
<div class="top"><img id="avatarTop" class="avatar" src="icon.png"><div style="display:flex;align-items:center;height:62px"><div style="font-weight:900;font-size:1.35rem;line-height:62px">每週菜單</div></div></div>
<div class="pages">
<div id="p-weekly" class="page active"><div class="card"><div class="topRowFixed"><input type="date" id="monPicker"><button class="iconBtn" onclick="saveWeekly()">💾</button><button class="iconBtn" onclick="exportWeeklyPDF()">📄</button></div></div><div id="weeklyGrid" class="weekWrap"></div></div>
<div id="p-library" class="page"><div class="card row"><button class="ghost" onclick="exportLib()">匯出</button><button class="ghost" onclick="document.getElementById('impFile').click()">匯入</button><button class="btn" onclick="openAdd()">新增菜式</button><input type="file" id="impFile" accept=".json" style="display:none"></div><div id="catGrid" class="grid3"></div></div>
<div id="p-mymenus" class="page"><div class="card row"><button class="ghost" onclick="toggleMy(true)">一鍵打開全部</button><button class="ghost" onclick="toggleMy(false)">一鍵關閉全部</button></div><div id="myList"></div></div>
<div id="p-settings" class="page"><div class="card"><h3>分類排序</h3><div id="catOrder"></div><div class="row" style="margin-top:12px"><input id="newCat" placeholder="新分類名稱"><button class="btn" onclick="addCat()">新增</button></div></div><div class="card"><h3>外觀</h3><div class="row"><span>深淺色</span><button class="ghost" onclick="toggleTheme()">切換</button></div><div style="margin-top:12px"><label>字體大小 <span id="fsVal">20</span>px</label><input type="range" id="fsRange" min="14" max="28" value="20" oninput="setFS(this.value)" style="width:100%"></div></div><div class="card"><h3>頭像</h3><input type="file" id="avFile" accept="image/*"><div style="width:260px;height:260px;margin:12px auto;border-radius:50%;overflow:hidden;border:3px solid var(--primary);background:#000"><canvas id="avCanvas" width="600" height="600" style="width:100%;height:100%"></canvas></div><div class="row"><span>縮放</span><input type="range" id="avZoom" min="0.2" max="4" step="0.05" value="1" style="flex:1"><button class="ghost" onclick="resetAv()">重置</button></div><button class="btn" style="width:100%;margin-top:10px" onclick="saveAv()">儲存頭像</button></div></div>
</div>
<div class="bottom"><div class="nav active" onclick="go('weekly',this)"><span class="ic">📅</span>每週</div><div class="nav" onclick="go('library',this)"><span class="ic">📚</span>菜式庫</div><div class="nav" onclick="go('mymenus',this)"><span class="ic">🗂️</span>我的菜單</div><div class="nav" onclick="go('settings',this)"><span class="ic">⚙️</span>設定</div></div>
<div class="modal" id="mCat"><div class="sheet"><div class="head"><b id="mCatTitle">分類</b><div class="x" onclick="closeM('mCat')">✕</div></div><div id="mCatBody"></div></div></div>
<div class="modal" id="mNote" style="z-index:10010"><div class="sheet"><div class="head"><b>備註</b><div class="x" onclick="closeM('mNote')">✕</div></div><div id="mNoteBody" style="padding:16px;white-space:pre-wrap"></div></div></div>
<div class="modal" id="mWeek"><div class="sheet"><div class="head"><b id="mWeekTitle">日期</b><div class="x" onclick="closeM('mWeek')">✕</div></div><div style="padding:14px"><div class="row"><label>用餐</label><select id="diners"></select><label>外帶</label><select id="takeaway"></select></div><div id="selDishes" style="margin-top:12px"></div><button class="btn" style="width:100%;margin-top:12px" onclick="openPickCat()">選擇菜式</button></div></div></div>
<div class="modal" id="mPickCat"><div class="sheet"><div class="head"><b>分類</b><div class="x" onclick="closeM('mPickCat')">✕</div></div><div id="mPickCatBody" class="grid3" style="padding:12px"></div></div></div>
<div class="modal" id="mPickDish"><div class="sheet"><div class="head"><b>菜式</b><div class="x" onclick="closeM('mPickDish')">✕</div></div><div id="mPickDishBody"></div></div></div>
<div class="modal" id="mAdd"><div class="sheet"><div class="head"><b>新增/修改</b><div class="x" onclick="closeM('mAdd')">✕</div></div><div style="padding:14px"><input id="fName" placeholder="中文菜名"><input id="fIndo" placeholder="印尼文" style="margin-top:10px"><textarea id="fNote" placeholder="備註" style="margin-top:10px;height:120px"></textarea><select id="fCat" style="margin-top:10px"></select><input type="hidden" id="fId"><button class="btn" style="width:100%;margin-top:12px" onclick="saveDish()">儲存</button></div></div></div>
<div class="modal" id="mAnyDate"><div class="sheet" style="border-radius:28px;border:3px solid #111"><div class="head"><b>加入到哪一天？</b><div class="x" onclick="closeM('mAnyDate')">✕</div></div><div style="padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center"><input type="date" id="anyDate" style="width:92%!important;height:68px!important;border-radius:20px!important;border:3px solid #111!important;text-align:center!important;font-weight:900!important;font-size:1.3rem!important"><button onclick="confirmAddToWeek()" style="width:92%!important;height:68px!important;border-radius:20px!important;border:3px solid #111!important;background:#ff6b35!important;color:#fff!important;font-weight:900!important;font-size:1.35rem!important">確認加入</button></div></div></div>
<div id="pdfWrap"><div class="pdfTool"><button class="btn" id="btnClosePdf">✕ 關閉</button><button class="ghost" id="btnSharePdf">📤 傳送真PDF</button></div><div class="pdfView"><div class="pdfPage"><div class="pdfInner" id="pdfContent"></div></div></div></div>
<script>
const CAT_META={"雞":{bg:"#ffeb8a",e:"🐔"},"牛":{bg:"#d7b899",e:"🐮"},"豬":{bg:"#ffb3c1",e:"🐷"},"魚":{bg:"#8ecfff",e:"🐟"},"蔬菜":{bg:"#a8e6a3",e:"🥬"},"湯水":{bg:"#ffcc7a",e:"🍲"},"西式":{bg:"#e2c499",e:"🍔"},"罐頭":{bg:"#9ec6ff",e:"🥫"},"其他":{bg:"#d8b4fe",e:"🍱"}};
let cats=JSON.parse(localStorage.getItem('cats')||'null')||Object.keys(CAT_META);
let dishes=JSON.parse(localStorage.getItem('dishes')||'null')||[];
let weeklyMenus=JSON.parse(localStorage.getItem('weeklyMenus')||'[]');
let current={mon:null,days:[]}, lastCook=JSON.parse(localStorage.getItem('lastCook')||'{}'), editDay=null, pendDish=null;
const cn=["一","二","三","四","五","六","日"];
function go(p,el){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('p-'+p).classList.add('active');document.querySelectorAll('.nav').forEach(e=>e.classList.remove('active'));if(el)el.classList.add('active');}
function getMon(d){let dt=new Date(d);let day=dt.getDay();let diff=dt.getDate()-day+(day==0?-6:1);return new Date(dt.setDate(diff));}
function fmt(d){if(typeof d==='string')return d;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function openM(id){document.getElementById(id).classList.add('open');}function closeM(id){document.getElementById(id).classList.remove('open');}
function makeDefaults(){if(dishes.length)return;const D={"雞":[["豉油雞","Ayam Kecap",""],["白切雞","Ayam Rebus",""]],"牛":[["牛腩","Sapi",""]],"豬":[["叉燒","Char Siu",""]],"魚":[["蒸魚","Ikan",""]],"蔬菜":[["菜心","Choy Sum",""]],"湯水":[["老火湯","Sup Tua",""]],"西式":[["意粉","Spag",""]],"罐頭":[["午餐肉","Lunch",""]],"其他":[["炒飯","Nasi",""]]};Object.entries(D).forEach(([cat,arr])=>{for(let i=0;i<10;i++){let a=arr[i%arr.length];dishes.push({id:Date.now()+Math.random()+i,name:a[0]+(i+1),indo:a[1],note:a[2],cat});}});localStorage.setItem('dishes',JSON.stringify(dishes));}
makeDefaults();
function init(){let mon=getMon(new Date());document.getElementById('monPicker').valueAsDate=mon;onMon(mon);renderCats();renderWeek();renderMy();renderCatOrder();let sel=document.getElementById('diners');sel.innerHTML=[...Array(10).keys()].map(n=>`<option value="${n}">${n}</option>`).join('');document.getElementById('takeaway').innerHTML=sel.innerHTML;document.getElementById('monPicker').addEventListener('change',e=>{let d=e.target.valueAsDate;if(!d)return;if(d.getDay()!==1){let m=getMon(d);e.target.valueAsDate=m;d=m;}onMon(d);});document.getElementById('btnClosePdf').addEventListener('click',e=>{e.stopPropagation();closePDF();});document.getElementById('btnSharePdf').addEventListener('click',e=>{e.stopPropagation();sharePDF();});}
function onMon(d){current.mon=d;current.days=[];for(let i=0;i<7;i++){let day=new Date(d);day.setDate(d.getDate()+i);current.days.push({date:day,dishes:[],diners:0,takeaway:0});}renderWeek();}
function renderCats(){let g=document.getElementById('catGrid');g.innerHTML='';document.getElementById('fCat').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');cats.forEach(cat=>{let meta=CAT_META[cat]||{bg:'#eee',e:'🍱'};let cnt=dishes.filter(d=>d.cat===cat).length;g.innerHTML+=`<div class="catBox" style="background:${meta.bg}" onclick="openCat('${cat}')"><div class="em">${meta.e}</div><div class="lb">${cat} (${cnt})</div></div>`;});}
function openCat(cat){document.getElementById('mCatTitle').innerText=cat;let list=dishes.filter(d=>d.cat===cat);document.getElementById('mCatBody').innerHTML=list.map(d=>`<div class="dishRow"><div style="flex:1" onclick="showNote(${d.id})"><b>${d.name}</b></div><div class="act"><button onclick="openAnyDate(${d.id})">📅</button><button onclick="editDish(${d.id})">✏️</button><button onclick="delDish(${d.id})">🗑️</button></div></div>`).join('');openM('mCat');}
function showNote(id){let d=dishes.find(x=>x.id==id);document.getElementById('mNoteBody').innerText=`${d.name}\n\n${d.note||''}`;openM('mNote');}
function openAnyDate(id){pendDish=id;document.getElementById('anyDate').valueAsDate=new Date();openM('mAnyDate');}
function confirmAddToWeek(){let v=document.getElementById('anyDate').value;if(!v)return;let date=new Date(v);let mon=getMon(date);if(fmt(mon)!==fmt(current.mon)){alert('請先選包含此日的星期一');return;}let idx=Math.round((date-current.mon)/86400000);if(idx<0||idx>6)return;let d=dishes.find(x=>x.id==pendDish);current.days[idx].dishes.push({...d});renderWeek();closeM('mAnyDate');}
function openAdd(){document.getElementById('fId').value='';document.getElementById('fName').value='';document.getElementById('fIndo').value='';document.getElementById('fNote').value='';openM('mAdd');}
function editDish(id){let d=dishes.find(x=>x.id==id);openAdd();document.getElementById('fId').value=d.id;document.getElementById('fName').value=d.name;document.getElementById('fIndo').value=d.indo||'';document.getElementById('fNote').value=d.note||'';document.getElementById('fCat').value=d.cat;}
function saveDish(){let id=document.getElementById('fId').value,n=document.getElementById('fName').value.trim(),i=document.getElementById('fIndo').value.trim(),t=document.getElementById('fNote').value.trim(),c=document.getElementById('fCat').value;if(!n)return alert('中文必填');if(id){let d=dishes.find(x=>x.id==id);d.name=n;d.indo=i;d.note=t;d.cat=c;}else dishes.push({id:Date.now()+Math.random(),name:n,indo:i,note:t,cat:c});localStorage.setItem('dishes',JSON.stringify(dishes));renderCats();closeM('mAdd');}
function delDish(id){if(!confirm('刪除?'))return;dishes=dishes.filter(x=>x.id!=id);localStorage.setItem('dishes',JSON.stringify(dishes));renderCats();openCat(document.getElementById('mCatTitle').innerText);}
function renderWeek(){let wrap=document.getElementById('weeklyGrid');wrap.innerHTML='';let rows=[[0,1],[2,3],[4,5,6]];rows.forEach(r=>{let row=document.createElement('div');row.className='weekRow';r.forEach(idx=>{let day=current.days[idx];if(!day)return;let div=document.createElement('div');div.className='dayBox';div.innerHTML=`<div style="font-size:36px">🌅</div><div style="font-weight:900;margin-top:4px;font-size:.85rem">星期${cn[idx]}<br>${fmt(day.date).slice(5)}<br><span style="color:var(--primary)">${day.dishes.length}道</span></div>`;div.onclick=()=>openWeek(idx);row.appendChild(div);});wrap.appendChild(row);});}
function openWeek(idx){editDay=idx;let day=current.days[idx];document.getElementById('mWeekTitle').innerText=`${fmt(day.date)} 星期${cn[idx]}`;document.getElementById('diners').value=day.diners;document.getElementById('takeaway').value=day.takeaway;document.getElementById('diners').onchange=e=>day.diners=+e.target.value;document.getElementById('takeaway').onchange=e=>day.takeaway=+e.target.value;document.getElementById('selDishes').innerHTML=day.dishes.map((d,i)=>`<div class="dishRow"><span style="flex:1">${d.name}</span><button class="ghost" style="width:auto" onclick="remDay(${idx},${i})">✕</button></div>`).join('')||'<div>尚未選擇</div>';openM('mWeek');}
function remDay(a,b){current.days[a].dishes.splice(b,1);openWeek(a);renderWeek();}
function openPickCat(){let b=document.getElementById('mPickCatBody');b.innerHTML='';cats.forEach(cat=>{let m=CAT_META[cat]||{bg:'#eee',e:'🍱'};b.innerHTML+=`<div class="catBox" style="background:${m.bg}" onclick="openPickDish('${cat}')"><div class="em">${m.e}</div><div class="lb">${cat}</div></div>`;});openM('mPickCat');}
function openPickDish(cat){let list=dishes.filter(d=>d.cat===cat);document.getElementById('mPickDishBody').innerHTML=list.map(d=>`<div class="dishRow"><span style="flex:1">${d.name}</span><button class="btn" style="width:auto" onclick="pickToWeek(${d.id})">加入</button></div>`).join('');openM('mPickDish');}
function pickToWeek(id){let d=dishes.find(x=>x.id==id);current.days[editDay].dishes.push({...d});openWeek(editDay);renderWeek();}
function saveWeekly(){if(!current.mon)return;let fname=fmt(current.mon);let toSave={monday:fname,days:current.days.map(d=>({date:fmt(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway}))};let idx=weeklyMenus.findIndex(m=>m.monday===fname);if(idx>=0)weeklyMenus[idx]=toSave;else weeklyMenus.push(toSave);localStorage.setItem('weeklyMenus',JSON.stringify(weeklyMenus));renderMy();alert('已儲存 '+fname);}
function renderMy(){let box=document.getElementById('myList');box.innerHTML=weeklyMenus.map((m,i)=>`<div class="card"><div class="head" style="cursor:pointer"><b>${m.monday}</b></div><div class="myBody" style="display:none"><div class="row"><button class="ghost" onclick="loadMenu(${i})">修改</button><button class="ghost" onclick="delMenu(${i})">刪除</button><button class="iconBtn" onclick="pdfSingle(${i})">📄</button></div>${m.days.map((d,di)=>`<div>${d.date} ${d.dishes.map(dd=>dd.name).join(',')}</div>`).join('')}</div></div>`).join('');box.querySelectorAll('.head').forEach(h=>{h.onclick=()=>{let b=h.nextElementSibling;b.style.display=b.style.display==='none'?'block':'none';};});}
function toggleMy(o){document.querySelectorAll('.myBody').forEach(b=>b.style.display=o?'block':'none');}
function loadMenu(i){let m=weeklyMenus[i];document.getElementById('monPicker').value=m.monday;let mon=new Date(m.monday);current.mon=mon;current.days=m.days.map(d=>({date:new Date(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway}));go('weekly',document.querySelectorAll('.nav')[0]);renderWeek();}
function delMenu(i){weeklyMenus.splice(i,1);localStorage.setItem('weeklyMenus',JSON.stringify(weeklyMenus));renderMy();}
function makePDF(days, monStr){let html=`<h1>每週菜單 ${monStr}</h1>`;days.forEach((d,i)=>{html+=`<div><b>星期${cn[i]} ${d.date}</b>${d.dishes.map(dd=>`<div>${dd.name} / ${dd.indo||''}</div>`).join('')}</div>`;});return html;}
function exportWeeklyPDF(){showPDF(makePDF(current.days.map(d=>({date:fmt(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway})),fmt(current.mon)));}
function pdfSingle(i){let m=weeklyMenus[i];showPDF(makePDF(m.days,m.monday));}
function showPDF(inner){document.getElementById('pdfContent').innerHTML=inner;document.getElementById('pdfWrap').classList.add('open');}
function closePDF(){document.getElementById('pdfWrap').classList.remove('open');}
async function sharePDF(){let content=document.getElementById('pdfContent');let btn=document.getElementById('btnSharePdf');let old=btn.textContent;btn.textContent='⏳';btn.disabled=true;try{let wrapper=document.createElement('div');wrapper.style.width='794px';wrapper.style.position='fixed';wrapper.style.left='-9999px';let clone=content.cloneNode(true);clone.style.width='794px';clone.style.padding='76px';wrapper.appendChild(clone);document.body.appendChild(wrapper);const canvas=await html2canvas(clone,{scale:2,useCORS:true,backgroundColor:'#fff',width:794});document.body.removeChild(wrapper);const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});const imgData=canvas.toDataURL('image/png');const pageW=210,pageH=297;const imgW=pageW,imgH=canvas.height*imgW/canvas.width;pdf.addImage(imgData,'PNG',0,0,imgW,imgH);let remain=imgH-pageH;let y=-pageH;while(remain>0){pdf.addPage();pdf.addImage(imgData,'PNG',0,y,imgW,imgH);y-=pageH;remain-=pageH;}const blob=pdf.output('blob');const file=new File([blob],`每週菜單_${fmt(new Date())}.pdf`,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}catch(e){}finally{btn.textContent=old;btn.disabled=false;}}
function exportLib(){let blob=new Blob([JSON.stringify({cats,dishes},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`菜式庫_${fmt(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function renderCatOrder(){let b=document.getElementById('catOrder');b.innerHTML=cats.map((c,i)=>`<div class="card row" style="justify-content:space-between"><span>${i+1}. ${c}</span><span class="row"><button class="iconBtn" onclick="moveCat(${i},-1)">↑</button><button class="iconBtn" onclick="moveCat(${i},1)">↓</button><button class="ghost" style="width:auto" onclick="delCat(${i})">刪除</button></span></div>`).join('');}
function moveCat(i,dir){let ni=i+dir;if(ni<0||ni>=cats.length)return;let t=cats[i];cats[i]=cats[ni];cats[ni]=t;localStorage.setItem('cats',JSON.stringify(cats));renderCatOrder();renderCats();}
function addCat(){let v=document.getElementById('newCat').value.trim();if(!v)return;cats.push(v);localStorage.setItem('cats',JSON.stringify(cats));document.getElementById('newCat').value='';renderCatOrder();renderCats();}
function delCat(i){let cat=cats[i];dishes.forEach(d=>{if(d.cat===cat)d.cat='其他';});if(!cats.includes('其他'))cats.push('其他');cats.splice(i,1);localStorage.setItem('cats',JSON.stringify(cats));localStorage.setItem('dishes',JSON.stringify(dishes));renderCatOrder();renderCats();}
function toggleTheme(){document.body.classList.toggle('dark');}
function setFS(v){document.documentElement.style.setProperty('--fs',v+'px');}
init();
</script>
