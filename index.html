<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每週菜單">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>每週菜單</title>
<style>
:root{--bg:#fff8ef;--card:#fff;--text:#1a1a1a;--muted:#888;--primary:#ff6b35;--border:#f0ddd0;--fs:19px}
.dark{--bg:#0f0f0f;--card:#1c1c1c;--text:#f3f3f3;--border:#2c2c2c}
html{font-size:var(--fs)}*{box-sizing:border-box}
body{margin:0;background:#ddd;display:flex;justify-content:center;min-height:100vh}
.app{width:6.5cm;min-height:14cm;background:var(--bg);color:var(--text);font-family:-apple-system,PingFang HK,sans-serif;position:relative;box-shadow:0 0 20px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden}
.top{padding:12px 14px;border-bottom:1.5px solid var(--border);background:var(--card);display:flex;align-items:center;gap:10px}
.avatar{width:56px;height:56px;border-radius:50%;border:3px solid var(--primary);object-fit:cover}
.pages{flex:1;overflow:auto;padding:12px 10px;padding-bottom:20px}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1.8px solid var(--border);border-radius:18px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.btn{flex:1;padding:14px;border-radius:14px;border:none;background:var(--primary);color:#fff;font-weight:900;font-size:1.05rem}
.ghost{flex:1;padding:12px;border-radius:14px;border:1.8px solid var(--border);background:var(--bg);font-weight:800}
.iconBtn{width:58px;height:58px;border-radius:16px;border:1.8px solid var(--border);background:var(--card);font-size:28px;display:grid;place-items:center}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.cat{aspect-ratio:1;border-radius:20px;border:2.5px solid #111;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:8px;cursor:pointer;position:relative}
.cat.em{font-size:42px}.cat.lb{background:#fff;border:1.5px solid #111;border-radius:10px;padding:2px 8px;font-weight:900;font-size:.85rem;margin-top:6px;color:#111}
.weekRow{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
.day{width:2.8cm;height:2.8cm;max-width:48%;aspect-ratio:1;border-radius:18px;border:2.5px solid #111;background:var(--card);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer}
.day.d1{font-size:30px}.day.d2{font-weight:900;font-size:.9rem;line-height:1.2}
.bottom{border-top:1.8px solid var(--border);background:var(--card);display:flex;justify-content:space-around;padding:12px 0 32px; /* 行高較圖標高 */}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer}.nav.ic{font-size:34px}.nav.active{color:var(--primary)}
/* 最上層彈出 - 每個獨立最高層 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:9999;align-items:center;justify-content:center;padding:12px}
.modal.open{display:flex}
.sheet{width:6.2cm;max-width:95vw;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px;border:2.5px solid #111}
.head{position:sticky;top:0;background:var(--card);padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;z-index:2}
.x{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;background:var(--bg);font-size:22px;cursor:pointer}
.dishRow{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px dashed var(--border);gap:6px}
.dishRow b{font-size:1rem}
.act button{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-size:18px}
select,input,textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem}
#pdfWrap{position:fixed;inset:0;background:#eee;z-index:10000;overflow:auto;display:none}#pdfWrap.open{display:block}
.pdfTool{position:sticky;top:0;background:#fff;padding:10px;display:flex;gap:8px;border-bottom:1px solid #ccc}
.pdfPage{width:210mm;min-height:297mm;background:#fff;margin:0 auto;padding:14mm}
@media screen and (max-width:210mm){.pdfPage{width:100%;padding:5vw}}
</style>
</head>
<body>
<div class="app">
<div class="top"><img id="avatarTop" class="avatar" src="icon.png"><div style="flex:1"><div style="font-weight:900;font-size:1.15rem">每週菜單</div><div style="font-size:.85rem;color:var(--muted)">Mingguan Menu</div></div></div>

<div class="pages">
<div id="p-weekly" class="page active">
<div class="card row"><input type="date" id="monPicker" style="flex:1"><button class="iconBtn" onclick="saveWeekly()">💾</button><button class="iconBtn" onclick="exportWeeklyPDF()">📄</button></div>
<div id="weeklyGrid"></div>
</div>

<div id="p-library" class="page">
<div class="card row"><button class="ghost" onclick="exportLib()">匯出</button><button class="ghost" onclick="document.getElementById('imp').click()">匯入</button><button class="btn" onclick="openAdd()">新增菜式</button><input type="file" id="imp" accept=".json" style="display:none"></div>
<div id="catGrid" class="grid3"></div>
</div>

<div id="p-mymenus" class="page">
<div class="card row"><button class="ghost" onclick="toggleAllMy(true)">一鍵打開全部</button><button class="ghost" onclick="toggleAllMy(false)">一鍵關閉全部</button></div>
<div id="myList"></div>
</div>

<div id="p-settings" class="page">
<div class="card"><h3>分類排序</h3><div id="catOrder"></div><div class="row" style="margin-top:10px"><input id="newCat" placeholder="新分類"><button class="btn" onclick="addCat()">新增</button></div></div>
<div class="card"><h3>外觀</h3><div class="row"><span>深淺色</span><button class="ghost" onclick="toggleTheme()">切換</button></div><div style="margin-top:10px"><label>字體 <span id="fsV">19</span>px</label><input type="range" id="fsR" min="14" max="26" value="19" oninput="setFS(this.value)"></div></div>
<div class="card"><h3>頭像自訂</h3><input type="file" id="avFile" accept="image/*"><div style="width:5cm;height:5cm;margin:10px auto;border-radius:50%;overflow:hidden;border:3px solid var(--primary);background:#000;position:relative"><canvas id="avC" width="600" height="600" style="width:100%;height:100%"></canvas></div><div class="row"><span>縮放</span><input type="range" id="avZ" min="0.2" max="4" step="0.05" value="1" style="flex:1"><button class="ghost" onclick="resetAv()">重置</button></div><button class="btn" style="width:100%;margin-top:8px" onclick="saveAv()">儲存</button></div>
</div>
</div>

<div class="bottom">
<div class="nav active" onclick="go('weekly')"><span class="ic">📅</span><span>每週</span></div>
<div class="nav" onclick="go('library')"><span class="ic">📚</span><span>菜庫</span></div>
<div class="nav" onclick="go('mymenus')"><span class="ic">🗂️</span><span>我的</span></div>
<div class="nav" onclick="go('settings')"><span class="ic">⚙️</span><span>設定</span></div>
</div>
</div>

<!-- 最上層彈出全部獨立 -->
<div class="modal" id="mCat" style="z-index:10001"><div class="sheet"><div class="head"><b id="mCatT">分類</b><div class="x" onclick="closeM('mCat')">✕</div></div><div id="mCatB"></div></div></div>
<div class="modal" id="mNote" style="z-index:10010"><div class="sheet"><div class="head"><b>備註 Catatan</b><div class="x" onclick="closeM('mNote')">✕</div></div><div id="mNoteB" style="padding:14px;white-space:pre-wrap;font-size:1.05rem"></div></div></div>
<div class="modal" id="mWeek" style="z-index:10002"><div class="sheet"><div class="head"><b id="mWeekT">日期</b><div class="x" onclick="closeM('mWeek')">✕</div></div><div style="padding:12px"><div class="row"><label>用餐 Makan</label><select id="d1"></select><label>外帶 Bungkus</label><select id="d2"></select></div><div id="selD" style="margin-top:10px"></div><button class="btn" style="width:100%;margin-top:10px" onclick="openPickCat()">選擇菜式</button></div></div></div>
<div class="modal" id="mPickCat" style="z-index:10003"><div class="sheet"><div class="head"><b>分類 Kategori</b><div class="x" onclick="closeM('mPickCat')">✕</div></div><div id="mPickCatB" class="grid3" style="padding:10px"></div></div></div>
<div class="modal" id="mPickDish" style="z-index:10004"><div class="sheet"><div class="head"><b>菜式 Menu</b><div class="x" onclick="closeM('mPickDish')">✕</div></div><div id="mPickDishB"></div></div></div>
<div class="modal" id="mAdd" style="z-index:10005"><div class="sheet"><div class="head"><b>新增/修改</b><div class="x" onclick="closeM('mAdd')">✕</div></div><div style="padding:12px"><input id="fN" placeholder="中文菜名"><input id="fI" placeholder="印尼文" style="margin-top:8px"><textarea id="fT" placeholder="備註 中文+印尼文烹調方法" style="margin-top:8px;height:110px"></textarea><select id="fC" style="margin-top:8px"></select><input type="hidden" id="fID"><button class="btn" style="width:100%;margin-top:10px" onclick="saveDish()">儲存</button></div></div></div>
<div class="modal" id="mAnyDate" style="z-index:10006"><div class="sheet"><div class="head"><b>加入日期</b><div class="x" onclick="closeM('mAnyDate')">✕</div></div><div style="padding:12px"><input type="date" id="anyD"><button class="btn" style="width:100%;margin-top:10px" onclick="doAddToWeek()">確認</button></div></div></div>

<div id="pdfWrap"><div class="pdfTool"><button class="btn" onclick="closePDF()">✕ 關閉</button><button class="ghost" onclick="downloadPDF()">💾 儲存</button><button class="ghost" onclick="sharePDF()">📤 傳送</button></div><div class="pdfPage" id="pdfC"></div></div>

<script>
const META={"雞 Ayam":{bg:"#ffec99",e:"🐔"},"牛 Sapi":{bg:"#d8bba0",e:"🐮"},"豬 Babi":{bg:"#ffb8c6",e:"🐷"},"魚 Ikan":{bg:"#a0d8ff",e:"🐟"},"蔬菜 Sayur":{bg:"#b5e6b0",e:"🥬"},"湯水 Sup":{bg:"#ffcb7a",e:"🍲"},"西式 Barat":{bg:"#e6c9a0",e:"🍔"},"罐頭 Kaleng":{bg:"#a8c8ff",e:"🥫"},"其他 Lainnya":{bg:"#d0b0ff",e:"🍱"}};
let cats=JSON.parse(localStorage.getItem('cats')||'null')||Object.keys(META);
let dishes=JSON.parse(localStorage.getItem('dishes')||'null')||[];
let weeklyMenus=JSON.parse(localStorage.getItem('weeklyMenus')||'[]');
let current={mon:null,days:[]}, lastCook=JSON.parse(localStorage.getItem('lastCook')||'{}'), editDay=null, pendDish=null;
const cn=["一","二","三","四","五","六","日"], idn=["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"], emo=["🐓","🐂","🐖","🐠","🥦","🍵","🍝","🥫","🎂"];

function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('p-'+p).classList.add('active');document.querySelectorAll('.nav').forEach((x,i)=>{x.classList.remove('active');if(['weekly','library','mymenus','settings'][i]==p)x.classList.add('active');});}
function getMon(d){let dt=new Date(d),day=dt.getDay(),diff=dt.getDate()-day+(day==0?-6:1);return new Date(dt.setDate(diff));}
function fmt(d){if(typeof d==='string')return d;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function openM(id){document.getElementById(id).classList.add('open');}
function closeM(id){document.getElementById(id).classList.remove('open');}

"西式 Barat":[["意粉","Spaghetti","中文：肉醬意粉。\nIndonesia: Bolognese."],["焗薯","Kentang Panggang","中文：芝士焗。\nIndonesia: Keju panggang."],["沙律","Salad","中文：雜菜沙律。\nIndonesia: Salad."],["漢堡","Burger","中文：牛肉漢堡。\nIndonesia: Burger sapi."],["薯條","Kentang Goreng","中文：炸薯條。\nIndonesia: Kentang goreng."],["牛扒薯條","Steak Kentang","中文：西冷薯條。\nIndonesia: Sirloin kentang."],["蘑菇湯","Sup Jamur","中文：忌廉蘑菇。\nIndonesia: Krim jamur."],["焗雞翼","Sayap Panggang","中文：蜜糖焗翼。\nIndonesia: Madu panggang."],["三文治","Sandwich","中文：火腿芝士。\nIndonesia: Ham keju."],["薄餅","Pizza","中文：芝士薄餅。\nIndonesia: Pizza keju."]],
"罐頭 Kaleng":[["茄汁豆","Kacang Tomat","中文：豆炒蛋。\nIndonesia: Kacang telur."],["午餐肉","Daging Kaleng","中文：煎。\nIndonesia: Goreng."],["沙甸魚","Sarden","中文：洋蔥炒。\nIndonesia: Bawang bombay."],["粟米湯","Sup Jagung","中文：忌廉湯。\nIndonesia: Krim jagung."],["吞拿魚","Tuna","中文：沙律。\nIndonesia: Salad tuna."],["蘑菇罐","Jamur Kaleng","中文：炒雞。\nIndonesia: Tumis ayam."],["豆豉鯪魚","Dencis Tauco","中文：油麥菜炒。\nIndonesia: Selada tumis."],["火腿湯","Sup Ham","中文：通粉火腿。\nIndonesia: Makaroni ham."],["粟米肉粒","Jagung Daging Kaleng","中文：午餐肉炒。\nIndonesia: Daging kaleng jagung."],["椰奶","Santan Kaleng","中文：咖喱椰奶。\nIndonesia: Kari santan."]],
"其他 Lainnya":[["蒸水蛋","Telur Kukus","中文：水蛋蒸8分。\nIndonesia: Kukus 8 menit."],["炒飯","Nasi Goreng","中文：揚州炒飯。\nIndonesia: Yangzhou goreng."],["炒麵","Mie Goreng","中文：豉油王炒麵。\nIndonesia: Kecap raja."],["粥","Bubur","中文：白粥皮蛋。\nIndonesia: Bubur pitan."],["餃子","Pangsit","中文：煎餃。\nIndonesia: Goreng."],["雲吞","Wonton","中文：雲吞湯。\nIndonesia: Sup wonton."],["腸粉","Cheung Fun","中文：蒸腸粉。\nIndonesia: Kukus."],["白飯","Nasi Putih","中文：白飯。\nIndonesia: Nasi putih."],["糖水","Sup Manis","中文：紅豆沙。\nIndonesia: Kacang merah."],["涼拌","Acar","中文：青瓜涼拌。\nIndonesia: Mentimun acar."]]
 };
 Object.entries(list).forEach(([cat,arr])=>{arr.forEach(([n,i,t])=>{dishes.push({id:Date.now()+Math.random(),name:n,indo:i,note:t,cat});});});
}
makeDefault();

function init(){
 let mon=getMon(new Date()); document.getElementById('monPicker').valueAsDate=mon; onMon(mon);
 renderCat(); renderWeek(); renderMy(); renderCatOrder(); setupSelects(); loadFS(); loadAv();
 document.getElementById('monPicker').addEventListener('change',e=>{ let d=e.target.valueAsDate; if(d.getDay()!==1){alert('只可以選擇星期一作起始日\nHanya boleh Senin'); let m=getMon(d); e.target.valueAsDate=m; d=m;} onMon(d); });
 document.getElementById('imp').addEventListener('change',importLib);
}
function onMon(d){ current.mon=d; current.days=[]; for(let i=0;i<7;i++){let day=new Date(d); day.setDate(d.getDate()+i); current.days.push({date:day,dishes:[],diners:0,takeaway:0});} renderWeek(); }
function setupSelects(){ let s=document.getElementById('d1'); s.innerHTML=[...Array(10).keys()].map(n=>`<option>${n}</option>`).join(''); document.getElementById('d2').innerHTML=s.innerHTML; }
function renderCat(){
 let g=document.getElementById('catGrid'); g.innerHTML=''; document.getElementById('fC').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');
 cats.forEach(cat=>{
  let m=META[cat]||{bg:'#eee',e:'🍱'}; let cnt=dishes.filter(d=>d.cat===cat).length;
  g.innerHTML+=`<div class="cat" style="background:${m.bg}" onclick="openCat('${cat}')"><div class="em">${m.e}</div><div class="lb">${cat} (${cnt})</div></div>`;
 });
}
function openCat(cat){
 document.getElementById('mCatT').innerText=cat;
 let list=dishes.filter(d=>d.cat===cat);
 document.getElementById('mCatB').innerHTML=list.map(d=>`<div class="dishRow"><div style="flex:1" onclick="showNote(${d.id})"><b>${d.name}</b><br><span style="font-size:.85rem;color:var(--muted)">${d.indo||''} ${lastCook[d.id]?'| 上次:'+lastCook[d.id]:''}</span></div><div class="act"><button onclick="openAnyDate(${d.id})">📅</button><button onclick="editDish(${d.id})">✏️</button><button onclick="delDish(${d.id})">🗑️</button></div></div>`).join('')||'<div style="padding:16px;color:var(--muted)">暫無</div>';
 openM('mCat');
}
function showNote(id){ let d=dishes.find(x=>x.id==id); document.getElementById('mNoteB').innerText=`${d.name} / ${d.indo||''}\n\n${d.note||''}`; openM('mNote'); }
function openAnyDate(id){ pendDish=id; document.getElementById('anyD').valueAsDate=new Date(); openM('mAnyDate'); }
function doAddToWeek(){
 let val=document.getElementById('anyD').value; if(!val) return; let date=new Date(val);
 let mon=getMon(date); if(fmt(mon)!=fmt(current.mon)){ alert('請先選擇包含此日期的星期一\nPilih Senin minggu ini dulu'); return; }
 let idx=Math.floor((date-current.mon)/86400000); if(idx<0||idx>=7) return;
 let d=dishes.find(x=>x.id==pendDish); current.days[idx].dishes.push({...d}); lastCook[d.id]=fmt(date); localStorage.setItem('lastCook',JSON.stringify(lastCook)); renderWeek(); closeM('mAnyDate');
}
function openAdd(){ document.getElementById('fID').value=''; document.getElementById('fN').value=''; document.getElementById('fI').value=''; document.getElementById('fT').value=''; openM('mAdd'); }
function editDish(id){ let d=dishes.find(x=>x.id==id); openAdd(); document.getElementById('fID').value=d.id; document.getElementById('fN').value=d.name; document.getElementById('fI').value=d.indo||''; document.getElementById('fT').value=d.note||''; document.getElementById('fC').value=d.cat; }
function saveDish(){ let id=document.getElementById('fID').value,n=document.getElementById('fN').value.trim(),i=document.getElementById('fI').value.trim(),t=document.getElementById('fT').value.trim(),c=document.getElementById('fC').value; if(!n) return alert('中文名必填'); if(id){let d=dishes.find(x=>x.id==id); d.name=n; d.indo=i; d.note=t; d.cat=c;} else dishes.push({id:Date.now()+Math.random(),name:n,indo:i,note:t,cat:c}); localStorage.setItem('dishes',JSON.stringify(dishes)); renderCat(); closeM('mAdd'); }
function delDish(id){ if(!confirm('刪除 Hapus?')) return; dishes=dishes.filter(x=>x.id!=id); localStorage.setItem('dishes',JSON.stringify(dishes)); renderCat(); document.getElementById('mCatB').innerHTML=''; openCat(document.getElementById('mCatT').innerText); }

function renderWeek(){
 let box=document.getElementById('weeklyGrid'); box.innerHTML='';
 let rows=[[0,1],[2,3],[4,5,6]];
 rows.forEach(r=>{
  let row=document.createElement('div'); row.className='weekRow';
  r.forEach(idx=>{
   let day=current.days[idx]; if(!day) return;
   let div=document.createElement('div'); div.className='day';
   div.innerHTML=`<div class="d1">${emo[idx%emo.length]}</div><div class="d2">星期${cn[idx]}<br>${fmt(day.date).slice(5)}<br>${idn[idx]}<br>${day.dishes.length}道</div>`;
   div.onclick=()=>openWeek(idx); row.appendChild(div);
  });
  box.appendChild(row);
 });
}
function openWeek(idx){
 editDay=idx; let day=current.days[idx];
 document.getElementById('mWeekT').innerText=`${fmt(day.date)} 星期${cn[idx]} / ${idn[idx]}`;
 document.getElementById('d1').value=day.diners; document.getElementById('d2').value=day.takeaway;
 document.getElementById('d1').onchange=e=>day.diners=+e.target.value;
 document.getElementById('d2').onchange=e=>day.takeaway=+e.target.value;
 document.getElementById('selD').innerHTML=day.dishes.map((d,i)=>`<div class="dishRow"><span style="flex:1" onclick="showNote(${d.id})">${d.name} / ${d.indo||''}</span><button class="ghost" style="width:auto" onclick="remDay(${idx},${i})">✕</button></div>`).join('')||'<div style="color:var(--muted)">尚未選擇 Belum pilih</div>';
 openM('mWeek');
}
function remDay(a,b){ current.days[a].dishes.splice(b,1); openWeek(a); renderWeek(); }
function openPickCat(){
 let b=document.getElementById('mPickCatB'); b.innerHTML='';
 cats.forEach(cat=>{ let m=META[cat]||{bg:'#eee',e:'🍱'}; b.innerHTML+=`<div class="cat" style="background:${m.bg}" onclick="openPickDish('${cat}')"><div class="em">${m.e}</div><div class="lb">${cat}</div></div>`; });
 openM('mPickCat');
}
function openPickDish(cat){
 let list=dishes.filter(d=>d.cat===cat);
 document.getElementById('mPickDishB').innerHTML=list.map(d=>`<div class="dishRow"><span style="flex:1" onclick="showNote(${d.id})"><b>${d.name}</b> ${d.indo||''}</span><button class="btn" style="width:auto" onclick="pickToWeek(${d.id})">加入</button></div>`).join('');
 openM('mPickDish');
}
function pickToWeek(id){ let d=dishes.find(x=>x.id==id); current.days[editDay].dishes.push({...d}); lastCook[id]=fmt(current.days[editDay].date); localStorage.setItem('lastCook',JSON.stringify(lastCook)); openWeek(editDay); renderWeek(); }

function saveWeekly(){
 if(!current.mon) return; let fname=fmt(current.mon);
 let ex=weeklyMenus.findIndex(m=>m.monday===fname);
 if(ex>=0){
  let c=confirm(`菜單 ${fname} 已存在，取代？\nSudah ada, ganti?`);
  if(!c){ let nd=prompt('輸入新星期一 YYYY-MM-DD'); if(!nd) return; let d=new Date(nd); if(d.getDay()!==1){alert('只可以星期一 Hanya Senin'); return;} fname=fmt(d); current.mon=d; } else weeklyMenus.splice(ex,1);
 }
 let toSave={monday:fname,days:current.days.map(d=>({date:fmt(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway}))};
 let idx=weeklyMenus.findIndex(m=>m.monday===fname); if(idx>=0) weeklyMenus[idx]=toSave; else weeklyMenus.push(toSave);
 if(weeklyMenus.length>10) weeklyMenus.shift();
 localStorage.setItem('weeklyMenus',JSON.stringify(weeklyMenus)); renderMy(); alert('已儲存 '+fname);
}
function renderMy(){
 let box=document.getElementById('myList');
 box.innerHTML=weeklyMenus.map((m,i)=>`<div class="card"><div class="head"><b>${m.monday} 星期一 Senin</b><div class="row"><button class="ghost" style="width:auto" onclick="loadMenu(${i})">改</button><button class="ghost" style="width:auto" onclick="delMenu(${i})">刪</button><button class="iconBtn" onclick="pdfSingle(${i})">📄</button></div></div><div class="myBody" style="display:none">${m.days.map((d,di)=>`<div style="border-top:1px dashed var(--border);padding:8px 0"><b>星期${cn[di]} ${idn[di]} ${d.date} 用餐 Makan ${d.diners} 外帶 Bungkus ${d.takeaway}</b>${d.dishes.map(dd=>`<div class="dishRow" style="padding:4px 0"><span style="flex:1;cursor:pointer" onclick="toggleNote(this)"><span>${dd.name} / ${dd.indo||''}</span><span class="note" style="display:none;white-space:pre-wrap;background:var(--bg);padding:6px;border-radius:8px;margin-top:4px">${dd.note||''}</span></span></div>`).join('')}</div>`).join('')}</div></div>`).join('')||'<div class="card">暫無</div>';
 box.querySelectorAll('.head').forEach(h=>{ h.style.cursor='pointer'; h.onclick=()=>{ let b=h.nextElementSibling; b.style.display=b.style.display==='none'?'block':'none'; }; });
}
function toggleAllMy(open){ document.querySelectorAll('#myList.myBody').forEach(b=>b.style.display=open?'block':'none'); }
function toggleNote(el){ let n=el.querySelector('.note'); n.style.display=n.style.display==='none'?'block':'none'; }
function loadMenu(i){ let m=weeklyMenus[i]; document.getElementById('monPicker').value=m.monday; let mon=new Date(m.monday); current.mon=mon; current.days=m.days.map(d=>({date:new Date(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway})); go('weekly'); renderWeek(); }
function delMenu(i){ if(!confirm('刪除?')) return; weeklyMenus.splice(i,1); localStorage.setItem('weeklyMenus',JSON.stringify(weeklyMenus)); renderMy(); }

function makePDF(days, monStr){
 let title=`<div style="font-size:22pt;font-weight:900;text-align:center">每週菜單<br><span style="font-size:14pt">Daftar Menu Mingguan</span></div><div style="text-align:center;color:#666;margin:8px 0 14px">${monStr} 星期一 / Senin</div>`;
 let body=days.map((d,i)=>`<div style="border:2px solid #000;border-radius:12px;margin-bottom:14px;page-break-inside:avoid"><div style="background:#000;color:#fff;padding:8px 12px;display:flex;justify-content:space-between;font-weight:900"><span>星期${cn[i]} ${idn[i]} ${d.date}</span><span>用餐 Makan ${d.diners} 外帶 Bungkus ${d.takeaway}</span></div>${d.dishes.map(dd=>`<div style="padding:10px 12px;border-top:1px dashed #aaa"><b>${dd.name} / ${dd.indo||''}</b><div style="white-space:pre-wrap;margin-top:4px">備註 Catatan: ${dd.note||''}</div></div>`).join('')||'<div style="padding:10px">無 Belum</div>'}</div>`).join('');
 return title+body;
}
function exportWeeklyPDF(){ showPDF(makePDF(current.days.map(d=>({date:fmt(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway})), fmt(current.mon))); }
function pdfSingle(i){ let m=weeklyMenus[i]; showPDF(makePDF(m.days,m.monday)); }
function showPDF(inner){ document.getElementById('pdfC').innerHTML=inner; document.getElementById('pdfWrap').classList.add('open'); }
function closePDF(){ document.getElementById('pdfWrap').classList.remove('open'); }
function downloadPDF(){ let el=document.getElementById('pdfC'); let full=`<!DOCTYPE html><html><head><meta charset="utf-8"><style>@page{size:A4;margin:10mm}body{font-size:14pt}</style></head><body>${el.innerHTML}</body></html>`; let blob=new Blob([full],{type:'text/html'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download=`每週菜單_${fmt(new Date())}.html`; a.click(); URL.revokeObjectURL(url); }
async function sharePDF(){ let el=document.getElementById('pdfC'); let html=`<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>${el.innerHTML}</body></html>`; let blob=new Blob([html],{type:'text/html'}); let file=new File([blob],`每週菜單.html`,{type:'text/html'}); try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'每週菜單'}); return; } }catch(e){} try{ if(navigator.share){ await navigator.share({title:'每週菜單',text:el.innerText.slice(0,800)}); return; } }catch(e){} downloadPDF(); }

function exportLib(){ let blob=new Blob([JSON.stringify({cats,dishes},null,2)],{type:'application/json'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download=`菜式庫_${fmt(new Date())}.json`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }
function importLib(e){ let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=ev=>{ try{ let j=JSON.parse(ev.target.result); if(j.cats&&j.dishes){ cats=j.cats; dishes=j.dishes; localStorage.setItem('cats',JSON.stringify(cats)); localStorage.setItem('dishes',JSON.stringify(dishes)); renderCat(); renderCatOrder(); alert('匯入成功'); } else alert('格式錯'); }catch{ alert('解析失敗'); } }; r.readAsText(f); e.target.value=''; }

function renderCatOrder(){ let b=document.getElementById('catOrder'); b.innerHTML=cats.map((c,i)=>`<div class="card row" style="justify-content:space-between"><span>${i+1}. ${c}</span><span class="row"><button class="iconBtn" onclick="moveCat(${i},-1)">↑</button><button class="iconBtn" onclick="moveCat(${i},1)">↓</button><button class="ghost" style="width:auto" onclick="delCat(${i})">刪</button></span></div>`).join(''); }
function moveCat(i,dir){ let ni=i+dir; if(ni<0||ni>=cats.length) return; let t=cats[i]; cats[i]=cats[ni]; cats[ni]=t; localStorage.setItem('cats',JSON.stringify(cats)); renderCatOrder(); renderCat(); }
function addCat(){ let v=document.getElementById('newCat').value.trim(); if(!v) return; cats.push(v); localStorage.setItem('cats',JSON.stringify(cats)); document.getElementById('newCat').value=''; renderCatOrder(); renderCat(); }
function delCat(i){ let cat=cats[i]; if(!confirm(`刪除「${cat}」會移到「其他」，確定？\nHapus "${cat}" pindah ke "其他"?`)) return; dishes.forEach(d=>{ if(d.cat===cat) d.cat='其他 Lainnya'; }); if(!cats.includes('其他 Lainnya')) cats.push('其他 Lainnya'); cats.splice(i,1); localStorage.setItem('cats',JSON.stringify(cats)); localStorage.setItem('dishes',JSON.stringify(dishes)); renderCatOrder(); renderCat(); }
function toggleTheme(){ document.body.classList.toggle('dark'); document.querySelector('.app').classList.toggle('dark'); localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light'); }
function setFS(v){ document.documentElement.style.setProperty('--fs',v+'px'); document.getElementById('fsV').innerText=v; localStorage.setItem('fs',v); }
function loadFS(){ let fs=localStorage.getItem('fs'); if(fs){ setFS(fs); document.getElementById('fsR').value=fs; } let th=localStorage.getItem('theme'); if(th==='dark'){ document.body.classList.add('dark'); document.querySelector('.app').classList.add('dark'); } }
function loadAv(){ let av=localStorage.getItem('avatar'); if(av) document.getElementById('avatarTop').src=av; }
let img=new Image(), scale=1, px=0, py=0, drag=false, lx=0, ly=0, initS=1, canvas=document.getElementById('avC');
function drawAv(){ let ctx=canvas.getContext('2d'); ctx.clearRect(0,0,600,600); if(!img.src) return; let w=img.width*scale, h=img.height*scale; ctx.drawImage(img,300-w/2+px,300-h/2+py,w,h); }
document.getElementById('avFile').addEventListener('change',e=>{ let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=ev=>{ img.src=ev.target.result; img.onload=()=>{ initS=500/Math.min(img.width,img.height); scale=initS; px=0; py=0; document.getElementById('avZ').value=scale; drawAv(); }; }; r.readAsDataURL(f); });
document.getElementById('avZ').addEventListener('input',e=>{ scale=parseFloat(e.target.value); drawAv(); });
canvas.addEventListener('mousedown',e=>{drag=true; lx=e.clientX; ly=e.clientY;});
canvas.addEventListener('touchstart',e=>{drag=true; lx=e.touches[0].clientX; ly=e.touches[0].clientY;},{passive:false});
window.addEventListener('mousemove',e=>{if(!drag) return; px+=e.clientX-lx; py+=e.clientY-ly; lx=e.clientX; ly=e.clientY; drawAv();});
window.addEventListener('touchmove',e=>{if(!drag) return; e.preventDefault(); px+=e.touches[0].clientX-lx; py+=e.touches[0].clientY-ly; lx=e.touches[0].clientX; ly=e.touches[0].clientY; drawAv();},{passive:false});
window.addEventListener('mouseup',()=>drag=false); window.addEventListener('touchend',()=>drag=false);
canvas.addEventListener('wheel',e=>{e.preventDefault(); scale+=e.deltaY*-0.001; scale=Math.min(Math.max(0.2,scale),4); document.getElementById('avZ').value=scale; drawAv();},{passive:false});
function resetAv(){ px=0; py=0; scale=initS; document.getElementById('avZ').value=scale; drawAv(); }
function saveAv(){ let d=canvas.toDataURL('image/png'); localStorage.setItem('avatar',d); document.getElementById('avatarTop').src=d; alert('已儲存'); }

init();
</script>
</body>
