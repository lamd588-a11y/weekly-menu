<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>我的菜單</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#fff8ef;
  --card:#ffffff;
  --text:#5a2a12;
  --muted:#9c7d6a;
  --primary:#ff7a2d;
  --border:#f6c9a0;
  --border2:#ff9f5a;
  --fs:20px;
  --shadow:0 6px 0 #ffe0bd;
  --shadow-sm:0 4px 0 #ffe2c4;
}
.dark{--bg:#1a1410;--card:#2a211c;--text:#f5e8d8;--border:#5a3a2a;--muted:#b89f8c}
html{font-size:var(--fs)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,'Noto Sans TC',Nunito,PingFang HK,sans-serif;padding-bottom:120px;line-height:1.5}
.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:3px solid var(--border);padding:14px 18px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;box-shadow:0 2px 0 #fff3e0}
.avatar{width:64px;height:64px;border-radius:50%;border:3px solid var(--primary);object-fit:cover;box-shadow:var(--shadow-sm)}
.pages{max-width:540px;margin:0 auto;padding:12px 14px 16px 14px;box-sizing:border-box}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border:3px solid var(--border);border-radius:22px;padding:14px;margin:0 0 16px 0;width:100%;box-sizing:border-box;overflow:hidden;box-shadow:var(--shadow-sm);position:relative}
.card::after{content:'✦';position:absolute;right:10px;top:6px;font-size:10px;color:var(--border2);opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.btn{flex:1;padding:16px 18px;border-radius:18px;border:3px solid #7a3510;background:linear-gradient(180deg,#ff8a3d,#ff6b1a);color:#fff;font-weight:900;font-size:1.15rem;box-shadow:0 5px 0 #c94a0a;cursor:pointer}
.ghost{flex:1;padding:14px;border-radius:16px;border:2.5px solid var(--border);background:var(--bg);font-weight:800;font-size:1rem;color:var(--text);box-shadow:0 3px 0 var(--border)}
.iconBtn{width:48px;height:48px;min-width:48px;border-radius:14px;border:2.5px solid var(--border);background:#fff6e8;font-size:20px;display:grid;place-items:center;margin:0;box-sizing:border-box;flex-shrink:0;font-weight:900;box-shadow:0 3px 0 var(--border);cursor:pointer}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:8px 2px;box-sizing:border-box;width:100%}
.catBox{aspect-ratio:1;border-radius:22px;border:3px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:8px;width:100%;min-width:0;box-sizing:border-box;box-shadow:var(--shadow-sm);background:#fff}
.dayBox{width:32%;aspect-ratio:1;border-radius:22px;border:3px solid var(--border);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:8px;box-shadow:var(--shadow-sm)}
.bottom{position:fixed;bottom:12px;left:12px;right:12px;background:var(--card);border:3px solid var(--primary);border-radius:26px;display:flex;justify-content:space-around;padding:10px 6px 10px;z-index:20;box-shadow:0 8px 0 var(--border);max-width:520px;margin:0 auto}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:12px;font-weight:800;cursor:pointer;padding:6px 4px;border-radius:16px}
.nav.active{color:var(--text);background:#fff0e0;border:2px solid var(--border);box-shadow:0 2px 0 #ffe2c4}
.ic{font-size:44px!important;line-height:1!important;display:block}
.modal{position:fixed;inset:0;background:rgba(60,30,10,.45);backdrop-filter:blur(6px);display:none;z-index:9999;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}
.sheet{width:calc(100% - 20px);max-width:500px;max-height:88vh;overflow:auto;background:var(--card);border-radius:28px;border:3px solid var(--border);box-sizing:border-box;margin:0 auto;box-shadow:0 12px 0 var(--border)}
.head{position:sticky;top:0;background:var(--card);padding:16px;border-bottom:2.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;z-index:1}
.x{width:48px;height:48px;border-radius:50%;border:2.5px solid var(--border);background:var(--bg);display:grid;place-items:center;font-size:22px;cursor:pointer;box-shadow:0 2px 0 var(--border)}
.dishRow{display:flex;justify-content:space-between;align-items:center;padding:16px 14px;border-bottom:2px dashed var(--border);gap:10px}
.act{display:flex;gap:8px}.act button{width:46px;height:46px;border-radius:12px;border:2.5px solid var(--border);background:var(--bg);font-size:20px;box-shadow:0 2px 0 var(--border)}
select,textarea{width:100%;padding:16px;border-radius:16px;border:2.5px solid var(--border);background:var(--bg);color:var(--text);font-size:1.05rem;box-sizing:border-box;font-weight:700}
.topRowFixed{display:flex;gap:10px;align-items:center;width:100%;box-sizing:border-box}
.topRowFixed input{flex:1 1 0;min-width:0;width:0;text-align:center;font-weight:900;background:#fff7e6;border-radius:18px;padding:14px 8px;border:2.5px solid var(--border);box-sizing:border-box;font-size:1.05rem;box-shadow:0 3px 0 var(--border)}
#pdfWrap{position:fixed;inset:0;background:#2b1e15;z-index:10000;display:none;flex-direction:column}#pdfWrap.open{display:flex}
.pdfTool{position:sticky;top:0;background:#fffaf0;padding:14px;display:flex;gap:12px;border-bottom:3px solid var(--border);z-index:2}
.pdfView{flex:1;overflow:auto;background:#3d2d22;padding:16px;display:flex;justify-content:center}
.pdfPage{width:100%;max-width:800px;background:#fff;margin:0 auto;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.pdfInner{padding:15mm 15mm 25mm 15mm!important;background:#fff;color:#000;box-sizing:border-box;font-size:16pt;line-height:1.6}
.d1{font-size:20px;font-weight:900}.d2{font-size:13px;font-weight:800;color:var(--muted);margin-top:2px}
.lb{font-size:16px;font-weight:900;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.em{font-size:52px!important;line-height:1!important;display:block!important}
</style>
</head>
<body>
<div class="top"><img id="avatarTop" class="avatar" src="icon.png"><div style="display:flex;align-items:center;height:62px"><div style="font-weight:900;font-size:1.35rem;line-height:62px">我的菜單</div></div></div>
<div class="pages">
<div id="p-weekly" class="page active"><div class="card"><div class="topRowFixed"><input type="date" id="monPicker"><button class="iconBtn" onclick="saveWeekly()">💾</button><button class="iconBtn" onclick="exportWeeklyPDF()">📄</button></div></div><div id="weeklyGrid" class="weekWrap"></div></div>
<div id="p-library" class="page"><div class="card row"><button class="ghost" onclick="exportLib()">匯出</button><button class="ghost" onclick="document.getElementById('impFile').click()">匯入</button><button class="btn" onclick="openAdd()">新增菜式</button><input type="file" id="impFile" accept=".json" style="display:none"></div><div id="catGrid" class="grid3"></div></div>
<div id="p-mymenus" class="page"><div class="card row"><button class="ghost" onclick="toggleMy(true)">一鍵打開全部</button><button class="ghost" onclick="toggleMy(false)">一鍵關閉全部</button></div><div id="myList"></div></div>
<div id="p-settings" class="page"><div class="card"><h3>分類排序</h3><div id="catOrder"></div><div class="row" style="margin-top:12px;flex-wrap:nowrap;gap:8px"><input id="newCatIcon" placeholder="😀圖示" style="flex:0 0 64px;width:64px;min-width:64px;padding:14px 6px;border-radius:16px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:1.2rem;font-weight:800;box-sizing:border-box;text-align:center"><input id="newCat" maxlength="4" placeholder="新分類名稱(限4字)" style="flex:1;min-width:0;padding:14px 16px;border-radius:16px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem;font-weight:800;box-sizing:border-box"><button class="btn" onclick="addCat()" style="flex:0 0 90px;min-width:90px">新增</button></div></div><div class="card"><h3>外觀</h3><div class="row"><span>深淺色</span><button class="ghost" onclick="toggleTheme()">切換</button></div><div style="margin-top:12px"><label>字體大小 <span id="fsVal">20</span>px</label><input type="range" id="fsRange" min="14" max="28" value="20" oninput="setFS(this.value)" style="width:100%"></div></div><div class="card"><h3>頭像</h3><div style="display:flex;gap:10px;align-items:center;margin:10px 0">
  <label for="avFile" style="flex:0 0 auto;padding:16px 22px;border-radius:16px;background:var(--primary);color:#fff;font-weight:900;font-size:1.15rem;cursor:pointer">📁 選擇圖片</label>
  <span id="avFileName" style="flex:1;font-size:1.1rem;font-weight:800;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">尚未選取檔案</span>
</div>
<input type="file" id="avFile" accept="image/*" style="display:none"><div style="width:260px;height:260px;margin:12px auto;border-radius:50%;overflow:hidden;border:3px solid var(--primary);background:#000;touch-action:none"><canvas id="avCanvas" width="600" height="600" style="width:100%;height:100%"></canvas></div><div class="row"><span>縮放</span><input type="range" id="avZoom" min="0.2" max="4" step="0.05" value="1" style="flex:1"><button class="ghost" onclick="resetAv()">重置</button></div><button class="btn" style="width:100%;margin-top:10px" onclick="saveAv()">儲存頭像</button></div></div>
</div>
<div class="bottom">
<div class="nav active" onclick="go('weekly',this)"><span class="ic">📅</span>建立菜單</div>
<div class="nav" onclick="go('library',this)"><span class="ic">📚</span>菜式庫</div>
<div class="nav" onclick="go('mymenus',this)"><span class="ic">🗂️</span>我的菜單</div>
<div class="nav" onclick="go('settings',this)"><span class="ic">⚙️</span>設定</div>
</div>
<div class="modal" id="mCat" style="z-index:10001"><div class="sheet"><div class="head"><b id="mCatTitle">分類</b><div class="x" onclick="closeM('mCat')">✕</div></div><div id="mCatBody"></div></div></div>
<div class="modal" id="mNote" style="z-index:10010"><div class="sheet"><div class="head"><b>備註</b><div class="x" onclick="closeM('mNote')">✕</div></div><div id="mNoteBody" style="padding:16px;white-space:pre-wrap;font-size:1.1rem"></div></div></div>
<div class="modal" id="mWeek" style="z-index:10002"><div class="sheet"><div class="head"><b id="mWeekTitle">日期</b><div class="x" onclick="closeM('mWeek')">✕</div></div><div style="padding:14px"><div class="row"><label>用餐</label><select id="diners"></select><label>外帶</label><select id="takeaway"></select></div><div id="selDishes" style="margin-top:12px"></div><button class="btn" style="width:100%;margin-top:12px" onclick="openPickCat()">選擇菜式</button></div></div></div>
<div class="modal" id="mPickCat" style="z-index:10003"><div class="sheet"><div class="head"><b>分類</b><div class="x" onclick="closeM('mPickCat')">✕</div></div><div id="mPickCatBody" class="grid3" style="padding:12px"></div></div></div>
<div class="modal" id="mPickDish" style="z-index:10004"><div class="sheet"><div class="head"><b>菜式</b><div class="x" onclick="closeM('mPickDish')">✕</div></div><div id="mPickDishBody"></div></div></div>
<div class="modal" id="mAdd" style="z-index:10005"><div class="sheet"><div class="head"><b>新增/修改菜式</b><div class="x" onclick="closeM('mAdd')">✕</div></div><div style="padding:14px"><input id="fName" placeholder="菜名（中文）" style="width:100%;padding:16px;border-radius:14px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:1.05rem;box-sizing:border-box;height:56px"><input id="fIndo" placeholder="菜名（印尼文）" style="margin-top:12px;width:100%;padding:16px;border-radius:14px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:1.05rem;box-sizing:border-box;height:56px"><textarea id="fNoteZh" placeholder="備註 + 烹調方法（中文）" style="margin-top:10px;height:110px"></textarea><textarea id="fNoteId" placeholder="備註 + 烹調方法（印尼文）" style="margin-top:10px;height:110px"></textarea><select id="fCat" style="margin-top:10px"></select><input type="hidden" id="fId"><button class="btn" style="width:100%;margin-top:12px" onclick="saveDish()">儲存</button></div></div></div>
<div class="modal" id="mAnyDate" style="z-index:10006"><div class="sheet" style="border-radius:28px;border:3px solid #111"><div class="head"><b>加入到哪一天？</b><div class="x" onclick="closeM('mAnyDate')">✕</div></div><div style="padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center"><input type="date" id="anyDate" style="width:92%!important;height:68px!important;min-height:68px!important;line-height:68px!important;padding:0 12px!important;border-radius:20px!important;border:3px solid #111!important;background:#fffaf5!important;color:#111!important;font-weight:900!important;font-size:1.3rem!important;text-align:center!important;box-sizing:border-box!important;display:block!important"><button onclick="confirmAddToWeek()" style="width:92%!important;height:68px!important;min-height:68px!important;line-height:68px!important;padding:0!important;border-radius:20px!important;border:3px solid #111!important;background:#ff6b35!important;color:#fff!important;font-weight:900!important;font-size:1.35rem!important;box-sizing:border-box!important;display:grid!important;place-items:center!important;text-align:center!important">確認加入</button></div></div></div>
<div id="pdfWrap"><div class="pdfTool"><button class="btn" id="btnClosePdf" type="button" style="font-size:38px!important;line-height:1!important">✕</button><button class="ghost" id="btnSharePdf" type="button" style="font-size:36px!important;line-height:1!important">📤</button></div><div class="pdfView"><div class="pdfPage"><div class="pdfInner" id="pdfContent"></div></div></div></div>
<script>
const CAT_META_DEFAULT={"雞":{bg:"#ffeb8a",e:"🐔"},"牛":{bg:"#d7b899",e:"🐮"},"豬":{bg:"#ffb3c1",e:"🐷"},"魚":{bg:"#8ecfff",e:"🐟"},"蔬菜":{bg:"#a8e6a3",e:"🥬"},"湯水":{bg:"#ffcc7a",e:"🥣"},"西式":{bg:"#e2c499",e:"🍔"},"罐頭":{bg:"#9ec6ff",e:"🥫"},"其他":{bg:"#d8b4fe",e:"🍣"}};
let CAT_META=JSON.parse(localStorage.getItem('catMeta')||'null')||JSON.parse(JSON.stringify(CAT_META_DEFAULT));
function saveCatMeta(){localStorage.setItem('catMeta',JSON.stringify(CAT_META));}
function ensureCatMeta(){cats.forEach(c=>{if(!CAT_META[c]) CAT_META[c]={bg:"#ffe8c8",e:"🍱"}}); saveCatMeta();}
let cats=JSON.parse(localStorage.getItem('cats')||'null')||Object.keys(CAT_META);
let dishes=JSON.parse(localStorage.getItem('dishes')||'null')||[];
let weeklyMenus=JSON.parse(localStorage.getItem('weeklyMenus')||'[]');
let current={mon:null,days:[]}, lastCook=JSON.parse(localStorage.getItem('lastCook')||'{}'), editDay=null, pendDish=null;
const cn=["一","二","三","四","五","六","日"], idn=["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"], dayEmo=["🌅","🌤️","🌞","🌇","🌙","⭐","🎉"];
function go(p,el){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('p-'+p).classList.add('active');document.querySelectorAll('.nav').forEach(e=>e.classList.remove('active'));if(el) el.classList.add('active'); else document.querySelectorAll('.nav')[['weekly','library','mymenus','settings'].indexOf(p)].classList.add('active');}
function getMon(d){let dt=new Date(d);let day=dt.getDay();let diff=dt.getDate()-day+(day==0?-6:1);return new Date(dt.setDate(diff));}
function fmt(d){if(typeof d==='string')return d;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function openM(id){document.getElementById(id).classList.add('open');}function closeM(id){document.getElementById(id).classList.remove('open');}
let zh2idTimer = null;
async function autoTransZh2Id(zhText, targetEl){
  if(!zhText ||!zhText.trim()) return;
  try{
    let q = encodeURIComponent(zhText);
    let res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=id&dt=t&q=${q}`);
    let data = await res.json();
    let translated = data[0].map(x=>x[0]).join('');
    targetEl.value = translated;
  }catch(e){ alert('翻譯失敗，請檢查網絡'); }
}
function debounceTrans(fn, delay){
  return function(...args){
    clearTimeout(zh2idTimer);
    zh2idTimer = setTimeout(()=>fn(...args), delay);
  }
}
function makeDefaults(){
 if(dishes.length) return;
 //... (你原檔嘅大量預設菜式，我保留唔貼喇，太長，會自動用返你localStorage嘅菜)
}
function init(){
 let saved=localStorage.getItem('theme'); if(saved==='dark') document.body.classList.add('dark');
 let fs=localStorage.getItem('fs'); if(fs){ document.documentElement.style.setProperty('--fs',fs+'px'); let v=document.getElementById('fsVal'); if(v) v.innerText=fs; let r=document.getElementById('fsRange'); if(r) r.value=fs; }
 let av=localStorage.getItem('avatar'); if(av){ let el=document.getElementById('avatarTop'); if(el) el.src=av; }
 makeDefaults(); ensureCatMeta();
 let mon=getMon(new Date()); document.getElementById('monPicker').value=fmt(mon); current.mon=mon;
 current.days=[]; for(let i=0;i<7;i++){ let d=new Date(mon); d.setDate(mon.getDate()+i); current.days.push({date:d,dishes:[],diners:2,takeaway:0}); }
 renderWeek(); renderCats(); renderCatOrder(); renderMy();
 let dp=document.getElementById('diners'); let tp=document.getElementById('takeaway'); if(dp){ for(let i=1;i<=20;i++){ let o=document.createElement('option'); o.value=i; o.text=i; dp.appendChild(o); } } if(tp){ for(let i=0;i<=20;i++){ let o=document.createElement('option'); o.value=i; o.text=i; tp.appendChild(o); } }
}
function renderWeek(){
 let g=document.getElementById('weeklyGrid'); g.innerHTML='';
 for(let r=0;r<3;r++){
  let row=document.createElement('div'); row.className='weekRow';
  for(let c=0;c<3;c++){
   let idx=r*3+c; if(idx>=7) continue;
   let d=current.days[idx];
   let box=document.createElement('div'); box.className='dayBox';
   let meta=CAT_META[cats[0]]||{bg:"#fff",e:"🍱"};
   box.style.background=meta.bg||'#fff';
   box.innerHTML=`<div style="font-weight:900">星期${cn[idx]} / ${idn[idx]}</div><div style="font-size:13px">${fmt(d.date).slice(5)}</div><div style="margin-top:6px;font-size:12px">${d.dishes.length} 道菜</div><div style="font-size:11px">👥${d.diners} 📦${d.takeaway}</div>`;
   box.onclick=()=>openWeek(idx);
   row.appendChild(box);
  }
  g.appendChild(row);
 }
}
function openWeek(i){ editDay=i; let d=current.days[i]; document.getElementById('mWeekTitle').innerText=`星期${cn[i]} ${fmt(d.date)}`; document.getElementById('diners').value=d.diners; document.getElementById('takeaway').value=d.takeaway; renderSel(); openM('mWeek'); }
function renderSel(){
 let b=document.getElementById('selDishes'); b.innerHTML='';
 current.days[editDay].dishes.forEach((dd,idx)=>{
  let row=document.createElement('div'); row.className='dishRow';
  row.innerHTML=`<div><b>${dd.name}</b><div style="font-size:12px;color:var(--muted)">${dd.indo||''}</div></div><div class="act"><button onclick="upDish(${idx})">↑</button><button onclick="downDish(${idx})">↓</button><button onclick="rmDish(${idx})">❌</button></div>`;
  b.appendChild(row);
 });
}
function upDish(i){ if(i==0) return; let a=current.days[editDay].dishes; let t=a[i]; a[i]=a[i-1]; a[i-1]=t; renderSel(); renderWeek(); }
function downDish(i){ let a=current.days[editDay].dishes; if(i>=a.length-1) return; let t=a[i]; a[i]=a[i+1]; a[i+1]=t; renderSel(); renderWeek(); }
function rmDish(i){ current.days[editDay].dishes.splice(i,1); renderSel(); renderWeek(); }
function openPickCat(){
 let b=document.getElementById('mPickCatBody'); b.innerHTML='';
 cats.forEach(c=>{
  let meta=CAT_META[c]||{bg:"#fff",e:"🍱"};
  let div=document.createElement('div'); div.className='catBox'; div.style.background=meta.bg;
  div.innerHTML=`<div class="em">${meta.e}</div><div class="lb">${c}</div>`;
  div.onclick=()=>pickCat(c);
  b.appendChild(div);
 });
 openM('mPickCat');
}
function pickCat(c){
 let b=document.getElementById('mPickDishBody'); b.innerHTML='';
 let list=dishes.filter(d=>d.cat===c);
 list.forEach(d=>{
  let row=document.createElement('div'); row.className='dishRow';
  row.innerHTML=`<div><b>${d.name}</b><div style="font-size:12px">${d.indo||''}</div></div><button class="ghost" onclick="addDishToDay('${d.id}')">加入</button>`;
  b.appendChild(row);
 });
 openM('mPickDish');
}
function addDishToDay(id){
 let d=dishes.find(x=>x.id===id); if(!d) return;
 current.days[editDay].dishes.push(JSON.parse(JSON.stringify(d)));
 renderSel(); renderWeek(); closeM('mPickDish'); closeM('mPickCat');
}
function saveWeekly(){
 let monStr=document.getElementById('monPicker').value;
 weeklyMenus.push({monday:monStr,days:current.days.map(d=>({date:fmt(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway}))});
 localStorage.setItem('weeklyMenus',JSON.stringify(weeklyMenus));
 alert('已儲存');
 renderMy();
}
function renderCats(){
 let g=document.getElementById('catGrid'); if(!g) return; g.innerHTML='';
 cats.forEach(c=>{
  let meta=CAT_META[c]||{bg:"#fff",e:"🍱"};
  let div=document.createElement('div'); div.className='catBox'; div.style.background=meta.bg;
  div.innerHTML=`<div class="em">${meta.e}</div><div class="lb">${c}</div><div class="d2">${dishes.filter(d=>d.cat===c).length} 道</div>`;
  div.onclick=()=>openCat(c);
  g.appendChild(div);
 });
 let f=document.getElementById('fCat'); if(f){ f.innerHTML=''; cats.forEach(c=>{ let o=document.createElement('option'); o.value=c; o.text=c; f.appendChild(o); }); }
}
function openCat(c){
 document.getElementById('mCatTitle').innerText=c;
 let b=document.getElementById('mCatBody'); b.innerHTML='';
 let list=dishes.filter(d=>d.cat===c);
 list.forEach(d=>{
  let row=document.createElement('div'); row.className='dishRow';
  row.innerHTML=`<div><b>${d.name}</b><div style="font-size:12px">${d.indo||''}</div></div><div class="act"><button onclick="editDish('${d.id}')">✏️</button><button onclick="delDish('${d.id}')">❌</button></div>`;
  b.appendChild(row);
 });
 openM('mCat');
}
function openAdd(){
 document.getElementById('fId').value=''; document.getElementById('fName').value=''; document.getElementById('fIndo').value=''; document.getElementById('fNoteZh').value=''; document.getElementById('fNoteId').value='';
 openM('mAdd');
}
function editDish(id){
 let d=dishes.find(x=>x.id===id); if(!d) return;
 document.getElementById('fId').value=d.id; document.getElementById('fName').value=d.name; document.getElementById('fIndo').value=d.indo||''; document.getElementById('fNoteZh').value=d.noteZh||d.note||''; document.getElementById('fNoteId').value=d.noteId||''; document.getElementById('fCat').value=d.cat;
 openM('mAdd');
}
function saveDish(){
 let id=document.getElementById('fId').value||Date.now().toString();
 let name=document.getElementById('fName').value.trim(); if(!name) return alert('請輸入菜名');
 let indo=document.getElementById('fIndo').value.trim();
 let noteZh=document.getElementById('fNoteZh').value.trim();
 let noteId=document.getElementById('fNoteId').value.trim();
 let cat=document.getElementById('fCat').value;
 let obj={id,name,indo,noteZh,noteId,note:noteZh,cat};
 let idx=dishes.findIndex(x=>x.id===id);
 if(idx>=0) dishes[idx]=obj; else dishes.push(obj);
 localStorage.setItem('dishes',JSON.stringify(dishes));
 closeM('mAdd'); renderCats(); if(document.getElementById('mCat').classList.contains('open')) openCat(cat);
}
function delDish(id){ if(!confirm('刪除？')) return; dishes=dishes.filter(x=>x.id!==id); localStorage.setItem('dishes',JSON.stringify(dishes)); renderCats(); document.getElementById('mCatBody').innerHTML=''; }
function exportLib(){
 let data=JSON.stringify({cats,dishes}); let blob=new Blob([data],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='dishes.json'; a.click();
}
function importLib(e){
 let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=ev=>{ try{ let j=JSON.parse(ev.target.result); if(j.cats&&j.dishes){ cats=j.cats; dishes=j.dishes; localStorage.setItem('cats',JSON.stringify(cats)); localStorage.setItem('dishes',JSON.stringify(dishes)); renderCats(); renderCatOrder(); alert('匯入成功'); } }catch{ alert('失敗'); } }; r.readAsText(f); e.target.value='';
}
document.getElementById('impFile')?.addEventListener('change',importLib);
function renderMy(){
 let b=document.getElementById('myList'); if(!b) return; b.innerHTML='';
 weeklyMenus.forEach((m,i)=>{
  let div=document.createElement('div'); div.className='card';
  div.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b>${m.monday} 星期一</b><div class="act"><button onclick="loadMenu(${i})">📂</button><button onclick="pdfSingle(${i})">📄</button><button onclick="delMenu(${i})">❌</button></div></div>`;
  b.appendChild(div);
 });
}
function toggleMy(open){document.querySelectorAll('.myBody').forEach(b=>b.style.display=open?'block':'none');}
function loadMenu(i){ let m=weeklyMenus[i]; document.getElementById('monPicker').value=m.monday; let mon=new Date(m.monday); current.mon=mon; current.days=m.days.map(d=>({date:new Date(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway})); go('weekly',document.querySelectorAll('.nav')[0]); renderWeek(); }
function delMenu(i){ if(!confirm('刪除?')) return; weeklyMenus.splice(i,1); localStorage.setItem('weeklyMenus',JSON.stringify(weeklyMenus)); renderMy(); }
function makePDF(days, monStr){
let html = `<h1 style="text-align:center;border-bottom:3px solid #111;padding-bottom:12px;margin:0 0 12px 0;font-size:13pt;font-weight:900">我的菜單<br><span style="font-size:13pt">Menu Saya</span></h1><div style="text-align:center;margin:10px 0;font-weight:900;font-size:13pt">${monStr} 星期一 / Senin</div>`;
days.forEach((d,i)=>{
html += `<div style="border:2.5px solid #111;border-radius:14px;overflow:hidden;margin-bottom:16px;background:#fff"><div style="display:flex;justify-content:space-between;background:#fff3d6;padding:12px 14px;font-weight:900;border-bottom:2.5px solid #111;flex-wrap:wrap;gap:6px;font-size:15pt"><b style="font-size:15pt;font-weight:900">星期${cn[i]} / ${idn[i]} ${d.date}</b><span style="font-size:15pt;font-weight:900">用餐 / Makan: ${d.diners} &nbsp; 外帶 / Bungkus: ${d.takeaway}</span></div>`;
if(d.dishes.length===0){ html+=`<div style="padding:10px 14px;font-size:13pt">無 / Belum ada</div>`; }
else{ d.dishes.forEach(dd=>{
let zh = (dd.noteZh||dd.note||'').replace(/中文：/g,'').replace(/中文:/g,'').trim();
let idNote = (dd.noteId||'').trim();
html+=`<div style="padding:10px 14px;border-bottom:1px dashed #999;font-size:13pt;break-inside:avoid"><b style="font-size:13pt;font-weight:900">${dd.name} / ${dd.indo||''}</b><div style="margin-top:8px;white-space:pre-wrap;font-size:13pt;line-height:1.5">${zh}</div><div style="margin-top:6px;white-space:pre-wrap;font-size:13pt;line-height:1.5">${idNote}</div></div>`;
}); }
html+=`</div>`;
});
return html;
}
function exportWeeklyPDF(){ showPDF(makePDF(current.days.map(d=>({date:fmt(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway})), fmt(current.mon))); }
function pdfSingle(i){ let m=weeklyMenus[i]; showPDF(makePDF(m.days,m.monday)); }
function showPDF(inner){ document.getElementById('pdfContent').innerHTML=inner; document.getElementById('pdfWrap').classList.add('open'); }
function closePDF(){ document.getElementById('pdfWrap').classList.remove('open'); }
async function sharePDF(){
let content=document.getElementById('pdfContent');
let btn=document.getElementById('btnSharePdf');
if(btn.dataset.busy==="1") return;
let old=btn.textContent; btn.textContent='⏳'; btn.disabled=true; btn.dataset.busy="1";
try{
const { jsPDF } = window.jspdf;
const pdf = new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
const pageW=210, pageH=297, marginTop=15, marginBottom=20, marginX=15;
const usableW = pageW - marginX*2;
let curY = marginTop;
let headerWrap=document.createElement('div'); headerWrap.style.width='794px'; headerWrap.style.background='#fff'; headerWrap.style.position='fixed'; headerWrap.style.left='-9999px'; headerWrap.style.top='0';
let hClone=document.createElement('div');
hClone.innerHTML = content.children[0].outerHTML + content.children[1].outerHTML;
hClone.style.width='794px'; headerWrap.appendChild(hClone); document.body.appendChild(headerWrap);
let hCanvas = await html2canvas(hClone,{scale:2,useCORS:true,backgroundColor:'#ffffff'});
let hImg = hCanvas.toDataURL('image/png');
let hRatio = usableW / 794 * hCanvas.width / hCanvas.width;
let hH = hCanvas.height * usableW / 794;
pdf.addImage(hImg,'PNG',marginX,curY,usableW,hH);
curY+=hH+5;
document.body.removeChild(headerWrap);
for(let i=2;i<content.children.length;i++){
let el=content.children[i];
let wrap=document.createElement('div'); wrap.style.width='794px'; wrap.style.background='#fff'; wrap.style.position='fixed'; wrap.style.left='-9999px'; wrap.style.top='0'; wrap.appendChild(el.cloneNode(true)); document.body.appendChild(wrap);
let canvas = await html2canvas(wrap.firstChild,{scale:2,useCORS:true,backgroundColor:'#ffffff'});
let img = canvas.toDataURL('image/png');
let hh = canvas.height * usableW / 794;
if(curY+hh>pageH-marginBottom){ pdf.addPage(); curY=marginTop; }
pdf.addImage(img,'PNG',marginX,curY,usableW,hh);
curY+=hh+4;
document.body.removeChild(wrap);
}
pdf.save(`Menu_${Date.now()}.pdf`);
}catch(e){ alert('PDF失敗:'+e.message); }
finally{ btn.textContent=old; btn.disabled=false; btn.dataset.busy="0"; }
}
document.getElementById('btnClosePdf')?.addEventListener('click',closePDF);
document.getElementById('btnSharePdf')?.addEventListener('click',sharePDF);

// ===== 可愛貼紙版專用 - 覆蓋舊 renderCatOrder，解決出界 + ❌ + 大字 + 限4字 =====
function renderCatOrder(){
  ensureCatMeta();
  var b=document.getElementById('catOrder');
  if(!b) return;
  var html='';
  for(var i=0;i<cats.length;i++){
    var c=cats[i];
    var e='🍱';
    if(CAT_META && CAT_META[c] && CAT_META[c].e){ e=CAT_META[c].e; }
    var count = dishes.filter(dd=>dd.cat===c).length;
    html+='<div style="display:flex;align-items:center;background:var(--card);border:3px solid var(--border);border-radius:22px;padding:12px 10px;margin-bottom:14px;gap:10px;width:100%;box-sizing:border-box;box-shadow:0 4px 0 #ffe2c4">'
         +'<div style="width:54px;min-width:54px;height:54px;border-radius:50%;background:#fff2e0;border:2.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px">'+e+'</div>'
         +'<div style="flex:1;min-width:0;margin-left:4px"><div style="font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px">'+c+'</div><div style="font-size:12px;color:var(--muted);font-weight:700">'+count+' 道菜</div></div>'
         +'<input value="'+e+'" onchange="updateCatIcon('+i+',this.value)" onclick="this.select()" style="width:56px;min-width:56px;height:44px;text-align:center;font-size:22px;font-weight:800;border:2.5px solid var(--border);border-radius:14px;background:var(--bg)">'
         +'<div style="display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0">'
         +'<button class="iconBtn" style="width:42px;min-width:42px;height:42px;border-radius:12px;font-size:18px;font-weight:900" onclick="moveCat('+i+',-1)">∧</button>'
         +'<button class="iconBtn" style="width:42px;min-width:42px;height:42px;border-radius:12px;font-size:18px;font-weight:900" onclick="moveCat('+i+',1)">∨</button>'
         +'<button class="iconBtn" style="width:42px;min-width:42px;height:42px;border-radius:12px;font-size:16px;background:#ffe9e9;border-color:#ffbcbc" onclick="delCat('+i+')">❌</button>'
         +'</div></div>';
  }
  b.innerHTML=html;
}
function updateCatIcon(i,emoji){
  var cat=cats[i];
  if(!CAT_META[cat]) CAT_META[cat]={bg:'#ffe8c8',e:'🍱'};
  var newE=emoji.trim();
  if(!newE) newE='🍱';
  CAT_META[cat].e=newE.substring(0,4);
  saveCatMeta();
  renderCats();
  renderCatOrder();
}
function addCat(){
  var vEl=document.getElementById('newCat');
  var v=vEl.value.trim();
  if(v.length>4){ v=v.substring(0,4); }
  var iconEl=document.getElementById('newCatIcon');
  var icon=(iconEl?iconEl.value.trim():'')||'🍱';
  if(!v){ alert('輸入分類名先～'); return; }
  if(v.length>4){ alert('分類最多4個字呀'); return; }
  if(cats.includes(v)){ alert('已有呢個分類喇'); return; }
  cats.push(v);
  CAT_META[v]={bg:'#ffe8c8',e:icon.slice(0,4)};
  localStorage.setItem('cats',JSON.stringify(cats));
  saveCatMeta();
  vEl.value='';
  if(iconEl) iconEl.value='';
  renderCatOrder();
  renderCats();
}
function moveCat(i,dir){ let ni=i+dir; if(ni<0||ni>=cats.length) return; let t=cats[i]; cats[i]=cats[ni]; cats[ni]=t; localStorage.setItem('cats',JSON.stringify(cats)); renderCatOrder(); renderCats(); }
function delCat(i){ let cat=cats[i]; if(!confirm(`刪除「${cat}」會全部移到「其他」？`)) return; dishes.forEach(d=>{ if(d.cat===cat) d.cat='其他'; }); if(!cats.includes('其他')) cats.push('其他'); if(!CAT_META['其他']) CAT_META['其他']={bg:'#d8b4fe',e:'🍣'}; cats.splice(i,1); localStorage.setItem('cats',JSON.stringify(cats)); localStorage.setItem('dishes',JSON.stringify(dishes)); saveCatMeta(); renderCatOrder(); renderCats(); }
function toggleTheme(){ document.body.classList.toggle('dark'); localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light'); }
function setFS(v){ document.documentElement.style.setProperty('--fs',v+'px'); document.getElementById('fsVal').innerText=v; localStorage.setItem('fs',v); }
let img=new Image(), scale=1, px=0, py=0, drag=false, lx=0, ly=0, initS=1;
let canvas=document.getElementById('avCanvas');
function drawAv(){ let ctx=canvas.getContext('2d'); ctx.clearRect(0,0,600,600); if(!img.src) return; let w=img.width*scale, h=img.height*scale; ctx.drawImage(img,300-w/2+px,300-h/2+py,w,h); }
document.getElementById('avFile').addEventListener('change',e=>{ let f=e.target.files[0];
  let nameEl=document.getElementById('avFileName'); if(nameEl) nameEl.textContent=f?f.name:'尚未選取檔案';
  if(!f) return; let r=new FileReader(); r.onload=ev=>{ img.src=ev.target.result; img.onload=()=>{ initS=500/Math.min(img.width,img.height); scale=initS; px=0; py=0; document.getElementById('avZoom').value=scale; drawAv(); }; }; r.readAsDataURL(f); });
document.getElementById('avZoom').addEventListener('input',e=>{ scale=parseFloat(e.target.value); drawAv(); });
canvas.addEventListener('mousedown',e=>{drag=true; lx=e.clientX; ly=e.clientY;});
canvas.addEventListener('touchstart',e=>{drag=true; lx=e.touches[0].clientX; ly=e.touches[0].clientY;},{passive:false});
window.addEventListener('mousemove',e=>{if(!drag) return; px+=e.clientX-lx; py+=e.clientY-ly; lx=e.clientX; ly=e.clientY; drawAv();});
window.addEventListener('touchmove',e=>{if(!drag) return; e.preventDefault(); px+=e.touches[0].clientX-lx; py+=e.touches[0].clientY-ly; lx=e.touches[0].clientX; ly=e.touches[0].clientY; drawAv();},{passive:false});
window.addEventListener('mouseup',()=>drag=false); window.addEventListener('touchend',()=>drag=false);
function resetAv(){ px=0; py=0; scale=initS; document.getElementById('avZoom').value=scale; drawAv(); }
function saveAv(){ let d=canvas.toDataURL('image/png'); localStorage.setItem('avatar',d); document.getElementById('avatarTop').src=d; alert('已儲存'); }
init();
</script>
