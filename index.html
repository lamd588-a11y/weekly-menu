<!DOCTYPE html>
<html lang="zh-HK" data-theme="light" style="font-size: 16px;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>每週菜單</title>
  
  <!-- PWA 設定 -->
  <link rel="manifest" href="data:application/json,{"name":"每週菜單","short_name":"每週菜單","start_url":"./","display":"standalone","background_color":"#f8f9fa","theme_color":"#ffffff"}">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Tailwind CSS & SortableJS & html2pdf -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root { --font-size-base: 16px; }
    html { font-size: var(--font-size-base); }
    body {
      user-select: none;
      -webkit-user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* 深色模式覆蓋 */
    [data-theme="dark"] {
      background-color: #121212;
      color: #e0e0e0;
    }
    [data-theme="dark"] .bg-white { background-color: #1e1e1e !important; color: #f0f0f0 !important; }
    [data-theme="dark"] .bg-gray-50 { background-color: #121212 !important; }
    [data-theme="dark"] .bg-gray-100 { background-color: #2a2a2a !important; color: #e0e0e0 !important; }
    [data-theme="dark"] .border { border-color: #333333 !important; }
    [data-theme="dark"] .text-gray-500 { color: #a0a0a0 !important; }
    [data-theme="dark"] .text-gray-700 { color: #dddddd !important; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b px-5 py-3 flex justify-between items-center sticky top-0 z-10 shadow-sm">
    <div class="flex items-center gap-3">
      <img id="header-avatar" src="icon.png" class="w-10 h-10 rounded-full object-cover border" alt="頭像">
      <h1 class="text-xl font-bold text-gray-800" id="app-title">每週菜單</h1>
    </div>
    <div class="flex gap-2">
      <button onclick="switchTab('menu')" class="px-3 py-1.5 rounded-lg bg-blue-50 text-blue-600 font-medium text-sm">菜單</button>
      <button onclick="switchTab('dishes')" class="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-600 font-medium text-sm">菜式庫</button>
      <button onclick="switchTab('settings')" class="p-2 rounded-lg bg-gray-100 text-gray-600"><i class="fa-solid fa-gear"></i></button>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="flex-1 p-4 pb-20 max-w-md mx-auto w-full">

    <!-- 頁籤 1: 每週菜單 -->
    <section id="tab-menu" class="space-y-4">
      <div class="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm border">
        <div>
          <label class="text-xs text-gray-500 block">起始星期一日期</label>
          <input type="date" id="menu-start-date" class="font-bold text-gray-700 bg-transparent outline-none" onchange="renderWeeklyMenu()">
        </div>
        <div class="flex gap-2">
          <button onclick="exportPDF('zh')" class="bg-green-600 text-white text-xs px-3 py-2 rounded-lg font-medium"><i class="fa-solid fa-file-pdf mr-1"></i>中文 PDF</button>
          <button onclick="exportPDF('id')" class="bg-teal-600 text-white text-xs px-3 py-2 rounded-lg font-medium"><i class="fa-solid fa-file-pdf mr-1"></i>Indo PDF</button>
        </div>
      </div>

      <!-- 7天菜單列表 -->
      <div id="pdf-content" class="space-y-3 bg-white p-3 rounded-xl">
        <h2 class="text-center font-bold text-lg mb-2 hidden print:block">每週菜單</h2>
        <div id="days-container" class="space-y-3"></div>
      </div>
    </section>

    <!-- 頁籤 2: 分類與菜式管理 -->
    <section id="tab-dishes" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold">菜式分類管理</h2>
        <button onclick="openAddDishModal()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm"><i class="fa-solid fa-plus mr-1"></i>新增菜式</button>
      </div>
      <div id="categories-dish-list" class="space-y-4"></div>
    </section>

    <!-- 頁籤 3: 設定 -->
    <section id="tab-settings" class="hidden space-y-6">
      <h2 class="text-lg font-bold">系統設定</h2>

      <!-- 自訂頭像 -->
      <div class="bg-white p-4 rounded-xl border shadow-sm space-y-3">
        <h3 class="font-semibold text-sm text-gray-700">個人頭像</h3>
        <div class="flex items-center gap-4">
          <img id="settings-avatar-preview" src="icon.png" class="w-16 h-16 rounded-full object-cover border">
          <input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="updateAvatar(event)">
          <button onclick="document.getElementById('avatar-input').click()" class="bg-gray-100 border px-3 py-1.5 rounded-lg text-sm">更換頭像</button>
        </div>
      </div>

      <!-- 主題與字型 -->
      <div class="bg-white p-4 rounded-xl border shadow-sm space-y-4">
        <h3 class="font-semibold text-sm text-gray-700">顯示設定</h3>
        <div class="flex justify-between items-center">
          <span>深色模式</span>
          <input type="checkbox" id="theme-toggle" onchange="toggleTheme()" class="w-5 h-5">
        </div>
        <div class="flex justify-between items-center">
          <span>字體大小</span>
          <select id="font-size-select" onchange="changeFontSize(this.value)" class="border rounded p-1 text-sm">
            <small value="14">小</small>
            <option value="16" selected>中 (預設)</option>
            <option value="18">大</option>
            <option value="20">特大</option>
          </select>
        </div>
      </div>

      <!-- 分類管理與拖拉排序 -->
      <div class="bg-white p-4 rounded-xl border shadow-sm space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="font-semibold text-sm text-gray-700">分類順序與管理 (可拖拉排序)</h3>
          <button onclick="addNewCategory()" class="text-blue-600 text-xs"><i class="fa-solid fa-plus"></i> 新增分類</button>
        </div>
        <ul id="sortable-categories" class="space-y-2"></ul>
      </div>
    </section>

  </main>

  <!-- 選擇菜式 Modal -->
  <div id="select-dish-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[80vh] flex flex-col p-4 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold">選擇菜式</h3>
        <button onclick="closeModal('select-dish-modal')" class="text-gray-400 text-xl">&times;</button>
      </div>
      <div id="modal-category-selector" class="flex gap-2 overflow-x-auto pb-2"></div>
      <div id="modal-dish-list" class="flex-1 overflow-y-auto space-y-2"></div>
    </div>
  </div>

  <script>
    // 預設資料設定
    const DEFAULT_CATEGORIES = ['雞', '牛', '豬', '魚', '菜', '湯', '其他'];
    
    let state = {
      categories: JSON.parse(localStorage.getItem('menu_categories')) || DEFAULT_CATEGORIES,
      dishes: JSON.parse(localStorage.getItem('menu_dishes')) || [
        { id: '1', name: '蒸水蛋', category: '其他', lastCooked: '' },
        { id: '2', name: '菜心炒牛肉', category: '牛', lastCooked: '' }
      ],
      weeklyMenu: JSON.parse(localStorage.getItem('menu_weekly')) || {},
      theme: localStorage.getItem('menu_theme') || 'light',
      fontSize: localStorage.getItem('menu_fontSize') || '16',
      avatar: localStorage.getItem('menu_avatar') || 'icon.png',
      selectedDayIndex: null
    };

    // 初始化 App
    document.addEventListener('DOMContentLoaded', () => {
      initSettings();
      setDefaultMonday();
      renderWeeklyMenu();
      renderCategoriesManagement();
      renderDishesTab();
      
      // 註冊 Service Worker (PWA)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(()=>{});
      }
    });

    function saveData() {
      localStorage.setItem('menu_categories', JSON.stringify(state.categories));
      localStorage.setItem('menu_dishes', JSON.stringify(state.dishes));
      localStorage.setItem('menu_weekly', JSON.stringify(state.weeklyMenu));
      localStorage.setItem('menu_theme', state.theme);
      localStorage.setItem('menu_fontSize', state.fontSize);
      localStorage.setItem('menu_avatar', state.avatar);
    }

    // 頁籤切換
    function switchTab(tab) {
      ['menu', 'dishes', 'settings'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab);
      });
    }

    // 設定預設星期一
    function setDefaultMonday() {
      const d = new Date();
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(d.setDate(diff)).toISOString().split('T')[0];
      document.getElementById('menu-start-date').value = monday;
    }

    // 渲染每週菜單 (7天)
    function renderWeeklyMenu() {
      const container = document.getElementById('days-container');
      container.innerHTML = '';
      const startDateStr = document.getElementById('menu-start-date').value;
      if (!startDateStr) return;

      const weekDays = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
      const startDate = new Date(startDateStr);

      weekDays.forEach((dayName, idx) => {
        const currentDate = new Date(startDate);
        currentDate.setDate(startDate.getDate() + idx);
        const dateStr = `${currentDate.getMonth()+1}月${currentDate.getDate()}日`;
        const key = `${startDateStr}_day_${idx}`;
        
        const dayData = state.weeklyMenu[key] || { dishes: [], diners: 0, takeaways: 0 };

        const dayEl = document.createElement('div');
        dayEl.className = 'border rounded-xl p-3 bg-gray-50/50 space-y-2';
        dayEl.innerHTML = `
          <div class="flex justify-between items-center border-b pb-1">
            <span class="font-bold text-blue-600">${dayName} (${dateStr})</span>
            <div class="flex gap-3 text-xs text-gray-500">
              <span>用餐: <input type="number" value="${dayData.diners}" min="0" class="w-10 border rounded text-center bg-white" onchange="updateDayMeta('${key}', 'diners', this.value)"> 人</span>
              <span>外帶: <input type="number" value="${dayData.takeaways}" min="0" class="w-10 border rounded text-center bg-white" onchange="updateDayMeta('${key}', 'takeaways', this.value)"> 人</span>
            </div>
          </div>
          <div class="space-y-1">
            ${dayData.dishes.map((dish, dIdx) => `
              <div class="flex justify-between items-center text-sm bg-white p-2 rounded border">
                <span>${dish.name} <small class="text-xs text-gray-400">(${dish.category})</small></span>
                <button onclick="removeDishFromDay('${key}',${dIdx})" class="text-red-400 text-xs"><i class="fa-solid fa-xmark"></i></button>
              </div>
            `).join('')}
          </div>
          <button onclick="openSelectDishModal('${key}', '${currentDate.toISOString().split('T')[0]}')" class="w-full py-1.5 border border-dashed rounded-lg text-xs text-gray-500 bg-white">+ 選擇菜式</button>
        `;
        container.appendChild(dayEl);
      });
    }

    function updateDayMeta(key, field, val) {
      if (!state.weeklyMenu[key]) state.weeklyMenu[key] = { dishes: [], diners: 0, takeaways: 0 };
      state.weeklyMenu[key][field] = parseInt(val) || 0;
      saveData();
    }

    function removeDishFromDay(key, index) {
      state.weeklyMenu[key].dishes.splice(index, 1);
      saveData();
      renderWeeklyMenu();
    }

    // Modal 選擇菜式邏輯
    let currentSelectKey = '';
    let currentSelectDate = '';
    function openSelectDishModal(key, dateStr) {
      currentSelectKey = key;
      currentSelectDate = dateStr;
      document.getElementById('select-dish-modal').classList.remove('hidden');
      renderModalDishes(state.categories[0]);
    }

    function renderModalDishes(selectedCat) {
      const catSelector = document.getElementById('modal-category-selector');
      catSelector.innerHTML = state.categories.map(cat => `
        <button onclick="renderModalDishes('${cat}')" class="px-3 py-1 rounded-full text-xs border whitespace-nowrap ${cat === selectedCat ? 'bg-blue-600 text-white' : 'bg-gray-100'}">${cat}</button>
      `).join('');

      const list = document.getElementById('modal-dish-list');
      const filteredDishes = state.dishes.filter(d => d.category === selectedCat);
      
      list.innerHTML = filteredDishes.map(d => `
        <div onclick="addDishToMenu('${d.id}')" class="flex justify-between items-center p-2.5 border rounded-lg cursor-pointer hover:bg-gray-50">
          <span class="font-medium text-sm">${d.name}</span>
          <span class="text-xs text-gray-400">上次烹飪: ${d.lastCooked || '未紀錄'}</span>
        </div>
      `).join('') || '<p class="text-xs text-gray-400 text-center py-4">此分類無菜式</p>';
    }

    function addDishToMenu(dishId) {
      const dish = state.dishes.find(d => d.id === dishId);
      if (!dish) return;

      if (!state.weeklyMenu[currentSelectKey]) {
        state.weeklyMenu[currentSelectKey] = { dishes: [], diners: 0, takeaways: 0 };
      }
      
      state.weeklyMenu[currentSelectKey].dishes.push({ name: dish.name, category: dish.category });
      dish.lastCooked = currentSelectDate; // 更新最後烹飪日期

      saveData();
      closeModal('select-dish-modal');
      renderWeeklyMenu();
      renderDishesTab();
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    // 匯出 PDF 功能
    function exportPDF(lang) {
      const element = document.getElementById('pdf-content');
      const opt = {
        margin:       0.5,
        filename:     `weekly_menu_${lang}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    // 設定頁面與分類拖拉排序
    function renderCategoriesManagement() {
      const ul = document.getElementById('sortable-categories');
      ul.innerHTML = state.categories.map((cat, idx) => `
        <li class="flex justify-between items-center p-2 bg-gray-50 border rounded-lg" data-cat="${cat}">
          <span class="flex items-center gap-2 text-sm"><i class="fa-solid fa-bars text-gray-400 handle cursor-grab"></i> ${cat}</span>
          ${cat !== '其他' ? `<button onclick="deleteCategory('${cat}')" class="text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>` : ''}
        </li>
      `).join('');

      new Sortable(ul, {
        handle: '.handle',
        animation: 150,
        onEnd: function() {
          const newOrder = Array.from(ul.children).map(li => li.getAttribute('data-cat'));
          state.categories = newOrder;
          saveData();
          renderDishesTab();
        }
      });
    }

    function addNewCategory() {
      const name = prompt('請輸入新分類名稱：');
      if (name && !state.categories.includes(name)) {
        state.categories.push(name);
        saveData();
        renderCategoriesManagement();
        renderDishesTab();
      }
    }

    function deleteCategory(cat) {
      if (confirm(`確定要刪除「${cat}」分類嗎？刪除後，該分類下的所有菜式將會自動移至「其他」分類。`)) {
        state.dishes.forEach(d => {
          if (d.category === cat) d.category = '其他';
        });
        state.categories = state.categories.filter(c => c !== cat);
        saveData();
        renderCategoriesManagement();
        renderDishesTab();
      }
    }

    // 菜式頁籤渲染與新增
    function renderDishesTab() {
      const container = document.getElementById('categories-dish-list');
      container.innerHTML = state.categories.map(cat => {
        const catDishes = state.dishes.filter(d => d.category === cat);
        return `
          <div class="bg-white p-3 rounded-xl border space-y-2">
            <h3 class="font-bold text-sm text-gray-700 border-b pb-1">${cat}</h3>
            <div class="space-y-1">
              ${catDishes.map(d => `
                <div class="flex justify-between items-center text-sm py-1">
                  <span>${d.name}</span>
                  <span class="text-xs text-gray-400">上次烹飪: ${d.lastCooked || '未紀錄'}</span>
                </div>
              `).join('') || '<span class="text-xs text-gray-400">暫無菜式</span>'}
            </div>
          </div>
        `;
      }).join('');
    }

    function openAddDishModal() {
      const name = prompt('請輸入菜式名稱：');
      if (!name) return;
      const cat = prompt(`請輸入分類 (${state.categories.join('/')})：`, state.categories[0]);
      if (name && state.categories.includes(cat)) {
        state.dishes.push({ id: Date.now().toString(), name, category: cat, lastCooked: '' });
        saveData();
        renderDishesTab();
      }
    }

    // 初始化與變更系統設定
    function initSettings() {
      document.documentElement.setAttribute('data-theme', state.theme);
      document.getElementById('theme-toggle').checked = state.theme === 'dark';
      document.documentElement.style.setProperty('--font-size-base', `${state.fontSize}px`);
      document.getElementById('font-size-select').value = state.fontSize;
      
      if(state.avatar) {
        document.getElementById('header-avatar').src = state.avatar;
        document.getElementById('settings-avatar-preview').src = state.avatar;
      }
    }

    function toggleTheme() {
      state.theme = document.getElementById('theme-toggle').checked ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', state.theme);
      saveData();
    }

    function changeFontSize(val) {
      state.fontSize = val;
      document.documentElement.style.setProperty('--font-size-base', `${val}px`);
      saveData();
    }

    function updateAvatar(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          state.avatar = evt.target.result;
          document.getElementById('header-avatar').src = state.avatar;
          document.getElementById('settings-avatar-preview').src = state.avatar;
          saveData();
        };
        reader.readAsDataURL(file);
      }
    }
  </script>
</body>
</html>
