<style>
:root{--bg:#fffaf0;--card:#fff;--text:#111;--muted:#888;--primary:#ff6b35;--border:#f0dcc8;--fs:20px}
html{font-size:var(--fs)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,PingFang HK,sans-serif;padding-bottom:140px}
.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:2px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
.avatar{width:62px;height:62px;border-radius:50%;border:3px solid var(--primary);object-fit:cover}
.pages{max-width:520px;margin:0 auto;padding:12px}.page{display:none}.page.active{display:block}
.card{background:var(--card);border:2px solid var(--border);border-radius:20px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center}
.btn{flex:1;padding:16px;border-radius:16px;border:none;background:var(--primary);color:#fff;font-weight:900;font-size:1.1rem}
.ghost{flex:1;padding:14px;border-radius:16px;border:2px solid var(--border);background:var(--bg);font-weight:800}
.iconBtn{width:60px;height:60px;border-radius:18px;border:2px solid var(--border);background:var(--card);font-size:30px;display:grid;place-items:center}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.catBox{aspect-ratio:1;border-radius:18px;border:3px solid #111;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:6px}
.weekWrap{display:flex;flex-direction:column;gap:8px}.weekRow{display:flex;gap:8px;justify-content:center}
.dayBox{width:32%;aspect-ratio:1;border-radius:18px;border:3px solid #111;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--border);display:flex;justify-content:space-around;padding:16px 0 38px;z-index:20}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}.ic{font-size:46px;line-height:1;display:block}.nav.active{color:var(--primary)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:9999;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}
.sheet{width:100%;max-width:500px;max-height:88vh;overflow:auto;background:var(--card);border-radius:24px;border:3px solid #111}
.head{position:sticky;top:0;background:var(--card);padding:14px;border-bottom:2px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.x{width:48px;height:48px;border-radius:50%;border:2px solid var(--border);background:var(--bg);display:grid;place-items:center;font-size:24px;cursor:pointer}
.dishRow{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1.5px dashed var(--border);gap:8px}
.act{display:flex;gap:6px}.act button{width:46px;height:46px;border-radius:12px;border:2px solid var(--border);background:var(--bg);font-size:20px}
select,input,textarea{width:100%;padding:14px;border-radius:14px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:1.05rem}
.topRowFixed{display:flex;gap:8px;align-items:center;width:100%}.topRowFixed input{flex:1;min-width:0}
#pdfWrap{position:fixed;inset:0;background:#222;z-index:10000;display:none;flex-direction:column}#pdfWrap.open{display:flex}
.pdfView{flex:1;overflow:auto;background:#333;padding:16px;display:flex;justify-content:center}
.pdfPage{width:100%;max-width:800px;background:#fff;margin:0 auto}
.pdfInner{padding:20mm;background:#fff;color:#000;box-sizing:border-box;font-size:18pt;line-height:1.6}
</style>

<div class="top"><img id="avatarTop" class="avatar" src="icon.png"><div style="font-weight:900;font-size:1.35rem">每週菜單</div></div>

<div id="p-weekly" class="page active"><div class="card"><div class="topRowFixed"><input type="date" id="monPicker"><button class="iconBtn" onclick="saveWeekly()">💾</button><button class="iconBtn" onclick="exportWeeklyPDF()">📄</button></div></div><div id="weeklyGrid" class="weekWrap"></div></div>

<div class="modal" id="mPickCat"><div class="sheet"><div class="head"><b>分類</b><div class="x" onclick="closeM('mPickCat')">✕</div></div><div id="mPickCatBody" class="grid3" style="padding:12px"></div></div></div>
<div class="modal" id="mPickDish"><div class="sheet"><div class="head"><b>菜式</b><div class="x" onclick="closeM('mPickDish')">✕</div></div><div id="mPickDishBody"></div></div></div>

      ["餃子","Pangsit","中文：煎餃。\nIndonesia: Goreng."],
      ["雲吞","Wonton","中文：雲吞湯。\nIndonesia: Sup wonton."],
      ["腸粉","Cheung Fun","中文：蒸腸粉。\nIndonesia: Kukus."],
      ["白飯","Nasi Putih","中文：白飯。\nIndonesia: Nasi putih."],
      ["糖水","Sup Manis","中文：紅豆沙。\nIndonesia: Kacang merah."],
      ["涼拌青瓜","Acar","中文：青瓜涼拌。\nIndonesia: Acar mentimun."]
    ]
  };
  Object.entries(D).forEach(([cat,arr])=>{
    arr.forEach(([n,i,t])=>{
      dishes.push({id:Date.now()+Math.random(),name:n,indo:i,note:t,cat});
    });
  });
  localStorage.setItem('dishes',JSON.stringify(dishes));
}
makeDefaults();
function init(){
  let mon=getMon(new Date()); document.getElementById('monPicker').valueAsDate=mon; onMon(mon);
  renderCats(); renderWeek(); renderMy(); renderCatOrder();
  let sel=document.getElementById('diners'); sel.innerHTML=[...Array(10).keys()].map(n=>`<option value="${n}">${n}</option>`).join(''); document.getElementById('takeaway').innerHTML=sel.innerHTML;
  document.getElementById('monPicker').addEventListener('change',e=>{let d=e.target.valueAsDate;if(!d)return;if(d.getDay()!==1){alert('只可以星期一');let m=getMon(d);e.target.valueAsDate=m;d=m;} onMon(d);});
  document.getElementById('impFile').addEventListener('change',importLib);
  document.getElementById('btnClosePdf').addEventListener('click',e=>{e.stopPropagation();closePDF();});
  document.getElementById('btnSharePdf').addEventListener('click',e=>{e.stopPropagation();sharePDF();});
}
function onMon(d){ current.mon=d; current.days=[]; for(let i=0;i<7;i++){let day=new Date(d); day.setDate(d.getDate()+i); current.days.push({date:day,dishes:[],diners:0,takeaway:0});} renderWeek(); }
function renderCats(){let g=document.getElementById('catGrid'); g.innerHTML=''; document.getElementById('fCat').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');cats.forEach(cat=>{let meta=CAT_META[cat]||{bg:'#eee',e:'🍱'}; let cnt=dishes.filter(d=>d.cat===cat).length;g.innerHTML+=`<div class="catBox" style="background:${meta.bg}" onclick="openCat('${cat}')"><div style="font-size:68px;line-height:1">${meta.e}</div><div style="margin-top:6px;background:#fff;color:#111;border:2px solid #111;border-radius:10px;padding:6px 10px;font-weight:900;font-size:16px;text-align:center">${cat} (${cnt})</div></div>`;});}
function openCat(cat){document.getElementById('mCatTitle').innerText=cat;let list=dishes.filter(d=>d.cat===cat);document.getElementById('mCatBody').innerHTML=list.map(d=>`<div class="dishRow"><div style="flex:1" onclick="showNote(${d.id})"><b>${d.name}</b><div style="font-size:.9rem;color:var(--muted)">${d.indo||''}</div></div><div class="act"><button onclick="openAnyDate(${d.id})">📅</button><button onclick="editDish(${d.id})">✏️</button><button onclick="delDish(${d.id})">🗑️</button></div></div>`).join('');openM('mCat');}
function showNote(id){ let d=dishes.find(x=>x.id==id); document.getElementById('mNoteBody').innerText=`${d.name} / ${d.indo||''}\n\n${d.note||''}`; openM('mNote'); }
function openAnyDate(id){ pendDish=id; document.getElementById('anyDate').valueAsDate=new Date(); openM('mAnyDate'); }
function confirmAddToWeek(){ let v=document.getElementById('anyDate').value; if(!v) return; let date=new Date(v); let mon=getMon(date); if(fmt(mon)!==fmt(current.mon)){alert('請先選包含此日的星期一'); return;} let idx=Math.round((date-current.mon)/86400000); let d=dishes.find(x=>x.id==pendDish); current.days[idx].dishes.push({...d}); lastCook[d.id]=fmt(date); localStorage.setItem('lastCook',JSON.stringify(lastCook)); renderWeek(); closeM('mAnyDate'); }
function openAdd(){ document.getElementById('fId').value=''; document.getElementById('fName').value=''; document.getElementById('fIndo').value=''; document.getElementById('fNote').value=''; openM('mAdd'); }
function editDish(id){ let d=dishes.find(x=>x.id==id); openAdd(); document.getElementById('fId').value=d.id; document.getElementById('fName').value=d.name; document.getElementById('fIndo').value=d.indo||''; document.getElementById('fNote').value=d.note||''; document.getElementById('fCat').value=d.cat; }
function saveDish(){ let id=document.getElementById('fId').value,n=document.getElementById('fName').value.trim(),i=document.getElementById('fIndo').value.trim(),t=document.getElementById('fNote').value.trim(),c=document.getElementById('fCat').value; if(!n) return alert('中文必填'); if(id){let d=dishes.find(x=>x.id==id);d.name=n;d.indo=i;d.note=t;d.cat=c;} else dishes.push({id:Date.now()+Math.random(),name:n,indo:i,note:t,cat:c}); localStorage.setItem('dishes',JSON.stringify(dishes)); renderCats(); closeM('mAdd'); }
function delDish(id){ if(!confirm('刪除?')) return; dishes=dishes.filter(x=>x.id!=id); localStorage.setItem('dishes',JSON.stringify(dishes)); renderCats(); }
function renderWeek(){let wrap=document.getElementById('weeklyGrid'); wrap.innerHTML='';let rows=[[0,1],[2,3],[4,5,6]];rows.forEach(r=>{let row=document.createElement('div'); row.className='weekRow';r.forEach(idx=>{let day=current.days[idx]; if(!day) return;let div=document.createElement('div'); div.className='dayBox';div.innerHTML=`<div>${dayEmo[idx]}</div><div style="font-weight:900;margin-top:4px;font-size:.85rem">星期${cn[idx]}<br>${fmt(day.date).slice(5)}<br><span style="color:var(--primary)">${day.dishes.length}道</span></div>`;div.onclick=()=>openWeek(idx); row.appendChild(div);});wrap.appendChild(row);});}
function openWeek(idx){editDay=idx; let day=current.days[idx];document.getElementById('mWeekTitle').innerText=`${fmt(day.date)} 星期${cn[idx]}`;document.getElementById('diners').value=day.diners; document.getElementById('takeaway').value=day.takeaway;document.getElementById('diners').onchange=e=>day.diners=+e.target.value;document.getElementById('takeaway').onchange=e=>day.takeaway=+e.target.value;document.getElementById('selDishes').innerHTML=day.dishes.map((d,i)=>`<div class="dishRow"><span style="flex:1"><b>${d.name}</b></span><button class="ghost" style="width:auto" onclick="remDay(${idx},${i})">✕</button></div>`).join('')||'<div>尚未選擇</div>';openM('mWeek');}
function remDay(a,b){ if(!confirm('刪除？')) return; current.days[a].dishes.splice(b,1); openWeek(a); renderWeek(); }
function openPickCat(){ let b=document.getElementById('mPickCatBody'); b.innerHTML=''; cats.forEach(cat=>{let m=CAT_META[cat]||{bg:'#eee',e:'🍱'}; b.innerHTML+=`<div class="catBox" style="background:${m.bg}" onclick="openPickDish('${cat}')"><div style="font-size:68px;line-height:1">${m.e}</div><div style="margin-top:6px;background:#fff;color:#111;border:2px solid #111;border-radius:10px;padding:6px 10px;font-weight:900;font-size:16px;text-align:center">${cat}</div></div>`;}); openM('mPickCat'); }
function openPickDish(cat){ let list=dishes.filter(d=>d.cat===cat); document.getElementById('mPickDishBody').innerHTML=list.map(d=>`<div class="dishRow"><span style="flex:1"><b>${d.name}</b></span><button class="btn" style="width:auto" onclick="pickToWeek(${d.id})">加入</button></div>`).join(''); openM('mPickDish'); }
function pickToWeek(id){ let d=dishes.find(x=>x.id==id); if(!confirm(`確定加入「${d.name}」？`)) return; current.days[editDay].dishes.push({...d}); lastCook[id]=fmt(current.days[editDay].date); localStorage.setItem('lastCook',JSON.stringify(lastCook)); openWeek(editDay); renderWeek(); }
function saveWeekly(){if(!current.mon) return; let fname=fmt(current.mon);let ex=weeklyMenus.findIndex(m=>m.monday===fname);if(ex>=0) weeklyMenus.splice(ex,1); let toSave={monday:fname,days:current.days.map(d=>({date:fmt(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway}))};weeklyMenus.push(toSave);localStorage.setItem('weeklyMenus',JSON.stringify(weeklyMenus)); renderMy(); alert('已儲存 '+fname);}
function renderMy(){let box=document.getElementById('myList');box.innerHTML=weeklyMenus.map((m,i)=>`<div class="card"><div class="head" style="cursor:pointer"><b>${m.monday} 星期一</b></div><div class="myBody" style="display:none"><div class="row" style="margin-bottom:8px"><button class="ghost" onclick="loadMenu(${i})">修改</button><button class="ghost" onclick="delMenu(${i})">刪除</button><button class="iconBtn" onclick="pdfSingle(${i})">📄</button></div>${m.days.map((d,di)=>`<div style="border-top:1.5px dashed var(--border);padding:8px 0"><b>星期${cn[di]} ${d.date}</b>${d.dishes.map(dd=>`<div>${dd.name}</div>`).join('')}</div>`).join('')}</div></div>`).join('');box.querySelectorAll('.head').forEach(h=>{h.onclick=()=>{let b=h.nextElementSibling; b.style.display=b.style.display==='none'?'block':'none';};});}
function toggleMy(o){document.querySelectorAll('.myBody').forEach(b=>b.style.display=o?'block':'none');}
function loadMenu(i){ let m=weeklyMenus[i]; document.getElementById('monPicker').value=m.monday; let mon=new Date(m.monday); current.mon=mon; current.days=m.days.map(d=>({date:new Date(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway})); go('weekly',document.querySelectorAll('.nav')[0]); renderWeek(); }
function delMenu(i){ if(!confirm('刪除?')) return; weeklyMenus.splice(i,1); localStorage.setItem('weeklyMenus',JSON.stringify(weeklyMenus)); renderMy(); }
function makePDF(days, monStr){let html = `<h1>每週菜單<br><span style="font-size:16pt">Daftar Menu Mingguan</span></h1><div class="sub">${monStr} 星期一 / Senin</div>`;days.forEach((d,i)=>{ html += `<div class="day"><div class="dayHead"><b>星期${cn[i]} / ${idn[i]} ${d.date}</b></div>`; d.dishes.forEach(dd=>{ html+=`<div class="dish"><b>${dd.name} / ${dd.indo||''}</b><div style="white-space:pre-wrap;font-size:11pt">備註: ${dd.note||''}</div></div>`; }); html+=`</div>`; }); return html;}
function exportWeeklyPDF(){ showPDF(makePDF(current.days.map(d=>({date:fmt(d.date),dishes:d.dishes,diners:d.diners,takeaway:d.takeaway})), fmt(current.mon))); }
function pdfSingle(i){ let m=weeklyMenus[i]; showPDF(makePDF(m.days,m.monday)); }
function showPDF(inner){ document.getElementById('pdfContent').innerHTML=inner; document.getElementById('pdfWrap').classList.add('open'); }
function closePDF(){ document.getElementById('pdfWrap').classList.remove('open'); }
async function sharePDF(){let content=document.getElementById('pdfContent');let btn=document.getElementById('btnSharePdf');if(btn.dataset.busy==="1") return;let old=btn.innerHTML; btn.innerHTML='⏳'; btn.disabled=true; btn.dataset.busy="1";try{let wrapper=document.createElement('div'); wrapper.style.width='794px'; wrapper.style.background='#fff'; wrapper.style.position='fixed'; wrapper.style.left='-9999px'; let clone=content.cloneNode(true); clone.style.width='794px'; clone.style.padding='76px'; wrapper.appendChild(clone); document.body.appendChild(wrapper);const canvas = await html2canvas(clone,{scale:2,useCORS:true,backgroundColor:'#ffffff',width:794});document.body.removeChild(wrapper);const { jsPDF } = window.jspdf; const pdf = new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});const imgData = canvas.toDataURL('image/png'); const pageW=210, imgW=pageW, imgH=canvas.height * imgW / canvas.width;pdf.addImage(imgData,'PNG',0,0,imgW,imgH); let remain=imgH - 297; let y = -297;while(remain>0){ pdf.addPage(); pdf.addImage(imgData,'PNG',0,y,imgW,imgH); y -= 297; remain -= 297; }const blob = pdf.output('blob'); const file = new File([blob], `每週菜單_${fmt(new Date())}.pdf`, {type:'application/pdf'});try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'每週菜單'}); return; } }catch(e){}const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=file.name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),2000);}catch(e){ alert('PDF失敗: '+e.message); } finally{ btn.innerHTML=old; btn.disabled=false; btn.dataset.busy="0"; }}
function exportLib(){ let blob=new Blob([JSON.stringify({cats,dishes},null,2)],{type:'application/json'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download=`菜式庫_${fmt(new Date())}.json`; document.body.appendChild(a); a.click(); a.remove(); }
function importLib(e){ let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=ev=>{ try{ let j=JSON.parse(ev.target.result); if(j.cats&&j.dishes){ cats=j.cats; dishes=j.dishes; localStorage.setItem('cats',JSON.stringify(cats)); localStorage.setItem('dishes',JSON.stringify(dishes)); renderCats(); renderCatOrder(); } }catch{ alert('失敗'); } }; r.readAsText(f); e.target.value=''; }
function renderCatOrder(){ let b=document.getElementById('catOrder'); b.innerHTML=cats.map((c,i)=>`<div class="card row" style="justify-content:space-between"><span>${i+1}. ${c}</span><span class="row"><button class="iconBtn" onclick="moveCat(${i},-1)">↑</button><button class="iconBtn" onclick="moveCat(${i},1)">↓</button><button class="ghost" style="width:auto" onclick="delCat(${i})">刪除</button></span></div>`).join(''); }
function moveCat(i,dir){ let ni=i+dir; if(ni<0||ni>=cats.length) return; let t=cats[i]; cats[i]=cats[ni]; cats[ni]=t; localStorage.setItem('cats',JSON.stringify(cats)); renderCatOrder(); renderCats(); }
function addCat(){ let v=document.getElementById('newCat').value.trim(); if(!v) return; cats.push(v); localStorage.setItem('cats',JSON.stringify(cats)); document.getElementById('newCat').value=''; renderCatOrder(); renderCats(); }
function delCat(i){ let cat=cats[i]; if(!confirm(`刪除「${cat}」？`)) return; dishes.forEach(d=>{ if(d.cat===cat) d.cat='其他'; }); cats.splice(i,1); localStorage.setItem('cats',JSON.stringify(cats)); localStorage.setItem('dishes',JSON.stringify(dishes)); renderCatOrder(); renderCats(); }
function toggleTheme(){ document.body.classList.toggle('dark'); }
function setFS(v){ document.documentElement.style.setProperty('--fs',v+'px'); document.getElementById('fsVal').innerText=v; }
init();
</script>
