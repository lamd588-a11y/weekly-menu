<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>每週菜單</title>
  
  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="每週菜單">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- html2pdf.js 庫 (用於匯出大字體 A4 PDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --text-color: #1c1c1e;
      --sub-text: #8e8e93;
      --primary-color: #007aff;
      --border-color: #e5e5ea;
      --danger-color: #ff3b30;
      --font-scale: 16px;
    }

    [data-theme="dark"] {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --text-color: #ffffff;
      --sub-text: #8e8e93;
      --primary-color: #0a84ff;
      --border-color: #38383a;
      --danger-color: #ff453a;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--font-scale);
      padding-bottom: 90px;
      padding-top: env(safe-area-inset-top);
    }

    /* iPhone 18 Pro Max 最佳化導航列與頂部 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      font-size: 1.4em;
      font-weight: 700;
    }

    .avatar-container img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary-color);
    }

    /* Tab 導航列 */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75em;
      color: var(--sub-text);
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--primary-color);
      font-weight: 600;
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
      margin-bottom: 4px;
      fill: currentColor;
    }

    .page {
      display: none;
      padding: 16px;
      max-width: 500px; /* iPhone 寬度最佳化 */
      margin: 0 auto;
    }

    .page.active {
      display: block;
    }

    /* 元件樣式 */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9em;
      cursor: pointer;
    }

    .btn-danger {
      background-color: var(--danger-color);
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      font-size: 0.95em;
    }

    /* 每週菜單樣式 */
    .day-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .day-header {
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--primary-color);
    }

    .people-inputs {
      display: flex;
      gap: 10px;
    }

    .people-inputs div {
      flex: 1;
    }

    .dish-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border-color);
    }

    /* 分類點選對話框 */
    .dish-picker-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: var(--bg-color);
      margin-bottom: 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .last-cooked {
      font-size: 0.75em;
      color: var(--sub-text);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      justify-content: center;
      align-items: flex-end;
    }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      padding: 20px;
      max-height: 85vh;
      overflow-y: auto;
    }

    /* PDF 隱藏導出區域 */
    #pdf-template {
      display: none;
      padding: 20px;
      font-size: 20px; /* 大字體 */
      color: #000;
      background: #fff;
    }

    .pdf-day-block {
      margin-bottom: 25px;
      page-break-inside: avoid;
      border-bottom: 2px solid #000;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- 頁首 -->
  <header>
    <div class="header-title">每週菜單</div>
    <div class="avatar-container">
      <img id="user-avatar" src="icon.png" alt="頭像" onclick="switchPage('settings')">
    </div>
  </header>

  <!-- 1. 每週菜單頁面 -->
  <div id="page-menu" class="page active">
    <div style="display: flex; gap: 10px; margin-bottom: 12px;">
      <input type="date" id="week-start-date" onchange="updateWeekDates()">
      <button class="btn" onclick="exportPDF()" style="white-space: nowrap;">匯出 PDF</button>
    </div>

    <div id="days-container"></div>
  </div>

  <!-- 2. 菜式庫頁面 -->
  <div id="page-dishes" class="page">
    <button class="btn" style="width:100%; margin-bottom: 16px;" onclick="openDishModal()">+ 新增菜式</button>
    <div id="dishes-library"></div>
  </div>

  <!-- 3. 設定頁面 -->
  <div id="page-settings" class="page">
    <div class="card">
      <h3>自訂頭像</h3>
      <input type="file" id="avatar-input" accept="image/*" onchange="uploadAvatar(event)">
    </div>

    <div class="card">
      <h3>外觀設定</h3>
      <label>模式轉換：</label>
      <select id="theme-select" onchange="changeTheme(this.value)">
        <option value="light">淺色模式 (Light)</option>
        <option value="dark">深色模式 (Dark)</option>
      </select>

      <label>字體大小：</label>
      <select id="font-size-select" onchange="changeFontSize(this.value)">
        <option value="14px">小</option>
        <option value="16px" selected>標準</option>
        <option value="18px">大</option>
      </select>
    </div>

    <div class="card">
      <h3>分類管理</h3>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="new-cat-input" placeholder="新分類名稱">
        <button class="btn" onclick="addCategory()">新增</button>
      </div>
      <div id="category-settings-list"></div>
    </div>
  </div>

  <!-- 底部導航列 -->
  <nav>
    <div class="nav-item active" onclick="switchPage('menu')">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/><path d="M7 7h10v2H7zm0 4h10v2H7zm0 4h7v2H7z"/></svg>
      每週菜單
    </div>
    <div class="nav-item" onclick="switchPage('dishes')">
      <svg viewBox="0 0 24 24"><path d="M8.1 13.34l2.83-2.83L3.91 3.5c-1.56 1.56-1.56 4.09 0 5.66l4.19 4.18zm6.78-1.81c1.53.71 3.68.21 5.27-1.38 1.91-1.91 2.28-4.65.81-6.12-1.46-1.46-4.2-1.1-6.12.81-1.59 1.59-2.09 3.74-1.38 5.27L3.7 19.87l1.41 1.41 9.77-9.75z"/></svg>
      菜式庫
    </div>
    <div class="nav-item" onclick="switchPage('settings')">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.63 3.6-3.6 3.6z"/></svg>
      設定
    </div>
  </nav>

  <!-- Modal 1: 選擇菜式對話框 -->
  <div id="picker-modal" class="modal">
    <div class="modal-content">
      <h3>選擇菜式 (一點即選)</h3>
      <div id="picker-list"></div>
      <button class="btn btn-danger" style="width:100%; margin-top:10px;" onclick="closeModal('picker-modal')">關閉</button>
    </div>
  </div>

  <!-- Modal 2: 新增/修改菜式對話框 -->
  <div id="dish-modal" class="modal">
    <div class="modal-content">
      <h3 id="dish-modal-title">新增菜式</h3>
      <input type="hidden" id="edit-dish-id">
      <label>中文名稱：</label>
      <input type="text" id="dish-name-zh" placeholder="例：清蒸雞">
      <label>印尼文名稱：</label>
      <input type="text" id="dish-name-id" placeholder="例：Ayam Kukus">
      <label>分類：</label>
      <select id="dish-category-select"></select>
      
      <button class="btn" style="width:100%; margin-top:10px;" onclick="saveDish()">儲存</button>
      <button class="btn btn-danger" style="width:100%; margin-top:8px;" onclick="closeModal('dish-modal')">取消</button>
    </div>
  </div>

  <!-- 隱藏 PDF 樣式生成板 -->
  <div id="pdf-template"></div>

  <script>
    // 預設資料
    let categories = ['雞', '牛', '豬', '魚', '菜', '湯水', '其他'];
    let dishes = [
      { id: '1', zh: '海南雞', idn: 'Nasi Ayam Hainan', cat: '雞', lastCooked: '' },
      { id: '2', zh: '巴東牛肉', idn: 'Rendang Sapi', cat: '牛', lastCooked: '' }
    ];
    let currentWeekData = Array(7).fill(null).map(() => ({ dishes: [], dineIn: '', takeOut: '' }));
    let activeDayIndex = null;

    // 初始化與載入 LocalStorage
    window.onload = function() {
      loadData();
      initDates();
      renderMenu();
      renderDishesLibrary();
      renderCategorySettings();
    };

    function loadData() {
      if(localStorage.getItem('categories')) categories = JSON.parse(localStorage.getItem('categories'));
      if(localStorage.getItem('dishes')) dishes = JSON.parse(localStorage.getItem('dishes'));
      if(localStorage.getItem('avatar')) document.getElementById('user-avatar').src = localStorage.getItem('avatar');
      if(localStorage.getItem('theme')) changeTheme(localStorage.getItem('theme'), false);
      if(localStorage.getItem('fontSize')) changeFontSize(localStorage.getItem('fontSize'), false);
    }

    function saveData() {
      localStorage.setItem('categories', JSON.stringify(categories));
      localStorage.setItem('dishes', JSON.stringify(dishes));
    }

    // 頁面切換
    function switchPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(`page-${pageId}`).classList.add('active');
      
      const idx = ['menu', 'dishes', 'settings'].indexOf(pageId);
      document.querySelectorAll('.nav-item')[idx].classList.add('active');
    }

    // 日期計算 (預設由本週一開始)
    function initDates() {
      const curr = new Date();
      const first = curr.getDate() - curr.getDay() + 1;
      const monday = new Date(curr.setDate(first)).toISOString().split('T')[0];
      document.getElementById('week-start-date').value = monday;
    }

    function updateWeekDates() { renderMenu(); }

    // 渲染菜單頁面
    function renderMenu() {
      const container = document.getElementById('days-container');
      container.innerHTML = '';
      const startDate = new Date(document.getElementById('week-start-date').value || Date.now());
      const weekDays = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];

      for (let i = 0; i < 7; i++) {
        const d = new Date(startDate);
        d.setDate(d.getDate() + i);
        const dateStr = `${d.getMonth()+1}月${d.getDate()}日 (${weekDays[i]})`;

        const dayData = currentWeekData[i];
        let dishesHtml = dayData.dishes.map((dish, dIdx) => `
          <div class="dish-list-item">
            <div><strong>${dish.zh}</strong> <span style="color:var(--sub-text); font-size:0.85em;">${dish.idn}</span></div>
            <span style="color:var(--danger-color); cursor:pointer;" onclick="removeDishFromDay(${i}, ${dIdx})">刪除</span>
          </div>
        `).join('');

        container.innerHTML += `
          <div class="day-card">
            <div class="day-header">${dateStr}</div>
            <div class="people-inputs">
              <div><label style="font-size:0.8em">堂食人數</label><input type="number" value="${dayData.dineIn}" onchange="currentWeekData[${i}].dineIn = this.value" placeholder="空白"></div>
              <div><label style="font-size:0.8em">外帶人數</label><input type="number" value="${dayData.takeOut}" onchange="currentWeekData[${i}].takeOut = this.value" placeholder="空白"></div>
            </div>
            <div>${dishesHtml}</div>
            <button class="btn" style="width:100%; margin-top:8px; background:var(--border-color); color:var(--text-color);" onclick="openPicker(${i})">+ 選擇/加入菜式</button>
          </div>
        `;
      }
    }

    // 開啟菜式選擇器 (一點即選)
    function openPicker(dayIdx) {
      activeDayIndex = dayIdx;
      const pickerList = document.getElementById('picker-list');
      pickerList.innerHTML = '';

      categories.forEach(cat => {
        const catDishes = dishes.filter(d => d.cat === cat);
        if(catDishes.length > 0) {
          pickerList.innerHTML += `<h4 style="margin:8px 0 4px 0; color:var(--primary-color);">${cat}</h4>`;
          catDishes.forEach(d => {
            const lastCookedText = d.lastCooked ? `上一次烹飪：${d.lastCooked}` : '上一次烹飪：未紀錄';
            pickerList.innerHTML += `
              <div class="dish-picker-item" onclick="selectDishForDay('${d.id}')">
                <div>
                  <div><strong>${d.zh}</strong> (${d.idn})</div>
                  <div class="last-cooked">${lastCookedText}</div>
                </div>
                <span style="color:var(--primary-color);">+ 選取</span>
              </div>
            `;
          });
        }
      });
      document.getElementById('picker-modal').style.display = 'flex';
    }

    function selectDishForDay(dishId) {
      const dish = dishes.find(d => d.id === dishId);
      const todayStr = new Date().toLocaleDateString('zh-HK');
      dish.lastCooked = todayStr; // 更新最後烹飪日期
      saveData();

      currentWeekData[activeDayIndex].dishes.push(dish);
      closeModal('picker-modal');
      renderMenu();
    }

    function removeDishFromDay(dayIdx, dishIdx) {
      currentWeekData[dayIdx].dishes.splice(dishIdx, 1);
      renderMenu();
    }

    // 菜式庫管理
    function renderDishesLibrary() {
      const container = document.getElementById('dishes-library');
      container.innerHTML = '';

      categories.forEach(cat => {
        const catDishes = dishes.filter(d => d.cat === cat);
        let listHtml = catDishes.map(d => `
          <div class="dish-list-item">
            <div>
              <strong>${d.zh}</strong> <span style="color:var(--sub-text);">${d.idn}</span>
            </div>
            <div>
              <span style="color:var(--primary-color); margin-right:8px; cursor:pointer;" onclick="editDish('${d.id}')">修改</span>
              <span style="color:var(--danger-color); cursor:pointer;" onclick="deleteDish('${d.id}')">刪除</span>
            </div>
          </div>
        `).join('');

        container.innerHTML += `
          <div class="card">
            <h4 style="margin-top:0; color:var(--primary-color);">${cat}</h4>
            ${listHtml || '<div style="color:var(--sub-text); font-size:0.85em;">暫無菜式</div>'}
          </div>
        `;
      });
    }

    function openDishModal(dish = null) {
      const select = document.getElementById('dish-category-select');
      select.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');

      if(dish) {
        document.getElementById('dish-modal-title').innerText = '修改菜式';
        document.getElementById('edit-dish-id').value = dish.id;
        document.getElementById('dish-name-zh').value = dish.zh;
        document.getElementById('dish-name-id').value = dish.idn;
        select.value = dish.cat;
      } else {
        document.getElementById('dish-modal-title').innerText = '新增菜式';
        document.getElementById('edit-dish-id').value = '';
        document.getElementById('dish-name-zh').value = '';
        document.getElementById('dish-name-id').value = '';
      }
      document.getElementById('dish-modal').style.display = 'flex';
    }

    function saveDish() {
      const id = document.getElementById('edit-dish-id').value;
      const zh = document.getElementById('dish-name-zh').value;
      const idn = document.getElementById('dish-name-id').value;
      const cat = document.getElementById('dish-category-select').value;

      if(!zh) return alert('請輸入中文名稱');

      if(id) {
        const d = dishes.find(x => x.id === id);
        d.zh = zh; d.idn = idn; d.cat = cat;
      } else {
        dishes.push({ id: Date.now().toString(), zh, idn, cat, lastCooked: '' });
      }

      saveData();
      closeModal('dish-modal');
      renderDishesLibrary();
    }

    function editDish(id) {
      const dish = dishes.find(d => d.id === id);
      openDishModal(dish);
    }

    function deleteDish(id) {
      if(confirm('確定刪除此菜式？')) {
        dishes = dishes.filter(d => d.id !== id);
        saveData();
        renderDishesLibrary();
      }
    }

    // 設定頁面功能
    function renderCategorySettings() {
      const container = document.getElementById('category-settings-list');
      container.innerHTML = '';
      categories.forEach((cat, idx) => {
        container.innerHTML += `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border-color)">
            <span>${cat}</span>
            <div>
              <button onclick="moveCategory(${idx}, -1)" ${idx===0?'disabled':''}>↑</button>
              <button onclick="moveCategory(${idx}, 1)" ${idx===categories.length-1?'disabled':''}>↓</button>
              ${cat !== '其他' ? `<button class="btn-danger" onclick="deleteCategory('${cat}')" style="padding:4px 8px; font-size:0.8em; margin-left:8px;">刪除</button>` : ''}
            </div>
          </div>
        `;
      });
    }

    function moveCategory(index, direction) {
      const target = index + direction;
      if (target < 0 || target >= categories.length) return;
      const temp = categories[index];
      categories[index] = categories[target];
      categories[target] = temp;
      saveData();
      renderCategorySettings();
      renderDishesLibrary();
    }

    function addCategory() {
      const val = document.getElementById('new-cat-input').value.trim();
      if(val && !categories.includes(val)) {
        categories.push(val);
        document.getElementById('new-cat-input').value = '';
        saveData();
        renderCategorySettings();
        renderDishesLibrary();
      }
    }

    function deleteCategory(catName) {
      if(confirm(`確定刪除「${catName}」分類？刪除後，分類內的所有項目會自動移到「其他」分類。`)) {
        // 移到其他
        dishes.forEach(d => { if(d.cat === catName) d.cat = '其他'; });
        categories = categories.filter(c => c !== catName);
        saveData();
        renderCategorySettings();
        renderDishesLibrary();
      }
    }

    function uploadAvatar(e) {
      const file = e.target.files[0];
      if(file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const base64 = event.target.result;
          document.getElementById('user-avatar').src = base64;
          localStorage.setItem('avatar', base64);
        };
        reader.readAsDataURL(file);
      }
    }

    function changeTheme(theme, save = true) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('theme-select').value = theme;
      if(save) localStorage.setItem('theme', theme);
    }

    function changeFontSize(size, save = true) {
      document.documentElement.style.setProperty('--font-scale', size);
      document.getElementById('font-size-select').value = size;
      if(save) localStorage.setItem('fontSize', size);
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // 匯出 PDF 功能
    function exportPDF() {
      const pdfContainer = document.getElementById('pdf-template');
      pdfContainer.style.display = 'block';
      pdfContainer.innerHTML = `<h1 style="text-align:center; font-size: 32px; margin-bottom:20px;">每週菜單 Menu Mingguan</h1>`;

      const startDate = new Date(document.getElementById('week-start-date').value || Date.now());
      const weekDays = ['星期一 (Senin)', '星期二 (Selasa)', '星期三 (Rabu)', '星期四 (Kamis)', '星期五 (Jumat)', '星期六 (Sabtu)', '星期日 (Minggu)'];

      for (let i = 0; i < 7; i++) {
        const d = new Date(startDate);
        d.setDate(d.getDate() + i);
        const dateStr = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()} ${weekDays[i]}`;
        const dayData = currentWeekData[i];

        let dishesText = dayData.dishes.map(d => `<div style="font-size:22px; font-weight:bold; margin-top:4px;">• ${d.zh} <span style="font-weight:normal; font-style:italic;">(${d.idn})</span></div>`).join('');
        if(!dishesText) dishesText = `<div style="font-size:18px; color:#666;">無菜式</div>`;

        pdfContainer.innerHTML += `
          <div class="pdf-day-block">
            <div style="font-size:24px; font-weight:bold; background:#f0f0f0; padding:4px 8px;">${dateStr}</div>
            <div style="font-size:18px; margin: 6px 0;">
              堂食人數 (Makan di tempat): <strong>${dayData.dineIn || '-'}</strong> | 
              外帶人數 (Bungkus): <strong>${dayData.takeOut || '-'}</strong>
            </div>
            ${dishesText}
          </div>
        `;
      }

      const opt = {
        margin:       10,
        filename:     'weekly-menu.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(pdfContainer).save().then(() => {
        pdfContainer.style.display = 'none';
      });
    }

    // PWA Service Worker 註冊 (支援離線與 App 體驗)
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(caches.open('pwa-v1').then(c => c.addAll(['./']))));
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
      `;
      const blob = new Blob([swCode], {type: 'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(blob));
    }
  </script>
</body>
</html>
