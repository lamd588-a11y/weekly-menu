<!DOCTYPE html>
<html lang="zh-HK" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>每週菜單</title>
  
  <!-- PWA & iOS 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="每週菜單">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <!-- TailWind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#10b981',
            iosbg: '#f2f2f7',
            iosbgdark: '#000000',
            cardlight: '#ffffff',
            carddark: '#1c1c1e'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- html2pdf.js (用於匯出 PDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <!-- SortableJS (用於拖拉排序) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <!-- Cropper.js (用於頭像裁剪) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <style>
    /* iPhone 18 Pro Max 視圖與 iOS 安全區域適應 */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-size: var(--app-font-size, 16px);
    }
    .safe-top { padding-top: max(env(safe-area-inset-top), 20px); }
    .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 20px); }
    
    /* A4 PDF 列印專用樣式 */
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
    
    #pdf-template {
      width: 210mm;
      min-height: 297mm;
      padding: 10mm;
      box-sizing: border-box;
      background: #fff;
      color: #000;
    }
  </style>
</head>
<body class="bg-iosbg dark:bg-iosbgdark text-gray-900 dark:text-gray-100 min-h-screen flex flex-col justify-between transition-colors duration-200">

  <!-- 頂部導覽列 -->
  <header class="safe-top bg-cardlight dark:bg-carddark border-b border-gray-200 dark:border-gray-800 sticky top-0 z-30 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3">
      <!-- 4. 主頁顯示頭像 -->
      <img id="header-avatar" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>" 
           alt="Avatar" class="w-10 h-10 rounded-full object-cover border border-gray-300 dark:border-gray-600">
      <h1 class="text-xl font-bold tracking-tight">每週菜單</h1>
    </div>
    <div id="header-actions" class="flex items-center space-x-2">
      <!-- 動態按鈕區域 -->
    </div>
  </header>

  <!-- 主內容視圖區域 -->
  <main class="flex-1 overflow-y-auto pb-24 px-4 pt-4 max-w-md mx-auto w-full">
    
    <!-- 1. 編輯每週菜單視圖 -->
    <section id="view-menu" class="view-page space-y-4">
      <div class="bg-cardlight dark:bg-carddark p-4 rounded-2xl shadow-sm border border-gray-200/50 dark:border-gray-800">
        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1">選擇起始日期 (必須為星期一)</label>
        <input type="date" id="menu-start-date" class="w-full p-2.5 bg-gray-100 dark:bg-gray-800 rounded-xl font-medium border-0 focus:ring-2 focus:ring-primary outline-none">
      </div>

      <!-- 7天菜單列表 -->
      <div id="days-container" class="space-y-4"></div>
    </section>

    <!-- 2. 我的菜單列表視圖 -->
    <section id="view-saved" class="view-page hidden space-y-3">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-bold">已儲存菜單 (<span id="saved-count">0</span>/10)</h2>
      </div>
      <div id="saved-menus-list" class="space-y-3"></div>
    </section>

    <!-- 3. 菜式庫視圖 -->
    <section id="view-dishes" class="view-page hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold">菜式庫</h2>
        <button onclick="openDishModal()" class="bg-primary text-white px-3 py-1.5 rounded-xl text-sm font-semibold flex items-center gap-1 shadow">
          <i class="fa-solid fa-plus"></i> 新增菜式
        </button>
      </div>

      <div id="dishes-by-category" class="space-y-4"></div>
    </section>

    <!-- 4. 設定頁視圖 -->
    <section id="view-settings" class="view-page hidden space-y-5">
      <!-- 頭像設定 -->
      <div class="bg-cardlight dark:bg-carddark p-4 rounded-2xl shadow-sm border border-gray-200/50 dark:border-gray-800 space-y-3">
        <h3 class="font-bold border-b pb-2 dark:border-gray-800">自訂頭像</h3>
        <div class="flex items-center space-x-4">
          <img id="settings-avatar-preview" src="" class="w-16 h-16 rounded-full object-cover border">
          <input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="handleAvatarSelect(event)">
          <button onclick="document.getElementById('avatar-input').click()" class="bg-gray-200 dark:bg-gray-700 px-4 py-2 rounded-xl text-sm font-semibold">
            上傳並裁剪相片
          </button>
        </div>
      </div>

      <!-- 深淺色 & 字體大小 -->
      <div class="bg-cardlight dark:bg-carddark p-4 rounded-2xl shadow-sm border border-gray-200/50 dark:border-gray-800 space-y-4">
        <h3 class="font-bold border-b pb-2 dark:border-gray-800">偏好設定</h3>
        <div class="flex justify-between items-center">
          <span>深淺色模式</span>
          <button onclick="toggleDarkMode()" class="p-2 bg-gray-200 dark:bg-gray-700 rounded-xl text-sm font-semibold">
            <i class="fa-solid fa-moon dark:hidden"></i>
            <i class="fa-solid fa-sun hidden dark:inline"></i>
            <span id="dark-mode-text" class="ml-1">切換</span>
          </button>
        </div>
        <div class="space-y-1">
          <div class="flex justify-between text-sm">
            <span>字體大小</span>
            <span id="font-size-val">16px</span>
          </div>
          <input type="range" id="font-size-slider" min="12" max="22" value="16" oninput="updateFontSize(this.value)" class="w-full accent-primary">
        </div>
      </div>

      <!-- 分類管理 -->
      <div class="bg-cardlight dark:bg-carddark p-4 rounded-2xl shadow-sm border border-gray-200/50 dark:border-gray-800 space-y-3">
        <div class="flex justify-between items-center border-b pb-2 dark:border-gray-800">
          <h3 class="font-bold">分類管理 (可拖拉排序)</h3>
          <button onclick="promptAddCategory()" class="text-primary text-sm font-semibold"><i class="fa-solid fa-plus"></i> 新增</button>
        </div>
        <ul id="category-sort-list" class="space-y-2"></ul>
      </div>
    </section>

  </main>

  <!-- 底部 Tab 導覽列 -->
  <nav class="safe-bottom fixed bottom-0 left-0 right-0 bg-cardlight/90 dark:bg-carddark/90 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 z-30 flex justify-around py-2">
    <button onclick="switchTab('menu')" id="tab-menu" class="flex flex-col items-center text-primary">
      <i class="fa-solid fa-calendar-week text-xl"></i>
      <span class="text-[10px] font-medium mt-0.5">編寫菜單</span>
    </button>
    <button onclick="switchTab('saved')" id="tab-saved" class="flex flex-col items-center text-gray-400">
      <i class="fa-solid fa-book-open text-xl"></i>
      <span class="text-[10px] font-medium mt-0.5">我的菜單</span>
    </button>
    <button onclick="switchTab('dishes')" id="tab-dishes" class="flex flex-col items-center text-gray-400">
      <i class="fa-solid fa-utensils text-xl"></i>
      <span class="text-[10px] font-medium mt-0.5">菜式庫</span>
    </button>
    <button onclick="switchTab('settings')" id="tab-settings" class="flex flex-col items-center text-gray-400">
      <i class="fa-solid fa-gear text-xl"></i>
      <span class="text-[10px] font-medium mt-0.5">設定</span>
    </button>
  </nav>

  <!-- Modals 彈窗區域 -->

  <!-- 1. 菜式選擇器彈窗 (一點即選) -->
  <div id="modal-select-dish" class="fixed inset-0 z-50 bg-black/50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-cardlight dark:bg-carddark w-full max-w-md h-[80vh] rounded-t-3xl sm:rounded-2xl flex flex-col overflow-hidden shadow-xl">
      <div class="p-4 border-b dark:border-gray-800 flex justify-between items-center">
        <h3 class="font-bold text-lg">選擇菜式</h3>
        <button onclick="closeModal('modal-select-dish')" class="text-gray-500 text-xl">&times;</button>
      </div>
      <div id="select-dish-content" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
    </div>
  </div>

  <!-- 2. 菜式新增/修改彈窗 -->
  <div id="modal-dish-form" class="fixed inset-0 z-50 bg-black/50 hidden flex items-center justify-center p-4">
    <div class="bg-cardlight dark:bg-carddark w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl">
      <h3 id="dish-modal-title" class="font-bold text-lg">新增菜式</h3>
      <input type="hidden" id="edit-dish-id">
      <div>
        <label class="text-xs font-semibold text-gray-500">中文名稱</label>
        <input type="text" id="dish-name-zh" class="w-full p-2 bg-gray-100 dark:bg-gray-800 rounded-xl mt-1 border-0 outline-none">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500">印尼文名稱 (Bahasa Indonesia)</label>
        <input type="text" id="dish-name-id" class="w-full p-2 bg-gray-100 dark:bg-gray-800 rounded-xl mt-1 border-0 outline-none">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500">分類</label>
        <select id="dish-category-select" class="w-full p-2 bg-gray-100 dark:bg-gray-800 rounded-xl mt-1 border-0 outline-none"></select>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeModal('modal-dish-form')" class="px-4 py-2 rounded-xl text-sm bg-gray-200 dark:bg-gray-700">取消</button>
        <button onclick="saveDish()" class="px-4 py-2 rounded-xl text-sm bg-primary text-white font-semibold">儲存</button>
      </div>
    </div>
  </div>

  <!-- 3. 頭像裁剪彈窗 -->
  <div id="modal-cropper" class="fixed inset-0 z-50 bg-black/80 hidden flex flex-col justify-between p-4">
    <div class="max-h-[75vh] w-full flex-1 my-auto">
      <img id="cropper-image" src="" class="max-w-full mx-auto">
    </div>
    <div class="flex justify-around pt-4">
      <button onclick="closeModal('modal-cropper')" class="px-6 py-2 bg-gray-600 text-white rounded-xl">取消</button>
      <button onclick="cropAndSaveAvatar()" class="px-6 py-2 bg-primary text-white font-bold rounded-xl">套用頭像</button>
    </div>
  </div>

  <!-- 隱藏的 PDF 生成模板 -->
  <div class="hidden">
    <div id="pdf-template" class="text-black">
      <div class="text-center border-b-2 border-black pb-4 mb-4">
        <h1 class="text-3xl font-bold tracking-wide">每週菜單 / Menu Mingguan</h1>
        <p id="pdf-date-range" class="text-lg font-semibold mt-1 text-gray-700"></p>
      </div>
      <div id="pdf-days-list" class="space-y-4"></div>
    </div>
  </div>

  <!-- JavaScript 邏輯 -->
  <script>
    // 預設分類 (25. 26.)
    const DEFAULT_CATEGORIES = ["雞", "牛", "豬", "魚", "海鮮(魚除外)", "疏菜", "湯水", "西式", "罐頭", "其他"];

    // 8. 預設5款菜式於3個分類
    const DEFAULT_DISHES = [
      { id: '1', zh: '蒸水蛋', idn: 'Telur Kukus', category: '其他', lastCooked: '' },
      { id: '2', zh: '炒青菜', idn: 'Tumis Sayur', category: '疏菜', lastCooked: '' },
      { id: '3', zh: '煎紅衫魚', idn: 'Ikan Goreng', category: '魚', lastCooked: '' },
      { id: '4', zh: '蒜蓉菜心', idn: 'Choy Sum Bawang Putih', category: '疏菜', lastCooked: '' },
      { id: '5', zh: '番茄豆腐湯', idn: 'Sup Tahu Tomat', category: '湯水', lastCooked: '' }
    ];

    // 全域 App 狀態
    let appData = {
      categories: JSON.parse(localStorage.getItem('wm_categories')) || DEFAULT_CATEGORIES,
      dishes: JSON.parse(localStorage.getItem('wm_dishes')) || DEFAULT_DISHES,
      savedMenus: JSON.parse(localStorage.getItem('wm_saved_menus')) || {}, // 最多10張
      avatar: localStorage.getItem('wm_avatar') || '',
      darkMode: localStorage.getItem('wm_dark_mode') === 'true',
      fontSize: localStorage.getItem('wm_font_size') || '16'
    };

    // 當前正在編輯的菜單
    let currentMenu = {
      startDate: getMonday(new Date()),
      days: {} // { '2026-09-28': { dishes: [], eatIn: '', takeOut: '' } }
    };

    let selectedDayForDish = null;
    let cropper = null;

    // 初始化 App
    window.addEventListener('DOMContentLoaded', () => {
      initSettings();
      initCurrentMenu(currentMenu.startDate);
      renderHeader();
      switchTab('menu');
    });

    function saveState() {
      localStorage.setItem('wm_categories', JSON.stringify(appData.categories));
      localStorage.setItem('wm_dishes', JSON.stringify(appData.dishes));
      localStorage.setItem('wm_saved_menus', JSON.stringify(appData.savedMenus));
      localStorage.setItem('wm_avatar', appData.avatar);
      localStorage.setItem('wm_dark_mode', appData.darkMode);
      localStorage.setItem('wm_font_size', appData.fontSize);
    }

    // 取得指定日期的星期一 YYYY-MM-DD
    function getMonday(d) {
      d = new Date(d);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const mon = new Date(d.setDate(diff));
      return mon.toISOString().split('T')[0];
    }

    // 日期格式化與星期對照
    const WEEKDAYS = [
      { zh: '星期一', idn: 'Senin' },
      { zh: '星期二', idn: 'Selasa' },
      { zh: '星期三', idn: 'Rabu' },
      { zh: '星期四', idn: 'Kamis' },
      { zh: '星期五', idn: 'Jumat' },
      { zh: '星期六', idn: 'Sabtu' },
      { zh: '星期日', idn: 'Minggu' }
    ];

    // 12. 13. 初始化編輯菜單 (從星期一開始 7 天)
    function initCurrentMenu(startDateStr) {
      currentMenu.startDate = startDateStr;
      currentMenu.days = {};
      
      const start = new Date(startDateStr);
      for(let i = 0; i < 7; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        const dateStr = d.toISOString().split('T')[0];
        currentMenu.days[dateStr] = {
          eatIn: '',
          takeOut: '',
          dishes: []
        };
      }
      document.getElementById('menu-start-date').value = startDateStr;
      renderMenuEditor();
    }

    // 13. 17. 起始日日期選擇監聽
    document.getElementById('menu-start-date').addEventListener('change', (e) => {
      const selected = new Date(e.target.value);
      if (selected.getDay() !== 1) { // 1 表示星期一
        alert('只可以選擇星期一作起始日！\nHanya bisa memilih hari Senin sebagai tanggal mulai.');
        e.target.value = currentMenu.startDate;
        return;
      }
      initCurrentMenu(e.target.value);
    });

    // 渲染頭像與主題設定
    function renderHeader() {
      const avatarSrc = appData.avatar || "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>";
      document.getElementById('header-avatar').src = avatarSrc;
      document.getElementById('settings-avatar-preview').src = avatarSrc;
      
      // 深淺色
      if (appData.darkMode) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      
      // 字體大小
      document.documentElement.style.setProperty('--app-font-size', appData.fontSize + 'px');
      document.getElementById('font-size-slider').value = appData.fontSize;
      document.getElementById('font-size-val').innerText = appData.fontSize + 'px';
    }

    // 頁籤切換
    function switchTab(tab) {
      document.querySelectorAll('.view-page').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('nav button').forEach(el => el.classList.replace('text-primary', 'text-gray-400'));
      
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).classList.replace('text-gray-400', 'text-primary');

      const headerActions = document.getElementById('header-actions');
      headerActions.innerHTML = '';

      if (tab === 'menu') {
        // 18. 23. 儲存與 PDF 圖示按鈕
        headerActions.innerHTML = `
          <button onclick="exportPDF()" class="p-2 text-primary hover:opacity-80 text-xl" title="匯出 PDF"><i class="fa-solid fa-file-pdf"></i></button>
          <button onclick="saveCurrentMenu()" class="p-2 text-primary hover:opacity-80 text-xl" title="儲存菜單"><i class="fa-solid fa-floppy-disk"></i></button>
        `;
      } else if (tab === 'saved') {
        renderSavedMenus();
      } else if (tab === 'dishes') {
        renderDishesView();
      } else if (tab === 'settings') {
        renderSettingsView();
      }
    }

    // 渲染編輯每週菜單視圖
    function renderMenuEditor() {
      const container = document.getElementById('days-container');
      container.innerHTML = '';

      const dates = Object.keys(currentMenu.days).sort();
      dates.forEach((dateStr, idx) => {
        const dayData = currentMenu.days[dateStr];
        const weekday = WEEKDAYS[idx];

        // 人數選單 0-9 14.
        const optionsHtml = ['<option value="">空白</option>']
          .concat([...Array(10).keys()].map(i => `<option value="${i}">${i} 人</option>`))
          .join('');

        const dayCard = document.createElement('div');
        dayCard.className = "bg-cardlight dark:bg-carddark p-4 rounded-2xl shadow-sm border border-gray-200/50 dark:border-gray-800 space-y-3";
        dayCard.innerHTML = `
          <div class="flex justify-between items-center border-b pb-2 dark:border-gray-800">
            <div>
              <span class="font-bold text-base">${weekday.zh} (${weekday.idn})</span>
              <span class="text-xs text-gray-500 block">${dateStr}</span>
            </div>
            <!-- 14. 自訂用餐人數及外帶人數 -->
            <div class="flex gap-2 text-xs">
              <div>
                <span class="text-gray-400 block text-[10px]">堂食</span>
                <select onchange="updatePeople('${dateStr}', 'eatIn', this.value)" class="bg-gray-100 dark:bg-gray-800 rounded p-1 border-0">
                  ${optionsHtml.replace(`value="${dayData.eatIn}"`, `value="${dayData.eatIn}" selected`)}
                </select>
              </div>
              <div>
                <span class="text-gray-400 block text-[10px]">外帶</span>
                <select onchange="updatePeople('${dateStr}', 'takeOut', this.value)" class="bg-gray-100 dark:bg-gray-800 rounded p-1 border-0">
                  ${optionsHtml.replace(`value="${dayData.takeOut}"`, `value="${dayData.takeOut}" selected`)}
                </select>
              </div>
            </div>
          </div>

          <!-- 菜式列表 (21. 分行顯示) -->
          <div class="space-y-2">
            <div class="text-xs font-semibold text-gray-400">已選菜式：</div>
            <div id="selected-dishes-${dateStr}" class="space-y-1">
              ${dayData.dishes.length === 0 ? '<div class="text-xs text-gray-400 italic">尚未選擇菜式</div>' : ''}
              ${dayData.dishes.map((dish, dIdx) => `
                <div class="flex justify-between items-center bg-gray-50 dark:bg-gray-800/50 p-2 rounded-xl text-sm">
                  <div>
                    <div class="font-medium">${dish.zh}</div>${dish.idn ? `<div class="text-xs text-gray-500">${dish.idn}</div>` : ''}
                  </div>
                  <button onclick="removeDishFromDay('${dateStr}',${dIdx})" class="text-red-500 p-1"><i class="fa-solid fa-xmark"></i></button>
                </div>
              `).join('')}
            </div>
            <button onclick="openSelectDishModal('${dateStr}')" class="w-full mt-2 py-2 border border-dashed border-primary text-primary rounded-xl text-xs font-semibold flex items-center justify-center gap-1">
              <i class="fa-solid fa-plus"></i> 選擇菜式
            </button>
          </div>
        `;
        container.appendChild(dayCard);
      });
    }

    function updatePeople(dateStr, type, val) {
      currentMenu.days[dateStr][type] = val;
    }

    function removeDishFromDay(dateStr, dishIdx) {
      currentMenu.days[dateStr].dishes.splice(dishIdx, 1);
      renderMenuEditor();
    }

    // 9. 10. 打開菜式選擇器 (一點即選)
    function openSelectDishModal(dateStr) {
      selectedDayForDish = dateStr;
      const content = document.getElementById('select-dish-content');
      content.innerHTML = '';

      appData.categories.forEach(cat => {
        const catDishes = appData.dishes.filter(d => d.category === cat);
        if (catDishes.length === 0) return;

        const catSec = document.createElement('div');
        catSec.className = "space-y-2";
        catSec.innerHTML = `<h4 class="font-bold text-sm text-primary border-b border-primary/20 pb-1">${cat}</h4>`;

        const list = document.createElement('div');
        list.className = "grid grid-cols-1 gap-2";

        catDishes.forEach(dish => {
          const btn = document.createElement('button');
          btn.className = "w-full text-left p-2.5 bg-gray-100 dark:bg-gray-800 hover:bg-primary/10 rounded-xl flex justify-between items-center transition";
          btn.onclick = () => selectDishForDay(dish);

          btn.innerHTML = `
            <div>
              <div class="font-medium text-sm">${dish.zh}</div>
              ${dish.idn ? `<div class="text-xs text-gray-500">${dish.idn}</div>` : ''}
            </div>
            ${dish.lastCooked ? `<span class="text-[10px] bg-gray-200 dark:bg-gray-700 px-2 py-0.5 rounded text-gray-500">上次: ${dish.lastCooked}</span>` : ''}
          `;
          list.appendChild(btn);
        });

        catSec.appendChild(list);
        content.appendChild(catSec);
      });

      document.getElementById('modal-select-dish').classList.remove('hidden');
    }

    // 10. 一點即選添加菜式 & 記錄烹飪日期
    function selectDishForDay(dish) {
      if (!selectedDayForDish) return;
      
      // 更新菜式的上次烹飪日期
      dish.lastCooked = selectedDayForDish;
      saveState();

      // 加入菜單
      currentMenu.days[selectedDayForDish].dishes.push({ zh: dish.zh, idn: dish.idn });
      
      closeModal('modal-select-dish');
      renderMenuEditor();
    }

    // 16. 17. 20. 儲存每週菜單
    function saveCurrentMenu() {
      const fileName = currentMenu.startDate; // 16. 以星期一日期作檔名
      const keys = Object.keys(appData.savedMenus);

      // 17. 菜單重複處理
      if (appData.savedMenus[fileName]) {
        const action = confirm(`日期 ${fileName} 的菜單已存在！\n按「確定」取代該菜單，按「取消」另擇日期。`);
        if (!action) return;
      } else {
        // 20. 最多儲存 10 張
        if (keys.length >= 10) {
          alert('「我的菜單」最多只能儲存 10 張菜單，請先刪除舊菜單！');
          return;
        }
      }

      appData.savedMenus[fileName] = JSON.parse(JSON.stringify(currentMenu));
      saveState();
      alert(`菜單 ${fileName} 儲存成功！`);
    }

    // 渲染我的菜單視圖
    function renderSavedMenus() {
      const list = document.getElementById('saved-menus-list');
      const keys = Object.keys(appData.savedMenus).sort().reverse();
      document.getElementById('saved-count').innerText = keys.length;

      list.innerHTML = '';
      if (keys.length === 0) {
        list.innerHTML = '<div class="text-center text-gray-400 py-8">暫無已儲存的菜單</div>';
        return;
      }

      keys.forEach(key => {
        const item = appData.savedMenus[key];
        const card = document.createElement('div');
        card.className = "bg-cardlight dark:bg-carddark p-4 rounded-2xl shadow-sm border border-gray-200/50 dark:border-gray-800 flex justify-between items-center";
        card.innerHTML = `
          <div>
            <div class="font-bold text-base">首日：${key}</div>
            <div class="text-xs text-gray-500 mt-1">包含 7 天菜單內容</div>
          </div>
          <div class="flex gap-2">
            <button onclick="loadSavedMenu('${key}')" class="px-3 py-1.5 bg-primary/10 text-primary rounded-xl text-xs font-semibold">載入 / 修改</button>
            <button onclick="deleteSavedMenu('${key}')" class="px-3 py-1.5 bg-red-100 dark:bg-red-900/30 text-red-500 rounded-xl text-xs font-semibold">刪除</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    // 19. 載入/修改菜單
    function loadSavedMenu(key) {
      currentMenu = JSON.parse(JSON.stringify(appData.savedMenus[key]));
      switchTab('menu');
      renderMenuEditor();
    }

    // 19. 刪除菜單
    function deleteSavedMenu(key) {
      if (confirm(`確定刪除 ${key} 的菜單嗎？`)) {
        delete appData.savedMenus[key];
        saveState();
        renderSavedMenus();
      }
    }

    // 渲染菜式庫視圖 (5. 6. 7. 11.)
    function renderDishesView() {
      const container = document.getElementById('dishes-by-category');
      container.innerHTML = '';

      appData.categories.forEach(cat => {
        const catDishes = appData.dishes.filter(d => d.category === cat);
        const sec = document.createElement('div');
        sec.className = "bg-cardlight dark:bg-carddark p-4 rounded-2xl shadow-sm border border-gray-200/50 dark:border-gray-800 space-y-2";
        
        sec.innerHTML = `
          <h3 class="font-bold text-base text-primary border-b dark:border-gray-800 pb-1">${cat} (${catDishes.length})</h3>
          <div class="divide-y dark:divide-gray-800">
            ${catDishes.length === 0 ? '<div class="text-xs text-gray-400 py-2 italic">無菜式</div>' : ''}
            ${catDishes.map(d => `
              <div class="py-2 flex justify-between items-center">
                <div>
                  <div class="font-medium">${d.zh}</div>
                  <div class="text-xs text-gray-500">${d.idn || '無印尼文翻譯'}</div>
                  ${d.lastCooked ? `<div class="text-[10px] text-gray-400">上次烹飪: ${d.lastCooked}</div>` : ''}
                </div>
                <div class="flex gap-2">
                  <button onclick="openDishModal('${d.id}')" class="text-gray-400 hover:text-primary"><i class="fa-solid fa-pen"></i></button>
                  <button onclick="deleteDish('${d.id}')" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(sec);
      });
    }

    // 開啟新增/編輯菜式彈窗 (7. 11.)
    function openDishModal(dishId = null) {
      const select = document.getElementById('dish-category-select');
      select.innerHTML = appData.categories.map(c => `<option value="${c}">${c}</option>`).join('');

      if (dishId) {
        const dish = appData.dishes.find(d => d.id === dishId);
        document.getElementById('dish-modal-title').innerText = '修改菜式';
        document.getElementById('edit-dish-id').value = dish.id;
        document.getElementById('dish-name-zh').value = dish.zh;
        document.getElementById('dish-name-id').value = dish.idn;
        select.value = dish.category;
      } else {
        document.getElementById('dish-modal-title').innerText = '新增菜式';
        document.getElementById('edit-dish-id').value = '';
        document.getElementById('dish-name-zh').value = '';
        document.getElementById('dish-name-id').value = '';
      }
      document.getElementById('modal-dish-form').classList.remove('hidden');
    }

    // 6. 7. 11. 儲存菜式
    function saveDish() {
      const id = document.getElementById('edit-dish-id').value;
      const zh = document.getElementById('dish-name-zh').value.trim();
      const idn = document.getElementById('dish-name-id').value.trim();
      const category = document.getElementById('dish-category-select').value;

      if (!zh) { alert('請輸入中文菜名'); return; }

      if (id) {
        const dish = appData.dishes.find(d => d.id === id);
        dish.zh = zh;
        dish.idn = idn;
        dish.category = category;
      } else {
        appData.dishes.push({
          id: Date.now().toString(),
          zh, idn, category, lastCooked: ''
        });
      }

      saveState();
      closeModal('modal-dish-form');
      renderDishesView();
    }

    // 6. 刪除菜式
    function deleteDish(id) {
      if (confirm('確定刪除此菜式？')) {
        appData.dishes = appData.dishes.filter(d => d.id !== id);
        saveState();
        renderDishesView();
      }
    }

    // 22. 24. 匯出每週菜單為 A4 PDF (含中文及印尼文對照)
    function exportPDF() {
      const dates = Object.keys(currentMenu.days).sort();
      const pdfDaysList = document.getElementById('pdf-days-list');
      pdfDaysList.innerHTML = '';

      document.getElementById('pdf-date-range').innerText = `${dates[0]} 至 / s.d. ${dates[6]}`;

      dates.forEach((dateStr, idx) => {
        const dayData = currentMenu.days[dateStr];
        const weekday = WEEKDAYS[idx];

        const dayItem = document.createElement('div');
        dayItem.className = "border-b border-gray-300 pb-2";
        
        const eatInText = dayData.eatIn ? `${dayData.eatIn} 人 / orang` : '未設定 / -';
        const takeOutText = dayData.takeOut ? `${dayData.takeOut} 人 / orang` : '未設定 / -';

        dayItem.innerHTML = `
          <div class="flex justify-between items-center bg-gray-100 p-2 font-bold text-lg mb-1">
            <span>${weekday.zh} (${weekday.idn}) - ${dateStr}</span>
            <span class="text-sm font-normal">堂食/Makan: ${eatInText} | 外帶/Bungkus: ${takeOutText}</span>
          </div>
          <div class="pl-3 space-y-1">
            ${dayData.dishes.length === 0 ? '<div class="text-sm italic text-gray-500">無菜式 / Tidak ada menu</div>' : ''}
            ${dayData.dishes.map(d => `
              <div class="text-base font-semibold">
                • ${d.zh}${d.idn ? `<span class="text-sm font-normal text-gray-700">(${d.idn})</span>` : ''}
              </div>
            `).join('')}
          </div>
        `;
        pdfDaysList.appendChild(dayItem);
      });

      const element = document.getElementById('pdf-template');
      const opt = {
        margin:       10,
        filename:     `Weekly_Menu_${currentMenu.startDate}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }

    // 設定頁邏輯 (25. 26. 27. 28. 29. 30.)
    function renderSettingsView() {
      const sortList = document.getElementById('category-sort-list');
      sortList.innerHTML = '';

      appData.categories.forEach((cat, idx) => {
        const li = document.createElement('li');
        li.className = "flex justify-between items-center bg-gray-100 dark:bg-gray-800 p-2.5 rounded-xl text-sm";
        li.dataset.cat = cat;
        li.innerHTML = `
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-bars text-gray-400 cursor-move handle"></i>
            <span>${cat}</span>
          </div>
          ${cat !== '其他' ? `
            <button onclick="deleteCategory('${cat}')" class="text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>
          ` : '<span class="text-[10px] text-gray-400">預設</span>'}
        `;
        sortList.appendChild(li);
      });

      // 25. 拖拉排序分類
      new Sortable(sortList, {
        handle: '.handle',
        animation: 150,
        onEnd: () => {
          const newOrder = Array.from(sortList.children).map(li => li.dataset.cat);
          appData.categories = newOrder;
          saveState();
        }
      });
    }

    // 26. 新增分類
    function promptAddCategory() {
      const name = prompt('請輸入新分類名稱：');
      if (name && !appData.categories.includes(name)) {
        appData.categories.push(name);
        saveState();
        renderSettingsView();
      }
    }

    // 27. 刪除分類 (自動將項目移至「其他」)
    function deleteCategory(cat) {
      if (cat === '其他') return;

      const confirmDel = confirm(`確定刪除「${cat}」分類嗎？\n該分類下的所有菜式將自動轉移至「其他」分類。`);
      if (confirmDel) {
        // 移動菜式
        appData.dishes.forEach(d => {
          if (d.category === cat) d.category = '其他';
        });

        // 移除分類
        appData.categories = appData.categories.filter(c => c !== cat);
        
        saveState();
        renderSettingsView();
      }
    }

    // 28. 深淺色轉換
    function toggleDarkMode() {
      appData.darkMode = !appData.darkMode;
      saveState();
      renderHeader();
    }

    // 30. 自訂字體大小
    function updateFontSize(val) {
      appData.fontSize = val;
      saveState();
      renderHeader();
    }

    // 29. 頭像選擇與 Crop 裁剪
    function handleAvatarSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = document.getElementById('cropper-image');
        img.src = event.target.result;

        document.getElementById('modal-cropper').classList.remove('hidden');

        if (cropper) cropper.destroy();
        cropper = new Cropper(img, {
          aspectRatio: 1,
          viewMode: 1
        });
      };
      reader.readAsDataURL(file);
    }

    function cropAndSaveAvatar() {
      if (!cropper) return;
      const canvas = cropper.getCroppedCanvas({ width: 200, height: 200 });
      appData.avatar = canvas.toDataURL('image/jpeg');
      saveState();
      renderHeader();
      closeModal('modal-cropper');
    }

    // 通用關閉 Modal
    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }
  </script>
</body>
</html>
