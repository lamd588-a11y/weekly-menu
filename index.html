<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>每週菜單</title>
  
  <!-- PWA 標籤與 iPhone 設定 (功能 1, 2, 3) -->
  <link rel="manifest" href="data:application/manifest+json;utf8,{
    &quot;name&quot;: &quot;每週菜單&quot;,
    &quot;short_name&quot;: &quot;每週菜單&quot;,
    &quot;start_url&quot;: &quot;.&quot;,
    &quot;display&quot;: &quot;standalone&quot;,
    &quot;background_color&quot;: &quot;#F2F2F7&quot;,
    &quot;theme_color&quot;: &quot;#007AFF&quot;,
    &quot;icons&quot;: [{&quot;src&quot;: &quot;icon.png&quot;, &quot;sizes&quot;: &quot;192x192&quot;, &quot;type&quot;: &quot;image/png&quot;}]
  }">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <!-- html2pdf.js 庫 (用於生成 PDF - 功能 22, 24) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg-color: #F2F2F7;
      --card-bg: #FFFFFF;
      --text-color: #000000;
      --sub-text: #8E8E93;
      --border-color: #C6C6C8;
      --primary: #007AFF;
      --danger: #FF3B30;
      --font-scale: 16px;
      --safe-area-top: env(safe-area-inset-top, 20px);
      --safe-area-bottom: env(safe-area-inset-bottom, 20px);
    }

    [data-theme="dark"] {
      --bg-color: #1C1C1E;
      --card-bg: #2C2C2E;
      --text-color: #FFFFFF;
      --sub-text: #8E8E93;
      --border-color: #38383A;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: var(--font-scale);
      background-color: var(--bg-color);
      color: var(--text-color);
      user-select: none;
      -webkit-user-select: none;
    }

    /* iPhone 18 Pro Max 邊框適應 (功能 3) */
    .app-container {
      display: flex; flex-direction: column; height: 100vh;
      padding-top: var(--safe-area-top);
      padding-bottom: calc(60px + var(--safe-area-bottom));
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }
    .header-title { font-size: 1.2em; font-weight: bold; }
    .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }

    /* 頁面導航 */
    .tab-content { flex: 1; overflow-y: auto; display: none; padding: 16px; }
    .tab-content.active { display: block; }

    /* 設定頁面固定頂部區域 */
    .sticky-card {
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    nav.tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: calc(50px + var(--safe-area-bottom));
      background: var(--card-bg); border-top: 1px solid var(--border-color);
      display: flex; justify-content: space-around; align-items: center;
      padding-bottom: var(--safe-area-bottom); z-index: 100;
    }
    .tab-btn {
      background: none; border: none; color: var(--sub-text);
      font-size: 0.8em; display: flex; flex-direction: column; align-items: center;
    }
    .tab-btn.active { color: var(--primary); font-weight: bold; }

    /* 通用 UI 元件 */
    .card { background: var(--card-bg); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 1em; cursor: pointer; }
    .btn-danger { background: var(--danger); }
    .icon-btn { background: none; border: none; font-size: 1.4em; cursor: pointer; color: var(--primary); }
    input, select { font-size: 1em; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); }

    /* 菜單編輯頁 */
    .day-card { border-left: 4px solid var(--primary); margin-bottom: 16px; }
    .day-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; }
    .people-selects { display: flex; gap: 12px; margin-bottom: 8px; font-size: 0.9em; }
    .dish-tag { display: flex; justify-content: space-between; background: rgba(0,122,255,0.1); padding: 6px; border-radius: 6px; margin-top: 4px; }

    /* 分類與菜式選擇 */
    .category-title { font-weight: bold; margin-top: 12px; color: var(--primary); }
    .dish-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
    .indonesian-text { font-size: 0.85em; color: var(--sub-text); }

    /* 彈窗 Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 200; }
    .modal.active { display: flex; }
    .modal-body { background: var(--card-bg); width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; border-radius: 14px; padding: 20px; }

    /* 設定頁面：頭像裁切 */
    .crop-container { width: 200px; height: 200px; border: 2px dashed var(--primary); margin: 0 auto; overflow: hidden; position: relative; }
    .crop-img { position: absolute; top: 0; left: 0; transform-origin: top left; cursor: move; }

    /* PDF 隱藏渲染區域 (字體尺寸已調小) */
    #pdf-template { display: none; }
    .pdf-page { width: 210mm; padding: 12mm; background: #fff; color: #000; font-family: sans-serif; }
    .pdf-title { text-align: center; font-size: 16pt; font-weight: bold; margin-bottom: 6mm; }
    .pdf-day { margin-bottom: 4mm; border-bottom: 1px solid #ccc; padding-bottom: 2mm; }
    .pdf-day-title { font-size: 11pt; font-weight: bold; color: #000; }
    .pdf-people { font-size: 9pt; color: #555; }
    .pdf-dish { font-size: 10pt; margin-top: 2mm; line-height: 1.3; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 頂部頁頭 (功能 1, 4) -->
  <header>
    <div class="header-title">每週菜單</div>
    <img id="header-avatar" class="avatar-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><circle cx='20' cy='20' r='20' fill='%23CCC'/></svg>" alt="頭像">
  </header>

  <!-- 1. 每週菜單編輯頁 -->
  <div id="tab-build" class="tab-content active">
    <div class="card">
      <label>選擇起始星期一 (功能 12, 13): </label>
      <input type="date" id="menu-start-date" onchange="handleDateSelect(this.value)">
      <button class="icon-btn" onclick="saveCurrentMenu()" title="儲存菜單" style="float: right;">💾</button> <!-- 功能 18 -->
      <button class="icon-btn" onclick="exportPDF()" title="匯出PDF" style="float: right; margin-right: 10px;">📄</button> <!-- 功能 23 -->
    </div>

    <div id="days-container"></div>
  </div>

  <!-- 2. 我的菜單 (功能 16, 19, 20) -->
  <div id="tab-saved" class="tab-content">
    <h3>我的菜單 (最多 10 張)</h3>
    <div id="saved-menus-list"></div>
  </div>

  <!-- 3. 菜式庫 (功能 5, 6, 7, 8, 10, 11, 21) -->
  <div id="tab-dishes" class="tab-content">
    <div class="card">
      <h4>新增菜式</h4>
      <input type="text" id="new-dish-zh" placeholder="中文菜式名稱" style="width:100%; margin-bottom:8px;">
      <input type="text" id="new-dish-id" placeholder="Nama Masakan (印尼文)" style="width:100%; margin-bottom:8px;">
      <select id="new-dish-cat" style="width:100%; margin-bottom:8px;"></select>
      <button class="btn" style="width:100%" onclick="addDish()">新增至菜式庫</button>
    </div>
    <div id="dishes-library"></div>
  </div>

  <!-- 4. 設定頁面 (功能 25, 26, 27, 28, 29, 30) -->
  <div id="tab-settings" class="tab-content">
    <!-- 加入 sticky-card 樣式固定頂部 -->
    <div class="card sticky-card">
      <h4>自訂頭像 (功能 29)</h4>
      <input type="file" id="avatar-input" accept="image/*" onchange="loadAvatarCrop(event)">
      <div id="crop-modal-controls" style="display:none; margin-top:10px; text-align:center;">
        <div class="crop-container" id="crop-box">
          <img id="crop-img" class="crop-img" src="" alt="">
        </div>
        <div style="margin-top:8px;">
          <button class="btn" onclick="zoomAvatar(1.1)">放大</button>
          <button class="btn" onclick="zoomAvatar(0.9)">縮小</button>
          <button class="btn" onclick="applyAvatarCrop()">確認裁切</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h4>外觀與字體</h4>
      <p>
        深淺色模式 (功能 28): 
        <button class="btn" onclick="toggleTheme()">切換深/淺色</button>
      </p>
      <p>
        字體大小 (功能 30): 
        <input type="range" min="14" max="22" value="16" oninput="changeFontSize(this.value)">
      </p>
    </div>

    <div class="card">
      <h4>分類管理 (功能 25, 26, 27)</h4>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="text" id="new-cat-name" placeholder="新分類名稱" style="flex:1;">
        <button class="btn" onclick="addCategory()">新增</button>
      </div>
      <div id="categories-list"></div>
    </div>
  </div>

  <!-- 底部導航欄 -->
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('tab-build', this)"><span>📅</span>建立菜單</button>
    <button class="tab-btn" onclick="switchTab('tab-saved', this)"><span>📁</span>我的菜單</button>
    <button class="tab-btn" onclick="switchTab('tab-dishes', this)"><span>🍳</span>菜式庫</button>
    <button class="tab-btn" onclick="switchTab('tab-settings', this)"><span>⚙️</span>設定</button>
  </nav>
</div>

<!-- 選擇菜式 Modal (功能 9, 10) -->
<div id="select-dish-modal" class="modal">
  <div class="modal-body">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h4>選擇菜式 (一點即選)</h4>
      <button class="icon-btn" onclick="closeModal('select-dish-modal')">✕</button>
    </div>
    <div id="modal-dish-selector"></div>
  </div>
</div>

<!-- 重複日期提示 Modal (功能 17) -->
<div id="duplicate-modal" class="modal">
  <div class="modal-body">
    <h4>菜單日期已存在</h4>
    <p>已有這天起始的菜單，請選擇取代或另擇日期：</p>
    <button class="btn" style="width:100%; margin-bottom:8px;" onclick="resolveDuplicate('replace')">取代原菜單</button>
    <button class="btn btn-danger" style="width:100%;" onclick="resolveDuplicate('reschedule')">另擇星期一</button>
  </div>
</div>

<!-- PDF 樣式模板 (功能 22, 24) -->
<div id="pdf-template">
  <div class="pdf-page" id="pdf-content">
    <div class="pdf-title" id="pdf-menu-title">每週菜單 Menu Mingguan</div>
    <div id="pdf-days-list"></div>
  </div>
</div>

<script>
// --- 初始化資料與預設值 (功能 5, 8) ---
const DEFAULT_CATEGORIES = ["雞", "牛", "豬", "魚", "海鮮(魚除外)", "疏菜", "湯水", "西式", "罐頭", "其他"];
const INITIAL_DISHES = [
  { id: '1', nameZh: '海南雞', nameId: 'Ayam Hainan', cat: '雞', lastCooked: '' },
  { id: '2', nameZh: '咖哩牛肉', nameId: 'Rendang Sapi', cat: '牛', lastCooked: '' },
  { id: '3', nameZh: '清蒸海上鮮', nameId: 'Ikan Kukus', cat: '魚', lastCooked: '' },
  { id: '4', nameZh: '炒時蔬', nameId: 'Tumis Sayuran', cat: '疏菜', lastCooked: '' },
  { id: '5', nameZh: '蕃茄蛋花湯', nameId: 'Sup Telur Tomat', cat: '湯水', lastCooked: '' }
];

let state = {
  categories: JSON.parse(localStorage.getItem('app_categories')) || DEFAULT_CATEGORIES,
  dishes: JSON.parse(localStorage.getItem('app_dishes')) || INITIAL_DISHES,
  savedMenus: JSON.parse(localStorage.getItem('app_saved_menus')) || {},
  avatar: localStorage.getItem('app_avatar') || '',
  theme: localStorage.getItem('app_theme') || 'light',
  fontSize: localStorage.getItem('app_fontsize') || '16',
  currentMenu: { startDate: '', days: Array(7).fill(null).map(() => ({ eat: '', take: '', dishes: [] })) }
};

let activeDayIndex = null;
let pendingSaveDate = null;

// 印尼文日曆及基本對照 (功能 22)
const ID_DAYS = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu", "Minggu"];
const ZH_DAYS = ["星期一", "星期二", "星期三", "星期四", "星期五", "星期六", "星期日"];

// --- 程式初始化 ---
window.onload = function() {
  applyTheme(state.theme);
  changeFontSize(state.fontSize);
  if (state.avatar) document.getElementById('header-avatar').src = state.avatar;
  
  // 設定預設日期為最近的星期一
  const nextMon = getNextMonday(new Date());
  document.getElementById('menu-start-date').value = nextMon;
  initMenuForDate(nextMon);
  
  renderCategoryDropdowns();
  renderDishesLibrary();
  renderCategorySettings();
  renderSavedMenusList();
  
  // 註冊 PWA Service Worker (功能 1)
  if ('serviceWorker' in navigator) {
    const swCode = `self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));`;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }
};

function saveData() {
  localStorage.setItem('app_categories', JSON.stringify(state.categories));
  localStorage.setItem('app_dishes', JSON.stringify(state.dishes));
  localStorage.setItem('app_saved_menus', JSON.stringify(state.savedMenus));
}

// --- 頁面切換 ---
function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
}

// --- 日期與菜單建立邏輯 (功能 12, 13, 14, 15) ---
function getNextMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = date.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(date.setDate(diff)).toISOString().split('T')[0];
}

function handleDateSelect(val) {
  if (!val) return;
  const chosen = new Date(val);
  if (chosen.getDay() !== 1) { // 1 代表星期一
    alert("只可以選擇星期一作起始日！"); // 功能 13
    document.getElementById('menu-start-date').value = state.currentMenu.startDate || getNextMonday(new Date());
    return;
  }
  initMenuForDate(val);
}

function initMenuForDate(startDateStr) {
  state.currentMenu.startDate = startDateStr;
  // 若「我的菜單」已有紀錄則載入，否則新開
  if (state.savedMenus[startDateStr]) {
    state.currentMenu.days = JSON.parse(JSON.stringify(state.savedMenus[startDateStr]));
  } else {
    state.currentMenu.days = Array(7).fill(null).map(() => ({ eat: '', take: '', dishes: [] }));
  }
  renderMenuBuilder();
}

function renderMenuBuilder() {
  const container = document.getElementById('days-container');
  container.innerHTML = '';
  
  const start = new Date(state.currentMenu.startDate);

  for (let i = 0; i < 7; i++) {
    const curDate = new Date(start);
    curDate.setDate(start.getDate() + i);
    const dateStr = `${curDate.getMonth()+1}/${curDate.getDate()}`;
    const dayData = state.currentMenu.days[i];

    const card = document.createElement('div');
    card.className = 'card day-card';
    card.innerHTML = `
      <div class="day-header">
        <span>${ZH_DAYS[i]} (${dateStr})</span>
        <button class="btn" style="padding:2px 8px; font-size:0.8em;" onclick="openDishSelector(${i})">+ 加菜式</button>
      </div>
      <div class="people-selects">
        <label>用餐人數: 
          <select onchange="updatePeople(${i}, 'eat', this.value)">
            ${renderPeopleOptions(dayData.eat)}
          </select>
        </label>
        <label>外帶人數: 
          <select onchange="updatePeople(${i}, 'take', this.value)">
            ${renderPeopleOptions(dayData.take)}
          </select>
        </label>
      </div>
      <div id="day-dishes-${i}">
        ${dayData.dishes.map((d, dIdx) => `
          <div class="dish-tag">
            <div>
              <div>${d.nameZh}</div>
              <div class="indonesian-text">${d.nameId}</div>
            </div>
            <button class="icon-btn" style="color:var(--danger);" onclick="removeDishFromDay(${i},${dIdx})">✕</button>
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(card);
  }
}

function renderPeopleOptions(selectedVal) {
  let opts = `<option value="">空白</option>`; // 預設空白 (功能 14)
  for (let i = 0; i <= 9; i++) {
    opts += `<option value="${i}" ${selectedVal === String(i) ? 'selected' : ''}>${i}</option>`;
  }
  return opts;
}

function updatePeople(dayIdx, type, val) {
  state.currentMenu.days[dayIdx][type] = val;
}

function removeDishFromDay(dayIdx, dishIdx) {
  state.currentMenu.days[dayIdx].dishes.splice(dishIdx, 1);
  renderMenuBuilder();
}

// --- 菜式選擇器 (功能 9, 10) ---
function openDishSelector(dayIdx) {
  activeDayIndex = dayIdx;
  const container = document.getElementById('modal-dish-selector');
  container.innerHTML = '';

  state.categories.forEach(cat => {
    const catDishes = state.dishes.filter(d => d.cat === cat);
    if (catDishes.length === 0) return;

    const catTitle = document.createElement('div');
    catTitle.className = 'category-title';
    catTitle.innerText = cat;
    container.appendChild(catTitle);

    catDishes.forEach(dish => {
      const item = document.createElement('div');
      item.className = 'dish-item';
      item.onclick = () => selectDishForDay(dish); // 一點即選 (功能 10)
      item.innerHTML = `
        <div>
          <div>${dish.nameZh}</div>
          <div class="indonesian-text">${dish.nameId || '無印尼文'}</div>
        </div>
        <div style="font-size:0.75em; color:var(--sub-text);">
          ${dish.lastCooked ? '上次: ' + dish.lastCooked : '未煮過'}
        </div>
      `;
      container.appendChild(item);
    });
  });

  document.getElementById('select-dish-modal').classList.add('active');
}

function selectDishForDay(dish) {
  if (activeDayIndex !== null) {
    // 放入每週菜單 (功能 9)
    state.currentMenu.days[activeDayIndex].dishes.push(dish);
    // 更新上次烹飪日期為該天的日期
    const start = new Date(state.currentMenu.startDate);
    start.setDate(start.getDate() + activeDayIndex);
    dish.lastCooked = `${start.getMonth()+1}/${start.getDate()}`;
    
    saveData();
    renderMenuBuilder();
    closeModal('select-dish-modal');
  }
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

// --- 儲存與管理每週菜單 (功能 16, 17, 19, 20) ---
function saveCurrentMenu() {
  const dateKey = state.currentMenu.startDate;
  const keys = Object.keys(state.savedMenus);

  // 功能 17: 重複處理
  if (state.savedMenus[dateKey]) {
    pendingSaveDate = dateKey;
    document.getElementById('duplicate-modal').classList.add('active');
    return;
  }

  // 功能 20: 最多 10 張
  if (keys.length >= 10) {
    alert("儲存失敗：最多只可儲存 10 張每週菜單。請先刪除舊菜單。");
    return;
  }

  executeSave(dateKey);
}

function resolveDuplicate(action) {
  closeModal('duplicate-modal');
  if (action === 'replace') {
    executeSave(pendingSaveDate);
  } else if (action === 'reschedule') {
    alert("請在主頁頂部選擇另一個星期一。");
  }
}

function executeSave(dateKey) {
  state.savedMenus[dateKey] = JSON.parse(JSON.stringify(state.currentMenu.days));
  saveData();
  renderSavedMenusList();
  alert(`菜單已成功儲存！檔名：${dateKey}`);
}

function renderSavedMenusList() {
  const container = document.getElementById('saved-menus-list');
  container.innerHTML = '';
  const keys = Object.keys(state.savedMenus);

  if (keys.length === 0) {
    container.innerHTML = '<p style="color:var(--sub-text);">暫無已儲存的菜單</p>';
    return;
  }

  keys.forEach(dateKey => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.display = 'flex';
    card.style.justifyContent = 'space-between';
    card.style.alignItems = 'center';
    card.innerHTML = `
      <div><strong>📅 ${dateKey}</strong></div>
      <div>
        <button class="btn" onclick="loadSavedMenu('${dateKey}')">修改/查看</button>
        <button class="btn btn-danger" onclick="deleteSavedMenu('${dateKey}')">刪除</button>
      </div>
    `;
    container.appendChild(card);
  });
}

function loadSavedMenu(dateKey) {
  document.getElementById('menu-start-date').value = dateKey;
  initMenuForDate(dateKey);
  switchTab('tab-build', document.querySelectorAll('.tab-btn')[0]);
}

function deleteSavedMenu(dateKey) {
  if (confirm(`確定刪除 ${dateKey} 的菜單嗎？`)) {
    delete state.savedMenus[dateKey];
    saveData();
    renderSavedMenusList();
  }
}

// --- 菜式庫管理 (功能 6, 7, 8, 11, 21) ---
function renderCategoryDropdowns() {
  const select = document.getElementById('new-dish-cat');
  select.innerHTML = state.categories.map(c => `<option value="${c}">${c}</option>`).join('');
}

function addDish() {
  const nameZh = document.getElementById('new-dish-zh').value.trim();
  const nameId = document.getElementById('new-dish-id').value.trim();
  const cat = document.getElementById('new-dish-cat').value;

  if (!nameZh) { alert("請輸入中文菜式名稱"); return; }

  state.dishes.push({
    id: Date.now().toString(),
    nameZh, nameId, cat, lastCooked: ''
  });
  
  saveData();
  renderDishesLibrary();
  document.getElementById('new-dish-zh').value = '';
  document.getElementById('new-dish-id').value = '';
}

function renderDishesLibrary() {
  const container = document.getElementById('dishes-library');
  container.innerHTML = '';

  state.categories.forEach(cat => {
    const catDishes = state.dishes.filter(d => d.cat === cat);
    const catCard = document.createElement('div');
    catCard.className = 'card';
    catCard.innerHTML = `<div class="category-title">${cat}</div>`;

    catDishes.forEach(dish => {
      const row = document.createElement('div');
      row.className = 'dish-item'; // 分行顯示 (功能 21)
      row.innerHTML = `
        <div style="flex:1;">
          <input type="text" value="${dish.nameZh}" onchange="updateDish('${dish.id}', 'nameZh', this.value)" style="width:45%">
          <input type="text" value="${dish.nameId}" placeholder="印尼文" onchange="updateDish('${dish.id}', 'nameId', this.value)" style="width:45%">
        </div>
        <select onchange="updateDish('${dish.id}', 'cat', this.value)">
          ${state.categories.map(c => `<option value="${c}" ${c === dish.cat ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
        <button class="icon-btn" style="color:var(--danger)" onclick="deleteDish('${dish.id}')">🗑️</button>
      `;
      catCard.appendChild(row);
    });

    container.appendChild(catCard);
  });
}

function updateDish(id, field, val) {
  const dish = state.dishes.find(d => d.id === id);
  if (dish) {
    dish[field] = val;
    saveData();
    if (field === 'cat') renderDishesLibrary(); // 重新分類更新介面 (功能 11)
  }
}

function deleteDish(id) {
  state.dishes = state.dishes.filter(d => d.id !== id);
  saveData();
  renderDishesLibrary();
}

// --- 設定頁面：分類、頭像、深淺色、字型 (功能 25, 26, 27, 28, 29, 30) ---
function renderCategorySettings() {
  const container = document.getElementById('categories-list');
  container.innerHTML = '';

  state.categories.forEach((cat, idx) => {
    const item = document.createElement('div');
    item.className = 'dish-item';
    item.draggable = true; // 支援拖拉 (功能 25)
    item.ondragstart = (e) => e.dataTransfer.setData('text/plain', idx);
    item.ondragover = (e) => e.preventDefault();
    item.ondrop = (e) => {
      e.preventDefault();
      const oldIdx = e.dataTransfer.getData('text/plain');
      const moved = state.categories.splice(oldIdx, 1)[0];
      state.categories.splice(idx, 0, moved);
      saveData();
      renderCategorySettings();
      renderCategoryDropdowns();
    };

    item.innerHTML = `
      <span>☰ <strong>${cat}</strong></span>
      ${cat !== '其他' ? `<button class="btn btn-danger" onclick="removeCategory('${cat}')">刪除</button>` : '<i>(預設)</i>'}
    `;
    container.appendChild(item);
  });
}

function addCategory() {
  const val = document.getElementById('new-cat-name').value.trim();
  if (val && !state.categories.includes(val)) {
    state.categories.push(val);
    saveData();
    renderCategorySettings();
    renderCategoryDropdowns();
    document.getElementById('new-cat-name').value = '';
  }
}

function removeCategory(cat) {
  // 功能 27: 刪除預先通知，並移到「其他」
  if (confirm(`刪除「${cat}」分類後，該分類內的所有菜式將會自動移至「其他」分類。確定刪除？`)) {
    state.dishes.forEach(d => {
      if (d.cat === cat) d.cat = '其他';
    });
    state.categories = state.categories.filter(c => c !== cat);
    if (!state.categories.includes('其他')) state.categories.push('其他');
    saveData();
    renderCategorySettings();
    renderCategoryDropdowns();
    renderDishesLibrary();
  }
}

// 深淺色切換 (功能 28)
function toggleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  applyTheme(state.theme);
  localStorage.setItem('app_theme', state.theme);
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
}

// 字體大小 (功能 30)
function changeFontSize(val) {
  state.fontSize = val;
  document.documentElement.style.setProperty('--font-scale', val + 'px');
  localStorage.setItem('app_fontsize', val);
}

// 頭像裁切/縮放 (功能 29)
let zoomScale = 1;
function loadAvatarCrop(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const img = document.getElementById('crop-img');
    img.src = evt.target.result;
    document.getElementById('crop-modal-controls').style.display = 'block';
    zoomScale = 1;
    img.style.transform = `scale(${zoomScale})`;
  };
  reader.readAsDataURL(file);
}

function zoomAvatar(factor) {
  zoomScale *= factor;
  document.getElementById('crop-img').style.transform = `scale(${zoomScale})`;
}

function applyAvatarCrop() {
  const img = document.getElementById('crop-img');
  // 簡易將當前圖像轉畫布生成 Base64 頭像
  const canvas = document.createElement('canvas');
  canvas.width = 100; canvas.height = 100;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, 100, 100);
  const dataUrl = canvas.toDataURL();
  
  state.avatar = dataUrl;
  localStorage.setItem('app_avatar', dataUrl);
  document.getElementById('header-avatar').src = dataUrl;
  document.getElementById('crop-modal-controls').style.display = 'none';
  alert("頭像已更新！");
}

// --- 匯出 PDF 功能 (雙語、小字體、A4 滿頁 - 功能 22, 24) ---
function exportPDF() {
  const pdfContainer = document.getElementById('pdf-days-list');
  pdfContainer.innerHTML = '';
  
  const start = new Date(state.currentMenu.startDate);

  for (let i = 0; i < 7; i++) {
    const curDate = new Date(start);
    curDate.setDate(start.getDate() + i);
    const dateStr = `${curDate.getFullYear()}-${curDate.getMonth()+1}-${curDate.getDate()}`;
    const dayData = state.currentMenu.days[i];

    const dayBlock = document.createElement('div');
    dayBlock.className = 'pdf-day';

    // 雙語顯示日期、星期、人數
    const eatText = dayData.eat ? `${dayData.eat} 人` : '未填';
    const takeText = dayData.take ? `${dayData.take} 人` : '未填';

    let dishesHtml = dayData.dishes.length > 0 
      ? dayData.dishes.map(d => `<div class="pdf-dish">• ${d.nameZh} / ${d.nameId || ''}</div>`).join('')
      : '<div class="pdf-dish" style="color:#999;">• 無菜式 / Tidak ada masakan</div>';

    dayBlock.innerHTML = `
      <div class="pdf-day-title">${ZH_DAYS[i]} / ${ID_DAYS[i]} (${dateStr})</div>
      <div class="pdf-people">
        用餐人數 / Jumlah Makan: ${eatText} | 外帶人數 / Jumlah Bungkus: ${takeText}
      </div>
      ${dishesHtml}
    `;
    pdfContainer.appendChild(dayBlock);
  }

  // 使用 html2pdf 生成 A4 尺寸 PDF (功能 24)
  const element = document.getElementById('pdf-content');
  document.getElementById('pdf-template').style.display = 'block';

  const opt = {
    margin:       10,
    filename:     `Weekly_Menu_${state.currentMenu.startDate}.pdf`,
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2 },
    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  html2pdf().set(opt).from(element).save().then(() => {
    document.getElementById('pdf-template').style.display = 'none';
  });
}
</script>
