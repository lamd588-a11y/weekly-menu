<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>每週菜單</title>
  
  <!-- PWA & iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="每週菜單">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  
  <!-- PWA Manifest Data URI -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"每週菜單","short_name":"每週菜單","start_url":".","display":"standalone","background_color":"#F2F2F7","theme_color":"#34C759","icons":[{"src":"icon.png","sizes":"192x192","type":"image/png"}]}'>

  <!-- PDF Generator CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg-color: #F2F2F7;
      --card-bg: #FFFFFF;
      --text-color: #1C1C1E;
      --subtext-color: #8E8E93;
      --primary-color: #34C759;
      --primary-dark: #28A745;
      --border-color: #E5E5EA;
      --danger-color: #FF3B30;
      --accent-blue: #007AFF;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    [data-theme="dark"] {
      --bg-color: #000000;
      --card-bg: #1C1C1E;
      --text-color: #FFFFFF;
      --subtext-color: #8E8E93;
      --border-color: #38383A;
      --primary-color: #30D158;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 70px);
      max-width: 440px; /* iPhone Pro Max viewport width */
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* App Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary-color);
      background-color: #E5E5EA;
    }

    .app-title {
      font-size: 20px;
      font-weight: 700;
    }

    /* Tab Container */
    .tab-content {
      display: none;
      padding: 16px;
      flex: 1;
    }

    .tab-content.active {
      display: block;
    }

    /* Bottom Navigation */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      height: calc(60px + var(--safe-bottom));
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: var(--safe-bottom);
      z-index: 100;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--subtext-color);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex: 1;
    }

    .nav-btn.active {
      color: var(--primary-color);
      font-weight: 600;
    }

    .nav-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* Section Cards */
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Day Card in Weekly Menu */
    .day-card {
      border-left: 4px solid var(--primary-color);
      margin-bottom: 12px;
      padding: 12px 16px;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .dish-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .dish-tag {
      background: rgba(52, 199, 89, 0.15);
      color: var(--primary-dark);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    [data-theme="dark"] .dish-tag {
      color: var(--primary-color);
    }

    .dish-tag .remove-btn {
      cursor: pointer;
      font-weight: bold;
      margin-left: 4px;
    }

    .people-count-inputs {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      font-size: 13px;
      color: var(--subtext-color);
    }

    .people-count-inputs label {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .people-count-inputs input {
      width: 48px;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      text-align: center;
    }

    /* Buttons & Controls */
    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: var(--primary-color);
      color: #FFF;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary {
      background: var(--border-color);
      color: var(--text-color);
    }

    .btn-danger {
      background: var(--danger-color);
      color: #FFF;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
    }

    .input-field {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      font-size: 14px;
      margin-bottom: 10px;
    }

    /* Dish Selection List */
    .dish-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .dish-item:last-child {
      border-bottom: none;
    }

    .dish-info {
      display: flex;
      flex-direction: column;
    }

    .dish-name {
      font-weight: 500;
      font-size: 15px;
    }

    .dish-date {
      font-size: 12px;
      color: var(--subtext-color);
      margin-top: 2px;
    }

    /* Drag & Drop Reorder List */
    .drag-list {
      list-style: none;
    }

    .drag-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: var(--bg-color);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: grab;
    }

    .drag-handle {
      margin-right: 10px;
      color: var(--subtext-color);
      cursor: grab;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      max-height: 80vh;
      overflow-y: auto;
    }

    /* Print Preview / PDF Container */
    #pdf-template {
      display: none;
      padding: 20px;
      background: #FFF;
      color: #000;
      font-family: Arial, sans-serif;
    }

    #pdf-template h2 { text-align: center; margin-bottom: 15px; }
    #pdf-template table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    #pdf-template th, #pdf-template td { border: 1px solid #CCC; padding: 8px; text-align: left; font-size: 13px; }
    #pdf-template th { background-color: #F0F0F0; }
  </style>
</head>
<body>

  <!-- App Header -->
  <header>
    <div class="header-user">
      <img id="header-avatar" src="icon.png" alt="Avatar" class="avatar" onclick="switchTab('settings')">
      <span class="app-title">每週菜單</span>
    </div>
    <div>
      <button class="btn btn-sm btn-secondary" onclick="exportPDFModal()">匯出 PDF</button>
    </div>
  </header>

  <!-- TAB 1: 每週菜單 (Weekly Menu) -->
  <main id="tab-menu" class="tab-content active">
    <div class="card">
      <div class="card-title">
        <span>菜單週次起始日</span>
        <input type="date" id="week-start-date" class="input-field" style="width: auto; margin-bottom:0;" onchange="updateWeekDates()">
      </div>
    </div>

    <div id="weekly-days-container">
      <!-- 7 Days Cards generated via JS -->
    </div>
  </main>

  <!-- TAB 2: 菜式分類庫 (Dishes & Categories) -->
  <main id="tab-dishes" class="tab-content">
    <div class="card">
      <div class="card-title">新增菜式</div>
      <input type="text" id="new-dish-name" class="input-field" placeholder="輸入菜式名稱">
      <select id="new-dish-category" class="input-field"></select>
      <button class="btn" style="width:100%" onclick="addDish()">新增至菜式庫</button>
    </div>

    <div id="dishes-by-category-container">
      <!-- Category Dish Lists -->
    </div>
  </main>

  <!-- TAB 3: 設定頁面 (Settings) -->
  <main id="tab-settings" class="tab-content">
    <!-- 頭像自訂 -->
    <div class="card">
      <div class="card-title">自訂頭像</div>
      <div style="display:flex; align-items:center; gap:16px;">
        <img id="settings-avatar-preview" src="icon.png" class="avatar" style="width:60px; height:60px;">
        <input type="file" id="avatar-input" accept="image/*" class="input-field" style="margin-bottom:0;" onchange="handleAvatarUpload(event)">
      </div>
    </div>

    <!-- 主題模式 -->
    <div class="card">
      <div class="card-title">
        <span>深色模式</span>
        <input type="checkbox" id="theme-toggle" onchange="toggleTheme(this.checked)">
      </div>
    </div>

    <!-- 分類管理 (拖拉排序 / 增刪) -->
    <div class="card">
      <div class="card-title">分類管理 (按住拖拉排序)</div>
      <ul id="category-drag-list" class="drag-list">
        <!-- Reorderable categories -->
      </ul>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <input type="text" id="new-cat-name" class="input-field" placeholder="新分類名稱" style="margin-bottom:0;">
        <button class="btn btn-sm" onclick="addCategory()">新增分類</button>
      </div>
    </div>

    <!-- 匯入 / 匯出數據 -->
    <div class="card">
      <div class="card-title">數據備份與復原</div>
      <p style="font-size:12px; color:var(--subtext-color); margin-bottom:12px;">支援 iPhone Safari 下載與匯入數據 json 檔案。</p>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="exportData()">匯出備份</button>
        <button class="btn btn-secondary" style="flex:1;" onclick="document.getElementById('import-file').click()">匯入備份</button>
        <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importData(event)">
      </div>
    </div>
  </main>

  <!-- Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('menu')" id="nav-menu">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v2H7zm0 4h2v2H7zm0-8h2v2H7zm4 4h6v2h-6zm0 4h6v2h-6zm0-8h6v2h-6z"/></svg>
      每週菜單
    </button>
    <button class="nav-btn" onclick="switchTab('dishes')" id="nav-dishes">
      <svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.46 3.9 3.45 4.38V21h2.1v-7.62C10.54 12.9 12 11.12 12 9V2h-1v7zm6-7v19h2V12h2V2h-4z"/></svg>
      菜式庫
    </button>
    <button class="nav-btn" onclick="switchTab('settings')" id="nav-settings">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      設定
    </button>
  </nav>

  <!-- Modal: 選擇菜式至菜單 -->
  <div id="select-dish-modal" class="modal">
    <div class="modal-content">
      <div class="card-title">
        <span id="modal-day-title">選擇菜式</span>
        <button class="btn btn-sm btn-secondary" onclick="closeModal('select-dish-modal')">關閉</button>
      </div>
      <div id="modal-dish-list">
        <!-- Dish checklist by category -->
      </div>
    </div>
  </div>

  <!-- Modal: PDF 語言選擇與匯出 -->
  <div id="pdf-modal" class="modal">
    <div class="modal-content">
      <div class="card-title">匯出每週菜單 (PDF)</div>
      <p style="margin-bottom:12px; font-size:14px;">請選擇匯出語言：</p>
      <select id="pdf-lang" class="input-field">
        <option value="zh">中文 (Chinese)</option>
        <option value="id">印尼文 (Bahasa Indonesia)</option>
      </select>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="closeModal('pdf-modal')">取消</button>
        <button class="btn" style="flex:1;" onclick="generatePDF()">下載 PDF</button>
      </div>
    </div>
  </div>

  <!-- Hidden PDF Render Template -->
  <div id="pdf-template"></div>

  <script>
    // App State Initial Defaults
    const DEFAULT_CATEGORIES = ['雞', '牛', '豬', '魚', '菜', '湯', '其他'];
    
    let state = {
      avatar: 'icon.png',
      darkMode: false,
      categories: [...DEFAULT_CATEGORIES],
      dishes: [
        { id: '1', name: '蒸水蛋', category: '菜', lastCooked: '' },
        { id: '2', name: '紅燒牛肉', category: '牛', lastCooked: '' },
        { id: '3', name: '香煎黃花魚', category: '魚', lastCooked: '' }
      ],
      weekStartDate: getMonday(new Date()).toISOString().split('T')[0],
      weeklyMenu: {} // Key: dayIndex (0-6), Value: { dishes: [dishId], dineIn: 0, takeOut: 0 }
    };

    // Initialize Menu Structure
    function initWeeklyMenuState() {
      for (let i = 0; i < 7; i++) {
        if (!state.weeklyMenu[i]) {
          state.weeklyMenu[i] = { dishes: [], dineIn: 2, takeOut: 1 };
        }
      }
    }

    // Helper: Get Monday of current week
    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    // Load State from LocalStorage
    function loadState() {
      const saved = localStorage.getItem('weekly_menu_pwa_state');
      if (saved) {
        try {
          state = JSON.parse(saved);
        } catch(e) { console.error(e); }
      }
      initWeeklyMenuState();
      applyTheme();
      renderAvatar();
      renderCategoriesSelect();
      renderWeeklyMenu();
      renderDishesTab();
      renderSettingsCategoryList();
      document.getElementById('week-start-date').value = state.weekStartDate;
    }

    // Save State
    function saveState() {
      localStorage.setItem('weekly_menu_pwa_state', JSON.stringify(state));
    }

    // Theme Switch
    function toggleTheme(isDark) {
      state.darkMode = isDark;
      applyTheme();
      saveState();
    }

    function applyTheme() {
      if (state.darkMode) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('theme-toggle').checked = true;
      } else {
        document.documentElement.removeAttribute('data-theme');
        document.getElementById('theme-toggle').checked = false;
      }
    }

    // Avatar Handling
    function renderAvatar() {
      const src = state.avatar || 'icon.png';
      document.getElementById('header-avatar').src = src;
      document.getElementById('settings-avatar-preview').src = src;
    }

    function handleAvatarUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          state.avatar = e.target.result;
          renderAvatar();
          saveState();
        };
        reader.readAsDataURL(file);
      }
    }

    // Tab Switcher
    function switchTab(tabKey) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabKey).classList.add('active');
      document.getElementById('nav-' + tabKey).classList.add('active');
    }

    // Render Weekly Menu
    const WEEK_DAYS = ['星期一 (Mon)', '星期二 (Tue)', '星期三 (Wed)', '星期四 (Thu)', '星期五 (Fri)', '星期六 (Sat)', '星期日 (Sun)'];
    
    function updateWeekDates() {
      state.weekStartDate = document.getElementById('week-start-date').value;
      saveState();
      renderWeeklyMenu();
    }

    function renderWeeklyMenu() {
      const container = document.getElementById('weekly-days-container');
      container.innerHTML = '';

      const baseDate = new Date(state.weekStartDate || getMonday(new Date()));

      for (let i = 0; i < 7; i++) {
        const currentDate = new Date(baseDate);
        currentDate.setDate(baseDate.getDate() + i);
        const dateStr = currentDate.toISOString().split('T')[0];

        const dayData = state.weeklyMenu[i] || { dishes: [], dineIn: 2, takeOut: 1 };

        const dayCard = document.createElement('div');
        dayCard.className = 'card day-card';

        // Dishes tags HTML
        let dishesHTML = '';
        dayData.dishes.forEach(dishId => {
          const dish = state.dishes.find(d => d.id === dishId);
          if (dish) {
            dishesHTML += `
              <span class="dish-tag">
                ${dish.name}
                <span class="remove-btn" onclick="removeDishFromDay(${i}, '${dish.id}')">&times;</span>
              </span>
            `;
          }
        });

        dayCard.innerHTML = `
          <div class="day-header">
            <span>${WEEK_DAYS[i]}</span>
            <span style="font-size:13px; color:var(--subtext-color);">${dateStr}</span>
          </div>
          <div class="dish-tag-list">${dishesHTML || '<span style="font-size:12px; color:var(--subtext-color);">未選擇菜式</span>'}</div>
          <button class="btn btn-sm btn-secondary" onclick="openSelectDishModal(${i}, '${dateStr}')">+ 選擇菜式</button>
          
          <div class="people-count-inputs">
            <label>用餐人數: 
              <input type="number" min="0" value="${dayData.dineIn}" onchange="updatePeopleCount(${i}, 'dineIn', this.value)">
            </label>
            <label>外帶人數: 
              <input type="number" min="0" value="${dayData.takeOut}" onchange="updatePeopleCount(${i}, 'takeOut', this.value)">
            </label>
          </div>
        `;
        container.appendChild(dayCard);
      }
    }

    function updatePeopleCount(dayIdx, type, val) {
      state.weeklyMenu[dayIdx][type] = parseInt(val) || 0;
      saveState();
    }

    function removeDishFromDay(dayIdx, dishId) {
      state.weeklyMenu[dayIdx].dishes = state.weeklyMenu[dayIdx].dishes.filter(id => id !== dishId);
      saveState();
      renderWeeklyMenu();
    }

    // Dish Modal
    let targetDayIndex = null;
    let targetDayDate = '';

    function openSelectDishModal(dayIdx, dateStr) {
      targetDayIndex = dayIdx;
      targetDayDate = dateStr;
      document.getElementById('modal-day-title').innerText = `${WEEK_DAYS[dayIdx]} - 選擇菜式`;

      const listContainer = document.getElementById('modal-dish-list');
      listContainer.innerHTML = '';

      state.categories.forEach(cat => {
        const catDishes = state.dishes.filter(d => d.category === cat);
        if (catDishes.length > 0) {
          const catHeader = document.createElement('div');
          catHeader.style.cssText = 'font-weight:600; font-size:14px; margin:10px 0 4px 0; color:var(--primary-color);';
          catHeader.innerText = cat;
          listContainer.appendChild(catHeader);

          catDishes.forEach(dish => {
            const isSelected = state.weeklyMenu[dayIdx].dishes.includes(dish.id);
            const item = document.createElement('div');
            item.className = 'dish-item';
            item.innerHTML = `
              <div class="dish-info">
                <span class="dish-name">${dish.name}</span>
                <span class="dish-date">上次烹飪: ${dish.lastCooked || '尚未紀錄'}</span>
              </div>
              <button class="btn btn-sm ${isSelected ? 'btn-secondary' : ''}" onclick="toggleDishForDay('${dish.id}')">
                ${isSelected ? '已加入' : '加入'}
              </button>
            `;
            listContainer.appendChild(item);
          });
        }
      });

      document.getElementById('select-dish-modal').classList.add('active');
    }

    function toggleDishForDay(dishId) {
      const dayDishes = state.weeklyMenu[targetDayIndex].dishes;
      const idx = dayDishes.indexOf(dishId);
      if (idx > -1) {
        dayDishes.splice(idx, 1);
      } else {
        dayDishes.push(dishId);
        // Update Dish Last Cooked Date
        const dish = state.dishes.find(d => d.id === dishId);
        if (dish) {
          dish.lastCooked = targetDayDate;
        }
      }
      saveState();
      renderWeeklyMenu();
      renderDishesTab();
      openSelectDishModal(targetDayIndex, targetDayDate); // Refresh modal view
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    // Dish Management Tab
    function renderCategoriesSelect() {
      const select = document.getElementById('new-dish-category');
      select.innerHTML = '';
      state.categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.innerText = cat;
        select.appendChild(opt);
      });
    }

    function addDish() {
      const nameInput = document.getElementById('new-dish-name');
      const catSelect = document.getElementById('new-dish-category');
      const name = nameInput.value.trim();
      const category = catSelect.value;

      if (!name) return alert('請輸入菜式名稱');

      const newDish = {
        id: Date.now().toString(),
        name: name,
        category: category,
        lastCooked: ''
      };

      state.dishes.push(newDish);
      nameInput.value = '';
      saveState();
      renderDishesTab();
    }

    function deleteDish(dishId) {
      if (confirm('確定刪除此菜式？')) {
        state.dishes = state.dishes.filter(d => d.id !== dishId);
        // Clean from weekly menus
        for (let key in state.weeklyMenu) {
          state.weeklyMenu[key].dishes = state.weeklyMenu[key].dishes.filter(id => id !== dishId);
        }
        saveState();
        renderDishesTab();
        renderWeeklyMenu();
      }
    }

    function renderDishesTab() {
      const container = document.getElementById('dishes-by-category-container');
      container.innerHTML = '';

      state.categories.forEach(cat => {
        const catDishes = state.dishes.filter(d => d.category === cat);
        const card = document.createElement('div');
        card.className = 'card';

        let dishesHTML = '';
        catDishes.forEach(dish => {
          dishesHTML += `
            <div class="dish-item">
              <div class="dish-info">
                <span class="dish-name">${dish.name}</span>
                <span class="dish-date">上一次烹飪日期: ${dish.lastCooked || '尚未紀錄'}</span>
              </div>
              <button class="btn btn-sm btn-danger" onclick="deleteDish('${dish.id}')">刪除</button>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="card-title">${cat} (${catDishes.length})</div>
          <div>${dishesHTML || '<span style="font-size:13px; color:var(--subtext-color);">此分類暫無菜式</span>'}</div>
        `;
        container.appendChild(card);
      });
    }

    // Category Management & Drag/Drop in Settings
    function renderSettingsCategoryList() {
      const list = document.getElementById('category-drag-list');
      list.innerHTML = '';

      state.categories.forEach((cat, index) => {
        const li = document.createElement('li');
        li.className = 'drag-item';
        li.draggable = true;
        li.dataset.index = index;

        li.innerHTML = `
          <div style="display:flex; align-items:center;">
            <span class="drag-handle">☰</span>
            <span>${cat}</span>
          </div>
          ${cat !== '其他' ? `<button class="btn btn-sm btn-danger" onclick="deleteCategory('${cat}')">刪除</button>` : '<span style="font-size:12px; color:var(--subtext-color);">預設分類</span>'}
        `;

        // Drag & drop events
        li.addEventListener('dragstart', handleDragStart);
        li.addEventListener('dragover', handleDragOver);
        li.addEventListener('drop', handleDrop);

        list.appendChild(li);
      });
    }

    let dragSrcIndex = null;

    function handleDragStart(e) {
      dragSrcIndex = this.dataset.index;
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDrop(e) {
      e.preventDefault();
      const targetIndex = this.dataset.index;
      if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
        const movedItem = state.categories.splice(dragSrcIndex, 1)[0];
        state.categories.splice(targetIndex, 0, movedItem);
        saveState();
        renderSettingsCategoryList();
        renderCategoriesSelect();
        renderDishesTab();
      }
    }

    function addCategory() {
      const input = document.getElementById('new-cat-name');
      const name = input.value.trim();
      if (!name) return;
      if (state.categories.includes(name)) return alert('分類名稱已存在');

      state.categories.push(name);
      input.value = '';
      saveState();
      renderSettingsCategoryList();
      renderCategoriesSelect();
      renderDishesTab();
    }

    function deleteCategory(catName) {
      if (catName === '其他') return alert('「其他」分類不能刪除');

      // Requirement 13: Warn user and auto move dishes to "其他"
      const confirmDelete = confirm(`刪除「${catName}」分類後，其中的所有菜式將會自動移至「其他」分類。確定刪除？`);
      
      if (confirmDelete) {
        // Move dishes to "其他"
        state.dishes.forEach(d => {
          if (d.category === catName) {
            d.category = '其他';
          }
        });

        // Remove category
        state.categories = state.categories.filter(c => c !== catName);
        if (!state.categories.includes('其他')) state.categories.push('其他');

        saveState();
        renderSettingsCategoryList();
        renderCategoriesSelect();
        renderDishesTab();
      }
    }

    // Export & Import Backup Data
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `weekly_menu_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const importedState = JSON.parse(e.target.result);
            if (importedState && importedState.categories && importedState.dishes) {
              state = importedState;
              saveState();
              loadState();
              alert('成功匯入數據！');
            } else {
              alert('無效的備份檔案格式');
            }
          } catch(err) {
            alert('匯入失敗：檔案損壞或格式不符');
          }
        };
        reader.readAsText(file);
      }
    }

    // PDF Export Modal & Logic
    function exportPDFModal() {
      document.getElementById('pdf-modal').classList.add('active');
    }

    function generatePDF() {
      const lang = document.getElementById('pdf-lang').value;
      const pdfContainer = document.getElementById('pdf-template');

      const isZh = (lang === 'zh');
      const titleText = isZh ? '每週菜單' : 'Menu Mingguan';
      const dineText = isZh ? '用餐人數' : 'Jumlah Pemakan';
      const takeOutText = isZh ? '外帶人數' : 'Jumlah Bungkus';
      const dishHeader = isZh ? '菜式' : 'Hidangan';
      const dayHeader = isZh ? '日期 / 星期' : 'Hari / Tanggal';

      const daysTranslation = isZh ? 
        ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'] :
        ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];

      const baseDate = new Date(state.weekStartDate || getMonday(new Date()));

      let tableRows = '';

      for (let i = 0; i < 7; i++) {
        const currentDate = new Date(baseDate);
        currentDate.setDate(baseDate.getDate() + i);
        const dateStr = currentDate.toISOString().split('T')[0];

        const dayData = state.weeklyMenu[i] || { dishes: [], dineIn: 0, takeOut: 0 };
        const dishNames = dayData.dishes.map(id => {
          const d = state.dishes.find(item => item.id === id);
          return d ? d.name : '';
        }).filter(Boolean).join(', ');

        tableRows += `
          <tr>
            <td><strong>${daysTranslation[i]}</strong><br><span style="color:#666; font-size:11px;">${dateStr}</span></td>
            <td>${dishNames || '-'}</td>
            <td>${dineText}: ${dayData.dineIn}<br>${takeOutText}: ${dayData.takeOut}</td>
          </tr>
        `;
      }

      pdfContainer.innerHTML = `
        <h2>${titleText} (${state.weekStartDate})</h2>
        <table>
          <thead>
            <tr>
              <th style="width:25%;">${dayHeader}</th>
              <th style="width:50%;">${dishHeader}</th>
              <th style="width:25%;">${isZh ? '人數' : 'Jumlah Orang'}</th>
            </tr>
          </thead>
          <tbody>
            ${tableRows}
          </tbody>
        </table>
      `;

      closeModal('pdf-modal');

      // html2pdf Options
      const opt = {
        margin: 10,
        filename: `weekly_menu_${state.weekStartDate}_${lang}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      pdfContainer.style.display = 'block';
      html2pdf().set(opt).from(pdfContainer).save().then(() => {
        pdfContainer.style.display = 'none';
      });
    }

    // Init App
    window.onload = loadState;
  </script>
</body>
</html>
